0\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><ellipse cx=\"136\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><path d=\"M68 58 Q60 22 88 44 Q80 56 72 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M132 58 Q140 22 112 44 Q120 56 128 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M71 54 Q67 36 82 48 Z\" fill=\"#3a3230\"/><path d=\"M129 54 Q133 36 118 48 Z\" fill=\"#3a3230\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#kFur__U)\"/><path d=\"M100 56 Q62 62 60 104 Q100 92 140 104 Q138 62 100 56 Z\" fill=\"#e8cfa8\"/><ellipse cx=\"100\" cy=\"98\" rx=\"40\" ry=\"30\" fill=\"#ecd6b4\"/><ellipse cx=\"100\" cy=\"116\" rx=\"30\" ry=\"24\" fill=\"#f2e1c8\"/><ellipse cx=\"72\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"128\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"100\" cy=\"106\" rx=\"9\" ry=\"7\" fill=\"#3a2a26\"/><ellipse cx=\"97\" cy=\"104\" rx=\"3\" ry=\"2\" fill=\"#5a4a44\" opacity=\"0.7\"/><ellipse cx=\"80\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><ellipse cx=\"120\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><circle cx=\"81\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"119\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"81\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"119\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"84\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"122\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"77\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"115\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M88 120 Q100 130 112 120\" stroke=\"#7a5238\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M74 142 Q100 154 126 142\" stroke=\"#9a4030\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"100\" cy=\"151\" r=\"7\" fill=\"#f0c44e\"/><circle cx=\"100\" cy=\"153\" r=\"1.8\" fill=\"#9a7a1a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Кайл</div><p>Дорогие студенты-Яндексоиды, начинаем с функций. Это не страшно. Функция — просто станок: кладёшь сырьё, получаешь результат. Сейчас всё покажу и дам потыкать.</p></div></div>\n\n  <section>\n    <div class=\"sec-num\">01 · ЧТО ТАКОЕ ФУНКЦИЯ</div>\n    <h2>Функция — это станок</h2>\n    <p class=\"lead\">Берёт что-то на вход, отдаёт что-то на выход. Один раз настроил — пользуешься сколько угодно.</p>\n    <p>Смысл простой. Есть кусок работы, который повторяется. Вместо копирования по всему коду — заворачиваешь в функцию и зовёшь по имени. Поменялась логика — правишь в одном месте.</p>\n\n    <div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">function.js</span><button class=\"runbtn\" onclick=\"runJS(this)\" data-src=\"//%20%D0%BE%D0%B1%D1%8A%D1%8F%D0%B2%D0%BB%D1%8F%D0%B5%D0%BC%20%D1%84%D1%83%D0%BD%D0%BA%D1%86%D0%B8%D1%8E%0Afunction%20greet%28name%29%20%7B%0A%20%20return%20%27%D0%9F%D1%80%D0%B8%D0%B2%D0%B5%D1%82%2C%20%27%20%2B%20name%20%2B%20%27%21%27%3B%0A%7D%0A%0A//%20%D0%B7%D0%BE%D0%B2%D1%91%D0%BC%20%D0%B5%D1%91%20%D1%81%20%D1%80%D0%B0%D0%B7%D0%BD%D1%8B%D0%BC%D0%B8%20%D0%B0%D1%80%D0%B3%D1%83%D0%BC%D0%B5%D0%BD%D1%82%D0%B0%D0%BC%D0%B8%0Aconsole.log%28greet%28%27%D0%90%D0%BD%D1%8F%27%29%29%3B%0Aconsole.log%28greet%28%27%D0%9C%D0%B0%D0%BA%D1%81%27%29%29%3B\"><span>▶</span><span class=\"rlabel\">Запустить</span></button></div>\n  <pre><code><span class=\"tc\">// объявляем функцию</span>\n<span class=\"tk\">function</span><span class=\"tx\"> </span><span class=\"tf\">greet</span><span class=\"tx\">(</span><span class=\"tx\">name</span><span class=\"tx\">)</span><span class=\"tx\"> </span><span class=\"tx\">{</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tk\">return</span><span class=\"tx\"> </span><span class=\"ts2\">&#x27;Привет, &#x27;</span><span class=\"tx\"> </span><span class=\"to\">+</span><span class=\"tx\"> </span><span class=\"tx\">name</span><span class=\"tx\"> </span><span class=\"to\">+</span><span class=\"tx\"> </span><span class=\"ts2\">&#x27;!&#x27;</span><span class=\"tx\">;</span>\n<span class=\"tx\">}</span>\n \n<span class=\"tc\">// зовём её с разными аргументами</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tf\">greet</span><span class=\"tx\">(</span><span class=\"ts2\">&#x27;Аня&#x27;</span><span class=\"tx\">)</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tf\">greet</span><span class=\"tx\">(</span><span class=\"ts2\">&#x27;Макс&#x27;</span><span class=\"tx\">)</span><span class=\"tx\">)</span><span class=\"tx\">;</span></code></pre>\n  <div class=\"console\"><div class=\"console-inner\"><div class=\"console-label\">console</div></div></div>\n</div>\n\n    <div class=\"say maxi\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"mFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#46b877\"/><stop offset=\"100%\" stop-color=\"#359a5e\"/></linearGradient><radialGradient id=\"mCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#f0a890\" stop-opacity=\"0.45\"/><stop offset=\"100%\" stop-color=\"#f0a890\" stop-opacity=\"0\"/></radialGradient></defs><path d=\"M66 56 Q56 18 90 42 Q80 54 72 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M134 56 Q144 18 110 42 Q120 54 128 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M70 50 Q64 30 82 44 Z\" fill=\"#1f1f1f\"/><path d=\"M130 50 Q136 30 118 44 Z\" fill=\"#1f1f1f\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#mFur__U)\"/><path d=\"M100 64 Q66 72 70 112 Q100 128 130 112 Q134 72 100 64 Z\" fill=\"#f2f6f2\"/><ellipse cx=\"100\" cy=\"104\" rx=\"34\" ry=\"26\" fill=\"#f7faf7\"/><ellipse cx=\"74\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"126\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"100\" cy=\"108\" rx=\"6.5\" ry=\"5\" fill=\"#2a2a2a\"/><path d=\"M100 113 L100 120\" stroke=\"#2a2a2a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><ellipse cx=\"82\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><ellipse cx=\"118\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><circle cx=\"83\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"117\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"83\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"117\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"86\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"120\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"79\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"113\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M90 119 Q100 127 110 119\" stroke=\"#1f5a32\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M97 124 Q100 129 103 124 Z\" fill=\"#e87a8a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Макси</div><p>Видишь? Нажал ▶️ — код реально выполнился, внизу вывод. Это не картинка, это работающий JavaScript прямо в лекции. Можешь мысленно подставлять свои имена.</p></div></div>\n\n    <h3>Параметры и аргументы</h3>\n    <p><strong>Параметр</strong> — это имя в скобках при объявлении (<code>name</code>). <strong>Аргумент</strong> — конкретное значение, которое передаёшь при вызове (<code>'Аня'</code>). Параметров может быть несколько:</p>\n\n    <div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">params.js</span><button class=\"runbtn\" onclick=\"runJS(this)\" data-src=\"function%20sum%28a%2C%20b%29%20%7B%0A%20%20return%20a%20%2B%20b%3B%0A%7D%0A%0Aconsole.log%28sum%282%2C%203%29%29%3B%0Aconsole.log%28sum%2810%2C%2025%29%29%3B%0Aconsole.log%28sum%28100%2C%20-40%29%29%3B\"><span>▶</span><span class=\"rlabel\">Запустить</span></button></div>\n  <pre><code><span class=\"tk\">function</span><span class=\"tx\"> </span><span class=\"tf\">sum</span><span class=\"tx\">(</span><span class=\"tx\">a</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tx\">b</span><span class=\"tx\">)</span><span class=\"tx\"> </span><span class=\"tx\">{</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tk\">return</span><span class=\"tx\"> </span><span class=\"tx\">a</span><span class=\"tx\"> </span><span class=\"to\">+</span><span class=\"tx\"> </span><span class=\"tx\">b</span><span class=\"tx\">;</span>\n<span class=\"tx\">}</span>\n \n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tf\">sum</span><span class=\"tx\">(</span><span class=\"tn\">2</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tn\">3</span><span class=\"tx\">)</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tf\">sum</span><span class=\"tx\">(</span><span class=\"tn\">10</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tn\">25</span><span class=\"tx\">)</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tf\">sum</span><span class=\"tx\">(</span><span class=\"tn\">100</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"to\">-</span><span class=\"tn\">40</span><span class=\"tx\">)</span><span class=\"tx\">)</span><span class=\"tx\">;</span></code></pre>\n  <div class=\"console\"><div class=\"console-inner\"><div class=\"console-label\">console</div></div></div>\n</div>\n  </section>\n\n  <section>\n    <div class=\"sec-num\">02 · СТРЕЛОЧНЫЕ ФУНКЦИИ</div>\n    <h2>Стрелочные функции</h2>\n    <p class=\"lead\">Та же идея, короче запись. Сейчас в React и современном коде пишут в основном так.</p>\n\n    <div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">arrow.js</span><button class=\"runbtn\" onclick=\"runJS(this)\" data-src=\"//%20%D0%BA%D0%BB%D0%B0%D1%81%D1%81%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%B0%D1%8F%0Afunction%20double1%28n%29%20%7B%0A%20%20return%20n%20%2A%202%3B%0A%7D%0A%0A//%20%D1%81%D1%82%D1%80%D0%B5%D0%BB%D0%BE%D1%87%D0%BD%D0%B0%D1%8F%20%E2%80%94%20%D1%82%D0%BE%20%D0%B6%D0%B5%20%D1%81%D0%B0%D0%BC%D0%BE%D0%B5%0Aconst%20double2%20%3D%20%28n%29%20%3D%3E%20%7B%0A%20%20return%20n%20%2A%202%3B%0A%7D%3B%0A%0A//%20%D0%B5%D1%81%D0%BB%D0%B8%20%D1%82%D0%B5%D0%BB%D0%BE%20%D0%BE%D0%B4%D0%BD%D0%BE%20%D0%B2%D1%8B%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%E2%80%94%20return%20%D0%BD%D0%B5%20%D0%BD%D1%83%D0%B6%D0%B5%D0%BD%0Aconst%20double3%20%3D%20%28n%29%20%3D%3E%20n%20%2A%202%3B%0A%0Aconsole.log%28double1%2821%29%29%3B%0Aconsole.log%28double2%2821%29%29%3B%0Aconsole.log%28double3%2821%29%29%3B\"><span>▶</span><span class=\"rlabel\">Запустить</span></button></div>\n  <pre><code><span class=\"tc\">// классическая</span>\n<span class=\"tk\">function</span><span class=\"tx\"> </span><span class=\"tf\">double1</span><span class=\"tx\">(</span><span class=\"tx\">n</span><span class=\"tx\">)</span><span class=\"tx\"> </span><span class=\"tx\">{</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tk\">return</span><span class=\"tx\"> </span><span class=\"tx\">n</span><span class=\"tx\"> </span><span class=\"to\">*</span><span class=\"tx\"> </span><span class=\"tn\">2</span><span class=\"tx\">;</span>\n<span class=\"tx\">}</span>\n \n<span class=\"tc\">// стрелочная — то же самое</span>\n<span class=\"tk\">const</span><span class=\"tx\"> </span><span class=\"tx\">double2</span><span class=\"tx\"> </span><span class=\"to\">=</span><span class=\"tx\"> </span><span class=\"tx\">(</span><span class=\"tx\">n</span><span class=\"tx\">)</span><span class=\"tx\"> </span><span class=\"to\">=&gt;</span><span class=\"tx\"> </span><span class=\"tx\">{</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tk\">return</span><span class=\"tx\"> </span><span class=\"tx\">n</span><span class=\"tx\"> </span><span class=\"to\">*</span><span class=\"tx\"> </span><span class=\"tn\">2</span><span class=\"tx\">;</span>\n<span class=\"tx\">}</span><span class=\"tx\">;</span>\n \n<span class=\"tc\">// если тело одно выражение — return не нужен</span>\n<span class=\"tk\">const</span><span class=\"tx\"> </span><span class=\"tx\">double3</span><span class=\"tx\"> </span><span class=\"to\">=</span><span class=\"tx\"> </span><span class=\"tx\">(</span><span class=\"tx\">n</span><span class=\"tx\">)</span><span class=\"tx\"> </span><span class=\"to\">=&gt;</span><span class=\"tx\"> </span><span class=\"tx\">n</span><span class=\"tx\"> </span><span class=\"to\">*</span><span class=\"tx\"> </span><span class=\"tn\">2</span><span class=\"tx\">;</span>\n \n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tf\">double1</span><span class=\"tx\">(</span><span class=\"tn\">21</span><span class=\"tx\">)</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tf\">double2</span><span class=\"tx\">(</span><span class=\"tn\">21</span><span class=\"tx\">)</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tf\">double3</span><span class=\"tx\">(</span><span class=\"tn\">21</span><span class=\"tx\">)</span><span class=\"tx\">)</span><span class=\"tx\">;</span></code></pre>\n  <div class=\"console\"><div class=\"console-inner\"><div class=\"console-label\">console</div></div></div>\n</div>\n\n    <div class=\"say maxi\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"mFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#46b877\"/><stop offset=\"100%\" stop-color=\"#359a5e\"/></linearGradient><radialGradient id=\"mCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#f0a890\" stop-opacity=\"0.45\"/><stop offset=\"100%\" stop-color=\"#f0a890\" stop-opacity=\"0\"/></radialGradient></defs><path d=\"M66 56 Q56 18 90 42 Q80 54 72 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M134 56 Q144 18 110 42 Q120 54 128 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M70 50 Q64 30 82 44 Z\" fill=\"#1f1f1f\"/><path d=\"M130 50 Q136 30 118 44 Z\" fill=\"#1f1f1f\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#mFur__U)\"/><path d=\"M100 64 Q66 72 70 112 Q100 128 130 112 Q134 72 100 64 Z\" fill=\"#f2f6f2\"/><ellipse cx=\"100\" cy=\"104\" rx=\"34\" ry=\"26\" fill=\"#f7faf7\"/><ellipse cx=\"74\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"126\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"100\" cy=\"108\" rx=\"6.5\" ry=\"5\" fill=\"#2a2a2a\"/><path d=\"M100 113 L100 120\" stroke=\"#2a2a2a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><ellipse cx=\"82\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><ellipse cx=\"118\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><circle cx=\"83\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"117\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"83\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"117\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"86\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"120\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"79\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"113\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M90 119 Q100 127 110 119\" stroke=\"#1f5a32\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M97 124 Q100 129 103 124 Z\" fill=\"#e87a8a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Макси</div><p>Стрелка <code>=&gt;</code> читается как «превращается в». <code>n =&gt; n * 2</code> — «эн превращается в эн умножить на два». Запомнишь так — путаться не будешь.</p></div></div>\n\n    <div class=\"box info\">\n      <div class=\"bt\">▸ Почему это важно для React</div>\n      <p>В React почти все обработчики событий и колбэки пишут стрелками: <code>onClick={() => doSomething()}</code>. Так что привыкай к синтаксису сейчас — дальше встретишь его сотни раз.</p>\n    </div>\n  </section>\n\n  <section>\n    <div class=\"sec-num\">03 · ФУНКЦИИ И ДАННЫЕ</div>\n    <h2>Функции работают с массивами</h2>\n    <p class=\"lead\">Самое полезное — прогонять функции по спискам данных. Вот где появляются <code>map</code> и <code>filter</code>.</p>\n\n    <p>Коротко напомню. <strong>filter</strong> отсеивает по условию, <strong>map</strong> преобразует каждый элемент. Обе принимают функцию. Запусти и посмотри разницу:</p>\n\n    <div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">filter-map.js</span><button class=\"runbtn\" onclick=\"runJS(this)\" data-src=\"const%20numbers%20%3D%20%5B1%2C%202%2C%203%2C%204%2C%205%2C%206%2C%207%2C%208%5D%3B%0A%0A//%20filter%20%E2%80%94%20%D0%BE%D1%81%D1%82%D0%B0%D0%B2%D0%B8%D1%82%D1%8C%20%D1%82%D0%BE%D0%BB%D1%8C%D0%BA%D0%BE%20%D1%87%D1%91%D1%82%D0%BD%D1%8B%D0%B5%0Aconst%20even%20%3D%20numbers.filter%28%28n%29%20%3D%3E%20n%20%25%202%20%3D%3D%3D%200%29%3B%0Aconsole.log%28%27%D1%87%D1%91%D1%82%D0%BD%D1%8B%D0%B5%3A%27%2C%20even%29%3B%0A%0A//%20map%20%E2%80%94%20%D1%83%D0%B4%D0%B2%D0%BE%D0%B8%D1%82%D1%8C%20%D0%BA%D0%B0%D0%B6%D0%B4%D0%BE%D0%B5%0Aconst%20doubled%20%3D%20numbers.map%28%28n%29%20%3D%3E%20n%20%2A%202%29%3B%0Aconsole.log%28%27%D1%83%D0%B4%D0%B2%D0%BE%D0%B5%D0%BD%D0%BD%D1%8B%D0%B5%3A%27%2C%20doubled%29%3B%0A%0A//%20%D1%86%D0%B5%D0%BF%D0%BE%D1%87%D0%BA%D0%B0%20%E2%80%94%20%D1%81%D0%BD%D0%B0%D1%87%D0%B0%D0%BB%D0%B0%20%D0%BE%D1%82%D1%81%D0%B5%D1%8F%D1%82%D1%8C%2C%20%D0%BF%D0%BE%D1%82%D0%BE%D0%BC%20%D0%BF%D1%80%D0%B5%D0%BE%D0%B1%D1%80%D0%B0%D0%B7%D0%BE%D0%B2%D0%B0%D1%82%D1%8C%0Aconst%20result%20%3D%20numbers%0A%20%20.filter%28%28n%29%20%3D%3E%20n%20%25%202%20%3D%3D%3D%200%29%0A%20%20.map%28%28n%29%20%3D%3E%20n%20%2A%2010%29%3B%0Aconsole.log%28%27%D1%86%D0%B5%D0%BF%D0%BE%D1%87%D0%BA%D0%B0%3A%27%2C%20result%29%3B\"><span>▶</span><span class=\"rlabel\">Запустить</span></button></div>\n  <pre><code><span class=\"tk\">const</span><span class=\"tx\"> </span><span class=\"tx\">numbers</span><span class=\"tx\"> </span><span class=\"to\">=</span><span class=\"tx\"> </span><span class=\"tx\">[</span><span class=\"tn\">1</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tn\">2</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tn\">3</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tn\">4</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tn\">5</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tn\">6</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tn\">7</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tn\">8</span><span class=\"tx\">]</span><span class=\"tx\">;</span>\n \n<span class=\"tc\">// filter — оставить только чётные</span>\n<span class=\"tk\">const</span><span class=\"tx\"> </span><span class=\"tx\">even</span><span class=\"tx\"> </span><span class=\"to\">=</span><span class=\"tx\"> </span><span class=\"tx\">numbers</span><span class=\"tx\">.</span><span class=\"tf\">filter</span><span class=\"tx\">(</span><span class=\"tx\">(</span><span class=\"tx\">n</span><span class=\"tx\">)</span><span class=\"tx\"> </span><span class=\"to\">=&gt;</span><span class=\"tx\"> </span><span class=\"tx\">n</span><span class=\"tx\"> </span><span class=\"to\">%</span><span class=\"tx\"> </span><span class=\"tn\">2</span><span class=\"tx\"> </span><span class=\"to\">===</span><span class=\"tx\"> </span><span class=\"tn\">0</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"ts2\">&#x27;чётные:&#x27;</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tx\">even</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n \n<span class=\"tc\">// map — удвоить каждое</span>\n<span class=\"tk\">const</span><span class=\"tx\"> </span><span class=\"tx\">doubled</span><span class=\"tx\"> </span><span class=\"to\">=</span><span class=\"tx\"> </span><span class=\"tx\">numbers</span><span class=\"tx\">.</span><span class=\"tf\">map</span><span class=\"tx\">(</span><span class=\"tx\">(</span><span class=\"tx\">n</span><span class=\"tx\">)</span><span class=\"tx\"> </span><span class=\"to\">=&gt;</span><span class=\"tx\"> </span><span class=\"tx\">n</span><span class=\"tx\"> </span><span class=\"to\">*</span><span class=\"tx\"> </span><span class=\"tn\">2</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"ts2\">&#x27;удвоенные:&#x27;</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tx\">doubled</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n \n<span class=\"tc\">// цепочка — сначала отсеять, потом преобразовать</span>\n<span class=\"tk\">const</span><span class=\"tx\"> </span><span class=\"tx\">result</span><span class=\"tx\"> </span><span class=\"to\">=</span><span class=\"tx\"> </span><span class=\"tx\">numbers</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">.</span><span class=\"tf\">filter</span><span class=\"tx\">(</span><span class=\"tx\">(</span><span class=\"tx\">n</span><span class=\"tx\">)</span><span class=\"tx\"> </span><span class=\"to\">=&gt;</span><span class=\"tx\"> </span><span class=\"tx\">n</span><span class=\"tx\"> </span><span class=\"to\">%</span><span class=\"tx\"> </span><span class=\"tn\">2</span><span class=\"tx\"> </span><span class=\"to\">===</span><span class=\"tx\"> </span><span class=\"tn\">0</span><span class=\"tx\">)</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">.</span><span class=\"tf\">map</span><span class=\"tx\">(</span><span class=\"tx\">(</span><span class=\"tx\">n</span><span class=\"tx\">)</span><span class=\"tx\"> </span><span class=\"to\">=&gt;</span><span class=\"tx\"> </span><span class=\"tx\">n</span><span class=\"tx\"> </span><span class=\"to\">*</span><span class=\"tx\"> </span><span class=\"tn\">10</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"ts2\">&#x27;цепочка:&#x27;</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tx\">result</span><span class=\"tx\">)</span><span class=\"tx\">;</span></code></pre>\n  <div class=\"console\"><div class=\"console-inner\"><div class=\"console-label\">console</div></div></div>\n</div>\n\n    <div class=\"say ren\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"rFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#8893ab\"/><stop offset=\"100%\" stop-color=\"#6e7a94\"/></linearGradient></defs><circle cx=\"70\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"130\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"70\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"130\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"100\" cy=\"102\" r=\"50\" fill=\"url(#rFur__U)\"/><ellipse cx=\"100\" cy=\"116\" rx=\"38\" ry=\"30\" fill=\"#e6eaf2\"/><ellipse cx=\"100\" cy=\"120\" rx=\"30\" ry=\"22\" fill=\"#eef1f7\"/><ellipse cx=\"100\" cy=\"110\" rx=\"11\" ry=\"8\" fill=\"#3e3e48\"/><ellipse cx=\"96\" cy=\"108\" rx=\"3\" ry=\"2\" fill=\"#5e5e68\" opacity=\"0.7\"/><path d=\"M100 117 L100 126\" stroke=\"#3e3e48\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><circle cx=\"120\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><path d=\"M96 94 Q100 90 104 94\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" fill=\"none\"/><circle cx=\"80\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"120\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"83\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"123\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"77\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><circle cx=\"117\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><path d=\"M72 88 Q78 84 84 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M112 88 Q118 84 124 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M78 116 Q60 114 52 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M78 122 Q60 124 54 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 116 Q140 114 148 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 122 Q140 124 146 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M90 124 Q100 131 110 124\" stroke=\"#525c70\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Рен</div><p>Обрати внимание: длина массива после <code>filter</code> может уменьшиться, а после <code>map</code> — никогда. map всегда возвращает столько же элементов, сколько было. Это инженерное правило, держи в голове.</p></div></div>\n\n    <h3>Функции с объектами</h3>\n    <p>На реальных проектах в массивах лежат объекты — это то, что приходит с сервера. Прогоним по ним функции:</p>\n\n    <div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">objects.js</span><button class=\"runbtn\" onclick=\"runJS(this)\" data-src=\"const%20products%20%3D%20%5B%0A%20%20%7B%20name%3A%20%27%D0%A2%D0%B5%D0%BB%D0%B5%D1%84%D0%BE%D0%BD%27%2C%20price%3A%2015000%2C%20inStock%3A%20true%20%7D%2C%0A%20%20%7B%20name%3A%20%27%D0%9D%D0%BE%D1%83%D1%82%D0%B1%D1%83%D0%BA%27%2C%20price%3A%2080000%2C%20inStock%3A%20false%20%7D%2C%0A%20%20%7B%20name%3A%20%27%D0%9F%D0%BB%D0%B0%D0%BD%D1%88%D0%B5%D1%82%27%2C%20price%3A%2025000%2C%20inStock%3A%20true%20%7D%2C%0A%5D%3B%0A%0A//%20%D1%82%D0%BE%D0%BB%D1%8C%D0%BA%D0%BE%20%D1%82%D0%BE%2C%20%D1%87%D1%82%D0%BE%20%D0%B2%20%D0%BD%D0%B0%D0%BB%D0%B8%D1%87%D0%B8%D0%B8%0Aconst%20available%20%3D%20products.filter%28%28p%29%20%3D%3E%20p.inStock%29%3B%0Aconsole.log%28%27%D0%B2%20%D0%BD%D0%B0%D0%BB%D0%B8%D1%87%D0%B8%D0%B8%3A%27%2C%20available.map%28%28p%29%20%3D%3E%20p.name%29%29%3B%0A%0A//%20%D0%BF%D0%BE%D0%B4%D0%BD%D1%8F%D1%82%D1%8C%20%D1%86%D0%B5%D0%BD%D1%8B%20%D0%BD%D0%B0%2010%25%0Aconst%20newPrices%20%3D%20products.map%28%28p%29%20%3D%3E%20p.name%20%2B%20%27%3A%20%27%20%2B%20%28p.price%20%2A%201.1%29%29%3B%0Aconsole.log%28newPrices%29%3B\"><span>▶</span><span class=\"rlabel\">Запустить</span></button></div>\n  <pre><code><span class=\"tk\">const</span><span class=\"tx\"> </span><span class=\"tx\">products</span><span class=\"tx\"> </span><span class=\"to\">=</span><span class=\"tx\"> </span><span class=\"tx\">[</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">{</span><span class=\"tx\"> </span><span class=\"tx\">name</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"ts2\">&#x27;Телефон&#x27;</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tx\">price</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tn\">15000</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tx\">inStock</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tp\">true</span><span class=\"tx\"> </span><span class=\"tx\">}</span><span class=\"tx\">,</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">{</span><span class=\"tx\"> </span><span class=\"tx\">name</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"ts2\">&#x27;Ноутбук&#x27;</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tx\">price</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tn\">80000</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tx\">inStock</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tp\">false</span><span class=\"tx\"> </span><span class=\"tx\">}</span><span class=\"tx\">,</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">{</span><span class=\"tx\"> </span><span class=\"tx\">name</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"ts2\">&#x27;Планшет&#x27;</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tx\">price</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tn\">25000</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tx\">inStock</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tp\">true</span><span class=\"tx\"> </span><span class=\"tx\">}</span><span class=\"tx\">,</span>\n<span class=\"tx\">]</span><span class=\"tx\">;</span>\n \n<span class=\"tc\">// только то, что в наличии</span>\n<span class=\"tk\">const</span><span class=\"tx\"> </span><span class=\"tx\">available</span><span class=\"tx\"> </span><span class=\"to\">=</span><span class=\"tx\"> </span><span class=\"tx\">products</span><span class=\"tx\">.</span><span class=\"tf\">filter</span><span class=\"tx\">(</span><span class=\"tx\">(</span><span class=\"tx\">p</span><span class=\"tx\">)</span><span class=\"tx\"> </span><span class=\"to\">=&gt;</span><span class=\"tx\"> </span><span class=\"tx\">p</span><span class=\"tx\">.</span><span class=\"tx\">inStock</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"ts2\">&#x27;в наличии:&#x27;</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tx\">available</span><span class=\"tx\">.</span><span class=\"tf\">map</span><span class=\"tx\">(</span><span class=\"tx\">(</span><span class=\"tx\">p</span><span class=\"tx\">)</span><span class=\"tx\"> </span><span class=\"to\">=&gt;</span><span class=\"tx\"> </span><span class=\"tx\">p</span><span class=\"tx\">.</span><span class=\"tx\">name</span><span class=\"tx\">)</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n \n<span class=\"tc\">// поднять цены на 10%</span>\n<span class=\"tk\">const</span><span class=\"tx\"> </span><span class=\"tx\">newPrices</span><span class=\"tx\"> </span><span class=\"to\">=</span><span class=\"tx\"> </span><span class=\"tx\">products</span><span class=\"tx\">.</span><span class=\"tf\">map</span><span class=\"tx\">(</span><span class=\"tx\">(</span><span class=\"tx\">p</span><span class=\"tx\">)</span><span class=\"tx\"> </span><span class=\"to\">=&gt;</span><span class=\"tx\"> </span><span class=\"tx\">p</span><span class=\"tx\">.</span><span class=\"tx\">name</span><span class=\"tx\"> </span><span class=\"to\">+</span><span class=\"tx\"> </span><span class=\"ts2\">&#x27;: &#x27;</span><span class=\"tx\"> </span><span class=\"to\">+</span><span class=\"tx\"> </span><span class=\"tx\">(</span><span class=\"tx\">p</span><span class=\"tx\">.</span><span class=\"tx\">price</span><span class=\"tx\"> </span><span class=\"to\">*</span><span class=\"tx\"> </span><span class=\"tn\">1.1</span><span class=\"tx\">)</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tx\">newPrices</span><span class=\"tx\">)</span><span class=\"tx\">;</span></code></pre>\n  <div class=\"console\"><div class=\"console-inner\"><div class=\"console-label\">console</div></div></div>\n</div>\n\n    <div class=\"meme-row\">\n      <span class=\"meme\"><span class=\"mava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"mFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#46b877\"/><stop offset=\"100%\" stop-color=\"#359a5e\"/></linearGradient><radialGradient id=\"mCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#f0a890\" stop-opacity=\"0.45\"/><stop offset=\"100%\" stop-color=\"#f0a890\" stop-opacity=\"0\"/></radialGradient></defs><path d=\"M66 56 Q56 18 90 42 Q80 54 72 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M134 56 Q144 18 110 42 Q120 54 128 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M70 50 Q64 30 82 44 Z\" fill=\"#1f1f1f\"/><path d=\"M130 50 Q136 30 118 44 Z\" fill=\"#1f1f1f\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#mFur__U)\"/><path d=\"M100 64 Q66 72 70 112 Q100 128 130 112 Q134 72 100 64 Z\" fill=\"#f2f6f2\"/><ellipse cx=\"100\" cy=\"104\" rx=\"34\" ry=\"26\" fill=\"#f7faf7\"/><ellipse cx=\"74\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"126\" cy=\"108\" rx=\"12\
