on></div><div class=\"fetchout\">нажми кнопку — увидишь живой ответ настоящего сервера здесь</div><div class=\"box warn\"><div class=\"bt\">Грабли fetch</div><p>fetch НЕ кидает ошибку на 404/500. Этот код спокойно «отработает» на сломанном запросе и упадёт уже на user.name. Всегда проверяй if (!res.ok) throw ... сам.</p></div></section><section><div class=\"sec-num\">02 · AXIOS</div><h2>То же, но с комфортом</h2><p>axios — обёртка над тем же HTTP, но снимает рутину. Что он даёт сверху:</p><ul class=\"plain\"><li>Сам парсит JSON — никакого второго <code>.json()</code>, данные сразу в <code>res.data</code>.</li><li>Сам кидает ошибку на 4xx/5xx — попадаешь в <code>catch</code>, а не ловишь баг на ровном месте.</li><li><strong>baseURL и interceptors</strong> — один раз настроил адрес и токен, дальше пишешь короткие пути. Перехватчики цепляют заголовки и логируют каждый запрос централизованно.</li></ul><div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">axios.js</span></div>\n  <pre><code><span class=\"tk\">import</span> <span class=\"tx\">axios</span> <span class=\"tk\">from</span> <span class=\"ts2\">'axios'</span><span class=\"tx\">;</span>\n\n<span class=\"tc\">// настроил один раз на весь проект</span>\n<span class=\"tk\">const</span> <span class=\"tx\">api</span> <span class=\"to\">=</span> <span class=\"tx\">axios</span><span class=\"tx\">.</span><span class=\"tf\">create</span><span class=\"tx\">(</span><span class=\"tx\">{</span>\n  <span class=\"tx\">baseURL</span><span class=\"to\">:</span> <span class=\"ts2\">'https://api.yandex.ru'</span><span class=\"tx\">,</span>\n  <span class=\"tx\">timeout</span><span class=\"to\">:</span> <span class=\"tn\">5000</span><span class=\"tx\">,</span>\n<span class=\"tx\">}</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n\n<span class=\"tc\">// interceptor: вешаем токен на каждый запрос автоматически</span>\n<span class=\"tx\">api</span><span class=\"tx\">.</span><span class=\"tx\">interceptors</span><span class=\"tx\">.</span><span class=\"tx\">request</span><span class=\"tx\">.</span><span class=\"tf\">use</span><span class=\"tx\">(</span><span class=\"tx\">(</span><span class=\"tx\">config</span><span class=\"tx\">)</span> <span class=\"to\">=&gt;</span> <span class=\"tx\">{</span>\n  <span class=\"tx\">config</span><span class=\"tx\">.</span><span class=\"tx\">headers</span><span class=\"tx\">.</span><span class=\"ty\">Authorization</span> <span class=\"to\">=</span> <span class=\"ts2\">`Bearer ${getToken()}`</span><span class=\"tx\">;</span>\n  <span class=\"tk\">return</span> <span class=\"tx\">config</span><span class=\"tx\">;</span>\n<span class=\"tx\">}</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n\n<span class=\"tc\">// сам запрос — коротко, JSON уже распарсен, ошибки в catch</span>\n<span class=\"tk\">const</span> <span class=\"tx\">{</span> <span class=\"tx\">data</span> <span class=\"tx\">}</span> <span class=\"to\">=</span> <span class=\"tk\">await</span> <span class=\"tx\">api</span><span class=\"tx\">.</span><span class=\"tk\">get</span><span class=\"tx\">(</span><span class=\"ts2\">'/users/2'</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tx\">data</span><span class=\"tx\">.</span><span class=\"tx\">name</span><span class=\"tx\">)</span><span class=\"tx\">;</span></code></pre>\n</div><div class=\"fetchout\">демо «как будто axios» (тот же реальный API, axios сам бы распарсил JSON):</div><div style=\"text-align:center;margin-top:10px;\"><button class=\"minibtn\" onclick=\"realFetch(this,'axios')\">▶ Запросить через axios-стиль</button></div><div class=\"say ren\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"rFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#8893ab\"/><stop offset=\"100%\" stop-color=\"#6e7a94\"/></linearGradient></defs><circle cx=\"70\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"130\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"70\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"130\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"100\" cy=\"102\" r=\"50\" fill=\"url(#rFur__U)\"/><ellipse cx=\"100\" cy=\"116\" rx=\"38\" ry=\"30\" fill=\"#e6eaf2\"/><ellipse cx=\"100\" cy=\"120\" rx=\"30\" ry=\"22\" fill=\"#eef1f7\"/><ellipse cx=\"100\" cy=\"110\" rx=\"11\" ry=\"8\" fill=\"#3e3e48\"/><ellipse cx=\"96\" cy=\"108\" rx=\"3\" ry=\"2\" fill=\"#5e5e68\" opacity=\"0.7\"/><path d=\"M100 117 L100 126\" stroke=\"#3e3e48\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><circle cx=\"120\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><path d=\"M96 94 Q100 90 104 94\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" fill=\"none\"/><circle cx=\"80\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"120\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"83\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"123\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"77\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><circle cx=\"117\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><path d=\"M72 88 Q78 84 84 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M112 88 Q118 84 124 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M78 116 Q60 114 52 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M78 122 Q60 124 54 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 116 Q140 114 148 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 122 Q140 124 146 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M90 124 Q100 131 110 124\" stroke=\"#525c70\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Рен</div><p>На пет-проекте хватит fetch. Как только появляется авторизация, базовый адрес и единая обработка ошибок на десятках запросов — axios экономит кучу копипасты. Это вопрос масштаба, а не вкуса.</p></div></div></section><div class=\"meme-row\"><span class=\"meme\"><span class=\"mava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"mFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#46b877\"/><stop offset=\"100%\" stop-color=\"#359a5e\"/></linearGradient><radialGradient id=\"mCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#f0a890\" stop-opacity=\"0.45\"/><stop offset=\"100%\" stop-color=\"#f0a890\" stop-opacity=\"0\"/></radialGradient></defs><path d=\"M66 56 Q56 18 90 42 Q80 54 72 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M134 56 Q144 18 110 42 Q120 54 128 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M70 50 Q64 30 82 44 Z\" fill=\"#1f1f1f\"/><path d=\"M130 50 Q136 30 118 44 Z\" fill=\"#1f1f1f\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#mFur__U)\"/><path d=\"M100 64 Q66 72 70 112 Q100 128 130 112 Q134 72 100 64 Z\" fill=\"#f2f6f2\"/><ellipse cx=\"100\" cy=\"104\" rx=\"34\" ry=\"26\" fill=\"#f7faf7\"/><ellipse cx=\"74\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"126\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"100\" cy=\"108\" rx=\"6.5\" ry=\"5\" fill=\"#2a2a2a\"/><path d=\"M100 113 L100 120\" stroke=\"#2a2a2a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><ellipse cx=\"82\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><ellipse cx=\"118\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><circle cx=\"83\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"117\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"83\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"117\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"86\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"120\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"79\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"113\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M90 119 Q100 127 110 119\" stroke=\"#1f5a32\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M97 124 Q100 129 103 124 Z\" fill=\"#e87a8a\"/></svg></span>fetch не кинул ошибку на 500 — сервер же ответил. Спасибо, fetch, ты настоящий друг.</span></div><section><div class=\"sec-num\">03 · ASYNC / AWAIT</div><h2>Как читать асинхронный код</h2><p>Запрос идёт время. JS не стоит и не ждёт — он идёт дальше, а результат приходит потом. <code>async/await</code> позволяет писать асинхронный код так, будто он синхронный: сверху вниз, по-человечески.</p><div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">async.js</span><button class=\"runbtn\" onclick=\"runJS(this)\" data-src=\"function%20getData%28%29%20%7B%0A%20%20%2F%2F%20%D0%B8%D0%BC%D0%B8%D1%82%D0%B8%D1%80%D1%83%D0%B5%D0%BC%20%D0%B7%D0%B0%D0%B4%D0%B5%D1%80%D0%B6%D0%BA%D1%83%20%D1%81%D0%B5%D1%82%D0%B8%20%D0%BD%D0%B0%20600%D0%BC%D1%81%0A%20%20return%20new%20Promise%28resolve%20%3D%3E%20%7B%0A%20%20%20%20setTimeout%28%28%29%20%3D%3E%20resolve%28%7B%20name%3A%20%27%D0%90%D0%BD%D1%8F%27%2C%20online%3A%20true%20%7D%29%2C%20600%29%3B%0A%20%20%7D%29%3B%0A%7D%0A%0Aconsole.log%28%271.%20%D0%BE%D1%82%D0%BF%D1%80%D0%B0%D0%B2%D0%BB%D1%8F%D1%8E%20%D0%B7%D0%B0%D0%BF%D1%80%D0%BE%D1%81...%27%29%3B%0Aconst%20user%20%3D%20await%20getData%28%29%3B%20%20%20%20%20%20%20%20%2F%2F%20%D1%82%D1%83%D1%82%20%D0%BA%D0%BE%D0%B4%20%22%D0%B6%D0%B4%D1%91%D1%82%22%20%D0%BD%D0%B5%20%D0%B1%D0%BB%D0%BE%D0%BA%D0%B8%D1%80%D1%83%D1%8F%0Aconsole.log%28%272.%20%D0%BF%D1%80%D0%B8%D1%88%D1%91%D0%BB%20%D0%BE%D1%82%D0%B2%D0%B5%D1%82%3A%27%2C%20user.name%29%3B%0Aconsole.log%28%273.%20%D0%BF%D0%BE%D0%B5%D1%85%D0%B0%D0%BB%D0%B8%20%D0%B4%D0%B0%D0%BB%D1%8C%D1%88%D0%B5%27%29%3B\"><span>▶</span><span class=\"rlabel\">Запустить</span></button></div>\n  <pre><code><span class=\"tk\">function</span> <span class=\"tf\">getData</span><span class=\"tx\">(</span><span class=\"tx\">)</span> <span class=\"tx\">{</span>\n  <span class=\"tc\">// имитируем задержку сети на 600мс</span>\n  <span class=\"tk\">return</span> <span class=\"tk\">new</span> <span class=\"ty\">Promise</span><span class=\"tx\">(</span><span class=\"tx\">resolve</span> <span class=\"to\">=&gt;</span> <span class=\"tx\">{</span>\n    <span class=\"tf\">setTimeout</span><span class=\"tx\">(</span><span class=\"tx\">(</span><span class=\"tx\">)</span> <span class=\"to\">=&gt;</span> <span class=\"tf\">resolve</span><span class=\"tx\">(</span><span class=\"tx\">{</span> <span class=\"tx\">name</span><span class=\"to\">:</span> <span class=\"ts2\">'Аня'</span><span class=\"tx\">,</span> <span class=\"tx\">online</span><span class=\"to\">:</span> <span class=\"tn\">true</span> <span class=\"tx\">}</span><span class=\"tx\">)</span><span class=\"tx\">,</span> <span class=\"tn\">600</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n  <span class=\"tx\">}</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">}</span>\n\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"ts2\">'1. отправляю запрос...'</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tk\">const</span> <span class=\"tx\">user</span> <span class=\"to\">=</span> <span class=\"tk\">await</span> <span class=\"tf\">getData</span><span class=\"tx\">(</span><span class=\"tx\">)</span><span class=\"tx\">;</span>        <span class=\"tc\">// тут код \"ждёт\" не блокируя</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"ts2\">'2. пришёл ответ:'</span><span class=\"tx\">,</span> <span class=\"tx\">user</span><span class=\"tx\">.</span><span class=\"tx\">name</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"ts2\">'3. поехали дальше'</span><span class=\"tx\">)</span><span class=\"tx\">;</span></code></pre>\n  <div class=\"console\"><div class=\"console-inner\"><div class=\"console-label\">console</div></div></div>\n</div><div class=\"box tip\"><div class=\"bt\">Мнемоника</div><p>async на функции = «внутри будут ожидания». await перед вызовом = «постой тут, пока не придёт результат». Всё, что после await, выполнится только когда данные на руках.</p></div></section><div class=\"meme-row\"><span class=\"meme\"><span class=\"mava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"mFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#46b877\"/><stop offset=\"100%\" stop-color=\"#359a5e\"/></linearGradient><radialGradient id=\"mCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#f0a890\" stop-opacity=\"0.45\"/><stop offset=\"100%\" stop-color=\"#f0a890\" stop-opacity=\"0\"/></radialGradient></defs><path d=\"M66 56 Q56 18 90 42 Q80 54 72 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M134 56 Q144 18 110 42 Q120 54 128 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M70 50 Q64 30 82 44 Z\" fill=\"#1f1f1f\"/><path d=\"M130 50 Q136 30 118 44 Z\" fill=\"#1f1f1f\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#mFur__U)\"/><path d=\"M100 64 Q66 72 70 112 Q100 128 130 112 Q134 72 100 64 Z\" fill=\"#f2f6f2\"/><ellipse cx=\"100\" cy=\"104\" rx=\"34\" ry=\"26\" fill=\"#f7faf7\"/><ellipse cx=\"74\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"126\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"100\" cy=\"108\" rx=\"6.5\" ry=\"5\" fill=\"#2a2a2a\"/><path d=\"M100 113 L100 120\" stroke=\"#2a2a2a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><ellipse cx=\"82\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><ellipse cx=\"118\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><circle cx=\"83\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"117\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"83\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"117\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"86\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"120\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"79\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"113\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M90 119 Q100 127 110 119\" stroke=\"#1f5a32\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M97 124 Q100 129 103 124 Z\" fill=\"#e87a8a\"/></svg></span>async/await придумали, чтобы перестать рисовать лесенку из .then().then().then()</span></div><div class=\"pager\"><button onclick=\"pager(-1)\">← Сеть</button><button onclick=\"pager(1)\" class=\"next\">Дальше: типы и Zod →</button></div></div>\n<div class=\"page\" id=\"page-types\"><div class=\"phero\"><div class=\"kicker\">Раздел 03 · Типы</div><h1>Объекты, классы и Zod</h1><p>Данные приехали. Теперь надо их описать типами и не доверять серверу на слово. Разберём объекты vs классы, почему TS-типы исчезают в рантайме, и как Zod проверяет данные по-настоящему.</p></div><div class=\"say kyle\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"kFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#b87a48\"/><stop offset=\"100%\" stop-color=\"#9a6238\"/></linearGradient><radialGradient id=\"kCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#e8957a\" stop-opacity=\"0.5\"/><stop offset=\"100%\" stop-color=\"#e8957a\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"58\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"142\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"64\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><ellipse cx=\"136\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><path d=\"M68 58 Q60 22 88 44 Q80 56 72 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M132 58 Q140 22 112 44 Q120 56 128 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M71 54 Q67 36 82 48 Z\" fill=\"#3a3230\"/><path d=\"M129 54 Q133 36 118 48 Z\" fill=\"#3a3230\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#kFur__U)\"/><path d=\"M100 56 Q62 62 60 104 Q100 92 140 104 Q138 62 100 56 Z\" fill=\"#e8cfa8\"/><ellipse cx=\"100\" cy=\"98\" rx=\"40\" ry=\"30\" fill=\"#ecd6b4\"/><ellipse cx=\"100\" cy=\"116\" rx=\"30\" ry=\"24\" fill=\"#f2e1c8\"/><ellipse cx=\"72\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"128\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"100\" cy=\"106\" rx=\"9\" ry=\"7\" fill=\"#3a2a26\"/><ellipse cx=\"97\" cy=\"104\" rx=\"3\" ry=\"2\" fill=\"#5a4a44\" opacity=\"0.7\"/><ellipse cx=\"80\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><ellipse cx=\"120\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><circle cx=\"81\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"119\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"81\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"119\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"84\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"122\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"77\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"115\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M88 120 Q100 130 112 120\" stroke=\"#7a5238\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M74 142 Q100 154 126 142\" stroke=\"#9a4030\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"100\" cy=\"151\" r=\"7\" fill=\"#f0c44e\"/><circle cx=\"100\" cy=\"153\" r=\"1.8\" fill=\"#9a7a1a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Кайл</div><p>Данные в JS живут в объектах. TypeScript добавляет к ним типы — описание формы. Но есть подвох на границе с сервером, и его закрывает Zod. Разберём по порядку.</p></div></div><section><div class=\"sec-num\">01 · ОБЪЕКТЫ</div><h2>Базовая структура данных</h2><p class=\"lead\">Объект — это набор пар «ключ: значение». 90% данных во фронте — объекты и массивы объектов.</p><div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">object.js</span><button class=\"runbtn\" onclick=\"runJS(this)\" data-src=\"%2F%2F%20%D0%BE%D0%B1%D1%8A%D0%B5%D0%BA%D1%82%20%E2%80%94%20%D0%B4%D0%B0%D0%BD%D0%BD%D1%8B%D0%B5%20%D1%81%D0%B3%D1%80%D1%83%D0%BF%D0%BF%D0%B8%D1%80%D0%BE%D0%B2%D0%B0%D0%BD%D1%8B%20%D0%BF%D0%BE%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D1%83%0Aconst%20user%20%3D%20%7B%0A%20%20name%3A%20%27%D0%90%D0%BD%D1%8F%27%2C%0A%20%20age%3A%2027%2C%0A%20%20isAdmin%3A%20false%2C%0A%7D%3B%0A%0Aconsole.log%28user.name%29%3B%20%20%20%20%20%20%20%20%20%20%2F%2F%20%D0%B4%D0%BE%D1%81%D1%82%D1%83%D0%BF%20%D0%BF%D0%BE%20%D0%BA%D0%BB%D1%8E%D1%87%D1%83%0Auser.age%20%3D%2028%3B%20%20%20%20%20%20%20%20%20%20%20%20%20%20%20%20%20%20%20%2F%2F%20%D0%BC%D0%B5%D0%BD%D1%8F%D0%B5%D0%BC%20%D0%BF%D0%BE%D0%BB%D0%B5%0A%0A%2F%2F%20%D0%BC%D0%B0%D1%81%D1%81%D0%B8%D0%B2%20%D0%BE%D0%B1%D1%8A%D0%B5%D0%BA%D1%82%D0%BE%D0%B2%20%E2%80%94%20%D1%82%D0%BE%2C%20%D1%87%D1%82%D0%BE%20%D0%BE%D0%B1%D1%8B%D1%87%D0%BD%D0%BE%20%D0%BF%D1%80%D0%B8%D1%85%D0%BE%D0%B4%D0%B8%D1%82%20%D1%81%20%D1%81%D0%B5%D1%80%D0%B2%D0%B5%D1%80%D0%B0%0Aconst%20users%20%3D%20%5B%0A%20%20%7B%20name%3A%20%27%D0%90%D0%BD%D1%8F%27%2C%20age%3A%2027%20%7D%2C%0A%20%20%7B%20name%3A%20%27%D0%9C%D0%B0%D0%BA%D1%81%27%2C%20age%3A%2031%20%7D%2C%0A%5D%3B%0Aconsole.log%28users.map%28u%20%3D%3E%20u.name%29%29%3B%20%20%20%2F%2F%20%5B%27%D0%90%D0%BD%D1%8F%27%2C%20%27%D0%9C%D0%B0%D0%BA%D1%81%27%5D\"><span>▶</span><span class=\"rlabel\">Запустить</span></button></div>\n  <pre><code><span class=\"tc\">// объект — данные сгруппированы по смыслу</span>\n<span class=\"tk\">const</span> <span class=\"tx\">user</span> <span class=\"to\">=</span> <span class=\"tx\">{</span>\n  <span class=\"tx\">name</span><span class=\"to\">:</span> <span class=\"ts2\">'Аня'</span><span class=\"tx\">,</span>\n  <span class=\"tx\">age</span><span class=\"to\">:</span> <span class=\"tn\">27</span><span class=\"tx\">,</span>\n  <span class=\"tx\">isAdmin</span><span class=\"to\">:</span> <span class=\"tn\">false</span><span class=\"tx\">,</span>\n<span class=\"tx\">}</span><span class=\"tx\">;</span>\n\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tx\">user</span><span class=\"tx\">.</span><span class=\"tx\">name</span><span class=\"tx\">)</span><span class=\"tx\">;</span>          <span class=\"tc\">// доступ по ключу</span>\n<span class=\"tx\">user</span><span class=\"tx\">.</span><span class=\"tx\">age</span> <span class=\"to\">=</span> <span class=\"tn\">28</span><span class=\"tx\">;</span>                   <span class=\"tc\">// меняем поле</span>\n\n<span class=\"tc\">// массив объектов — то, что обычно приходит с сервера</span>\n<span class=\"tk\">const</span> <span class=\"tx\">users</span> <span class=\"to\">=</span> <span class=\"tx\">[</span>\n  <span class=\"tx\">{</span> <span class=\"tx\">name</span><span class=\"to\">:</span> <span class=\"ts2\">'Аня'</span><span class=\"tx\">,</span> <span class=\"tx\">age</span><span class=\"to\">:</span> <span class=\"tn\">27</span> <span class=\"tx\">}</span><span class=\"tx\">,</span>\n  <span class=\"tx\">{</span> <span class=\"tx\">name</span><span class=\"to\">:</span> <span class=\"ts2\">'Макс'</span><span class=\"tx\">,</span> <span class=\"tx\">age</span><span class=\"to\">:</span> <span class=\"tn\">31</span> <span class=\"tx\">}</span><span class=\"tx\">,</span>\n<span class=\"tx\">]</span><span class=\"tx\">;</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tx\">users</span><span class=\"tx\">.</span><span class=\"tf\">map</span><span class=\"tx\">(</span><span class=\"tx\">u</span> <span class=\"to\">=&gt;</span> <span class=\"tx\">u</span><span class=\"tx\">.</span><span class=\"tx\">name</span><span class=\"tx\">)</span><span class=\"tx\">)</span><span class=\"tx\">;</span>   <span class=\"tc\">// ['Аня', 'Макс']</span></code></pre>\n  <div class=\"console\"><div class=\"console-inner\"><div class=\"console-label\">console</div></div></div>\n</div></section><section><div class=\"sec-num\">02 · КЛАССЫ vs ИНТЕРФЕЙСЫ</div><h2>Когда что</h2><p>Тут новички путаются. Разница простая по сути.</p><ul class=\"plain\"><li><strong>interface / type</strong> — это только <em>описание формы</em>. Существует на этапе компиляции, в рантайме его нет. Не создаёт ничего, просто говорит «объект должен выглядеть так».</li><li><strong>class</strong> — это <em>фабрика объектов с поведением</em>. Существует в рантайме, через <code>new</code> создаёт экземпляры, держит данные и методы вместе.</li></ul><div class=\"cmp\"><div class=\"ch a\">interface — форма данных</div><div class=\"ch b\">class — объект с логикой</div><div class=\"cc\">interface User {\n  name: string;\n  age: number;\n}\n\n// просто контракт, кода нет</div><div class=\"cc\">class User {\n  constructor(public name: string) {}\n  greet() {\n    return `Привет, ${this.name}`;\n  }\n}\n// new User('Аня').greet()</div></div><div class=\"box info\"><div class=\"bt\">Практика фронта</div><p>В React-проектах ты в 95% случаев берёшь interface/type для описания данных (props, ответы API, состояние). Классы всплывают редко — для сервисов или сложной доменной логики. Не плоди классы там, где хватает интерфейса.</p></div></section><section><div class=\"sec-num\">03 · ГЛАВНЫЙ ПОДВОХ</div><h2>Типы врут на границе сети</h2><p>Вот ловушка, на которую попадаются все. Ты пишешь тип ответа сервера. TS верит тебе на слово и больше ничего не проверяет — <strong>типы исчезают при компиляции</strong>. А сервер возьмёт и пришлёт не то. И ты узнаешь об этом, когда приложение уже упало у пользователя.</p><div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">lie.js</span><button class=\"runbtn\" onclick=\"runJS(this)\" data-src=\"%2F%2F%20%D1%82%D1%8B%20%D0%94%D0%A3%D0%9C%D0%90%D0%95%D0%A8%D0%AC%20%D1%87%D1%82%D0%BE%20age%20%E2%80%94%20%D1%87%D0%B8%D1%81%D0%BB%D0%BE%20%28%D1%82%D0%B0%D0%BA%20%D0%BD%D0%B0%D0%BF%D0%B8%D1%81%D0%B0%D0%BD%D0%BE%20%D0%B2%20%D1%82%D0%B8%D0%BF%D0%B5%29%0A%2F%2F%20%D0%BD%D0%BE%20%D1%81%D0%B5%D1%80%D0%B2%D0%B5%D1%80%20%D0%BF%D1%80%D0%B8%D1%81%D0%BB%D0%B0%D0%BB%20%D1%81%D1%82%D1%80%D0%BE%D0%BA%D1%83.%20TS%20%D1%83%D0%B6%D0%B5%20%D0%BD%D0%B8%D1%87%D0%B5%D0%B3%D0%BE%20%D0%BD%D0%B5%20%D0%BF%D1%80%D0%BE%D0%B2%D0%B5%D1%80%D1%8F%D0%B5%D1%82%20%D0%B2%20%D1%80%D0%B0%D0%BD%D1%82%D0%B0%D0%B9%D0%BC%D0%B5.%0Aconst%20fromServer%20%3D%20%7B%20name%3A%20%27%D0%90%D0%BD%D1%8F%27%2C%20age%3A%20%2727%27%20%7D%3B%20%20%20%2F%2F%20%E2%86%90%20%D1%81%D1%82%D1%80%D0%BE%D0%BA%D0%B0%21%0A%0A%2F%2F%20%D1%81%D1%87%D0%B8%D1%82%D0%B0%D0%B5%D0%BC%20%D1%81%D1%80%D0%B5%D0%B4%D0%BD%D0%B8%D0%B9%20%D0%B2%D0%BE%D0%B7%D1%80%D0%B0%D1%81%D1%82%20%E2%80%94%20%D0%B8%20%D0%BF%D0%BE%D0%BB%D1%83%D1%87%D0%B0%D0%B5%D0%BC%20%D0%BC%D1%83%D1%81%D0%BE%D1%80%0Aconst%20avg%20%3D%20%28fromServer.age%20%2B%203%29%3B%0Aconsole.log%28%27%D0%BE%D0%B6%D0%B8%D0%B4%D0%B0%D0%BB%D0%B8%2030%2C%20%D0%BF%D0%BE%D0%BB%D1%83%D1%87%D0%B8%D0%BB%D0%B8%3A%27%2C%20avg%29%3B%20%20%20%2F%2F%20%22273%22%20%E2%80%94%20%D1%81%D0%BA%D0%BB%D0%B5%D0%B9%D0%BA%D0%B0%20%D1%81%D1%82%D1%80%D0%BE%D0%BA%21%0Aconsole.log%28%27%D1%82%D0%B8%D0%BF%3A%27%2C%20typeof%20avg%29%3B%20%20%20%20%20%20%20%20%20%20%20%20%20%2F%2F%20string%0A%0A%2F%2F%20%D0%B1%D0%B0%D0%B3%20%D1%82%D0%B8%D1%85%D0%BE%20%D0%BF%D1%80%D0%BE%D1%82%D1%91%D0%BA%20%D0%B4%D0%B0%D0%BB%D1%8C%D1%88%D0%B5%20%D0%BF%D0%BE%20%D0%BF%D1%80%D0%B8%D0%BB%D0%BE%D0%B6%D0%B5%D0%BD%D0%B8%D1%8E\"><span>▶</span><span class=\"rlabel\">Запустить</span></button></div>\n  <pre><code><span class=\"tc\">// ты ДУМАЕШЬ что age — число (так написано в типе)</span>\n<span class=\"tc\">// но сервер прислал строку. TS уже ничего не проверяет в рантайме.</span>\n<span class=\"tk\">const</span> <span class=\"tx\">fromServer</span> <span class=\"to\">=</span> <span class=\"tx\">{</span> <span class=\"tx\">name</span><span class=\"to\">:</span> <span class=\"ts2\">'Аня'</span><span class=\"tx\">,</span> <span class=\"tx\">age</span><span class=\"to\">:</span> <span class=\"ts2\">'27'</span> <span class=\"tx\">}</span><span class=\"tx\">;</span>   <span class=\"tc\">// ← строка!</span>\n\n<span class=\"tc\">// считаем средний возраст — и получаем мусор</span>\n<span class=\"tk\">const</span> <span class=\"tx\">avg</span> <span class=\"to\">=</span> <span class=\"tx\">(</span><span class=\"tx\">fromServer</span><span class=\"tx\">.</span><span class=\"tx\">age</span> <span class=\"to\">+</span> <span class=\"tn\">3</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"ts2\">'ожидали 30, получили:'</span><span class=\"tx\">,</span> <span class=\"tx\">avg</span><span class=\"tx\">)</span><span class=\"tx\">;</span>   <span class=\"tc\">// \"273\" — склейка строк!</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"ts2\">'тип:'</span><span class=\"tx\">,</span> <span class=\"tk\">typeof</span> <span class=\"tx\">avg</span><span class=\"tx\">)</span><span class=\"tx\">;</span>             <span class=\"tc\">// string</span>\n\n<span class=\"tc\">// баг тихо протёк дальше по приложению</span></code></pre>\n  <div class=\"console\"><div class=\"console-inner\"><div class=\"console-label\">console</div></div></div>\n</div><div class=\"say maxi\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"mFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#46b877\"/><stop offset=\"100%\" stop-color=\"#359a5e\"/></linearGradient><radialGradient id=\"mCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#f0a890\" stop-opacity=\"0.45\"/><stop offset=\"100%\" stop-color=\"#f0a890\" stop-opacity=\"0\"/></radialGradient></defs><path d=\"M66 56 Q56 18 90 42 Q80 54 72 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M134 56 Q144 18 110 42 Q120 54 128 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M70 50 Q64 30 82 44 Z\" fill=\"#1f1f1f\"/><path d=\"M130 50 Q136 30 118 44 Z\" fill=\"#1f1f1f\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#mFur__U)\"/><path d=\"M100 64 Q66 72 70 112 Q100 128 130 112 Q134 72 100 64 Z\" fill=\"#f2f6f2\"/><ellipse cx=\"100\" cy=\"104\" rx=\"34\" ry=\"26\" fill=\"#f7faf7\"/><ellipse cx=\"74\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"126\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"100\" cy=\"108\" rx=\"6.5\" ry=\"5\" fill=\"#2a2a2a\"/><path d=\"M100 113 L100 120\" stroke=\"#2a2a2a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><ellipse cx=\"82\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><ellipse cx=\"118\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><circle cx=\"83\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"117\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"83\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"117\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"86\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"120\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"79\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"113\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M90 119 Q100 127 110 119\" stroke=\"#1f5a32\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M97 124 Q100 129 103 124 Z\" fill=\"#e87a8a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Макси</div><p>Видишь? TS на этапе написания зелёный, всё «типизировано». А в рантайме сервер подсунул строку, и 27 + 3 стало \"273\". Типы не защищают от реальных данных. Нужен сторож на входе.</p></div></div></section><div class=\"meme-row\"><span class=\"meme\"><span class=\"mava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"mFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#46b877\"/><stop offset=\"100%\" stop-color=\"#359a5e\"/></linearGradient><radialGradient id=\"mCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#f0a890\" stop-opacity=\"0.45\"/><stop offset=\"100%\" stop-color=\"#f0a890\" stop-opacity=\"0\"/></radialGradient></defs><path d=\"M66 56 Q56 18 90 42 Q80 54 72 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M134 56 Q144 18 110 42 Q120 54 128 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M70 50 Q64 30 82 44 Z\" fill=\"#1f1f1f\"/><path d=\"M130 50 Q136 30 118 44 Z\" fill=\"#1f1f1f\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#mFur__U)\"/><path d=\"M100 64 Q66 72 70 112 Q100 128 130 112 Q134 72 100 64 Z\" fill=\"#f2f6f2\"/><ellipse cx=\"100\" cy=\"104\" rx=\"34\" ry=\"26\" fill=\"#f7faf7\"/><ellipse cx=\"74\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"126\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"100\" cy=\"108\" rx=\"6.5\" ry=\"5\" fill=\"#2a2a2a\"/><path d=\"M100 113 L100 120\" stroke=\"#2a2a2a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><ellipse cx=\"82\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><ellipse cx=\"118\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><circle cx=\"83\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"117\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"83\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"117\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"86\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"120\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"79\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"113\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M90 119 Q100 127 110 119\" stroke=\"#1f5a32\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M97 124 Q100 129 103 124 Z\" fill=\"#e87a8a\"/></svg></span>Сервер поклялся вернуть число. Сервер соврал.</span></div><section><div class=\"sec-num\">04 · ZOD</div><h2>Валидация, которая работает в рантайме</h2><p>Zod — это схема данных, которая <strong>проверяет по-настоящему, во время выполнения</strong>. Ты описываешь форму один раз, и Zod на входе режет всё, что не подходит. Бонус: из схемы автоматически выводится TS-тип через <code>z.infer</code> — один источник правды.</p><div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">schema.ts</span></div>\n  <pre><code><span class=\"tk\">import</span> <span class=\"tx\">{</span> <span class=\"tx\">z</span> <span class=\"tx\">}</span> <span class=\"tk\">from</span> <span class=\"ts2\">'zod'</span><span class=\"tx\">;</span>\n\n<span class=\"tc\">// одна схема = и проверка в рантайме, и тип для TS</span>\n<span class=\"tk\">const</span> <span class=\"ty\">UserSchema</span> <span class=\"to\">=</span> <span class=\"tx\">z</span><span class=\"tx\">.</span><span class=\"ty\">object</span><span class=\"tx\">(</span><span class=\"tx\">{</span>\n  <span class=\"tx\">name</span><span class=\"to\">:</span> <span class=\"tx\">z</span><span class=\"tx\">.</span><span class=\"ty\">string</span><span class=\"tx\">(</span><span class=\"tx\">)</span><span class=\"tx\">.</span><span class=\"tf\">min</span><span class=\"tx\">(</span><span class=\"tn\">1</span><span class=\"tx\">)</span><span class=\"tx\">,</span>\n  <span class=\"tx\">age</span><span class=\"to\">:</span> <span class=\"tx\">z</span><span class=\"tx\">.</span><span class=\"ty\">number</span><span class=\"tx\">(</span><span class=\"tx\">)</span><span class=\"tx\">.</span><span class=\"tf\">min</span><span class=\"tx\">(</span><span class=\"tn\">0</span><span class=\"tx\">)</span><span class=\"tx\">.</span><span class=\"tf\">max</span><span class=\"tx\">(</span><span class=\"tn\">120</span><span class=\"tx\">)</span><span class=\"tx\">,</span>\n  <span class=\"tx\">email</span><span class=\"to\">:</span> <span class=\"tx\">z</span><span class=\"tx\">.</span><span class=\"ty\">string</span><span class=\"tx\">(</span><span class=\"tx\">)</span><span class=\"tx\">.</span><span class=\"tf\">email</span><span class=\"tx\">(</span><span class=\"tx\">)</span><span class=\"tx\">,</span>\n<span class=\"tx\">}</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n\n<span class=\"tc\">// тип выводится из схемы автоматически</span>\n<span class=\"tk\">type</span> <span class=\"ty\">User</span> <span class=\"to\">=</span> <span class=\"tx\">z</span><span class=\"tx\">.</span><span class=\"tx\">infer</span><span class=\"to\">&lt;</span><span class=\"tk\">typeof</span> <span class=\"ty\">UserSchema</span><span class=\"to\">&gt;</span><span class=\"tx\">;</span>\n\n<span class=\"tc\">// на границе сети: проверяем ответ ДО того как доверять</span>\n<span class=\"tk\">const</span> <span class=\"tx\">res</span> <span class=\"to\">=</span> <span class=\"tk\">await</span> <span class=\"tf\">fetch</span><span class=\"tx\">(</span><span class=\"ts2\">'/api/user/2'</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tk\">const</span> <span class=\"tx\">data</span> <span class=\"to\">=</span> <span class=\"tk\">await</span> <span class=\"tx\">res</span><span class=\"tx\">.</span><span class=\"tf\">json</span><span class=\"tx\">(</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tk\">const</span> <span class=\"tx\">parsed</span> <span class=\"to\">=</span> <span class=\"ty\">UserSchema</span><span class=\"tx\">.</span><span class=\"tf\">safeParse</span><span class=\"tx\">(</span><span class=\"tx\">data</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n\n<span class=\"tk\">if</span> <span class=\"tx\">(</span><span class=\"tx\">parsed</span><span class=\"tx\">.</span><span class=\"tx\">success</span><span class=\"tx\">)</span> <span class=\"tx\">{</span>\n  <span class=\"tf\">use</span><span class=\"tx\">(</span><span class=\"tx\">parsed</span><span class=\"tx\">.</span><span class=\"tx\">data</span><span class=\"tx\">)</span><span class=\"tx\">;</span>   <span class=\"tc\">// тут уже гарантированно правильная форма</span>\n<span class=\"tx\">}</span> <span class=\"tk\">else</span> <span class=\"tx\">{</span>\n  <span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">error</span><span class=\"tx\">(</span><span class=\"tx\">parsed</span><span class=\"tx\">.</span><span class=\"tx\">error</span><span class=\"tx\">)</span><span class=\"tx\">;</span>   <span class=\"tc\">// сервер прислал мусор — ловим тут</span>\n<span class=\"tx\">}</span></code></pre>\n</div><div class=\"say ren\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"rFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#8893ab\"/><stop offset=\"100%\" stop-color=\"#6e7a94\"/></linearGradient></defs><circle cx=\"70\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"130\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"70\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"130\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"100\" cy=\"102\" r=\"50\" fill=\"url(#rFur__U)\"/><ellipse cx=\"100\" cy=\"116\" rx=\"38\" ry=\"30\" fill=\"#e6eaf2\"/><ellipse cx=\"100\" cy=\"120\" rx=\"30\" ry=\"22\" fill=\"#eef1f7\"/><ellipse cx=\"100\" cy=\"110\" rx=\"11\" ry=\"8\" fill=\"#3e3e48\"/><ellipse cx=\"96\" cy=\"108\" rx=\"3\" ry=\"2\" fill=\"#5e5e68\" opacity=\"0.7\"/><path d=\"M100 117 L100 126\" stroke=\"#3e3e48\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><circle cx=\"120\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><path d=\"M96 94 Q100 90 104 94\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" fill=\"none\"/><circle cx=\"80\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"120\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"83\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"123\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"77\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><circle cx=\"117\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><path d=\"M72 88 Q78 84 84 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M112 88 Q118 84 124 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M78 116 Q60 114 52 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M78 122 Q60 124 54 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 116 Q140 114 148 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 122 Q140 124 146 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M90 124 Q100 131 110 124\" stroke=\"#525c70\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Рен</div><p>Ниже — живая песочница. Логика та же, что у Zod: схема ждёт непустое имя, возраст-число 0..120 и валидный email. Подсунь сломанные данные и посмотри, как валидатор их завернёт.</p></div></div><div class=\"zod\"><div style=\"font-family:JetBrains Mono,monospace;font-size:11px;color:var(--muted);margin-bottom:8px;\">схема: { name: string(min 1), age: number(0..120), email: email }</div><textarea id=\"zod-input\">{\n  \"name\": \"Аня\",\n  \"age\": 27,\n  \"email\": \"anya@yandex.ru\"\n}</textarea><div class=\"zrow\"><button class=\"minibtn\" onclick=\"runZod()\">▶ Проверить схемой</button><button class=\"minibtn ghost\" onclick=\"zodPreset('good')\">подставить валидные</button><button class=\"minibtn ghost\" onclick=\"zodPreset('bad')\">подставить битые</button></div><div class=\"zod-result idle\" id=\"zod-result\">результат проверки появится здесь</div></div><div class=\"box tip\"><div class=\"bt\">Где это живёт в проекте</div><p>Zod-схемы кладут в слой данных — рядом с запросами, в api/model сущности. Граница «сеть → приложение» это единственное место, где данные надо валидировать. Прошли схему — дальше им можно верить везде.</p></div></section><div class=\"meme-row\"><span class=\"meme\"><span class=\"mava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"rFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#8893ab\"/><stop offset=\"100%\" stop-color=\"#6e7a94\"/></linearGradient></defs><circle cx=\"70\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"130\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"70\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"130\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"100\" cy=\"102\" r=\"50\" fill=\"url(#rFur__U)\"/><ellipse cx=\"100\" cy=\"116\" rx=\"38\" ry=\"30\" fill=\"#e6eaf2\"/><ellipse cx=\"100\" cy=\"120\" rx=\"30\" ry=\"22\" fill=\"#eef1f7\"/><ellipse cx=\"100\" cy=\"110\" rx=\"11\" ry=\"8\" fill=\"#3e3e48\"/><ellipse cx=\"96\" cy=\"108\" rx=\"3\" ry=\"2\" fill=\"#5e5e68\" opacity=\"0.7\"/><path d=\"M100 117 L100 126\" stroke=\"#3e3e48\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><circle cx=\"120\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><path d=\"M96 94 Q100 90 104 94\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" fill=\"none\"/><circle cx=\"80\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"120\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"83\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"123\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"77\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><circle cx=\"117\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><path d=\"M72 88 Q78 84 84 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M112 88 Q118 84 124 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M78 116 Q60 114 52 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M78 122 Q60 124 54 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 116 Q140 114 148 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 122 Q140 124 146 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M90 124 Q100 131 110 124\" stroke=\"#525c70\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/></svg></span>any — это способ сказать TypeScript «отстань», а потом плакать в проде</span></div><div class=\"pager\"><button onclick=\"pager(-1)\">← Инструменты</button><button onclick=\"pager(1)\" class=\"next\">Дальше: дата-менеджмент →</button></div></div>\n<div class=\"page\" id=\"page-data\"><div class=\"phero\"><div class=\"kicker\">Раздел 04 · Состояние</div><h1>Дата-менеджмент: Zustand vs Redux</h1><p>Данные получены и проверены. Где они теперь живут, пока приложение работает? Разберём теорию состояния, проблему prop drilling, и два инструмента: минималистичный Zustand и классический Redux. Со живым стором, который можно потыкать.</p></div><div class=\"say kyle\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"kFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#b87a48\"/><stop offset=\"100%\" stop-color=\"#9a6238\"/></linearGradient><radialGradient id=\"kCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#e8957a\" stop-opacity=\"0.5\"/><stop offset=\"100%\" stop-color=\"#e8957a\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"58\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"142\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"64\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><ellipse cx=\"136\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><path d=\"M68 58 Q60 22 88 44 Q80 56 72 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M132 58 Q140 22 112 44 Q120 56 128 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M71 54 Q67 36 82 48 Z\" fill=\"#3a3230\"/><path d=\"M129 54 Q133 36 118 48 Z\" fill=\"#3a3230\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#kFur__U)\"/><path d=\"M100 56 Q62 62 60 104 Q100 92 140 104 Q138 62 100 56 Z\" fill=\"#e8cfa8\"/><ellipse cx=\"100\" cy=\"98\" rx=\"40\" ry=\"30\" fill=\"#ecd6b4\"/><ellipse cx=\"100\" cy=\"116\" rx=\"30\" ry=\"24\" fill=\"#f2e1c8\"/><ellipse cx=\"72\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"128\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"100\" cy=\"106\" rx=\"9\" ry=\"7\" fill=\"#3a2a26\"/><ellipse cx=\"97\" cy=\"104\" rx=\"3\" ry=\"2\" fill=\"#5a4a44\" opacity=\"0.7\"/><ellipse cx=\"80\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><ellipse cx=\"120\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><circle cx=\"81\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"119\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"81\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"119\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"84\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"122\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"77\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"115\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M88 120 Q100 130 112 120\" stroke=\"#7a5238\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M74 142 Q100 154 126 142\" stroke=\"#9a4030\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"100\" cy=\"151\" r=\"7\" fill=\"#f0c44e\"/><circle cx=\"100\" cy=\"153\" r=\"1.8\" fill=\"#9a7a1a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Кайл</div><p>Состояние — это память приложения прямо сейчас: что в корзине, кто залогинен, какой фильтр выбран. Вопрос дата-менеджмента простой: где это хранить, чтобы любой компонент мог взять и не утонуть.</p></div></div><section><div class=\"sec-num\">01 · ТЕОРИЯ</div><h2>Два вида состояния</h2><p>Сначала важное различие, которое экономит кучу нервов:</p><ul class=\"plain\"><li><strong>Server state</strong> — данные, которые живут на сервере, а у тебя их копия: список товаров, профиль. Их надо грузить, кэшировать, обновлять (этим часто рулит отдельный инструмент типа TanStack Query).</li><li><strong>Client state</strong> — то, что существует только в браузере: открыто ли меню, что в корзине, тема. Вот этим и занимаются Zustand / Redux.</li></ul><div class=\"box warn\"><div class=\"bt\">Проблема prop drilling</div><p>Без стора состояние приходится протаскивать пропсами через 5 уровней компонентов: A → B → C → D → E, хотя нужно только A и E. Промежуточные компоненты тащат чужие пропсы просто как курьеры. Стор убирает этот туннель: положил в одно место, взял где угодно.</p></div></section><section><div class=\"sec-num\">02 · ZUSTAND</div><h2>Стор как один объект</h2><p class=\"lead\">Zustand до неприличия простой. Один <code>create</code>, внутри состояние и функции, которые его меняют. Никаких провайдеров, редьюсеров и церемоний.</p><div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">cartStore.ts</span></div>\n  <pre><code><span class=\"tk\">import</span> <span class=\"tx\">{</span> <span class=\"tx\">create</span> <span class=\"tx\">}</span> <span class=\"tk\">from</span> <span class=\"ts2\">'zustand'</span><span class=\"tx\">;</span>\n\n<span class=\"tc\">// весь стор — один хук</span>\n<span class=\"tk\">export</span> <span class=\"tk\">const</span> <span class=\"tx\">useCart</span> <span class=\"to\">=</span> <span class=\"tf\">create</span><span class=\"tx\">(</span><span class=\"tx\">(</span><span class=\"tk\">set</span><span class=\"tx\">)</span> <span class=\"to\">=&gt;</span> <span class=\"tx\">(</span><span class=\"tx\">{</span>\n  <span class=\"tx\">items</span><span class=\"to\">:</span> <span class=\"tx\">[</span><span class=\"tx\">]</span><span class=\"tx\">,</span>\n  <span class=\"tx\">total</span><span class=\"to\">:</span> <span class=\"tn\">0</span><span class=\"tx\">,</span>\n  <span class=\"tc\">// экшены прямо тут, рядом с данными</span>\n  <span class=\"tx\">add</span><span class=\"to\">:</span> <span class=\"tx\">(</span><span class=\"tx\">product</span><span class=\"tx\">)</span> <span class=\"to\">=&gt;</span> <span class=\"tk\">set</span><span class=\"tx\">(</span><span class=\"tx\">(</span><span class=\"tx\">state</span><span class=\"tx\">)</span> <span class=\"to\">=&gt;</span> <span class=\"tx\">(</span><span class=\"tx\">{</span>\n    <span class=\"tx\">items</span><span class=\"to\">:</span> <span class=\"tx\">[</span><span class=\"to\">...</span><span class=\"tx\">state</span><span class=\"tx\">.</span><span class=\"tx\">items</span><span class=\"tx\">,</span> <span class=\"tx\">product</span><span class=\"tx\">]</span><span class=\"tx\">,</span>\n    <span class=\"tx\">total</span><span class=\"to\">:</span> <span class=\"tx\">state</span><span class=\"tx\">.</span><span class=\"tx\">total</span> <span class=\"to\">+</span> <span class=\"tx\">product</span><span class=\"tx\">.</span><span class=\"tx\">price</span><span class=\"tx\">,</span>\n  <span class=\"tx\">}</span><span class=\"tx\">)</span><span class=\"tx\">)</span><span class=\"tx\">,</span>\n  <span class=\"tx\">clear</span><span class=\"to\">:</span> <span class=\"tx\">(</span><span class=\"tx\">)</span> <span class=\"to\">=&gt;</span> <span class=\"tk\">set</span><span class=\"tx\">(</span><span class=\"tx\">{</span> <span class=\"tx\">items</span><span class=\"to\">:</span> <span class=\"tx\">[</span><span class=\"tx\">]</span><span class=\"tx\">,</span> <span class=\"tx\">total</span><span class=\"to\">:</span> <span class=\"tn\">0</span> <span class=\"tx\">}</span><span class=\"tx\">)</span><span class=\"tx\">,</span>\n<span class=\"tx\">}</span><span class=\"tx\">)</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n\n<span class=\"tc\">// в компоненте — берёшь ровно то, что нужно (селектор)</span>\n<span class=\"tk\">function</span> <span class=\"ty\">Badge</span><span class=\"tx\">(</span><span class=\"tx\">)</span> <span class=\"tx\">{</span>\n  <span class=\"tk\">const</span> <span class=\"tx\">count</span> <span class=\"to\">=</span> <span class=\"tf\">useCart</span><span class=\"tx\">(</span><span class=\"tx\">(</span><span class=\"tx\">s</span><span class=\"tx\">)</span> <span class=\"to\">=&gt;</span> <span class=\"tx\">s</span><span class=\"tx\">.</span><span class=\"tx\">items</span><span class=\"tx\">.</span><span class=\"tx\">length</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n  <span class=\"tk\">return</span> <span class=\"to\">&lt;</span><span class=\"tx\">span</span><span class=\"to\">&gt;</span> <span class=\"tx\">{</span><span class=\"tx\">count</span><span class=\"tx\">}</span><span class=\"to\">&lt;</span><span class=\"to\">/</span><span class=\"tx\">span</span><span class=\"to\">&gt;</span><span class=\"tx\">;</span>\n<span class=\"tx\">}</span></code></pre>\n</div><div class=\"say maxi\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"mFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#46b877\"/><stop offset=\"100%\" stop-color=\"#359a5e\"/></linearGradient><radialGradient id=\"mCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#f0a890\" stop-opacity=\"0.45\"/><stop offset=\"100%\" stop-color=\"#f0a890\" stop-opacity=\"0\"/></radialGradient></defs><path d=\"M66 56 Q56 18 90 42 Q80 54 72 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M134 56 Q144 18 110 42 Q120 54 128 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M70 50 Q64 30 82 44 Z\" fill=\"#1f1f1f\"/><path d=\"M130 50 Q136 30 118 44 Z\" fill=\"#1f1f1f\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#mFur__U)\"/><path d=\"M100 64 Q66 72 70 112 Q100 128 130 112 Q134 72 100 64 Z\" fill=\"#f2f6f2\"/><ellipse cx=\"100\" cy=\"104\" rx=\"34\" ry=\"26\" fill=\"#f7faf7\"/><ellipse cx=\"74\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"126\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"100\" cy=\"108\" rx=\"6.5\" ry=\"5\" fill=\"#2a2a2a\"/><path d=\"M100 113 L100 120\" stroke=\"#2a2a2a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><ellipse cx=\"82\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><ellipse cx=\"118\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><circle cx=\"83\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"117\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"83\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"117\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"86\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"120\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"79\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"113\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M90 119 Q100 127 110 119\" stroke=\"#1f5a32\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M97 124 Q100 129 103 124 Z\" fill=\"#e87a8a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Макси</div><p>Ниже — настоящий работающий стор (та же механика: состояние + set + подписчики). Жми «В корзину» и смотри: меняется одно место, а оба подписчика — счётчик и сумма — перерисовываются сами. Никто никому не передавал пропсы.</p></div></div><div class=\"widget\"><div class=\"widget-grid\"><div class=\"w-panel\"><h5>магазин — экшены меняют стор</h5><div class=\"shop-item\"><div><div class=\"nm\">📱 Телефон</div><div class=\"pr\">15000 ₽</div></div><button class=\"minibtn\" onclick=\"cartAdd('Телефон',15000)\">+ в корзину</button></div><div class=\"shop-item\"><div><div class=\"nm\">🎧 Наушники</div><div class=\"pr\">5000 ₽</div></div><button class=\"minibtn\" onclick=\"cartAdd('Наушники',5000)\">+ в корзину</button></div><div class=\"shop-item\"><div><div class=\"nm\">⌚ Часы</div><div class=\"pr\">22000 ₽</div></div><button class=\"minibtn\" onclick=\"cartAdd('Часы',22000)\">+ в корзину</button></div><div style=\"margin-top:12px;\"><button class=\"minibtn ghost\" onclick=\"cartClear()\">очистить</button></div></div><div class=\"w-panel\"><h5>состояние стора (живое)</h5><div class=\"state-json\" id=\"store-state\"></div><h5 style=\"margin-top:14px;\">подписчики (перерисовываются сами)</h5><div class=\"subs\"><div class=\"sub-card\" id=\"sub-badge\"><span class=\"tag\">&lt;Badge/&gt;</span><br>🛒 товаров: <b class=\"cnt\">0</b></div><div class=\"sub-card\" id=\"sub-total\"><span class=\"tag\">&lt;Total/&gt;</span><br>💰 сумма: <b class=\"cnt\">0 ₽</b></div></div></div></div></div></section><section><div class=\"sec-num\">03 · REDUX</div><h2>Классика с церемонией</h2><p>Redux старше и строже. Данные неизменяемы, любое изменение идёт через <strong>action → reducer → новый стейт</strong>. Поток строго однонаправленный и предсказуемый, но кода ощутимо больше.</p><div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">cartSlice.ts</span></div>\n  <pre><code><span class=\"tk\">import</span> <span class=\"tx\">{</span> <span class=\"tx\">createSlice</span> <span class=\"tx\">}</span> <span class=\"tk\">from</span> <span class=\"ts2\">'@reduxjs/toolkit'</span><span class=\"tx\">;</span>\n\n<span class=\"tk\">const</span> <span class=\"tx\">cartSlice</span> <span class=\"to\">=</span> <span class=\"tf\">createSlice</span><span class=\"tx\">(</span><span class=\"tx\">{</span>\n  <span class=\"tx\">name</span><span class=\"to\">:</span> <span class=\"ts2\">'cart'</span><span class=\"tx\">,</span>\n  <span class=\"tx\">initialState</span><span class=\"to\">:</span> <span class=\"tx\">{</span> <span class=\"tx\">items</span><span class=\"to\">:</span> <span class=\"tx\">[</span><span class=\"tx\">]</span><span class=\"tx\">,</span> <span class=\"tx\">total</span><span class=\"to\">:</span> <span class=\"tn\">0</span> <span class=\"tx\">}</span><span class=\"tx\">,</span>\n  <span class=\"tx\">reducers</span><span class=\"to\">:</span> <span class=\"tx\">{</span>\n    <span class=\"tc\">// редьюсер: получает стейт и action, возвращает новый стейт</span>\n    <span class=\"tx\">add</span><span class=\"to\">:</span> <span class=\"tx\">(</span><span class=\"tx\">state</span><span class=\"tx\">,</span> <span class=\"tx\">action</span><span class=\"tx\">)</span> <span class=\"to\">=&gt;</span> <span class=\"tx\">{</span>\n      <span class=\"tx\">state</span><span class=\"tx\">.</span><span class=\"tx\">items</span><span class=\"tx\">.</span><span class=\"tf\">push</span><span class=\"tx\">(</span><span class=\"tx\">action</span><span class=\"tx\">.</span><span class=\"tx\">payload</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n      <span class=\"tx\">state</span><span class=\"tx\">.</span><span class=\"tx\">total</span> <span class=\"to\">+</span><span class=\"to\">=</span> <span class=\"tx\">action</span><span class=\"tx\">.</span><span class=\"tx\">payload</span><span class=\"tx\">.</span><span class=\"tx\">price</span><span class=\"tx\">;</span>\n    <span class=\"tx\">}</span><span class=\"tx\">,</span>\n    <span class=\"tx\">clear</span><span class=\"to\">:</span> <span class=\"tx\">(</span><span class=\"tx\">state</span><span class=\"tx\">)</span> <span class=\"to\">=&gt;</span> <span class=\"tx\">{</span> <span class=\"tx\">state</span><span class=\"tx\">.</span><span class=\"tx\">items</span> <span class=\"to\">=</span> <span class=\"tx\">[</span><span class=\"tx\">]</span><span class=\"tx\">;</span> <span class=\"tx\">state</span><span class=\"tx\">.</span><span class=\"tx\">total</span> <span class=\"to\">=</span> <span class=\"tn\">0</span><span class=\"tx\">;</span> <span class=\"tx\">}</span><span class=\"tx\">,</span>\n  <span class=\"tx\">}</span><span class=\"tx\">,</span>\n<span class=\"tx\">}</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n\n<span class=\"tk\">export</span> <span class=\"tk\">const</span> <span class=\"tx\">{</span> <span class=\"tx\">add</span><span class=\"tx\">,</span> <span class=\"tx\">clear</span> <span class=\"tx\">}</span> <span class=\"to\">=</span> <span class=\"tx\">cartSlice</span><span class=\"tx\">.</span><span class=\"tx\">actions</span><span class=\"tx\">;</span>\n<span class=\"tc\">// + нужен store, Provider в корне, useSelector/useDispatch в компонентах</span></code></pre>\n</div><div class=\"cmp\"><div class=\"ch a\">Zustand</div><div class=\"ch b\">Redux Toolkit</div><div class=\"cc\">• один create, и всё\n• нет Provider-обёртки\n• экшены рядом с данными\n• мало кода\n• меняешь стейт напрямую через set</div><div class=\"cc\">• slices + store + Provider\n• action → reducer → стейт\n• строгий однонаправленный поток\n• больше boilerplate\n• мощный DevTools, time-travel</div></div><div class=\"say ren\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"rFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#8893ab\"/><stop offset=\"100%\" stop-color=\"#6e7a94\"/></linearGradient></defs><circle cx=\"70\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"130\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"70\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"130\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"100\" cy=\"102\" r=\"50\" fill=\"url(#rFur__U)\"/><ellipse cx=\"100\" cy=\"116\" rx=\"38\" ry=\"30\" fill=\"#e6eaf2\"/><ellipse cx=\"100\" cy=\"120\" rx=\"30\" ry=\"22\" fill=\"#eef1f7\"/><ellipse cx=\"100\" cy=\"110\" rx=\"11\" ry=\"8\" fill=\"#3e3e48\"/><ellipse cx=\"96\" cy=\"108\" rx=\"3\" ry=\"2\" fill=\"#5e5e68\" opacity=\"0.7\"/><path d=\"M100 117 L100 126\" stroke=\"#3e3e48\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><circle cx=\"120\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><path d=\"M96 94 Q100 90 104 94\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" fill=\"none\"/><circle cx=\"80\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"120\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"83\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"123\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"77\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><circle cx=\"117\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><path d=\"M72 88 Q78 84 84 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M112 88 Q118 84 124 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M78 116 Q60 114 52 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M78 122 Q60 124 54 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 116 Q140 114 148 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 122 Q140 124 146 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M90 124 Q100 131 110 124\" stroke=\"#525c70\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Рен</div><p>Выбор по масштабу. Маленькое-среднее, команда хочет скорость — Zustand. Огромное приложение, сложные взаимозависимости, нужен жёсткий аудит каждого изменения и time-travel отладка — тогда дисциплина Redux окупается. Для большинства фронтов сегодня Zustand закрывает потребность.</p></div></div><div class=\"meme-row\"><span class=\"meme\"><span class=\"mava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"mFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#46b877\"/><stop offset=\"100%\" stop-color=\"#359a5e\"/></linearGradient><radialGradient id=\"mCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#f0a890\" stop-opacity=\"0.45\"/><stop offset=\"100%\" stop-color=\"#f0a890\" stop-opacity=\"0\"/></radialGradient></defs><path d=\"M66 56 Q56 18 90 42 Q80 54 72 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M134 56 Q144 18 110 42 Q120 54 128 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M70 50 Q64 30 82 44 Z\" fill=\"#1f1f1f\"/><path d=\"M130 50 Q136 30 118 44 Z\" fill=\"#1f1f1f\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#mFur__U)\"/><path d=\"M100 64 Q66 72 70 112 Q100 128 130 112 Q134 72 100 64 Z\" fill=\"#f2f6f2\"/><ellipse cx=\"100\" cy=\"104\" rx=\"34\" ry=\"26\" fill=\"#f7faf7\"/><ellipse cx=\"74\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"126\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"100\" cy=\"108\" rx=\"6.5\" ry=\"5\" fill=\"#2a2a2a\"/><path d=\"M100 113 L100 120\" stroke=\"#2a2a2a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><ellipse cx=\"82\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><ellipse cx=\"118\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><circle cx=\"83\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"117\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"83\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"117\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"86\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"120\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"79\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"113\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M90 119 Q100 127 110 119\" stroke=\"#1f5a32\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M97 124 Q100 129 103 124 Z\" fill=\"#e87a8a\"/></svg></span>Redux: 40 строк чтобы поменять одно число. Zustand: set(n =&gt; n+1)</span></div></section><div class=\"meme-row\"><span class=\"meme\"><span class=\"mava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"mFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#46b877\"/><stop offset=\"100%\" stop-color=\"#359a5e\"/></linearGradient><radialGradient id=\"mCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#f0a890\" stop-opacity=\"0.45\"/><stop offset=\"100%\" stop-color=\"#f0a890\" stop-opacity=\"0\"/></radialGradient></defs><path d=\"M66 56 Q56 18 90 42 Q80 54 72 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M134 56 Q144 18 110 42 Q120 54 128 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M70 50 Q64 30 82 44 Z\" fill=\"#1f1f1f\"/><path d=\"M130 50 Q136 30 118 44 Z\" fill=\"#1f1f1f\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#mFur__U)\"/><path d=\"M100 64 Q66 72 70 112 Q100 128 130 112 Q134 72 100 64 Z\" fill=\"#f2f6f2\"/><ellipse cx=\"100\" cy=\"104\" rx=\"34\" ry=\"26\" fill=\"#f7faf7\"/><ellipse cx=\"74\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"126\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"100\" cy=\"108\" rx=\"6.5\" ry=\"5\" fill=\"#2a2a2a\"/><path d=\"M100 113 L100 120\" stroke=\"#2a2a2a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><ellipse cx=\"82\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><ellipse cx=\"118\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><circle cx=\"83\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"117\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"83\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"117\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"86\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"120\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"79\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"113\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M90 119 Q100 127 110 119\" stroke=\"#1f5a32\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M97 124 Q100 129 103 124 Z\" fill=\"#e87a8a\"/></svg></span>prop drilling — это когда пропс едет через шесть компонентов, как метро без пересадок</span></div><div class=\"pager\"><button onclick=\"pager(-1)\">← Типы и Zod</button><button onclick=\"pager(1)\" class=\"next\">Дальше: FSD и архитектура →</button></div></div>\n<div class=\"page\" id=\"page-fsd\"><div class=\"phero\"><div class=\"kicker\">Раздел 05 · Архитектура</div><h1>FSD: торт, который не разваливается</h1><p>Финал. У нас есть запросы, типы, валидация и сторы. Теперь надо разложить это по проекту так, чтобы через год в нём можно было жить. Это и есть Feature-Sliced Design — разрезаем приложение на слои, как торт на коржи.</p></div><div class=\"say kyle\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"kFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#b87a48\"/><stop offset=\"100%\" stop-color=\"#9a6238\"/></linearGradient><radialGradient id=\"kCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#e8957a\" stop-opacity=\"0.5\"/><stop offset=\"100%\" stop-color=\"#e8957a\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"58\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"142\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"64\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><ellipse cx=\"136\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><path d=\"M68 58 Q60 22 88 44 Q80 56 72 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M132 58 Q140 22 112 44 Q120 56 128 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M71 54 Q67 36 82 48 Z\" fill=\"#3a3230\"/><path d=\"M129 54 Q133 36 118 48 Z\" fill=\"#3a3230\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#kFur__U)\"/><path d=\"M100 56 Q62 62 60 104 Q100 92 140 104 Q138 62 100 56 Z\" fill=\"#e8cfa8\"/><ellipse cx=\"100\" cy=\"98\" rx=\"40\" ry=\"30\" fill=\"#ecd6b4\"/><ellipse cx=\"100\" cy=\"116\" rx=\"30\" ry=\"24\" fill=\"#f2e1c8\"/><ellipse cx=\"72\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"128\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"100\" cy=\"106\" rx=\"9\" ry=\"7\" fill=\"#3a2a26\"/><ellipse cx=\"97\" cy=\"104\" rx=\"3\" ry=\"2\" fill=\"#5a4a44\" opacity=\"0.7\"/><ellipse cx=\"80\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><ellipse cx=\"120\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><circle cx=\"81\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"119\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"81\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"119\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"84\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"122\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"77\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"115\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M88 120 Q100 130 112 120\" stroke=\"#7a5238\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M74 142 Q100 154 126 142\" stroke=\"#9a4030\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"100\" cy=\"151\" r=\"7\" fill=\"#f0c44e\"/><circle cx=\"100\" cy=\"153\" r=\"1.8\" fill=\"#9a7a1a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Кайл</div><p>Дорогие студенты-Яндексоиды, код без архитектуры — это спагетти: дёрнул одну нитку, размотался весь клубок. Архитектура — это правила, где что лежит и кто кого может звать. FSD — самый популярный такой свод правил во фронте.</p></div></div><section><div class=\"sec-num\">01 · ЗАЧЕМ</div><h2>Почему правильная архитектура — это красиво</h2><p>Можно ведь свалить всё в папки <code>components</code>, <code>utils</code>, <code>api</code> и группировать <strong>по типу файла</strong>. Работает... пока проект маленький. Потом фича размазана по десяти папкам, и чтобы понять одну кнопку, открываешь полпроекта.</p><p>FSD группирует <strong>по смыслу</strong>: всё про авторизацию — в одном месте, всё про корзину — в другом. Удалить фичу = удалить папку. Найти баг = знаешь где искать. Новый человек в команде ориентируется за день.</p><div class=\"cmp\"><div class=\"ch a\">по смыслу (FSD) ✓</div><div class=\"ch b\">по типу (каша) ✗</div><div class=\"cc\">features/\n  auth/\n  cart/\nentities/\n  user/\n  product/</div><div class=\"cc\">components/\n  LoginForm.tsx\n  CartButton.tsx\n  UserCard.tsx\nutils/\n  authApi.ts\n  cartApi.ts</div></div><div class=\"box info\"><div class=\"bt\">Главный профит</div><p>Когда архитектура задаёт чёткие границы, ты держишь в голове один маленький кусок, а не весь проект. Меняешь одно — не ломается другое. Это не эстетика ради эстетики, это скорость и спокойный сон.</p></div></section><div class=\"meme-row\"><span class=\"meme\"><span class=\"mava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"mFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#46b877\"/><stop offset=\"100%\" stop-color=\"#359a5e\"/></linearGradient><radialGradient id=\"mCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#f0a890\" stop-opacity=\"0.45\"/><stop offset=\"100%\" stop-color=\"#f0a890\" stop-opacity=\"0\"/></radialGradient></defs><path d=\"M66 56 Q56 18 90 42 Q80 54 72 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M134 56 Q144 18 110 42 Q120 54 128 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M70 50 Q64 30 82 44 Z\" fill=\"#1f1f1f\"/><path d=\"M130 50 Q136 30 118 44 Z\" fill=\"#1f1f1f\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#mFur__U)\"/><path d=\"M100 64 Q66 72 70 112 Q100 128 130 112 Q134 72 100 64 Z\" fill=\"#f2f6f2\"/><ellipse cx=\"100\" cy=\"104\" rx=\"34\" ry=\"26\" fill=\"#f7faf7\"/><ellipse cx=\"74\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"126\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"100\" cy=\"108\" rx=\"6.5\" ry=\"5\" fill=\"#2a2a2a\"/><path d=\"M100 113 L100 120\" stroke=\"#2a2a2a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><ellipse cx=\"82\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><ellipse cx=\"118\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><circle cx=\"83\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"117\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"83\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"117\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"86\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"120\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"79\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"113\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M90 119 Q100 127 110 119\" stroke=\"#1f5a32\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M97 124 Q100 129 103 124 Z\" fill=\"#e87a8a\"/></svg></span>Спагетти-код потому и спагетти: тянешь одну фичу — на вилку наматывается весь проект</span></div><section><div class=\"sec-num\">02 · ТОРТИК</div><h2>Слои — это коржи</h2><p class=\"lead\">FSD режет приложение на горизонтальные слои. Сверху — конкретное и зависимое, снизу — общее и независимое. Наведи на корж:</p><div class=\"cake\"><div class=\"cake-layer cl-app\" onclick=\"cakeInfo('app')\"><span class=\"cl-name\">app</span><span class=\"cl-tag\">точка входа, роутер, провайдеры</span></div><div class=\"cake-layer cl-pages\" onclick=\"cakeInfo('pages')\"><span class=\"cl-name\">pages</span><span class=\"cl-tag\">страницы, собранные из виджетов</span></div><div class=\"cake-layer cl-widgets\" onclick=\"cakeInfo('widgets')\"><span class=\"cl-name\">widgets</span><span class=\"cl-tag\">самостоятельные блоки страницы</span></div><div class=\"cake-layer cl-features\" onclick=\"cakeInfo('features')\"><span class=\"cl-name\">features</span><span class=\"cl-tag\">действия пользователя</span></div><div class=\"cake-layer cl-entities\" onclick=\"cakeInfo('entities')\"><span class=\"cl-name\">entities</span><span class=\"cl-tag\">бизнес-сущности</span></div><div class=\"cake-layer cl-shared\" onclick=\"cakeInfo('shared')\"><span class=\"cl-name\">shared</span><span class=\"cl-tag\">фундамент: ui-кит, api, утилиты</span></div></div><div class=\"cake-detail\" id=\"cake-detail\"><div class=\"cd-t\">Нажми на слой</div>Каждый корж — это уровень ответственности. Чем выше, тем ближе к конкретному экрану.</div><div class=\"say ren\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"rFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#8893ab\"/><stop offset=\"100%\" stop-color=\"#6e7a94\"/></linearGradient></defs><circle cx=\"70\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"130\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"70\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"130\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"100\" cy=\"102\" r=\"50\" fill=\"url(#rFur__U)\"/><ellipse cx=\"100\" cy=\"116\" rx=\"38\" ry=\"30\" fill=\"#e6eaf2\"/><ellipse cx=\"100\" cy=\"120\" rx=\"30\" ry=\"22\" fill=\"#eef1f7\"/><ellipse cx=\"100\" cy=\"110\" rx=\"11\" ry=\"8\" fill=\"#3e3e48\"/><ellipse cx=\"96\" cy=\"108\" rx=\"3\" ry=\"2\" fill=\"#5e5e68\" opacity=\"0.7\"/><path d=\"M100 117 L100 126\" stroke=\"#3e3e48\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><circle cx=\"120\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><path d=\"M96 94 Q100 90 104 94\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" fill=\"none\"/><circle cx=\"80\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"120\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"83\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"123\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"77\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><circle cx=\"117\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><path d=\"M72 88 Q78 84 84 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M112 88 Q118 84 124 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M78 116 Q60 114 52 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M78 122 Q60 124 54 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 116 Q140 114 148 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 122 Q140 124 146 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M90 124 Q100 131 110 124\" stroke=\"#525c70\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Рен</div><p>Запомни направление: верхние коржи зависят от нижних, никогда наоборот. shared не знает про features, а app знает про всех. Самый общий код — внизу, самый конкретный — сверху.</p></div></div></section><section><div class=\"sec-num\">03 · СЛАЙСЫ И СЕГМЕНТЫ</div><h2>Режем корж дальше</h2><p>Внутри слоя (кроме app и shared) код делится на <strong>слайсы</strong> — это бизнес-домены. В <code>entities</code> слайсы это <code>user</code>, <code>product</code>, <code>order</code>. В <code>features</code> — <code>auth</code>, <code>add-to-cart</code>. Слайс = вертикальный кусок одной темы.</p><p>А внутри каждого слайса — <strong>сегменты</strong>, всегда одни и те же по смыслу:</p><ul class=\"plain\"><li><code>ui</code> — компоненты, как это выглядит.</li><li><code>model</code> — состояние и логика: тут живут <strong>zustand-сторы, типы, zod-схемы</strong>.</li><li><code>api</code> — запросы на сервер: тут живут <strong>fetch/axios</strong>.</li><li><code>lib</code> — вспомогательные функции этого слайса.</li></ul><div class=\"ftree\"><span class=\"dir\">src/</span>\n├─ <span class=\"dir\">entities/</span>          <span class=\"cm\"># бизнес-сущности</span>\n│  └─ <span class=\"dir\">product/</span>        <span class=\"cm\"># ← слайс</span>\n│     ├─ <span class=\"dir\">ui/</span>           <span class=\"cm\"># ProductCard.tsx</span>\n│     ├─ <span class=\"dir\">model/</span>        <span class=\"cm\"># store.ts, types.ts, schema.ts (zod)</span>\n│     └─ <span class=\"dir\">api/</
