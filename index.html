round\"/><circle cx=\"80\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><circle cx=\"120\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><path d=\"M96 94 Q100 90 104 94\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" fill=\"none\"/><circle cx=\"80\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"120\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"83\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"123\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"77\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><circle cx=\"117\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><path d=\"M72 88 Q78 84 84 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M112 88 Q118 84 124 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M78 116 Q60 114 52 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M78 122 Q60 124 54 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 116 Q140 114 148 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 122 Q140 124 146 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M90 124 Q100 131 110 124\" stroke=\"#525c70\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/></svg></span>«map всегда той же длины»</span>\n    </div>\n  </section>\n\n  <div class=\"pager\">\n    <button disabled>← Назад</button>\n    <button class=\"next\" onclick=\"pager(1)\">Дальше: TypeScript →</button>\n  </div>\n</div>\n\n<div class=\"page\" id=\"page-ts\">\n  <div class=\"phero k-ts\">\n    <div class=\"kicker\">Раздел 02 · Типизация</div>\n    <h1>Основы TypeScript</h1>\n    <p>TypeScript — это JavaScript, который требует объяснений. Ты заранее говоришь, что хранит переменная, и редактор ловит ошибки до запуска. Разберём типы, интерфейсы и зачем это всё.</p>\n  </div>\n\n  <div class=\"say ren\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"rFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#8893ab\"/><stop offset=\"100%\" stop-color=\"#6e7a94\"/></linearGradient></defs><circle cx=\"70\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"130\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"70\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"130\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"100\" cy=\"102\" r=\"50\" fill=\"url(#rFur__U)\"/><ellipse cx=\"100\" cy=\"116\" rx=\"38\" ry=\"30\" fill=\"#e6eaf2\"/><ellipse cx=\"100\" cy=\"120\" rx=\"30\" ry=\"22\" fill=\"#eef1f7\"/><ellipse cx=\"100\" cy=\"110\" rx=\"11\" ry=\"8\" fill=\"#3e3e48\"/><ellipse cx=\"96\" cy=\"108\" rx=\"3\" ry=\"2\" fill=\"#5e5e68\" opacity=\"0.7\"/><path d=\"M100 117 L100 126\" stroke=\"#3e3e48\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><circle cx=\"120\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><path d=\"M96 94 Q100 90 104 94\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" fill=\"none\"/><circle cx=\"80\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"120\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"83\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"123\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"77\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><circle cx=\"117\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><path d=\"M72 88 Q78 84 84 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M112 88 Q118 84 124 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M78 116 Q60 114 52 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M78 122 Q60 124 54 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 116 Q140 114 148 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 122 Q140 124 146 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M90 124 Q100 131 110 124\" stroke=\"#525c70\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Рен</div><p>Дорогие студенты-Яндексоиды. Я инженер, поэтому скажу прямо: TypeScript экономит часы отладки. Чем раньше поймана ошибка, тем дешевле она стоит. TS ловит их прямо когда пишешь код.</p></div></div>\n\n  <section>\n    <div class=\"sec-num\">01 · ЗАЧЕМ</div>\n    <h2>Проблема, которую решает TS</h2>\n    <p class=\"lead\">В чистом JS переменная может внезапно сменить тип — и всё сломается там, где не ждёшь.</p>\n\n    <p>Запусти этот JS — он «работает», но выдаёт бред. Никто не подсказал, что складывать строку с числом — плохая идея:</p>\n\n    <div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">problem.js</span><button class=\"runbtn\" onclick=\"runJS(this)\" data-src=\"function%20add%28a%2C%20b%29%20%7B%0A%20%20return%20a%20%2B%20b%3B%0A%7D%0A%0Aconsole.log%28add%282%2C%203%29%29%3B%20%20%20%20%20%20//%205%20%E2%80%94%20%D0%BE%D0%BA%0Aconsole.log%28add%28%272%27%2C%203%29%29%3B%20%20%20%20//%20%2723%27%20%E2%80%94%20%D1%83%D0%BF%D1%81%2C%20%D1%81%D0%BA%D0%BB%D0%B5%D0%B8%D0%BB%D0%BE%20%D1%81%D1%82%D1%80%D0%BE%D0%BA%D0%B8%0Aconsole.log%28add%28%27%D1%86%D0%B5%D0%BD%D0%B0%27%2C%205%29%29%3B%20//%20%27%D1%86%D0%B5%D0%BD%D0%B05%27%20%E2%80%94%20%D0%BF%D0%BE%D0%BB%D0%BD%D1%8B%D0%B9%20%D0%B1%D1%80%D0%B5%D0%B4\"><span>▶</span><span class=\"rlabel\">Запустить</span></button></div>\n  <pre><code><span class=\"tk\">function</span><span class=\"tx\"> </span><span class=\"tf\">add</span><span class=\"tx\">(</span><span class=\"tx\">a</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tx\">b</span><span class=\"tx\">)</span><span class=\"tx\"> </span><span class=\"tx\">{</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tk\">return</span><span class=\"tx\"> </span><span class=\"tx\">a</span><span class=\"tx\"> </span><span class=\"to\">+</span><span class=\"tx\"> </span><span class=\"tx\">b</span><span class=\"tx\">;</span>\n<span class=\"tx\">}</span>\n \n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tf\">add</span><span class=\"tx\">(</span><span class=\"tn\">2</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tn\">3</span><span class=\"tx\">)</span><span class=\"tx\">)</span><span class=\"tx\">;</span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tc\">// 5 — ок</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tf\">add</span><span class=\"tx\">(</span><span class=\"ts2\">&#x27;2&#x27;</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tn\">3</span><span class=\"tx\">)</span><span class=\"tx\">)</span><span class=\"tx\">;</span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tc\">// &#x27;23&#x27; — упс, склеило строки</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tf\">add</span><span class=\"tx\">(</span><span class=\"ts2\">&#x27;цена&#x27;</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tn\">5</span><span class=\"tx\">)</span><span class=\"tx\">)</span><span class=\"tx\">;</span><span class=\"tx\"> </span><span class=\"tc\">// &#x27;цена5&#x27; — полный бред</span></code></pre>\n  <div class=\"console\"><div class=\"console-inner\"><div class=\"console-label\">console</div></div></div>\n</div>\n\n    <div class=\"say ren\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"rFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#8893ab\"/><stop offset=\"100%\" stop-color=\"#6e7a94\"/></linearGradient></defs><circle cx=\"70\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"130\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"70\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"130\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"100\" cy=\"102\" r=\"50\" fill=\"url(#rFur__U)\"/><ellipse cx=\"100\" cy=\"116\" rx=\"38\" ry=\"30\" fill=\"#e6eaf2\"/><ellipse cx=\"100\" cy=\"120\" rx=\"30\" ry=\"22\" fill=\"#eef1f7\"/><ellipse cx=\"100\" cy=\"110\" rx=\"11\" ry=\"8\" fill=\"#3e3e48\"/><ellipse cx=\"96\" cy=\"108\" rx=\"3\" ry=\"2\" fill=\"#5e5e68\" opacity=\"0.7\"/><path d=\"M100 117 L100 126\" stroke=\"#3e3e48\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><circle cx=\"120\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><path d=\"M96 94 Q100 90 104 94\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" fill=\"none\"/><circle cx=\"80\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"120\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"83\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"123\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"77\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><circle cx=\"117\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><path d=\"M72 88 Q78 84 84 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M112 88 Q118 84 124 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M78 116 Q60 114 52 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M78 122 Q60 124 54 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 116 Q140 114 148 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 122 Q140 124 146 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M90 124 Q100 131 110 124\" stroke=\"#525c70\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Рен</div><p>Вот ровно из-за этого в больших проектах появляется TypeScript. В TS такой вызов со строкой вместо числа подсветится красным ещё в редакторе — до того, как код вообще запустится.</p></div></div>\n\n    <div class=\"box ts\">\n      <div class=\"bt\">▸ Как это работает технически</div>\n      <p>TypeScript не запускается в браузере напрямую. Ты пишешь <code>.ts</code>, компилятор проверяет типы и превращает код в обычный <code>.js</code>. То есть TS — это слой проверок поверх JavaScript на этапе написания.</p>\n    </div>\n  </section>\n\n  <section>\n    <div class=\"sec-num\">02 · БАЗОВЫЕ ТИПЫ</div>\n    <h2>Аннотации типов</h2>\n    <p class=\"lead\">Ты дописываешь после имени <code>: тип</code> — и теперь переменная держит только его.</p>\n\n    <div class=\"cmp\">\n      <div class=\"ch js\">JavaScript — тип не указан</div>\n      <div class=\"ch ts\">TypeScript — тип явный</div>\n      <div class=\"cc\">let name = 'Аня';\nlet age = 25;\nlet active = true;\n\n// можно случайно сломать:\nname = 42;  // молчит</div>\n      <div class=\"cc\">let name: string = 'Аня';\nlet age: number = 25;\nlet active: boolean = true;\n\n// поймает сразу:\nname = 42;  // Ошибка! ✗</div>\n    </div>\n\n    <p>Основные типы, которые встретишь каждый день:</p>\n    <ul class=\"plain\">\n      <li><code>string</code> — строки: <code>'привет'</code>, <code>\"текст\"</code></li>\n      <li><code>number</code> — любые числа: <code>42</code>, <code>3.14</code>, <code>-7</code></li>\n      <li><code>boolean</code> — <code>true</code> или <code>false</code></li>\n      <li><code>string[]</code> — массив строк</li>\n      <li><code>number[]</code> — массив чисел</li>\n    </ul>\n\n    <div class=\"say maxi\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"mFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#46b877\"/><stop offset=\"100%\" stop-color=\"#359a5e\"/></linearGradient><radialGradient id=\"mCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#f0a890\" stop-opacity=\"0.45\"/><stop offset=\"100%\" stop-color=\"#f0a890\" stop-opacity=\"0\"/></radialGradient></defs><path d=\"M66 56 Q56 18 90 42 Q80 54 72 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M134 56 Q144 18 110 42 Q120 54 128 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M70 50 Q64 30 82 44 Z\" fill=\"#1f1f1f\"/><path d=\"M130 50 Q136 30 118 44 Z\" fill=\"#1f1f1f\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#mFur__U)\"/><path d=\"M100 64 Q66 72 70 112 Q100 128 130 112 Q134 72 100 64 Z\" fill=\"#f2f6f2\"/><ellipse cx=\"100\" cy=\"104\" rx=\"34\" ry=\"26\" fill=\"#f7faf7\"/><ellipse cx=\"74\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"126\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"100\" cy=\"108\" rx=\"6.5\" ry=\"5\" fill=\"#2a2a2a\"/><path d=\"M100 113 L100 120\" stroke=\"#2a2a2a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><ellipse cx=\"82\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><ellipse cx=\"118\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><circle cx=\"83\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"117\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"83\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"117\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"86\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"120\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"79\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"113\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M90 119 Q100 127 110 119\" stroke=\"#1f5a32\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M97 124 Q100 129 103 124 Z\" fill=\"#e87a8a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Макси</div><p>Запомни просто: двоеточие после имени — это «обещание». <code>age: number</code> значит «обещаю, тут всегда будет число». Нарушишь обещание — TS заметит.</p></div></div>\n\n    <h3>Типы в функциях</h3>\n    <p>Указываем типы параметров и тип того, что функция возвращает (после скобок):</p>\n\n    <div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">typed-fn.ts</span></div>\n  <pre><code><span class=\"tc\">// (параметры с типами): тип результата</span>\n<span class=\"tk\">function</span><span class=\"tx\"> </span><span class=\"tf\">add</span><span class=\"tx\">(</span><span class=\"tx\">a</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tk\">number</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tx\">b</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tk\">number</span><span class=\"tx\">)</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tk\">number</span><span class=\"tx\"> </span><span class=\"tx\">{</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tk\">return</span><span class=\"tx\"> </span><span class=\"tx\">a</span><span class=\"tx\"> </span><span class=\"to\">+</span><span class=\"tx\"> </span><span class=\"tx\">b</span><span class=\"tx\">;</span>\n<span class=\"tx\">}</span>\n \n<span class=\"tf\">add</span><span class=\"tx\">(</span><span class=\"tn\">2</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tn\">3</span><span class=\"tx\">)</span><span class=\"tx\">;</span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tc\">// ок</span>\n<span class=\"tf\">add</span><span class=\"tx\">(</span><span class=\"ts2\">&#x27;2&#x27;</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tn\">3</span><span class=\"tx\">)</span><span class=\"tx\">;</span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tc\">// Ошибка! строка вместо числа</span>\n \n<span class=\"tc\">// стрелочная с типами</span>\n<span class=\"tk\">const</span><span class=\"tx\"> </span><span class=\"tx\">greet</span><span class=\"tx\"> </span><span class=\"to\">=</span><span class=\"tx\"> </span><span class=\"tx\">(</span><span class=\"tx\">name</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tk\">string</span><span class=\"tx\">)</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tk\">string</span><span class=\"tx\"> </span><span class=\"to\">=&gt;</span><span class=\"tx\"> </span><span class=\"tx\">{</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tk\">return</span><span class=\"tx\"> </span><span class=\"ts2\">&#x27;Привет, &#x27;</span><span class=\"tx\"> </span><span class=\"to\">+</span><span class=\"tx\"> </span><span class=\"tx\">name</span><span class=\"tx\">;</span>\n<span class=\"tx\">}</span><span class=\"tx\">;</span></code></pre>\n</div>\n\n    <div class=\"box info\">\n      <div class=\"bt\">▸ Почему примеры на этой странице не запускаются</div>\n      <p>TypeScript нельзя выполнить в браузере без компиляции, поэтому тут код показан для чтения. Но логика та же, что в JS с прошлой страницы — добавились только аннотации типов. Сами вычисления идентичны.</p>\n    </div>\n  </section>\n\n  <section>\n    <div class=\"sec-num\">03 · ИНТЕРФЕЙСЫ</div>\n    <h2>Интерфейсы — форма объекта</h2>\n    <p class=\"lead\">Интерфейс описывает, какие поля и какого типа должны быть у объекта. Это «договор».</p>\n\n    <div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">interface.ts</span></div>\n  <pre><code><span class=\"tc\">// описываем форму объекта</span>\n<span class=\"tk\">interface</span><span class=\"tx\"> </span><span class=\"ty\">User</span><span class=\"tx\"> </span><span class=\"tx\">{</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">id</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tk\">number</span><span class=\"tx\">;</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">name</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tk\">string</span><span class=\"tx\">;</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">email</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tk\">string</span><span class=\"tx\">;</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">age</span><span class=\"to\">?</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tk\">number</span><span class=\"tx\">;</span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tc\">// ? — поле необязательное</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tk\">readonly</span><span class=\"tx\"> </span><span class=\"tx\">role</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tk\">string</span><span class=\"tx\">;</span><span class=\"tx\"> </span><span class=\"tc\">// readonly — менять нельзя</span>\n<span class=\"tx\">}</span>\n \n<span class=\"tc\">// теперь объект обязан соответствовать</span>\n<span class=\"tk\">const</span><span class=\"tx\"> </span><span class=\"tx\">user</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"ty\">User</span><span class=\"tx\"> </span><span class=\"to\">=</span><span class=\"tx\"> </span><span class=\"tx\">{</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">id</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tn\">1</span><span class=\"tx\">,</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">name</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"ts2\">&#x27;Иван&#x27;</span><span class=\"tx\">,</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">email</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"ts2\">&#x27;ivan@mail.ru&#x27;</span><span class=\"tx\">,</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">role</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"ts2\">&#x27;admin&#x27;</span><span class=\"tx\">,</span>\n<span class=\"tx\">}</span><span class=\"tx\">;</span>\n \n<span class=\"tc\">// массив таких объектов</span>\n<span class=\"tk\">const</span><span class=\"tx\"> </span><span class=\"tx\">users</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"ty\">User</span><span class=\"tx\">[</span><span class=\"tx\">]</span><span class=\"tx\"> </span><span class=\"to\">=</span><span class=\"tx\"> </span><span class=\"tx\">[</span><span class=\"tx\">user</span><span class=\"tx\">]</span><span class=\"tx\">;</span></code></pre>\n</div>\n\n    <div class=\"say ren\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"rFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#8893ab\"/><stop offset=\"100%\" stop-color=\"#6e7a94\"/></linearGradient></defs><circle cx=\"70\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"130\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"70\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"130\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"100\" cy=\"102\" r=\"50\" fill=\"url(#rFur__U)\"/><ellipse cx=\"100\" cy=\"116\" rx=\"38\" ry=\"30\" fill=\"#e6eaf2\"/><ellipse cx=\"100\" cy=\"120\" rx=\"30\" ry=\"22\" fill=\"#eef1f7\"/><ellipse cx=\"100\" cy=\"110\" rx=\"11\" ry=\"8\" fill=\"#3e3e48\"/><ellipse cx=\"96\" cy=\"108\" rx=\"3\" ry=\"2\" fill=\"#5e5e68\" opacity=\"0.7\"/><path d=\"M100 117 L100 126\" stroke=\"#3e3e48\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><circle cx=\"120\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><path d=\"M96 94 Q100 90 104 94\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" fill=\"none\"/><circle cx=\"80\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"120\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"83\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"123\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"77\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><circle cx=\"117\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><path d=\"M72 88 Q78 84 84 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M112 88 Q118 84 124 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M78 116 Q60 114 52 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M78 122 Q60 124 54 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 116 Q140 114 148 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 122 Q140 124 146 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M90 124 Q100 131 110 124\" stroke=\"#525c70\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Рен</div><p>Интерфейс — это контракт. Один раз описал <code>User</code> — и везде, где он используется, редактор знает структуру. Опечатался в имени поля? Подсветит. Забыл обязательное поле? Подсветит. Это страховка от глупых ошибок.</p></div></div>\n\n    <h3>Зачем это в команде</h3>\n    <p>Когда над проектом работают десять человек, интерфейсы становятся общим языком. Один написал функцию, которая ждёт <code>User</code> — остальные сразу видят, что туда передавать. Не надо лезть в чужой код и разбираться.</p>\n\n    <div class=\"cmp\">\n      <div class=\"ch js\">Без типов: что внутри?</div>\n      <div class=\"ch ts\">С интерфейсом: всё ясно</div>\n      <div class=\"cc\">function save(user) {\n  // что у user внутри?\n  // name? имя? username?\n  // надо лезть и искать...\n}</div>\n      <div class=\"cc\">function save(user: User) {\n  // редактор подскажет:\n  // user.id, user.name,\n  // user.email — всё видно\n}</div>\n    </div>\n\n    <div class=\"meme-row\">\n      <span class=\"meme\"><span class=\"mava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"rFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#8893ab\"/><stop offset=\"100%\" stop-color=\"#6e7a94\"/></linearGradient></defs><circle cx=\"70\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"130\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"70\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"130\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"100\" cy=\"102\" r=\"50\" fill=\"url(#rFur__U)\"/><ellipse cx=\"100\" cy=\"116\" rx=\"38\" ry=\"30\" fill=\"#e6eaf2\"/><ellipse cx=\"100\" cy=\"120\" rx=\"30\" ry=\"22\" fill=\"#eef1f7\"/><ellipse cx=\"100\" cy=\"110\" rx=\"11\" ry=\"8\" fill=\"#3e3e48\"/><ellipse cx=\"96\" cy=\"108\" rx=\"3\" ry=\"2\" fill=\"#5e5e68\" opacity=\"0.7\"/><path d=\"M100 117 L100 126\" stroke=\"#3e3e48\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><circle cx=\"120\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><path d=\"M96 94 Q100 90 104 94\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" fill=\"none\"/><circle cx=\"80\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"120\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"83\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"123\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"77\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><circle cx=\"117\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><path d=\"M72 88 Q78 84 84 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M112 88 Q118 84 124 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M78 116 Q60 114 52 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M78 122 Q60 124 54 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 116 Q140 114 148 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 122 Q140 124 146 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M90 124 Q100 131 110 124\" stroke=\"#525c70\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/></svg></span>«типы — это страховка, а не бюрократия»</span>\n      <span class=\"meme\"><span class=\"mava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"mFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#46b877\"/><stop offset=\"100%\" stop-color=\"#359a5e\"/></linearGradient><radialGradient id=\"mCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#f0a890\" stop-opacity=\"0.45\"/><stop offset=\"100%\" stop-color=\"#f0a890\" stop-opacity=\"0\"/></radialGradient></defs><path d=\"M66 56 Q56 18 90 42 Q80 54 72 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M134 56 Q144 18 110 42 Q120 54 128 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M70 50 Q64 30 82 44 Z\" fill=\"#1f1f1f\"/><path d=\"M130 50 Q136 30 118 44 Z\" fill=\"#1f1f1f\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#mFur__U)\"/><path d=\"M100 64 Q66 72 70 112 Q100 128 130 112 Q134 72 100 64 Z\" fill=\"#f2f6f2\"/><ellipse cx=\"100\" cy=\"104\" rx=\"34\" ry=\"26\" fill=\"#f7faf7\"/><ellipse cx=\"74\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"126\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"100\" cy=\"108\" rx=\"6.5\" ry=\"5\" fill=\"#2a2a2a\"/><path d=\"M100 113 L100 120\" stroke=\"#2a2a2a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><ellipse cx=\"82\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><ellipse cx=\"118\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><circle cx=\"83\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"117\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"83\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"117\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"86\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"120\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"79\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"113\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M90 119 Q100 127 110 119\" stroke=\"#1f5a32\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M97 124 Q100 129 103 124 Z\" fill=\"#e87a8a\"/></svg></span>«опечатку поймают до запуска»</span>\n    </div>\n  </section>\n\n  <div class=\"pager\">\n    <button onclick=\"pager(-1)\">← Назад: Функции</button>\n    <button class=\"next\" onclick=\"pager(1)\">Дальше: React →</button>\n  </div>\n</div>\n\n<div class=\"page\" id=\"page-react\">\n  <div class=\"phero k-react\">\n    <div class=\"kicker\">Раздел 03 · Интерфейсы</div>\n    <h1>Основы React</h1>\n    <p>React собирает интерфейсы из компонентов — как из кубиков Lego. Каждый компонент это функция, возвращающая кусок страницы. Жми ▶️ — увидишь, что отрисует код в браузере.</p>\n  </div>\n\n  <div class=\"say kyle\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"kFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#b87a48\"/><stop offset=\"100%\" stop-color=\"#9a6238\"/></linearGradient><radialGradient id=\"kCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#e8957a\" stop-opacity=\"0.5\"/><stop offset=\"100%\" stop-color=\"#e8957a\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"58\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"142\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"64\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><ellipse cx=\"136\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><path d=\"M68 58 Q60 22 88 44 Q80 56 72 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M132 58 Q140 22 112 44 Q120 56 128 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M71 54 Q67 36 82 48 Z\" fill=\"#3a3230\"/><path d=\"M129 54 Q133 36 118 48 Z\" fill=\"#3a3230\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#kFur__U)\"/><path d=\"M100 56 Q62 62 60 104 Q100 92 140 104 Q138 62 100 56 Z\" fill=\"#e8cfa8\"/><ellipse cx=\"100\" cy=\"98\" rx=\"40\" ry=\"30\" fill=\"#ecd6b4\"/><ellipse cx=\"100\" cy=\"116\" rx=\"30\" ry=\"24\" fill=\"#f2e1c8\"/><ellipse cx=\"72\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"128\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"100\" cy=\"106\" rx=\"9\" ry=\"7\" fill=\"#3a2a26\"/><ellipse cx=\"97\" cy=\"104\" rx=\"3\" ry=\"2\" fill=\"#5a4a44\" opacity=\"0.7\"/><ellipse cx=\"80\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><ellipse cx=\"120\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><circle cx=\"81\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"119\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"81\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"119\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"84\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"122\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"77\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"115\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M88 120 Q100 130 112 120\" stroke=\"#7a5238\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M74 142 Q100 154 126 142\" stroke=\"#9a4030\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"100\" cy=\"151\" r=\"7\" fill=\"#f0c44e\"/><circle cx=\"100\" cy=\"153\" r=\"1.8\" fill=\"#9a7a1a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Кайл</div><p>Помнишь функции-станки с первой страницы? React — это станки, которые выдают не текст, а куски интерфейса. Сейчас покажу, и под каждым примером будет кнопка отрисовки результата.</p></div></div>\n\n  <div class=\"box info\">\n    <div class=\"bt\">▸ Как тут устроен запуск React</div>\n    <p>Настоящий React требует сборщика и не запускается в чистом браузере. Поэтому ▶️ под React-примерами показывает <strong>симуляцию результата</strong> — точно то, что отрисовал бы компонент. Код рядом — настоящий, рабочий React-синтаксис.</p>\n  </div>\n\n  <section>\n    <div class=\"sec-num\">01 · КОМПОНЕНТЫ</div>\n    <h2>Компонент — это функция</h2>\n    <p class=\"lead\">Возвращает разметку (JSX). Используется потом как HTML-тег.</p>\n\n    <div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">Welcome.jsx</span><button class=\"runbtn react\" onclick=\"runReact(this)\" data-demo=\"welcome\"><span>▶</span><span class=\"rlabel\">Запустить</span></button></div>\n  <pre><code><span class=\"tk\">function</span><span class=\"tx\"> </span><span class=\"tf\">Welcome</span><span class=\"tx\">(</span><span class=\"tx\">)</span><span class=\"tx\"> </span><span class=\"tx\">{</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tk\">return</span><span class=\"tx\"> </span><span class=\"to\">&lt;</span><span class=\"tx\">h1</span><span class=\"to\">&gt;</span><span class=\"ty\">Привет</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"ty\">Яндексоиды</span><span class=\"to\">!&lt;/</span><span class=\"tx\">h1</span><span class=\"to\">&gt;</span><span class=\"tx\">;</span>\n<span class=\"tx\">}</span>\n \n<span class=\"tc\">// используется как тег:</span>\n<span class=\"tc\">// &lt;Welcome /&gt;</span></code></pre>\n  <div class=\"rresult\"><div class=\"rresult-inner\">\n      <div class=\"rresult-label\">результат в браузере</div>\n      <div class=\"browser\">\n        <div class=\"browser-bar\"><span class=\"bd\" style=\"background:#ff5f57\"></span><span class=\"bd\" style=\"background:#febc2e\"></span><span class=\"bd\" style=\"background:#28c840\"></span><span class=\"url\">localhost:3000</span></div>\n        <div class=\"browser-body\"></div>\n      </div>\n    </div></div>\n</div>\n\n    <div class=\"say kyle\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"kFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#b87a48\"/><stop offset=\"100%\" stop-color=\"#9a6238\"/></linearGradient><radialGradient id=\"kCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#e8957a\" stop-opacity=\"0.5\"/><stop offset=\"100%\" stop-color=\"#e8957a\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"58\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"142\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"64\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><ellipse cx=\"136\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><path d=\"M68 58 Q60 22 88 44 Q80 56 72 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M132 58 Q140 22 112 44 Q120 56 128 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M71 54 Q67 36 82 48 Z\" fill=\"#3a3230\"/><path d=\"M129 54 Q133 36 118 48 Z\" fill=\"#3a3230\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#kFur__U)\"/><path d=\"M100 56 Q62 62 60 104 Q100 92 140 104 Q138 62 100 56 Z\" fill=\"#e8cfa8\"/><ellipse cx=\"100\" cy=\"98\" rx=\"40\" ry=\"30\" fill=\"#ecd6b4\"/><ellipse cx=\"100\" cy=\"116\" rx=\"30\" ry=\"24\" fill=\"#f2e1c8\"/><ellipse cx=\"72\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"128\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"100\" cy=\"106\" rx=\"9\" ry=\"7\" fill=\"#3a2a26\"/><ellipse cx=\"97\" cy=\"104\" rx=\"3\" ry=\"2\" fill=\"#5a4a44\" opacity=\"0.7\"/><ellipse cx=\"80\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><ellipse cx=\"120\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><circle cx=\"81\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"119\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"81\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"119\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"84\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"122\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"77\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"115\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M88 120 Q100 130 112 120\" stroke=\"#7a5238\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M74 142 Q100 154 126 142\" stroke=\"#9a4030\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"100\" cy=\"151\" r=\"7\" fill=\"#f0c44e\"/><circle cx=\"100\" cy=\"153\" r=\"1.8\" fill=\"#9a7a1a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Кайл</div><p>Две важные вещи. Имя компонента всегда с <strong>большой буквы</strong> — так React отличает его от обычного тега. И вот эта смесь JS с HTML внутри — это JSX. Выглядит странно день, потом привыкаешь намертво.</p></div></div>\n\n    <div class=\"box info\">\n      <div class=\"bt\">▸ Фигурные скобки в JSX</div>\n      <p>Внутри разметки <code>{ }</code> означает «здесь JavaScript». <code>{user.name}</code> вставит значение переменной. Просто текст пишем как есть, динамику — в скобках.</p>\n    </div>\n  </section>\n\n  <section>\n    <div class=\"sec-num\">02 · PROPS</div>\n    <h2>Props — данные сверху вниз</h2>\n    <p class=\"lead\">Параметры компонента. Точно как аргументы функции: родитель передаёт, ребёнок показывает.</p>\n\n    <div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">ProductCard.jsx</span><button class=\"runbtn react\" onclick=\"runReact(this)\" data-demo=\"card\"><span>▶</span><span class=\"rlabel\">Запустить</span></button></div>\n  <pre><code><span class=\"tk\">function</span><span class=\"tx\"> </span><span class=\"tf\">ProductCard</span><span class=\"tx\">(</span><span class=\"tx\">props</span><span class=\"tx\">)</span><span class=\"tx\"> </span><span class=\"tx\">{</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tk\">return</span><span class=\"tx\"> </span><span class=\"tx\">(</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"to\">&lt;</span><span class=\"tx\">div</span><span class=\"tx\"> </span><span class=\"tx\">className</span><span class=\"to\">=</span><span class=\"ts2\">&quot;card&quot;</span><span class=\"to\">&gt;</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"to\">&lt;</span><span class=\"tx\">h3</span><span class=\"to\">&gt;</span><span class=\"tx\">{</span><span class=\"tx\">props</span><span class=\"tx\">.</span><span class=\"tx\">name</span><span class=\"tx\">}</span><span class=\"to\">&lt;/</span><span class=\"tx\">h3</span><span class=\"to\">&gt;</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"to\">&lt;</span><span class=\"tx\">p</span><span class=\"to\">&gt;</span><span class=\"tx\">{</span><span class=\"tx\">props</span><span class=\"tx\">.</span><span class=\"tx\">price</span><span class=\"tx\">}</span><span class=\"tx\"> </span><span class=\"tx\">₽</span><span class=\"to\">&lt;/</span><span class=\"tx\">p</span><span class=\"to\">&gt;</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"to\">&lt;/</span><span class=\"tx\">div</span><span class=\"to\">&gt;</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">}</span>\n \n<span class=\"tc\">// родитель передаёт данные:</span>\n<span class=\"tc\">// &lt;ProductCard name=&quot;Телефон&quot; price={15000} /&gt;</span></code></pre>\n  <div class=\"rresult\"><div class=\"rresult-inner\">\n      <div class=\"rresult-label\">результат в браузере</div>\n      <div class=\"browser\">\n        <div class=\"browser-bar\"><span class=\"bd\" style=\"background:#ff5f57\"></span><span class=\"bd\" style=\"background:#febc2e\"></span><span class=\"bd\" style=\"background:#28c840\"></span><span class=\"url\">localhost:3000</span></div>\n        <div class=\"browser-body\"></div>\n      </div>\n    </div></div>\n</div>\n\n    <div class=\"say ren\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"rFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#8893ab\"/><stop offset=\"100%\" stop-color=\"#6e7a94\"/></linearGradient></defs><circle cx=\"70\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"130\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"70\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"130\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"100\" cy=\"102\" r=\"50\" fill=\"url(#rFur__U)\"/><ellipse cx=\"100\" cy=\"116\" rx=\"38\" ry=\"30\" fill=\"#e6eaf2\"/><ellipse cx=\"100\" cy=\"120\" rx=\"30\" ry=\"22\" fill=\"#eef1f7\"/><ellipse cx=\"100\" cy=\"110\" rx=\"11\" ry=\"8\" fill=\"#3e3e48\"/><ellipse cx=\"96\" cy=\"108\" rx=\"3\" ry=\"2\" fill=\"#5e5e68\" opacity=\"0.7\"/><path d=\"M100 117 L100 126\" stroke=\"#3e3e48\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><circle cx=\"120\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><path d=\"M96 94 Q100 90 104 94\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" fill=\"none\"/><circle cx=\"80\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"120\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"83\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"123\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"77\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><circle cx=\"117\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><path d=\"M72 88 Q78 84 84 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M112 88 Q118 84 124 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M78 116 Q60 114 52 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M78 122 Q60 124 54 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 116 Q140 114 148 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 122 Q140 124 146 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M90 124 Q100 131 110 124\" stroke=\"#525c70\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Рен</div><p>Данные в React текут только <strong>сверху вниз</strong>. Почему так? Проще искать баги: видишь не то значение — знаешь, что пришло от родителя. Не надо гадать, кто его поменял. Предсказуемость дороже удобства.</p></div></div>\n\n    <h3>Поток данных наглядно</h3>\n    <div class=\"viz\">\n      <div class=\"viz-title\">props текут вниз</div>\n      <div class=\"flow\">\n        <div style=\"text-align:center;\">\n          <div class=\"pill\" style=\"border:2px solid var(--react);color:var(--react);\">&lt;App /&gt;</div>\n          <div class=\"lbl\">родитель</div>\n        </div>\n        <div style=\"display:flex;flex-direction:column;align-items:center;color:var(--maxi);font-family:'JetBrains Mono',monospace;font-size:11px;\">\n          <div>name=\"Телефон\"</div><div style=\"font-size:18px;\">↓</div>\n        </div>\n        <div style=\"text-align:center;\">\n          <div class=\"pill\" style=\"border:2px solid var(--green);color:var(--green);\">&lt;ProductCard /&gt;</div>\n          <div class=\"lbl\">ребёнок показывает</div>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <section>\n    <div class=\"sec-num\">03 · MAP РИСУЕТ СПИСКИ</div>\n    <h2>map() превращает данные в интерфейс</h2>\n    <p class=\"lead\">Вот связка всего. Массив данных → массив компонентов через тот самый <code>.map()</code>.</p>\n\n    <p>Логика та же, что на первой странице. Только map теперь превращает не число в число, а <strong>объект — в карточку</strong>. Запусти — увидишь три карточки, отрисованные из массива:</p>\n\n    <div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">ProductList.jsx</span><button class=\"runbtn react\" onclick=\"runReact(this)\" data-demo=\"list\"><span>▶</span><span class=\"rlabel\">Запустить</span></button></div>\n  <pre><code><span class=\"tk\">function</span><span class=\"tx\"> </span><span class=\"tf\">ProductList</span><span class=\"tx\">(</span><span class=\"tx\">)</span><span class=\"tx\"> </span><span class=\"tx\">{</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tk\">const</span><span class=\"tx\"> </span><span class=\"tx\">products</span><span class=\"tx\"> </span><span class=\"to\">=</span><span class=\"tx\"> </span><span class=\"tx\">[</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">{</span><span class=\"tx\"> </span><span class=\"tx\">id</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tn\">1</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tx\">name</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"ts2\">&#x27;Телефон&#x27;</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tx\">price</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tn\">15000</span><span class=\"tx\"> </span><span class=\"tx\">}</span><span class=\"tx\">,</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">{</span><span class=\"tx\"> </span><span class=\"tx\">id</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tn\">2</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tx\">name</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"ts2\">&#x27;Планшет&#x27;</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tx\">price</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tn\">25000</span><span class=\"tx\"> </span><span class=\"tx\">}</span><span class=\"tx\">,</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">{</span><span class=\"tx\"> </span><span class=\"tx\">id</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tn\">3</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tx\">name</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"ts2\">&#x27;Часы&#x27;</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tx\">price</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tn\">22000</span><span class=\"tx\"> </span><span class=\"tx\">}</span><span class=\"tx\">,</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">]</span><span class=\"tx\">;</span>\n \n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tk\">return</span><span class=\"tx\"> </span><span class=\"tx\">(</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"to\">&lt;</span><span class=\"tx\">div</span><span class=\"to\">&gt;</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">{</span><span class=\"tx\">products</span><span class=\"tx\">.</span><span class=\"tf\">map</span><span class=\"tx\">(</span><span class=\"tx\">(</span><span class=\"tx\">p</span><span class=\"tx\">)</span><span class=\"tx\"> </span><span class=\"to\">=&gt;</span><span class=\"tx\"> </span><span class=\"tx\">(</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"to\">&lt;</span><span class=\"ty\">ProductCard</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">key</span><span class=\"to\">=</span><span class=\"tx\">{</span><span class=\"tx\">p</span><span class=\"tx\">.</span><span class=\"tx\">id</span><span class=\"tx\">}</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">name</span><span class=\"to\">=</span><span class=\"tx\">{</span><span class=\"tx\">p</span><span class=\"tx\">.</span><span class=\"tx\">name</span><span class=\"tx\">}</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">price</span><span class=\"to\">=</span><span class=\"tx\">{</span><span class=\"tx\">p</span><span class=\"tx\">.</span><span class=\"tx\">price</span><span class=\"tx\">}</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"to\">/&gt;</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">)</span><span class=\"tx\">)</span><span class=\"tx\">}</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"to\">&lt;/</span><span class=\"tx\">div</span><span class=\"to\">&gt;</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">}</span></code></pre>\n  <div class=\"rresult\"><div class=\"rresult-inner\">\n      <div class=\"rresult-label\">результат в браузере</div>\n      <div class=\"browser\">\n        <div class=\"browser-bar\"><span class=\"bd\" style=\"background:#ff5f57\"></span><span class=\"bd\" style=\"background:#febc2e\"></span><span class=\"bd\" style=\"background:#28c840\"></span><span class=\"url\">localhost:3000</span></div>\n        <div class=\"browser-body\"></div>\n      </div>\n    </div></div>\n</div>\n\n    <div class=\"say kyle\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"kFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#b87a48\"/><stop offset=\"100%\" stop-color=\"#9a6238\"/></linearGradient><radialGradient id=\"kCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#e8957a\" stop-opacity=\"0.5\"/><stop offset=\"100%\" stop-color=\"#e8957a\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"58\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"142\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"64\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><ellipse cx=\"136\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><path d=\"M68 58 Q60 22 88 44 Q80 56 72 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M132 58 Q140 22 112 44 Q120 56 128 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M71 54 Q67 36 82 48 Z\" fill=\"#3a3230\"/><path d=\"M129 54 Q133 36 118 48 Z\" fill=\"#3a3230\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#kFur__U)\"/><path d=\"M100 56 Q62 62 60 104 Q100 92 140 104 Q138 62 100 56 Z\" fill=\"#e8cfa8\"/><ellipse cx=\"100\" cy=\"98\" rx=\"40\" ry=\"30\" fill=\"#ecd6b4\"/><ellipse cx=\"100\" cy=\"116\" rx=\"30\" ry=\"24\" fill=\"#f2e1c8\"/><ellipse cx=\"72\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"128\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"100\" cy=\"106\" rx=\"9\" ry=\"7\" fill=\"#3a2a26\"/><ellipse cx=\"97\" cy=\"104\" rx=\"3\" ry=\"2\" fill=\"#5a4a44\" opacity=\"0.7\"/><ellipse cx=\"80\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><ellipse cx=\"120\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><circle cx=\"81\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"119\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"81\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"119\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"84\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"122\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"77\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"115\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M88 120 Q100 130 112 120\" stroke=\"#7a5238\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M74 142 Q100 154 126 142\" stroke=\"#9a4030\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"100\" cy=\"151\" r=\"7\" fill=\"#f0c44e\"/><circle cx=\"100\" cy=\"153\" r=\"1.8\" fill=\"#9a7a1a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Кайл</div><p>Смотри что вышло. Взяли массив <code>products</code>, через <code>.map()</code> каждый объект превратили в карточку, данные прокинули через props. Это связало всё: массивы, map, компоненты, props — в одной конструкции. Так и выглядит реальная разработка.</p></div></div>\n\n    <div class=\"box warn\">\n      <div class=\"bt\">▸ Зачем key={p.id}</div>\n      <p>При отрисовке списка через map React требует уникальный <code>key</code> у каждого элемента — по нему он понимает, что изменилось, и не перерисовывает весь список. Бери <code>id</code>, а не индекс массива.</p>\n    </div>\n  </section>\n\n  <section>\n    <div class=\"sec-num\">04 · СОСТОЯНИЕ</div>\n    <h2>Состояние — память компонента</h2>\n    <p class=\"lead\">Props приходят сверху и не меняются. State — собственная память, которая живёт и меняется от действий пользователя.</p>\n\n    <p>Нажал лайк — счётчик вырос. За это отвечает <code>useState</code>. Ключевой момент: <strong>поменял состояние — React сам перерисовал</strong>. Запусти и пожми кнопку в результате:</p>\n\n    <div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">Counter.jsx</span><button class=\"runbtn react\" onclick=\"runReact(this)\" data-demo=\"counter\"><span>▶</span><span class=\"rlabel\">Запустить</span></button></div>\n  <pre><code><span class=\"tk\">import</span><span class=\"tx\"> </span><span class=\"tx\">{</span><span class=\"tx\"> </span><span class=\"tx\">useState</span><span class=\"tx\"> </span><span class=\"tx\">}</span><span class=\"tx\"> </span><span class=\"tk\">from</span><span class=\"tx\"> </span><span class=\"ts2\">&#x27;react&#x27;</span><span class=\"tx\">;</span>\n \n<span class=\"tk\">function</span><span class=\"tx\"> </span><span class=\"tf\">Counter</span><span class=\"tx\">(</span><span class=\"tx\">)</span><span class=\"tx\"> </span><span class=\"tx\">{</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tc\">// [значение, функция-меняла] = useState(старт)</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tk\">const</span><span class=\"tx\"> </span><span class=\"tx\">[</span><span class=\"tx\">count</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tx\">setCount</span><span class=\"tx\">]</span><span class=\"tx\"> </span><span class=\"to\">=</span><span class=\"tx\"> </span><span class=\"tf\">useState</span><span class=\"tx\">(</span><span class=\"tn\">0</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n \n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tk\">return</span><span class=\"tx\"> </span><span class=\"tx\">(</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"to\">&lt;</span><span class=\"tx\">button</span><span class=\"tx\"> </span><span class=\"tx\">onClick</span><span class=\"to\">=</span><span class=\"tx\">{</span><span class=\"tx\">(</span><span class=\"tx\">)</span><span class=\"tx\"> </span><span class=\"to\">=&gt;</span><span class=\"tx\"> </span><span class=\"tf\">setCount</span><span class=\"tx\">(</span><span class=\"tx\">count</span><span class=\"tx\"> </span><span class=\"to\">+</span><span class=\"tx\"> </span><span class=\"tn\">1</span><span class=\"tx\">)</span><span class=\"tx\">}</span><span class=\"to\">&gt;</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"ty\">Лайков</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tx\">{</span><span class=\"tx\">count</span><span class=\"tx\">}</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"to\">&lt;/</span><span class=\"tx\">button</span><span class=\"to\">&gt;</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">}</span></code></pre>\n  <div class=\"rresult\"><div class=\"rresult-inner\">\n      <div class=\"rresult-label\">результат в браузере</div>\n      <div class=\"browser\">\n        <div class=\"browser-bar\"><span class=\"bd\" style=\"background:#ff5f57\"></span><span class=\"bd\" style=\"background:#febc2e\"></span><span class=\"bd\" style=\"background:#28c840\"></span><span class=\"url\">localhost:3000</span></div>\n        <div class=\"browser-body\"></div>\n      </div>\n    </div></div>\n</div>\n\n    <div class=\"say maxi\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"mFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#46b877\"/><stop offset=\"100%\" stop-color=\"#359a5e\"/></linearGradient><radialGradient id=\"mCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#f0a890\" stop-opacity=\"0.45\"/><stop offset=\"100%\" stop-color=\"#f0a890\" stop-opacity=\"0\"/></radialGradient></defs><path d=\"M66 56 Q56 18 90 42 Q80 54 72 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M134 56 Q144 18 110 42 Q120 54 128 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M70 50 Q64 30 82 44 Z\" fill=\"#1f1f1f\"/><path d=\"M130 50 Q136 30 118 44 Z\" fill=\"#1f1f1f\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#mFur__U)\"/><path d=\"M100 64 Q66 72 70 112 Q100 128 130 112 Q134 72 100 64 Z\" fill=\"#f2f6f2\"/><ellipse cx=\"100\" cy=\"104\" rx=\"34\" ry=\"26\" fill=\"#f7faf7\"/><ellipse cx=\"74\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"126\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"100\" cy=\"108\" rx=\"6.5\" ry=\"5\" fill=\"#2a2a2a\"/><path d=\"M100 113 L100 120\" stroke=\"#2a2a2a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><ellipse cx=\"82\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><ellipse cx=\"118\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><circle cx=\"83\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"117\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"83\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"117\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"86\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"120\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"79\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"113\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M90 119 Q100 127 110 119\" stroke=\"#1f5a32\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M97 124 Q100 129 103 124 Z\" fill=\"#e87a8a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Макси</div><p>Разбор <code>const [count, setCount] = useState(0)</code>: <code>count</code> — текущее значение, <code>setCount</code> — функция чтобы менять, <code>0</code> — старт. Менять count напрямую нельзя, только через setCount — иначе React не заметит и не перерисует.</p></div></div>\n\n    <div class=\"meme-row\">\n      <span class=\"meme\"><span class=\"mava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"rFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#8893ab\"/><stop offset=\"100%\" stop-color=\"#6e7a94\"/></linearGradient></defs><circle cx=\"70\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"130\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"70\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"130\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"100\" cy=\"102\" r=\"50\" fill=\"url(#rFur__U)\"/><ellipse cx=\"100\" cy=\"116\" rx=\"38\" ry=\"30\" fill=\"#e6eaf2\"/><ellipse cx=\"100\" cy=\"120\" rx=\"30\" ry=\"22\" fill=\"#eef1f7\"/><ellipse cx=\"100\" cy=\"110\" rx=\"11\" ry=\"8\" fill=\"#3e3e48\"/><ellipse cx=\"96\" cy=\"108\" rx=\"3\" ry=\"2\" fill=\"#5e5e68\" opacity=\"0.7\"/><path d=\"M100 117 L100  stroke=\"#9a4030\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"100\" cy=\"151\" r=\"7\" fill=\"#f0c44e\"/><circle cx=\"100\" cy=\"153\" r=\"1.8\" fill=\"#9a7a1a\"/></svg></span>«это уже мини-приложение»</span>\n    </div>\n  </section>\n\n  <div class=\"pager\">\n    <button onclick=\"pager(-1)\">← Назад: TypeScript</button>\n    <button class=\"next\" onclick=\"pager(1)\">Дальше: TS + Архитектура →</button>\n  </div>\n</div>\n\n<div class=\"page\" id=\"page-arch\">\n  <div class=\"phero k-arch\">\n    <div class=\"kicker\">Раздел 04 · TS + Архитектура</div>\n    <h1>TypeScript в React + архитектура</h1>\n    <p>Соединяем TS и React, а потом смотрим, как организовать растущее приложение, чтобы оно не превратилось в кашу. И знакомимся с FSD — поверхностно, для старта.</p>\n  </div>\n\n  <div class=\"say ren\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"rFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#8893ab\"/><stop offset=\"100%\" stop-color=\"#6e7a94\"/></linearGradient></defs><circle cx=\"70\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"130\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"70\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"130\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"100\" cy=\"102\" r=\"50\" fill=\"url(#rFur__U)\"/><ellipse cx=\"100\" cy=\"116\" rx=\"38\" ry=\"30\" fill=\"#e6eaf2\"/><ellipse cx=\"100\" cy=\"120\" rx=\"30\" ry=\"22\" fill=\"#eef1f7\"/><ellipse cx=\"100\" cy=\"110\" rx=\"11\" ry=\"8\" fill=\"#3e3e48\"/><ellipse cx=\"96\" cy=\"108\" rx=\"3\" ry=\"2\" fill=\"#5e5e68\" opacity=\"0.7\"/><path d=\"M100 117 L100 126\" stroke=\"#3e3e48\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><circle cx=\"120\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><path d=\"M96 94 Q100 90 104 94\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" fill=\"none\"/><circle cx=\"80\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"120\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"83\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"123\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"77\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><circle cx=\"117\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><path d=\"M72 88 Q78 84 84 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M112 88 Q118 84 124 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M78 116 Q60 114 52 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M78 122 Q60 124 54 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 116 Q140 114 148 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 122 Q140 124 146 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M90 124 Q100 131 110 124\" stroke=\"#525c70\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Рен</div><p>Дорогие студенты-Яндексоиды. Сейчас самое полезное для работы: типизированный React и то, как раскладывать файлы по полочкам. Без этого большой проект быстро становится болотом.</p></div></div>\n\n  <section>\n    <div class=\"sec-num\">01 · TS + REACT</div>\n    <h2>Типизируем компоненты</h2>\n    <p class=\"lead\">Props — это объект, а значит для него можно описать интерфейс. Тогда React-компонент станет типобезопасным.</p>\n\n    <div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">ProductCard.tsx</span></div>\n  <pre><code><span class=\"tc\">// описываем форму props через интерфейс</span>\n<span class=\"tk\">interface</span><span class=\"tx\"> </span><span class=\"ty\">ProductCardProps</span><span class=\"tx\"> </span><span class=\"tx\">{</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">name</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tk\">string</span><span class=\"tx\">;</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">price</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tk\">number</span><span class=\"tx\">;</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">inStock</span><span class=\"to\">?</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tk\">boolean</span><span class=\"tx\">;</span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tc\">// необязательное</span>\n<span class=\"tx\">}</span>\n \n<span class=\"tc\">// компонент принимает типизированные props</span>\n<span class=\"tk\">function</span><span class=\"tx\"> </span><span class=\"tf\">ProductCard</span><span class=\"tx\">(</span><span class=\"tx\">{</span><span class=\"tx\"> </span><span class=\"tx\">name</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tx\">price</span><span class=\"tx\"> </span><span class=\"tx\">}</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"ty\">ProductCardProps</span><span class=\"tx\">)</span><span class=\"tx\"> </span><span class=\"tx\">{</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tk\">return</span><span class=\"tx\"> </span><span class=\"tx\">(</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"to\">&lt;</span><span class=\"tx\">div</span><span class=\"tx\"> </span><span class=\"tx\">className</span><span class=\"to\">=</span><span class=\"ts2\">&quot;card&quot;</span><span class=\"to\">&gt;</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"to\">&lt;</span><span class=\"tx\">h3</span><span class=\"to\">&gt;</span><span class=\"tx\">{</span><span class=\"tx\">name</span><span class=\"tx\">}</span><span class=\"to\">&lt;/</span><span class=\"tx\">h3</span><span class=\"to\">&gt;</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"to\">&lt;</span><span class=\"tx\">p</span><span class=\"to\">&gt;</span><span class=\"tx\">{</span><span class=\"tx\">price</span><span class=\"tx\">}</span><span class=\"tx\"> </span><span class=\"tx\">₽</span><span class=\"to\">&lt;/</span><span class=\"tx\">p</span><span class=\"to\">&gt;</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"to\">&lt;/</span><span class=\"tx\">div</span><span class=\"to\">&gt;</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">}</span></code></pre>\n</div>\n\n    <div class=\"say maxi\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"mFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#46b877\"/><stop offset=\"100%\" stop-color=\"#359a5e\"/></linearGradient><radialGradient id=\"mCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#f0a890\" stop-opacity=\"0.45\"/><stop offset=\"100%\" stop-color=\"#f0a890\" stop-opacity=\"0\"/></radialGradient></defs><path d=\"M66 56 Q56 18 90 42 Q80 54 72 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M134 56 Q144 18 110 42 Q120 54 128 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M70
