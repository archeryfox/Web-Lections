an><span class=\"tx\"> </span><span class=\"tx\">{</span><span class=\"tx\"> </span><span class=\"tx\">useState</span><span class=\"tx\"> </span><span class=\"tx\">}</span><span class=\"tx\"> </span><span class=\"tk\">from</span><span class=\"tx\"> </span><span class=\"ts2\">&#x27;react&#x27;</span><span class=\"tx\">;</span>\n \n<span class=\"tk\">function</span><span class=\"tx\"> </span><span class=\"tf\">Counter</span><span class=\"tx\">(</span><span class=\"tx\">)</span><span class=\"tx\"> </span><span class=\"tx\">{</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tc\">// &lt;number&gt; — говорим, что состояние это число</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tk\">const</span><span class=\"tx\"> </span><span class=\"tx\">[</span><span class=\"tx\">count</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tx\">setCount</span><span class=\"tx\">]</span><span class=\"tx\"> </span><span class=\"to\">=</span><span class=\"tx\"> </span><span class=\"tx\">useState</span><span class=\"to\">&lt;</span><span class=\"tk\">number</span><span class=\"to\">&gt;</span><span class=\"tx\">(</span><span class=\"tn\">0</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n \n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tk\">return</span><span class=\"tx\"> </span><span class=\"tx\">(</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"to\">&lt;</span><span class=\"tx\">button</span><span class=\"tx\"> </span><span class=\"tx\">onClick</span><span class=\"to\">=</span><span class=\"tx\">{</span><span class=\"tx\">(</span><span class=\"tx\">)</span><span class=\"tx\"> </span><span class=\"to\">=&gt;</span><span class=\"tx\"> </span><span class=\"tf\">setCount</span><span class=\"tx\">(</span><span class=\"tx\">count</span><span class=\"tx\"> </span><span class=\"to\">+</span><span class=\"tx\"> </span><span class=\"tn\">1</span><span class=\"tx\">)</span><span class=\"tx\">}</span><span class=\"to\">&gt;</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"ty\">Лайков</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tx\">{</span><span class=\"tx\">count</span><span class=\"tx\">}</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"to\">&lt;/</span><span class=\"tx\">button</span><span class=\"to\">&gt;</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">}</span></code></pre>\n</div>\n\n    <p>Запустим типизированный пример — список пользователей, где у каждого свой тип роли:</p>\n\n    <div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">UserList.tsx</span><button class=\"runbtn react\" onclick=\"runReact(this)\" data-demo=\"typedcard\"><span>▶</span><span class=\"rlabel\">Запустить</span></button></div>\n  <pre><code><span class=\"tk\">interface</span><span class=\"tx\"> </span><span class=\"ty\">User</span><span class=\"tx\"> </span><span class=\"tx\">{</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">id</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tk\">number</span><span class=\"tx\">;</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">name</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tk\">string</span><span class=\"tx\">;</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">role</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"ts2\">&#x27;admin&#x27;</span><span class=\"tx\"> </span><span class=\"to\">|</span><span class=\"tx\"> </span><span class=\"ts2\">&#x27;user&#x27;</span><span class=\"tx\">;</span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tc\">// только эти два значения!</span>\n<span class=\"tx\">}</span>\n \n<span class=\"tk\">function</span><span class=\"tx\"> </span><span class=\"tf\">UserList</span><span class=\"tx\">(</span><span class=\"tx\">)</span><span class=\"tx\"> </span><span class=\"tx\">{</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tk\">const</span><span class=\"tx\"> </span><span class=\"tx\">users</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"ty\">User</span><span class=\"tx\">[</span><span class=\"tx\">]</span><span class=\"tx\"> </span><span class=\"to\">=</span><span class=\"tx\"> </span><span class=\"tx\">[</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">{</span><span class=\"tx\"> </span><span class=\"tx\">id</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tn\">1</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tx\">name</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"ts2\">&#x27;Иван&#x27;</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tx\">role</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"ts2\">&#x27;admin&#x27;</span><span class=\"tx\"> </span><span class=\"tx\">}</span><span class=\"tx\">,</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">{</span><span class=\"tx\"> </span><span class=\"tx\">id</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tn\">2</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tx\">name</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"ts2\">&#x27;Аня&#x27;</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tx\">role</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"ts2\">&#x27;user&#x27;</span><span class=\"tx\"> </span><span class=\"tx\">}</span><span class=\"tx\">,</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">]</span><span class=\"tx\">;</span>\n \n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tk\">return</span><span class=\"tx\"> </span><span class=\"tx\">(</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"to\">&lt;</span><span class=\"tx\">div</span><span class=\"to\">&gt;</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">{</span><span class=\"tx\">users</span><span class=\"tx\">.</span><span class=\"tf\">map</span><span class=\"tx\">(</span><span class=\"tx\">(</span><span class=\"tx\">u</span><span class=\"tx\">)</span><span class=\"tx\"> </span><span class=\"to\">=&gt;</span><span class=\"tx\"> </span><span class=\"tx\">(</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"to\">&lt;</span><span class=\"tx\">div</span><span class=\"tx\"> </span><span class=\"tx\">key</span><span class=\"to\">=</span><span class=\"tx\">{</span><span class=\"tx\">u</span><span class=\"tx\">.</span><span class=\"tx\">id</span><span class=\"tx\">}</span><span class=\"to\">&gt;</span><span class=\"tx\">{</span><span class=\"tx\">u</span><span class=\"tx\">.</span><span class=\"tx\">name</span><span class=\"tx\">}</span><span class=\"tx\"> </span><span class=\"tx\">—</span><span class=\"tx\"> </span><span class=\"tx\">{</span><span class=\"tx\">u</span><span class=\"tx\">.</span><span class=\"tx\">role</span><span class=\"tx\">}</span><span class=\"to\">&lt;/</span><span class=\"tx\">div</span><span class=\"to\">&gt;</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">)</span><span class=\"tx\">)</span><span class=\"tx\">}</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"to\">&lt;/</span><span class=\"tx\">div</span><span class=\"to\">&gt;</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">}</span></code></pre>\n  <div class=\"rresult\"><div class=\"rresult-inner\">\n      <div class=\"rresult-label\">результат в браузере</div>\n      <div class=\"browser\">\n        <div class=\"browser-bar\"><span class=\"bd\" style=\"background:#ff5f57\"></span><span class=\"bd\" style=\"background:#febc2e\"></span><span class=\"bd\" style=\"background:#28c840\"></span><span class=\"url\">localhost:3000</span></div>\n        <div class=\"browser-body\"></div>\n      </div>\n    </div></div>\n</div>\n\n    <div class=\"box ts\">\n      <div class=\"bt\">▸ Что за role: 'admin' | 'user'</div>\n      <p>Это «union-тип» — поле может быть только одной из перечисленных строк. Напишешь <code>role: 'moderator'</code> — TS подсветит ошибку. Так типы защищают от опечаток в значениях, а не только в названиях полей.</p>\n    </div>\n  </section>\n\n  <section>\n    <div class=\"sec-num\">02 · АРХИТЕКТУРА</div>\n    <h2>Как не утонуть в файлах</h2>\n    <p class=\"lead\">Пока компонентов три — порядок не нужен. Когда их триста — без структуры наступает хаос.</p>\n\n    <p>Сначала все пишут просто: папка <code>components</code>, и туда сваливается всё подряд. Работает ровно до момента, когда ты не можешь найти нужный файл и не понимаешь, что от чего зависит.</p>\n\n    <div class=\"say ren\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"rFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#8893ab\"/><stop offset=\"100%\" stop-color=\"#6e7a94\"/></linearGradient></defs><circle cx=\"70\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"130\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"70\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"130\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"100\" cy=\"102\" r=\"50\" fill=\"url(#rFur__U)\"/><ellipse cx=\"100\" cy=\"116\" rx=\"38\" ry=\"30\" fill=\"#e6eaf2\"/><ellipse cx=\"100\" cy=\"120\" rx=\"30\" ry=\"22\" fill=\"#eef1f7\"/><ellipse cx=\"100\" cy=\"110\" rx=\"11\" ry=\"8\" fill=\"#3e3e48\"/><ellipse cx=\"96\" cy=\"108\" rx=\"3\" ry=\"2\" fill=\"#5e5e68\" opacity=\"0.7\"/><path d=\"M100 117 L100 126\" stroke=\"#3e3e48\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><circle cx=\"120\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><path d=\"M96 94 Q100 90 104 94\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" fill=\"none\"/><circle cx=\"80\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"120\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"83\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"123\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"77\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><circle cx=\"117\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><path d=\"M72 88 Q78 84 84 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M112 88 Q118 84 124 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M78 116 Q60 114 52 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M78 122 Q60 124 54 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 116 Q140 114 148 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 122 Q140 124 146 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M90 124 Q100 131 110 124\" stroke=\"#525c70\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Рен</div><p>Я это называю «папка-помойка». Сто файлов в одном месте, всё импортит всё, поменял одно — сломалось другое в неожиданном месте. Архитектура нужна именно чтобы этого не было.</p></div></div>\n\n    <h3>Базовый принцип: группируй по смыслу</h3>\n    <p>Первый шаг — раскладывать не по типу файла, а по <strong>смыслу</strong>. Не «все кнопки в одну кучу», а «всё про товары вместе, всё про пользователя вместе»:</p>\n\n    <div class=\"cmp\">\n      <div class=\"ch js\">✗ по типу файла</div>\n      <div class=\"ch ts\">✓ по смыслу</div>\n      <div class=\"cc\">components/\n  Button.tsx\n  ProductCard.tsx\n  UserAvatar.tsx\n  CartItem.tsx\nhooks/\n  useUser.ts\n  useCart.ts\n  useProduct.ts</div>\n      <div class=\"cc\">product/\n  ProductCard.tsx\n  useProduct.ts\nuser/\n  UserAvatar.tsx\n  useUser.ts\ncart/\n  CartItem.tsx\n  useCart.ts</div>\n    </div>\n\n    <p>В правом варианте всё про товар лежит рядом. Работаешь с товарами — открыл одну папку, всё под рукой. Это уже половина пути к нормальной архитектуре.</p>\n  </section>\n\n  <section>\n    <div class=\"sec-num\">03 · FSD</div>\n    <h2>Feature-Sliced Design</h2>\n    <p class=\"lead\">FSD — популярная методология раскладки кода для фронтенда. Сегодня только знакомимся: что это и зачем.</p>\n\n    <div class=\"say kyle\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"kFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#b87a48\"/><stop offset=\"100%\" stop-color=\"#9a6238\"/></linearGradient><radialGradient id=\"kCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#e8957a\" stop-opacity=\"0.5\"/><stop offset=\"100%\" stop-color=\"#e8957a\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"58\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"142\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"64\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><ellipse cx=\"136\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><path d=\"M68 58 Q60 22 88 44 Q80 56 72 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M132 58 Q140 22 112 44 Q120 56 128 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M71 54 Q67 36 82 48 Z\" fill=\"#3a3230\"/><path d=\"M129 54 Q133 36 118 48 Z\" fill=\"#3a3230\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#kFur__U)\"/><path d=\"M100 56 Q62 62 60 104 Q100 92 140 104 Q138 62 100 56 Z\" fill=\"#e8cfa8\"/><ellipse cx=\"100\" cy=\"98\" rx=\"40\" ry=\"30\" fill=\"#ecd6b4\"/><ellipse cx=\"100\" cy=\"116\" rx=\"30\" ry=\"24\" fill=\"#f2e1c8\"/><ellipse cx=\"72\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"128\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"100\" cy=\"106\" rx=\"9\" ry=\"7\" fill=\"#3a2a26\"/><ellipse cx=\"97\" cy=\"104\" rx=\"3\" ry=\"2\" fill=\"#5a4a44\" opacity=\"0.7\"/><ellipse cx=\"80\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><ellipse cx=\"120\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><circle cx=\"81\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"119\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"81\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"119\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"84\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"122\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"77\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"115\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M88 120 Q100 130 112 120\" stroke=\"#7a5238\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M74 142 Q100 154 126 142\" stroke=\"#9a4030\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"100\" cy=\"151\" r=\"7\" fill=\"#f0c44e\"/><circle cx=\"100\" cy=\"153\" r=\"1.8\" fill=\"#9a7a1a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Кайл</div><p>FSD — это, по сути, набор правил «что куда класть и что от чего может зависеть». Звучит занудно, но именно это спасает большие проекты. Сейчас пройдёмся по верхам, в следующий раз разберём глубоко.</p></div></div>\n\n    <h3>Слои FSD</h3>\n    <p>Код делится на слои. Сверху — самое общее (всё приложение), снизу — самое переиспользуемое (мелкие кирпичики):</p>\n\n    <div class=\"fsd\">\n      <div class=\"layer app\"><span class=\"lname\">app</span><span class=\"ldesc\">вход в приложение: роутинг, провайдеры, глобальные стили</span></div>\n      <div class=\"layer pages\"><span class=\"lname\">pages</span><span class=\"ldesc\">страницы целиком — то, что видит пользователь по адресу</span></div>\n      <div class=\"layer widgets\"><span class=\"lname\">widgets</span><span class=\"ldesc\">крупные самостоятельные блоки: шапка, лента, сайдбар</span></div>\n      <div class=\"layer features\"><span class=\"lname\">features</span><span class=\"ldesc\">действия пользователя: «лайкнуть», «добавить в корзину»</span></div>\n      <div class=\"layer entities\"><span class=\"lname\">entities</span><span class=\"ldesc\">бизнес-сущности: товар, пользователь, заказ</span></div>\n      <div class=\"layer shared\"><span class=\"lname\">shared</span><span class=\"ldesc\">переиспользуемое без привязки к бизнесу: кнопки, утилиты, API</span></div>\n    </div>\n\n    <div class=\"say ren\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"rFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#8893ab\"/><stop offset=\"100%\" stop-color=\"#6e7a94\"/></linearGradient></defs><circle cx=\"70\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"130\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"70\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"130\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"100\" cy=\"102\" r=\"50\" fill=\"url(#rFur__U)\"/><ellipse cx=\"100\" cy=\"116\" rx=\"38\" ry=\"30\" fill=\"#e6eaf2\"/><ellipse cx=\"100\" cy=\"120\" rx=\"30\" ry=\"22\" fill=\"#eef1f7\"/><ellipse cx=\"100\" cy=\"110\" rx=\"11\" ry=\"8\" fill=\"#3e3e48\"/><ellipse cx=\"96\" cy=\"108\" rx=\"3\" ry=\"2\" fill=\"#5e5e68\" opacity=\"0.7\"/><path d=\"M100 117 L100 126\" stroke=\"#3e3e48\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><circle cx=\"120\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><path d=\"M96 94 Q100 90 104 94\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" fill=\"none\"/><circle cx=\"80\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"120\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"83\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"123\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"77\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><circle cx=\"117\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><path d=\"M72 88 Q78 84 84 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M112 88 Q118 84 124 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M78 116 Q60 114 52 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M78 122 Q60 124 54 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 116 Q140 114 148 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 122 Q140 124 146 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M90 124 Q100 131 110 124\" stroke=\"#525c70\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Рен</div><p>Логика слоёв простая: чем выше — тем «конкретнее и про этот проект», чем ниже — тем «универсальнее». Кнопка в shared не знает ничего про товары. А страница в pages знает про всё, что ниже.</p></div></div>\n\n    <h3>Главное правило: импорты только вниз</h3>\n    <p>Это сердце FSD. <strong>Слой может использовать только то, что лежит ниже него</strong>. Никогда наоборот.</p>\n\n    <div class=\"viz\">\n      <div class=\"viz-title\">направление зависимостей</div>\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:13px;\">\n        <div style=\"color:var(--red);\">pages</div>\n        <div style=\"color:var(--maxi);font-size:18px;\">↓ можно</div>\n        <div style=\"color:var(--blue);\">entities</div>\n        <div style=\"color:var(--maxi);font-size:18px;\">↓ можно</div>\n        <div style=\"color:var(--ren);\">shared</div>\n        <div style=\"color:var(--red);font-size:13px;margin-top:10px;\">↑ наверх — НЕЛЬЗЯ</div>\n      </div>\n    </div>\n\n    <p>Почему так строго? Потому что это убирает запутанные связи. <code>shared</code> ничего не знает о том, кто его использует, поэтому его можно менять спокойно. А зависимости всегда текут в одну сторону — как и данные в React.</p>\n\n    <h3>Как это выглядит в папках</h3>\n    <div class=\"ftree\">\n<span class=\"dir\">src/</span>\n  <span class=\"dir\">app/</span>          <span class=\"cm\"># провайдеры, роутинг</span>\n  <span class=\"dir\">pages/</span>        <span class=\"cm\"># страницы</span>\n    <span class=\"dir\">product/</span>\n  <span class=\"dir\">widgets/</span>      <span class=\"cm\"># крупные блоки</span>\n    <span class=\"dir\">header/</span>\n  <span class=\"dir\">features/</span>     <span class=\"cm\"># действия</span>\n    <span class=\"dir\">add-to-cart/</span>\n  <span class=\"dir\">entities/</span>     <span class=\"cm\"># сущности</span>\n    <span class=\"dir\">product/</span>\n    <span class=\"dir\">user/</span>\n  <span class=\"dir\">shared/</span>       <span class=\"cm\"># кирпичики</span>\n    <span class=\"dir\">ui/</span>         <span class=\"cm\"># кнопки, инпуты</span>\n    <span class=\"dir\">api/</span>        <span class=\"cm\"># запросы к серверу</span>\n    </div>\n\n    <div class=\"box info\">\n      <div class=\"bt\">▸ Что разберём в следующий раз</div>\n      <p>Сегодня это обзор для общего понимания. В следующей лекции углубимся: сегменты внутри слоёв (ui / model / api), правила публичного API через index-файлы, и data-management — как данные ходят по приложению. Пока достаточно уловить идею слоёв и правило «импорт только вниз».</p>\n    </div>\n\n    <div class=\"say kyle\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"kFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#b87a48\"/><stop offset=\"100%\" stop-color=\"#9a6238\"/></linearGradient><radialGradient id=\"kCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#e8957a\" stop-opacity=\"0.5\"/><stop offset=\"100%\" stop-color=\"#e8957a\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"58\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"142\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"64\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><ellipse cx=\"136\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><path d=\"M68 58 Q60 22 88 44 Q80 56 72 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M132 58 Q lTop/(h.scrollHeight-h.clientHeight)*100)+'%';\n});\n\n// ============ REAL JS RUNNER ============\n// Executes the data-src code, captures console.log, shows in the console panel\nfunction runJS(btn){\n  const block = btn.closest('.code');\n  const consoleEl = block.querySelector('.console');\n  const inner = consoleEl.querySelector('.console-inner');\n  const src = decodeURIComponent(btn.dataset.src);\n\n  // build capture\n  const logs = [];\n  const fmt = (v)=>{\n    if(typeof v==='string') return v;\n    if(v===undefined) return 'undefined';\n    if(v===null) return 'null';\n    try { return JSON.stringify(v, null, 0)\n      .replace(/\"([^\"]+)\":/g,'$1:')\n      .replace(/,/g,', '); }\n    catch(e){ return String(v); }\n  };\n  const fakeConsole = {\n    log:(...a)=>logs.push({t:'log',m:a.map(fmt).join(' ')}),\n    error:(...a)=>logs.push({t:'err',m:a.map(fmt).join(' ')}),\n    warn:(...a)=>logs.push({t:'log',m:a.map(fmt).join(' ')}),\n  };\n  try{\n    const fn = new Function('console', src);\n    fn(fakeConsole);\n  }catch(e){\n    logs.push({t:'err',m:e.name+': '+e.message});\n  }\n  // render\n  inner.querySelectorAll('.cline').forEach(n=>n.remove());\n  if(logs.length===0){\n    const d=document.createElement('div');d.className='cline ctype';d.textContent='(нет вывода — добавь console.log)';inner.appendChild(d);\n  } else {\n    logs.forEach(l=>{\n      const d=document.createElement('div');\n      d.className='cline'+(l.t==='err'?' err':'');\n      d.textContent=l.m;\n      inner.appendChild(d);\n    });\n  }\n  consoleEl.classList.add('show');\n  btn.querySelector('.rlabel').textContent='Запущено';\n  setTimeout(()=>{btn.querySelector('.rlabel').textContent='Запустить';},1200);\n}\n\n// ============ REACT RESULT SIMULATOR ============\n// Each react demo has an id; we render a real DOM preview of what the component would output\nconst reactDemos = {};\n\nfunction runReact(btn){\n  const block = btn.closest('.code');\n  const res = block.querySelector(' epeat(3,1fr);}}\n  .bk-slot{background:var(--p-slot);border:1.5px solid transparent;border-radius:11px;padding:12px 6px;text-align:center;cursor:pointer;transition:all .15s;}\n  .bk-slot:hover{transform:translateY(-2px);border-color:var(--p-acc);}\n  .bk-slot.taken{opacity:.35;cursor:not-allowed;text-decoration:line-through;}\n  .bk-slot.taken:hover{transform:none;border-color:transparent;}\n  .bk-slot.sel{background:var(--p-acc);color:#fff;border-color:var(--p-acc);}\n  .bk-time{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;}\n  .bk-price{font-size:11px;opacity:.85;margin-top:3px;}\n  .bk-summary{margin-top:16px;background:var(--p-card);border:1px solid var(--p-line);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}\n  .bk-summary .lbl{color:var(--p-muted);font-size:13px;}\n  .bk-summary .pick{font-family:'Unbounded';font-weight:700;font-size:16px;}\n  .bk-book{background:var(--p-acc);color:#fff;border:none;border-radius:10px;padding:10px 20px;font-weight:700;font-family:'Nunito';cursor:pointer;font-size:14px;}\n  .bk-book:disabled{opacity:.4;cursor:not-allowed;}\n  .bk-layer{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--acc2);background:rgba(226,59,80,.12);border:1px solid rgba(226,59,80,.3);border-radius:6px;padding:2px 7px;margin-left:6px;}\n</style>\n</head>\n<body>\n<div class=\"progress\" id=\"prog\"></div>\n<div class=\"topbar\"><div class=\"topbar-inner\">\n  <div class=\"brand\">UI<b>·</b>LAYER</div>\n  <div class=\"tabs\" id=\"tabs\"><button class=\"tab active\" data-page=\"layout\"><span class=\"n\">01</span>Вёрстка</button><button class=\"tab\" data-page=\"tw\"><span class=\"n\">02</span>Tailwind</button><button class=\"tab\" data-page=\"hooks\"><span class=\"n\">03</span>Props &amp; Hooks</button><button class=\"tab\" data-page=\"theme\"><span class=\"n\">04</span>Темы</button><button class=\"tab\" data-page=\"booking\"><span class=\"n\">05</span>Букинг · FSD</button></div>\n</div></div>\n<div class=\"wrap\"><div id=\"PAGES\">\n<div class=\"page active\" id=\"page-layout\"><div class=\"phero\"><div class=\"kicker\">Раздел 01 · Вёрстка</div><h1>Контейнеры и раскладка в React</h1><p>Прежде чем красить кнопки, надо понять как располагать блоки. В React вёрстка живёт прямо в компоненте — это JSX. Разберём контейнеры, вложенность и две главные системы раскладки: flex и grid. С живой песочницей.</p></div><div class=\"say kyle\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"kFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#b87a48\"/><stop offset=\"100%\" stop-color=\"#9a6238\"/></linearGradient><radialGradient id=\"kCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#e8957a\" stop-opacity=\"0.5\"/><stop offset=\"100%\" stop-color=\"#e8957a\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"58\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"142\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"64\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><ellipse cx=\"136\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><path d=\"M68 58 Q60 22 88 44 Q80 56 72 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M132 58 Q140 22 112 44 Q120 56 128 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M71 54 Q67 36 82 48 Z\" fill=\"#3a3230\"/><path d=\"M129 54 Q133 36 118 48 Z\" fill=\"#3a3230\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#kFur__U)\"/><path d=\"M100 56 Q62 62 60 104 Q100 92 140 104 Q138 62 100 56 Z\" fill=\"#e8cfa8\"/><ellipse cx=\"100\" cy=\"98\" rx=\"40\" ry=\"30\" fill=\"#ecd6b4\"/><ellipse cx=\"100\" cy=\"116\" rx=\"30\" ry=\"24\" fill=\"#f2e1c8\"/><ellipse cx=\"72\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"128\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"100\" cy=\"106\" rx=\"9\" ry=\"7\" fill=\"#3a2a26\"/><ellipse cx=\"97\" cy=\"104\" rx=\"3\" ry=\"2\" fill=\"#5a4a44\" opacity=\"0.7\"/><ellipse cx=\"80\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><ellipse cx=\"120\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><circle cx=\"81\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"119\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"81\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"119\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"84\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"122\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"77\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"115\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M88 120 Q100 130 112 120\" stroke=\"#7a5238\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M74 142 Q100 154 126 142\" stroke=\"#9a4030\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"100\" cy=\"151\" r=\"7\" fill=\"#f0c44e\"/><circle cx=\"100\" cy=\"153\" r=\"1.8\" fill=\"#9a7a1a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Кайл</div><p>Дорогие студенты-Яндексоиды, начнём с каркаса. Интерфейс — это коробки в коробках. Освоишь как ставить коробки рядом и друг под другом — соберёшь любой макет. Остальное косметика.</p></div></div><section><div class=\"sec-num\">01 · JSX</div><h2>Разметка прямо в коде</h2><p class=\"lead\">JSX — это HTML, который умеет в JavaScript. Компонент возвращает разметку, а в фигурных скобках можно вставлять переменные и логику.</p><p>Главное правило: компонент возвращает <strong>один корневой контейнер</strong>. Всё остальное вкладывается внутрь. Обычно корень — это <code>div</code> или фрагмент <code>&lt;&gt;...&lt;/&gt;</code>.</p><div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">Card.jsx</span></div>\n  <pre><code><span class=\"tk\">function</span> <span class=\"ty\">Card</span><span class=\"tx\">(</span><span class=\"tx\">)</span> <span class=\"tx\">{</span>\n  <span class=\"tk\">const</span> <span class=\"tx\">title</span> <span class=\"to\">=</span> <span class=\"ts2\">'Отель у моря'</span><span class=\"tx\">;</span>\n  <span class=\"tk\">const</span> <span class=\"tx\">price</span> <span class=\"to\">=</span> <span class=\"tn\">4500</span><span class=\"tx\">;</span>\n\n  <span class=\"tk\">return</span> <span class=\"tx\">(</span>\n    <span class=\"to\">&lt;</span><span class=\"tx\">div</span> <span class=\"tx\">className</span><span class=\"to\">=</span><span class=\"ts2\">\"card\"</span><span class=\"to\">&gt;</span>         <span class=\"tx\">{</span><span class=\"tc\">/* корневой контейнер */</span><span class=\"tx\">}</span>\n      <span class=\"to\">&lt;</span><span class=\"tx\">h3</span><span class=\"to\">&gt;</span><span class=\"tx\">{</span><span class=\"tx\">title</span><span class=\"tx\">}</span><span class=\"to\">&lt;</span><span class=\"to\">/</span><span class=\"tx\">h3</span><span class=\"to\">&gt;</span>             <span class=\"tx\">{</span><span class=\"tc\">/* переменная в скобках */</span><span class=\"tx\">}</span>\n      <span class=\"to\">&lt;</span><span class=\"tx\">p</span><span class=\"to\">&gt;</span><span class=\"tx\">{</span><span class=\"tx\">price</span><span class=\"tx\">}</span>  <span class=\"to\">/</span> <span class=\"to\">&lt;</span><span class=\"to\">/</span><span class=\"tx\">p</span><span class=\"to\">&gt;</span>\n      <span class=\"tx\">{</span><span class=\"tx\">price</span> <span class=\"to\">&lt;</span> <span class=\"tn\">5000</span> <span class=\"to\">&amp;&amp;</span> <span class=\"to\">&lt;</span><span class=\"tx\">span</span><span class=\"to\">&gt;</span><span class=\"to\">&lt;</span><span class=\"to\">/</span><span class=\"tx\">span</span><span class=\"to\">&gt;</span><span class=\"tx\">}</span>  <span class=\"tx\">{</span><span class=\"tc\">/* логика прямо тут */</span><span class=\"tx\">}</span>\n    <span class=\"to\">&lt;</span><span class=\"to\">/</span><span class=\"tx\">div</span><span class=\"to\">&gt;</span>\n  <span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">}</span></code></pre>\n</div><div class=\"box info\"><div class=\"bt\">className вместо class</div><p>В JSX атрибут класса называется className, а не class. Это потому что class — зарезервированное слово в JS. Единственная неожиданность, к которой привыкаешь за день.</p></div></section><section><div class=\"sec-num\">02 · КОНТЕЙНЕРЫ</div><h2>Коробка в коробке</h2><p>Любой блок — это коробка с тремя кольцами: <strong>content</strong> (содержимое), <strong>padding</strong> (отступ внутри, до рамки) и <strong>margin</strong> (отступ снаружи, между коробками). Путаница padding/margin — причина 80% кривых макетов у новичков.</p><div class=\"cmp\"><div class=\"ch a\">padding — внутри</div><div class=\"ch b\">margin — снаружи</div><div class=\"cc\">отодвигает содержимое\nОТ края коробки\n\nкнопка стала «толще»\nвнутри её фона</div><div class=\"cc\">отодвигает коробку\nОТ соседей\n\nрасстояние МЕЖДУ\nкарточками</div></div><div class=\"say ren\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"rFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#8893ab\"/><stop offset=\"100%\" stop-color=\"#6e7a94\"/></linearGradient></defs><circle cx=\"70\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"130\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"70\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"130\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"100\" cy=\"102\" r=\"50\" fill=\"url(#rFur__U)\"/><ellipse cx=\"100\" cy=\"116\" rx=\"38\" ry=\"30\" fill=\"#e6eaf2\"/><ellipse cx=\"100\" cy=\"120\" rx=\"30\" ry=\"22\" fill=\"#eef1f7\"/><ellipse cx=\"100\" cy=\"110\" rx=\"11\" ry=\"8\" fill=\"#3e3e48\"/><ellipse cx=\"96\" cy=\"108\" rx=\"3\" ry=\"2\" fill=\"#5e5e68\" opacity=\"0.7\"/><path d=\"M100 117 L100 126\" stroke=\"#3e3e48\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><circle cx=\"120\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><path d=\"M96 94 Q100 90 104 94\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" fill=\"none\"/><circle cx=\"80\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"120\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"83\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"123\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"77\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><circle cx=\"117\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><path d=\"M72 88 Q78 84 84 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M112 88 Q118 84 124 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M78 116 Q60 114 52 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M78 122 Q60 124 54 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 116 Q140 114 148 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 122 Q140 124 146 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M90 124 Q100 131 110 124\" stroke=\"#525c70\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Рен</div><p>Мнемоника: padding — это вата внутри коробки вокруг товара. margin — это пустое место на полке между коробками. Перепутаешь — либо текст прилипнет к рамке, либо карточки слипнутся.</p></div></div></section><section><div class=\"sec-num\">03 · FLEX vs GRID</div><h2>Две системы раскладки</h2><p>Есть два инструмента, чтобы расставлять коробки. Они закрывают почти всё.</p><ul class=\"plain\"><li><strong>Flexbox</strong> — одна ось. Поставить элементы в ряд или в колонку, распределить пространство между ними. Меню, тулбары, карточка с иконкой и текстом.</li><li><strong>Grid</strong> — две оси сразу. Настоящая сетка строк и столбцов. Галереи, каталоги, дашборды, сетка слотов букинга.</li></ul><div class=\"box tip\"><div class=\"bt\">Правило выбора</div><p>Элементы в линию (ряд ИЛИ колонка) — flex. Сетка строк И столбцов одновременно — grid. Если сомневаешься между ними, скорее всего тебе нужен flex.</p></div></section><section><div class=\"sec-num\">04 · ПЕСОЧНИЦА</div><h2>Пощупай flexbox</h2><p>Вот живая flex-коробка. Тыкай кнопки — увидишь как меняется раскладка, и как это записывается в Tailwind-классах (про них следующий раздел).</p><div class=\"demo\"><div class=\"demo-head\">live flexbox</div><div class=\"ctrl-row\"><span class=\"gl\">направление:</span><button class=\"minibtn\" onclick=\"flexSet('dir','row')\">row →</button><button class=\"minibtn ghost\" onclick=\"flexSet('dir','column')\">column ↓</button></div><div class=\"ctrl-row\"><span class=\"gl\">justify (по оси):</span><button class=\"minibtn ghost\" onclick=\"flexSet('justify','flex-start')\">start</button><button class=\"minibtn ghost\" onclick=\"flexSet('justify','center')\">center</button><button class=\"minibtn ghost\" onclick=\"flexSet('justify','space-between')\">between</button><button class=\"minibtn ghost\" onclick=\"flexSet('justify','flex-end')\">end</button></div><div class=\"ctrl-row\"><span class=\"gl\">align (поперёк):</span><button class=\"minibtn ghost\" onclick=\"flexSet('align','stretch')\">stretch</button><button class=\"minibtn ghost\" onclick=\"flexSet('align','center')\">center</button><button class=\"minibtn ghost\" onclick=\"flexSet('align','flex-start')\">start</button></div><div class=\"flexbox\" id=\"flexbox\"><div class=\"fchip\">1</div><div class=\"fchip\">2</div><div class=\"fchip\">3</div></div><div class=\"cls-line\" id=\"flex-cls\"></div></div><div class=\"meme-row\"><span class=\"meme\"><span class=\"mava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"mFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#46b877\"/><stop offset=\"100%\" stop-color=\"#359a5e\"/></linearGradient><radialGradient id=\"mCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#f0a890\" stop-opacity=\"0.45\"/><stop offset=\"100%\" stop-color=\"#f0a890\" stop-opacity=\"0\"/></radialGradient></defs><path d=\"M66 56 Q56 18 90 42 Q80 54 72 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M134 56 Q144 18 110 42 Q120 54 128 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M70 50 Q64 30 82 44 Z\" fill=\"#1f1f1f\"/><path d=\"M130 50 Q136 30 118 44 Z\" fill=\"#1f1f1f\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#mFur__U)\"/><path d=\"M100 64 Q66 72 70 112 Q100 128 130 112 Q134 72 100 64 Z\" fill=\"#f2f6f2\"/><ellipse cx=\"100\" cy=\"104\" rx=\"34\" ry=\"26\" fill=\"#f7faf7\"/><ellipse cx=\"74\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"126\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"100\" cy=\"108\" rx=\"6.5\" ry=\"5\" fill=\"#2a2a2a\"/><path d=\"M100 113 L100 120\" stroke=\"#2a2a2a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><ellipse cx=\"82\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><ellipse cx=\"118\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><circle cx=\"83\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"117\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"83\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"117\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"86\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"120\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"79\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"113\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M90 119 Q100 127 110 119\" stroke=\"#1f5a32\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M97 124 Q100 129 103 124 Z\" fill=\"#e87a8a\"/></svg></span>justify — главная ось, align — поперечная. Их всю жизнь путают, и это нормально</span></div></section><div class=\"qt\"><div class=\"qt-text\">Вертикальное центрирование div — единственная по-настоящему нерешённая задача информатики.</div><div class=\"qt-author\">девелоперский фольклор</div></div><div class=\"pager\"><button onclick=\"pager(1)\" class=\"next\">Дальше: Tailwind CSS →</button></div></div>\n<div class=\"page\" id=\"page-tw\"><div class=\"phero\"><div class=\"kicker\">Раздел 02 · Tailwind</div><h1>Tailwind CSS: стили классами</h1><p>Вместо отдельных css-файлов с придуманными именами — набор готовых классов-утилит прямо в разметке. Звучит дико, на практике быстро. Разберём идею и пощупаем на живой карточке.</p></div><div class=\"say kyle\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"kFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#b87a48\"/><stop offset=\"100%\" stop-color=\"#9a6238\"/></linearGradient><radialGradient id=\"kCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#e8957a\" stop-opacity=\"0.5\"/><stop offset=\"100%\" stop-color=\"#e8957a\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"58\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"142\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"64\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><ellipse cx=\"136\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><path d=\"M68 58 Q60 22 88 44 Q80 56 72 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M132 58 Q140 22 112 44 Q120 56 128 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M71 54 Q67 36 82 48 Z\" fill=\"#3a3230\"/><path d=\"M129 54 Q133 36 118 48 Z\" fill=\"#3a3230\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#kFur__U)\"/><path d=\"M100 56 Q62 62 60 104 Q100 92 140 104 Q138 62 100 56 Z\" fill=\"#e8cfa8\"/><ellipse cx=\"100\" cy=\"98\" rx=\"40\" ry=\"30\" fill=\"#ecd6b4\"/><ellipse cx=\"100\" cy=\"116\" rx=\"30\" ry=\"24\" fill=\"#f2e1c8\"/><ellipse cx=\"72\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"128\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"100\" cy=\"106\" rx=\"9\" ry=\"7\" fill=\"#3a2a26\"/><ellipse cx=\"97\" cy=\"104\" rx=\"3\" ry=\"2\" fill=\"#5a4a44\" opacity=\"0.7\"/><ellipse cx=\"80\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><ellipse cx=\"120\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><circle cx=\"81\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"119\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"81\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"119\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"84\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"122\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"77\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"115\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M88 120 Q100 130 112 120\" stroke=\"#7a5238\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M74 142 Q100 154 126 142\" stroke=\"#9a4030\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"100\" cy=\"151\" r=\"7\" fill=\"#f0c44e\"/><circle cx=\"100\" cy=\"153\" r=\"1.8\" fill=\"#9a7a1a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Кайл</div><p>Обычный CSS: придумай имя класса, открой другой файл, напиши правила, свяжи. Tailwind: пишешь p-4 bg-red-500 rounded-xl прямо на элементе. Меньше прыжков между файлами, меньше выдуманных названий.</p></div></div><section><div class=\"sec-num\">01 · ИДЕЯ</div><h2>Utility-first</h2><p class=\"lead\">Каждый класс делает одну маленькую вещь. Из мелких кирпичей собираешь любой вид.</p><ul class=\"plain\"><li><code>p-4</code> — padding 16px. <code>m-2</code> — margin 8px. Шкала кратна 4px.</li><li><code>flex</code>, <code>grid</code>, <code>gap-3</code> — раскладка, та самая из прошлого раздела.</li><li><code>bg-red-500</code>, <code>text-white</code> — цвета по палитре.</li><li><code>rounded-xl</code>, <code>shadow-lg</code> — скругление, тень.</li><li><code>hover:bg-red-600</code>, <code>md:flex-row</code>, <code>dark:bg-slate-800</code> — состояния, адаптив и тёмная тема прямо в классе.</li></ul></section><section><div class=\"sec-num\">02 · CSS vs TAILWIND</div><h2>Тот же результат</h2><p>Одна и та же карточка двумя способами. Слева классика, справа Tailwind.</p><div class=\"cmp\"><div class=\"ch a\">обычный CSS</div><div class=\"ch b\">Tailwind</div><div class=\"cc\">/* styles.css */\n.card {\n  padding: 16px;\n  background: #fff;\n  border-radius: 12px;\n  box-shadow: 0 4px 12px #0002;\n}\n\n&lt;div class=\"card\"&gt;</div><div class=\"cc\">&lt;!-- всё в разметке --&gt;\n&lt;div class=\"\n  p-4\n  bg-white\n  rounded-xl\n  shadow-md\n\"&gt;</div></div><div class=\"box warn\"><div class=\"bt\">Честный минус</div><p>Разметка становится длиннее и пёстрая от классов. Это плата за скорость. Лечится тем, что повторяющиеся куски выносишь в компоненты — и класс-строка пишется один раз на весь проект.</p></div></section><section><div class=\"sec-num\">03 · ПЕСОЧНИЦА</div><h2>Собери карточку утилитами</h2><p>Включай утилиты по одной — смотри как меняется карточка и как растёт класс-строка. Это и есть работа в Tailwind: накидал утилит, получил вид.</p><div class=\"demo\"><div class=\"demo-head\">live tailwind card</div><div class=\"ctrl-row\"><button class=\"minibtn ghost\" onclick=\"twToggle('pad',this)\">p-6 (padding)</button><button class=\"minibtn ghost\" onclick=\"twToggle('round',this)\">rounded-2xl</button><button class=\"minibtn ghost\" onclick=\"twToggle('shadow',this)\">shadow-xl</button><button class=\"minibtn ghost\" onclick=\"twToggle('accent',this)\">bg-red-500</button></div><div class=\"twcard-stage\"><div class=\"twcard\" id=\"twcard\"><h4>Отель «Прибой»</h4><p>4500 ₽ / ночь · 4.8 ★</p></div></div><div class=\"cls-line\" id=\"tw-cls\"></div></div><div class=\"say ren\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"rFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#8893ab\"/><stop offset=\"100%\" stop-color=\"#6e7a94\"/></linearGradient></defs><circle cx=\"70\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"130\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"70\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"130\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"100\" cy=\"102\" r=\"50\" fill=\"url(#rFur__U)\"/><ellipse cx=\"100\" cy=\"116\" rx=\"38\" ry=\"30\" fill=\"#e6eaf2\"/><ellipse cx=\"100\" cy=\"120\" rx=\"30\" ry=\"22\" fill=\"#eef1f7\"/><ellipse cx=\"100\" cy=\"110\" rx=\"11\" ry=\"8\" fill=\"#3e3e48\"/><ellipse cx=\"96\" cy=\"108\" rx=\"3\" ry=\"2\" fill=\"#5e5e68\" opacity=\"0.7\"/><path d=\"M100 117 L100 126\" stroke=\"#3e3e48\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><circle cx=\"120\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><path d=\"M96 94 Q100 90 104 94\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" fill=\"none\"/><circle cx=\"80\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"120\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"83\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"123\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"77\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><circle cx=\"117\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><path d=\"M72 88 Q78 84 84 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M112 88 Q118 84 124 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M78 116 Q60 114 52 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M78 122 Q60 124 54 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 116 Q140 114 148 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 122 Q140 124 146 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M90 124 Q100 131 110 124\" stroke=\"#525c70\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Рен</div><p>Заметь: ты ни разу не открыл css-файл и не придумал ни одного имени класса. Вся настройка вида — здесь же, на элементе. Когда привыкнешь читать утилиты, видишь стиль элемента не отходя от разметки.</p></div></div></section><div class=\"qt\"><div class=\"qt-text\">В программировании всего две сложные вещи: инвалидация кэша и придумывание имён.</div><div class=\"qt-author\">Фил Карлтон · а вторую половину, шутят, лечит Tailwind</div></div><div class=\"pager\"><button onclick=\"pager(-1)\">← Вёрстка</button><button onclick=\"pager(1)\" class=\"next\">Дальше: пропсы и хуки →</button></div></div>\n<div class=\"page\" id=\"page-hooks\"><div class=\"phero\"><div class=\"kicker\">Раздел 03 · Логика</div><h1>Пропсы, хуки, состояние и события</h1><p>Каркас есть, стили есть. Теперь оживляем. Как данные текут в компоненты (пропсы), как компонент помнит (состояние), как реагирует на клики (события) и как рисует списки (map). Всё с живыми демками.</p></div><div class=\"say kyle\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"kFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#b87a48\"/><stop offset=\"100%\" stop-color=\"#9a6238\"/></linearGradient><radialGradient id=\"kCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#e8957a\" stop-opacity=\"0.5\"/><stop offset=\"100%\" stop-color=\"#e8957a\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"58\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"142\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"64\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><ellipse cx=\"136\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><path d=\"M68 58 Q60 22 88 44 Q80 56 72 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M132 58 Q140 22 112 44 Q120 56 128 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M71 54 Q67 36 82 48 Z\" fill=\"#3a3230\"/><path d=\"M129 54 Q133 36 118 48 Z\" fill=\"#3a3230\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#kFur__U)\"/><path d=\"M100 56 Q62 62 60 104 Q100 92 140 104 Q138 62 100 56 Z\" fill=\"#e8cfa8\"/><ellipse cx=\"100\" cy=\"98\" rx=\"40\" ry=\"30\" fill=\"#ecd6b4\"/><ellipse cx=\"100\" cy=\"116\" rx=\"30\" ry=\"24\" fill=\"#f2e1c8\"/><ellipse cx=\"72\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"128\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"100\" cy=\"106\" rx=\"9\" ry=\"7\" fill=\"#3a2a26\"/><ellipse cx=\"97\" cy=\"104\" rx=\"3\" ry=\"2\" fill=\"#5a4a44\" opacity=\"0.7\"/><ellipse cx=\"80\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><ellipse cx=\"120\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><circle cx=\"81\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"119\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"81\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"119\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"84\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"122\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"77\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"115\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M88 120 Q100 130 112 120\" stroke=\"#7a5238\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M74 142 Q100 154 126 142\" stroke=\"#9a4030\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"100\" cy=\"151\" r=\"7\" fill=\"#f0c44e\"/><circle cx=\"100\" cy=\"153\" r=\"1.8\" fill=\"#9a7a1a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Кайл</div><p>Четыре кита React: пропсы передают данные вниз, состояние хранит что меняется, события ловят действия юзера, рендер перерисовывает картинку. Разберём по одному.</p></div></div><section><div class=\"sec-num\">01 · PROPS</div><h2>Данные текут вниз</h2><p class=\"lead\">Props — это аргументы компонента. Родитель передаёт, ребёнок получает и только читает. Менять их ребёнку нельзя — поток строго сверху вниз.</p><div class=\"demo\"><div class=\"demo-head\">props flow — родитель → ребёнок</div><div class=\"props-wire\"><div class=\"props-box\"><div class=\"tag\">&lt;App/&gt; (родитель)</div><input class=\"f\" id=\"props-input\" value=\"Аня\" oninput=\"propsUpdate()\" placeholder=\"введи имя\"><div class=\"cls-line\" id=\"props-call\" style=\"margin-top:8px;\"></div></div><div class=\"props-arrow\">→<br><span style=\"font-size:11px;color:var(--muted);font-family:JetBrains Mono\">props</span></div><div class=\"props-box\"><div class=\"tag\">&lt;UserCard/&gt; (ребёнок)</div><div class=\"props-child-card\"><div class=\"av\" id=\"props-initial\">А</div><b id=\"props-name\">Аня</b><div style=\"font-size:12px;color:var(--muted)\">это значение пришло пропсом</div></div></div></div></div><div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">props.jsx</span></div>\n  <pre><code><span class=\"tc\">// ребёнок принимает props и только читает их</span>\n<span class=\"tk\">function</span> <span class=\"ty\">UserCard</span><span class=\"tx\">(</span><span class=\"tx\">{</span> <span class=\"tx\">name</span> <span class=\"tx\">}</span><span class=\"tx\">)</span> <span class=\"tx\">{</span>\n  <span class=\"tk\">return</span> <span class=\"to\">&lt;</span><span class=\"tx\">div</span> <span class=\"tx\">className</span><span class=\"to\">=</span><span class=\"ts2\">\"card\"</span><span class=\"to\">&gt;</span><span class=\"tx\">{</span><span class=\"tx\">name</span><span class=\"tx\">}</span><span class=\"to\">&lt;</span><span class=\"to\">/</span><span class=\"tx\">div</span><span class=\"to\">&gt;</span><span class=\"tx\">;</span>\n<span class=\"tx\">}</span>\n\n<span class=\"tc\">// родитель передаёт данные вниз</span>\n<span class=\"tk\">function</span> <span class=\"ty\">App</span><span class=\"tx\">(</span><span class=\"tx\">)</span> <span class=\"tx\">{</span>\n  <span class=\"tk\">return</span> <span class=\"to\">&lt;</span><span class=\"ty\">UserCard</span> <span class=\"tx\">name</span><span class=\"to\">=</span><span class=\"ts2\">\"Аня\"</span> <span class=\"to\">/</span><span class=\"to\">&gt;</span><span class=\"tx\">;</span>\n<span class=\"tx\">}</span></code></pre>\n</div><div class=\"box warn\"><div class=\"bt\">Props read-only</div><p>Ребёнок не имеет права менять свои props. Если данные должны меняться от действий — это уже не props, это состояние. Об этом ниже.</p></div></section><section><div class=\"sec-num\">02 · useState</div><h2>Память компонента</h2><p>Хук <code>useState</code> даёт компоненту память. Возвращает текущее значение и функцию-сеттер. Вызвал сеттер — React <strong>перерисовывает</strong> компонент с новым значением. В этом вся суть реактивности: меняешь состояние → картинка обновляется сама.</p><div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">Counter.jsx</span></div>\n  <pre><code><span class=\"tk\">function</span> <span class=\"ty\">Counter</span><span class=\"tx\">(</span><span class=\"tx\">)</span> <span class=\"tx\">{</span>\n  <span class=\"tk\">const</span> <span class=\"tx\">[</span><span class=\"tx\">count</span><span class=\"tx\">,</span> <span class=\"tx\">setCount</span><span class=\"tx\">]</span> <span class=\"to\">=</span> <span class=\"tf\">useState</span><span class=\"tx\">(</span><span class=\"tn\">0</span><span class=\"tx\">)</span><span class=\"tx\">;</span>   <span class=\"tc\">// [значение, сеттер]</span>\n\n  <span class=\"tk\">return</span> <span class=\"tx\">(</span>\n    <span class=\"to\">&lt;</span><span class=\"tx\">button</span> <span class=\"tx\">onClick</span><span class=\"to\">=</span><span class=\"tx\">{</span><span class=\"tx\">(</span><span class=\"tx\">)</span> <span class=\"to\">=&gt;</span> <span class=\"tf\">setCount</span><span class=\"tx\">(</span><span class=\"tx\">count</span> <span class=\"to\">+</span> <span class=\"tn\">1</span><span class=\"tx\">)</span><span class=\"tx\">}</span><span class=\"to\">&gt;</span>\n      <span class=\"to\">:</span> <span class=\"tx\">{</span><span class=\"tx\">count</span><span class=\"tx\">}</span>\n    <span class=\"to\">&lt;</span><span class=\"to\">/</span><span class=\"tx\">button</span><span class=\"to\">&gt;</span>\n  <span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">}</span>\n<span class=\"tc\">// каждый setCount запускает новый рендер с новым count</span></code></pre>\n</div><div class=\"demo\"><div class=\"demo-head\">live useState</div><div class=\"counter\"><button class=\"minibtn\" onclick=\"stateInc(1)\">+1</button><button class=\"minibtn ghost\" onclick=\"stateInc(-1)\">−1</button><div class=\"val\" id=\"cval\">0</div><button class=\"minibtn ghost\" onclick=\"stateReset()\">сброс</button><div class=\"rendertag\">состояние изменилось → перерисовок: <b id=\"renders\">0</b></div></div></div><div class=\"say maxi\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"mFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#46b877\"/><stop offset=\"100%\" stop-color=\"#359a5e\"/></linearGradient><radialGradient id=\"mCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#f0a890\" stop-opacity=\"0.45\"/><stop offset=\"100%\" stop-color=\"#f0a890\" stop-opacity=\"0\"/></radialGradient></defs><path d=\"M66 56 Q56 18 90 42 Q80 54 72 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M134 56 Q144 18 110 42 Q120 54 128 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M70 50 Q64 30 82 44 Z\" fill=\"#1f1f1f\"/><path d=\"M130 50 Q136 30 118 44 Z\" fill=\"#1f1f1f\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#mFur__U)\"/><path d=\"M100 64 Q66 72 70 112 Q100 128 130 112 Q134 72 100 64 Z\" fill=\"#f2f6f2\"/><ellipse cx=\"100\" cy=\"104\" rx=\"34\" ry=\"26\" fill=\"#f7faf7\"/><ellipse cx=\"74\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"126\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"100\" cy=\"108\" rx=\"6.5\" ry=\"5\" fill=\"#2a2a2a\"/><path d=\"M100 113 L100 120\" stroke=\"#2a2a2a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><ellipse cx=\"82\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><ellipse cx=\"118\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><circle cx=\"83\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"117\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"83\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"117\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"86\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"120\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"79\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"113\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M90 119 Q100 127 110 119\" stroke=\"#1f5a32\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M97 124 Q100 129 103 124 Z\" fill=\"#e87a8a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Макси</div><p>Видишь счётчик «перерисовок»? Каждое изменение состояния = новый рендер. Компонент не правит DOM руками, он просто описывает «как выглядеть при таком состоянии», а React сам обновляет экран.</p></div></div></section><section><div class=\"sec-num\">03 · СОБЫТИЯ</div><h2>Реакция на действия</h2><p>События — это мост от юзера к состоянию. <code>onClick</code>, <code>onChange</code>, <code>onSubmit</code>. Внутри обработчика обычно вызываешь сеттер состояния. Клик → setState → рендер. Этот цикл ты уже видел выше: кнопки <code>+1</code> это <code>onClick</code>, а поле имени в пропсах — <code>onChange</code>.</p><div class=\"box info\"><div class=\"bt\">useEffect — на будущее</div><p>Есть ещё хук useEffect для побочных эффектов: загрузить данные при появлении компонента, подписаться на что-то. Грубо: «сделай вот это после рендера / когда поменялось вот это». Глубоко копнём отдельно, пока просто знай что он есть.</p></div></section><section><div class=\"sec-num\">04 · map()</div><h2>Рисуем коллекции</h2><p class=\"lead\">Список данных → список элементов. <code>array.map()</code> превращает каждый объект в JSX. Это самый частый паттерн рендера во всём React.</p><div class=\"say ren\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"rFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#8893ab\"/><stop offset=\"100%\" stop-color=\"#6e7a94\"/></linearGradient></defs><circle cx=\"70\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"130\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"70\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"130\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"100\" cy=\"102\" r=\"50\" fill=\"url(#rFur__U)\"/><ellipse cx=\"100\" cy=\"116\" rx=\"38\" ry=\"30\" fill=\"#e6eaf2\"/><ellipse cx=\"100\" cy=\"120\" rx=\"30\" ry=\"22\" fill=\"#eef1f7\"/><ellipse cx=\"100\" cy=\"110\" rx=\"11\" ry=\"8\" fill=\"#3e3e48\"/><ellipse cx=\"96\" cy=\"108\" rx=\"3\" ry=\"2\" fill=\"#5e5e68\" opacity=\"0.7\"/><path d=\"M100 117 L100 126\" stroke=\"#3e3e48\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><circle cx=\"120\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><path d=\"M96 94 Q100 90 104 94\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" fill=\"none\"/><circle cx=\"80\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"120\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"83\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"123\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"77\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><circle cx=\"117\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><path d=\"M72 88 Q78 84 84 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M112 88 Q118 84 124 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M78 116 Q60 114 52 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M78 122 Q60 124 54 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 116 Q140 114 148 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 122 Q140 124 146 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M90 124 Q100 131 110 124\" stroke=\"#525c70\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Рен</div><p>Один нюанс, который все забывают: каждому элементу списка нужен уникальный key. По нему React понимает, что изменилось, и не перерисовывает весь список зря. key — это id из данных, не индекс массива.</p></div></div><div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">map.js</span><button class=\"runbtn\" onclick=\"runJS(this)\" data-src=\"%2F%2F%20%D0%B4%D0%B0%D0%BD%D0%BD%D1%8B%D0%B5%20%28%D0%BF%D1%80%D0%B8%D1%88%D0%BB%D0%B8%20%D0%B1%D1%8B%20%D1%81%20%D1%81%D0%B5%D1%80%D0%B2%D0%B5%D1%80%D0%B0%29%0Aconst%20todos%20%3D%20%5B%0A%20%20%7B%20id%3A%201%2C%20t%3A%20%27%D0%97%D0%B0%D0%B1%D1%80%D0%BE%D0%BD%D0%B8%D1%80%D0%BE%D0%B2%D0%B0%D1%82%D1%8C%20%D0%BE%D1%82%D0%B5%D0%BB%D1%8C%27%20%7D%2C%0A%20%20%7B%20id%3A%202%2C%20t%3A%20%27%D0%9A%D1%83%D0%BF%D0%B8%D1%82%D1%8C%20%D0%B1%D0%B8%D0%BB%D0%B5%D1%82%D1%8B%27%20%7D%2C%0A%20%20%7B%20id%3A%203%2C%20t%3A%20%27%D0%A1%D0%BE%D0%B1%D1%80%D0%B0%D1%82%D1%8C%20%D1%87%D0%B5%D0%BC%D0%BE%D0%B4%D0%B0%D0%BD%27%20%7D%2C%0A%5D%3B%0A%0A%2F%2F%20map%20%D0%BF%D1%80%D0%B5%D0%B2%D1%80%D0%B0%D1%89%D0%B0%D0%B5%D1%82%20%D0%BA%D0%B0%D0%B6%D0%B4%D1%8B%D0%B9%20%D0%BE%D0%B1%D1%8A%D0%B5%D0%BA%D1%82%20%D0%B2%20%D1%81%D1%82%D1%80%D0%BE%D0%BA%D1%83%20%28%D0%B2%20React%20%E2%80%94%20%D0%B2%20JSX%29%0Aconst%20rendered%20%3D%20todos.map%28todo%20%3D%3E%20%60%5B%20%5D%20%24%7Btodo.t%7D%20%20%28key%3D%24%7Btodo.id%7D%29%60%29%3B%0Arendered.forEach%28line%20%3D%3E%20console.log%28line%29%29%3B%0Aconsole.log%28%27%D0%B2%D1%81%D0%B5%D0%B3%D0%BE%20%D1%8D%D0%BB%D0%B5%D0%BC%D0%B5%D0%BD%D1%82%D0%BE%D0%B2%3A%27%2C%20todos.length%29%3B\"><span>▶</span><span class=\"rlabel\">Запустить</span></button></div>\n  <pre><code><span class=\"tc\">// данные (пришли бы с сервера)</span>\n<span class=\"tk\">const</span> <span class=\"tx\">todos</span> <span class=\"to\">=</span> <span class=\"tx\">[</span>\n  <span class=\"tx\">{</span> <span class=\"tx\">id</span><span class=\"to\">:</span> <span class=\"tn\">1</span><span class=\"tx\">,</span> <span class=\"tx\">t</span><span class=\"to\">:</span> <span class=\"ts2\">'Забронировать отель'</span> <span class=\"tx\">}</span><span class=\"tx\">,</span>\n  <span class=\"tx\">{</span> <span class=\"tx\">id</span><span class=\"to\">:</span> <span class=\"tn\">2</span><span class=\"tx\">,</span> <span class=\"tx\">t</span><span class=\"to\">:</span> <span class=\"ts2\">'Купить билеты'</span> <span class=\"tx\">}</span><span class=\"tx\">,</span>\n  <span class=\"tx\">{</span> <span class=\"tx\">id</span><span class=\"to\">:</span> <span class=\"tn\">3</span><span class=\"tx\">,</span> <span class=\"tx\">t</span><span class=\"to\">:</span> <span class=\"ts2\">'Собрать чемодан'</span> <span class=\"tx\">}</span><span class=\"tx\">,</span>\n<span class=\"tx\">]</span><span class=\"tx\">;</span>\n\n<span class=\"tc\">// map превращает каждый объект в строку (в React — в JSX)</span>\n<span class=\"tk\">const</span> <span class=\"tx\">rendered</span> <span class=\"to\">=</span> <span class=\"tx\">todos</span><span class=\"tx\">.</span><span class=\"tf\">map</span><span class=\"tx\">(</span><span class=\"tx\">todo</span> <span class=\"to\">=&gt;</span> <span class=\"ts2\">`[ ] ${todo.t}  (key=${todo.id})`</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">rendered</span><span class=\"tx\">.</span><span class=\"tf\">forEach</span><span class=\"tx\">(</span><span class=\"tx\">line</span> <span class=\"to\">=&gt;</span> <span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tx\">line</span><span class=\"tx\">)</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"ts2\">'всего элементов:'</span><span class=\"tx\">,</span> <span class=\"tx\">todos</span><span class=\"tx\">.</span><span class=\"tx\">length</span><span class=\"tx\">)</span><span class=\"tx\">;</span></code></pre>\n  <div class=\"console\"><div class=\"console-inner\"><div class=\"console-label\">console</div></div></div>\n</div><div class=\"demo\"><div class=\"demo-head\">live map() — добавляй, массив перерисует список</div><div class=\"ctrl-row\"><input class=\"f\" id=\"map-input\" placeholder=\"новый пункт...\" style=\"flex:1;min-width:160px\" onkeydown=\"if(event.key==='Enter')mapAdd()\"><button class=\"minibtn\" onclick=\"mapAdd()\">+ добавить</button></div><div style=\"font-family:JetBrains Mono;font-size:12px;color:var(--muted)\">todos.map(t =&gt; &lt;Item key={t.id} /&gt;) · элементов: <b id=\"map-count\" style=\"color:var(--acc2)\">0</b></div><div class=\"maplist\" id=\"maplist\"></div></div><div class=\"meme-row\"><span class=\"meme\"><span class=\"mava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"mFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#46b877\"/><stop offset=\"100%\" stop-color=\"#359a5e\"/></linearGradient><radialGradient id=\"mCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#f0a890\" stop-opacity=\"0.45\"/><stop offset=\"100%\" stop-color=\"#f0a890\" stop-opacity=\"0\"/></radialGradient></defs><path d=\"M66 56 Q56 18 90 42 Q80 54 72 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M134 56 Q144 18 110 42 Q120 54 128 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M70 50 Q64 30 82 44 Z\" fill=\"#1f1f1f\"/><path d=\"M130 50 Q136 30 118 44 Z\" fill=\"#1f1f1f\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#mFur__U)\"/><path d=\"M100 64 Q66 72 70 112 Q100 128 130 112 Q134 72 100 64 Z\" fill=\"#f2f6f2\"/><ellipse cx=\"100\" cy=\"104\" rx=\"34\" ry=\"26\" fill=\"#f7faf7\"/><ellipse cx=\"74\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"126\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"100\" cy=\"108\" rx=\"6.5\" ry=\"5\" fill=\"#2a2a2a\"/><path d=\"M100 113 L100 120\" stroke=\"#2a2a2a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><ellipse cx=\"82\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><ellipse cx=\"118\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><circle cx=\"83\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"117\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"83\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"117\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"86\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"120\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"79\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"113\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M90 119 Q100 127 110 119\" stroke=\"#1f5a32\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M97 124 Q100 129 103 124 Z\" fill=\"#e87a8a\"/></svg></span>key={index} — классика, на которой все обжигаются. Бери настоящий id</span></div></section><div class=\"qt\"><div class=\"qt-text\">Компьютер всегда делает не то, что ты хочешь, а ровно то, что ты написал.</div><div class=\"qt-author\">девелоперский фольклор</div></div><div class=\"pager\"><button onclick=\"pager(-1)\">← Tailwind</button><button onclick=\"pager(1)\" class=\"next\">Дальше: глобальный стейт и темы →</button></div></div>\n<div class=\"page\" id=\"page-theme\"><div class=\"phero\"><div class=\"kicker\">Раздел 04 · Глобальный стейт</div><h1>Глобальные данные и переключатель тем</h1><p>useState хорош для одного компонента. А если состояние нужно половине приложения — например тема оформления? Тогда его поднимают глобально. Тема — идеальный пример. Сейчас включим её наглядно.</p></div><div class=\"say kyle\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"kFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#b87a48\"/><stop offset=\"100%\" stop-color=\"#9a6238\"/></linearGradient><radialGradient id=\"kCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#e8957a\" stop-opacity=\"0.5\"/><stop offset=\"100%\" stop-color=\"#e8957a\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"58\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"142\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"64\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><ellipse cx=\"136\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><path d=\"M68 58 Q60 22 88 44 Q80 56 72 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M132 58 Q140 22 112 44 Q120 56 128 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M71 54 Q67 36 82 48 Z\" fill=\"#3a3230\"/><path d=\"M129 54 Q133 36 118 48 Z\" fill=\"#3a3230\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#kFur__U)\"/><path d=\"M100 56 Q62 62 60 104 Q100 92 140 104 Q138 62 100 56 Z\" fill=\"#e8cfa8\"/><ellipse cx=\"100\" cy=\"98\" rx=\"40\" ry=\"30\" fill=\"#ecd6b4\"/><ellipse cx=\"100\" cy=\"116\" rx=\"30\" ry=\"24\" fill=\"#f2e1c8\"/><ellipse cx=\"72\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"128\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"100\" cy=\"106\" rx=\"9\" ry=\"7\" fill=\"#3a2a26\"/><ellipse cx=\"97\" cy=\"104\" rx=\"3\" ry=\"2\" fill=\"#5a4a44\" opacity=\"0.7\"/><ellipse cx=\"80\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><ellipse cx=\"120\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><circle cx=\"81\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"119\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"81\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"119\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"84\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"122\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"77\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"115\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M88 120 Q100 130 112 120\" stroke=\"#7a5238\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M74 142 Q100 154 126 142\" stroke=\"#9a4030\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"100\" cy=\"151\" r=\"7\" fill=\"#f0c44e\"/><circle cx=\"100\" cy=\"153\" r=\"1.8\" fill=\"#9a7a1a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Кайл</div><p>Правило простое: состояние живёт настолько высоко, насколько широко оно нужно. Нужно одной кнопке — useState в ней. Нужно всему приложению — глобальный стор или Context. Тема нужна всем, значит глобально.</p></div></div><section><div class=\"sec-num\">01 · ЛОКАЛЬНОЕ vs ГЛОБАЛЬНОЕ</div><h2>Где держать состояние</h2><ul class=\"plain\"><li><strong>Локальное (useState)</strong> — открыт ли этот конкретный дропдаун, текст в этом поле. Никому за пределами компонента не нужно.</li><li><strong>Глобальное (стор / Context)</strong> — тема, текущий юзер, корзина, язык. Нужно во многих местах сразу, передавать пропсами через все слои — мучение (помнишь prop drilling из прошлой лекции?).</li></ul><div class=\"box info\"><div class=\"bt\">Связь с дата-менеджментом</div><p>Тут смыкается прошлая лекция: глобальный стейт — это работа Zustand или Context. Тема обычно лежит в маленьком сторе, и любой компонент берёт её оттуда напрямую, без протаскивания пропсов.</p></div></section><section><div class=\"sec-num\">02 · ПЕРЕКЛЮЧАТЕЛЬ ТЕМ</div><h2>Один флаг — весь интерфейс</h2><p>Механика тёмной/светлой темы простая: где-то глобально лежит флаг <code>theme</code>. Компоненты не хранят цвета жёстко, а берут их из темы (через CSS-переменные или Tailwind <code>dark:</code>). Меняешь один флаг — перекрашивается всё разом. Жми тумблер:</p><div class=\"demo\"><div class=\"demo-head\">live theme switch</div><div style=\"display:flex;justify-content:flex-end;margin-bottom:12px;\"><div class=\"theme-toggle\" onclick=\"toggleTheme()\"><span class=\"lab theme-lab\">theme: dark</span><div class=\"knob\"></div></div></div><div class=\"preview-ui theme-target\"><div class=\"pv-top\"><div class=\"pv-title\">Booking · превью</div><span class=\"pv-muted\">тема применяется ко всему блоку</span></div><div class=\"pv-card\"><div style=\"font-weight:700;margin-bottom:4px;\">Отель «Прибой»</div><div class=\"pv-muted\">4500 ₽ / ночь · свободно сегодня</div><div style=\"margin-top:12px;\"><button class=\"pv-btn\">Забронировать</button></div></div></div></div><div class=\"say maxi\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"mFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#46b877\"/><stop offset=\"100%\" stop-color=\"#359a5e\"/></linearGradient><radialGradient id=\"mCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#f0a890\" stop-opacity=\"0.45\"/><stop offset=\"100%\" stop-color=\"#f0a890\" stop-opacity=\"0\"/></radialGradient></defs><path d=\"M66 56 Q56 18 90 42 Q80 54 72 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M134 56 Q144 18 110 42 Q120 54 128 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M70 50 Q64 30 82 44 Z\" fill=\"#1f1f1f\"/><path d=\"M130 50 Q136 30 118 44 Z\" fill=\"#1f1f1f\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#mFur__U)\"/><path d=\"M100 64 Q66 72 70 112 Q100 128 130 112 Q134 72 100 64 Z\" fill=\"#f2f6f2\"/><ellipse cx=\"100\" cy=\"104\" rx=\"34\" ry=\"26\" fill=\"#f7faf7\"/><ellipse cx=\"74\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"126\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"100\" cy=\"108\" rx=\"6.5\" ry=\"5\" fill=\"#2a2a2a\"/><path d=\"M100 113 L100 120\" stroke=\"#2a2a2a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><ellipse cx=\"82\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><ellipse cx=\"118\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><circle cx=\"83\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"117\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"83\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"117\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"86\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"120\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"79\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"113\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M90 119 Q100 127 110 119\" stroke=\"#1f5a32\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\
