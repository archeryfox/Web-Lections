"round\"/><path d=\"M97 124 Q100 129 103 124 Z\" fill=\"#e87a8a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Макси</div><p>Заметь: я не перекрашивал каждый элемент руками. Один флаг переключился — фон, карточка, текст, рамки поехали все вместе. Потому что цвета берутся из темы, а не зашиты в компонент.</p></div></div></section><section><div class=\"sec-num\">03 · КАК ЭТО В КОДЕ</div><h2>Тема в сторе + dark:</h2><p>Два кусочка. Первый — глобальный флаг темы (тут на Zustand, как в прошлой лекции). Второй — компоненты, которые описывают оба варианта цвета через <code>dark:</code>, а Tailwind сам подставит нужный по классу на корне.</p><div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">themeStore.ts</span></div>\n  <pre><code><span class=\"tk\">import</span> <span class=\"tx\">{</span> <span class=\"tx\">create</span> <span class=\"tx\">}</span> <span class=\"tk\">from</span> <span class=\"ts2\">'zustand'</span><span class=\"tx\">;</span>\n\n<span class=\"tk\">export</span> <span class=\"tk\">const</span> <span class=\"tx\">useTheme</span> <span class=\"to\">=</span> <span class=\"tf\">create</span><span class=\"tx\">(</span><span class=\"tx\">(</span><span class=\"tk\">set</span><span class=\"tx\">)</span> <span class=\"to\">=&gt;</span> <span class=\"tx\">(</span><span class=\"tx\">{</span>\n  <span class=\"tx\">dark</span><span class=\"to\">:</span> <span class=\"tn\">true</span><span class=\"tx\">,</span>\n  <span class=\"tx\">toggle</span><span class=\"to\">:</span> <span class=\"tx\">(</span><span class=\"tx\">)</span> <span class=\"to\">=&gt;</span> <span class=\"tk\">set</span><span class=\"tx\">(</span><span class=\"tx\">(</span><span class=\"tx\">s</span><span class=\"tx\">)</span> <span class=\"to\">=&gt;</span> <span class=\"tx\">(</span><span class=\"tx\">{</span> <span class=\"tx\">dark</span><span class=\"to\">:</span> <span class=\"to\">!</span><span class=\"tx\">s</span><span class=\"tx\">.</span><span class=\"tx\">dark</span> <span class=\"tx\">}</span><span class=\"tx\">)</span><span class=\"tx\">)</span><span class=\"tx\">,</span>\n<span class=\"tx\">}</span><span class=\"tx\">)</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n\n<span class=\"tc\">// на корне приложения вешаем класс</span>\n<span class=\"tk\">function</span> <span class=\"ty\">App</span><span class=\"tx\">(</span><span class=\"tx\">)</span> <span class=\"tx\">{</span>\n  <span class=\"tk\">const</span> <span class=\"tx\">dark</span> <span class=\"to\">=</span> <span class=\"tf\">useTheme</span><span class=\"tx\">(</span><span class=\"tx\">(</span><span class=\"tx\">s</span><span class=\"tx\">)</span> <span class=\"to\">=&gt;</span> <span class=\"tx\">s</span><span class=\"tx\">.</span><span class=\"tx\">dark</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n  <span class=\"tk\">return</span> <span class=\"to\">&lt;</span><span class=\"tx\">div</span> <span class=\"tx\">className</span><span class=\"to\">=</span><span class=\"tx\">{</span><span class=\"tx\">dark</span> <span class=\"to\">?</span> <span class=\"ts2\">'dark'</span> <span class=\"to\">:</span> <span class=\"ts2\">''</span><span class=\"tx\">}</span><span class=\"to\">&gt;</span><span class=\"to\">...</span><span class=\"to\">&lt;</span><span class=\"to\">/</span><span class=\"tx\">div</span><span class=\"to\">&gt;</span><span class=\"tx\">;</span>\n<span class=\"tx\">}</span></code></pre>\n</div><div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">Card.jsx</span></div>\n  <pre><code><span class=\"tc\">// компонент описывает ОБА варианта — Tailwind выберет по теме</span>\n<span class=\"tk\">function</span> <span class=\"ty\">Card</span><span class=\"tx\">(</span><span class=\"tx\">)</span> <span class=\"tx\">{</span>\n  <span class=\"tk\">const</span> <span class=\"tx\">toggle</span> <span class=\"to\">=</span> <span class=\"tf\">useTheme</span><span class=\"tx\">(</span><span class=\"tx\">(</span><span class=\"tx\">s</span><span class=\"tx\">)</span> <span class=\"to\">=&gt;</span> <span class=\"tx\">s</span><span class=\"tx\">.</span><span class=\"tx\">toggle</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n  <span class=\"tk\">return</span> <span class=\"tx\">(</span>\n    <span class=\"to\">&lt;</span><span class=\"tx\">div</span> <span class=\"tx\">className</span><span class=\"to\">=</span><span class=\"ts2\">\"bg-white text-slate-900\n                    dark:bg-slate-800 dark:text-slate-100\n                    p-4 rounded-xl\"</span><span class=\"to\">&gt;</span>\n      <span class=\"to\">&lt;</span><span class=\"tx\">button</span> <span class=\"tx\">onClick</span><span class=\"to\">=</span><span class=\"tx\">{</span><span class=\"tx\">toggle</span><span class=\"tx\">}</span><span class=\"to\">&gt;</span> <span class=\"to\">&lt;</span><span class=\"to\">/</span><span class=\"tx\">button</span><span class=\"to\">&gt;</span>\n    <span class=\"to\">&lt;</span><span class=\"to\">/</span><span class=\"tx\">div</span><span class=\"to\">&gt;</span>\n  <span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">}</span></code></pre>\n</div><div class=\"box tip\"><div class=\"bt\">Суть</div><p>Компонент не знает, какая тема активна. Он просто говорит «в светлой я белый, в тёмной — тёмно-серый». Решение принимает один флаг наверху. Это и есть сила глобального состояния: одна точка правды, много реагирующих компонентов.</p></div></section><div class=\"qt\"><div class=\"qt-text\">Тёмная тема придумана не для красоты, а для тех, кто пишет код в три часа ночи.</div><div class=\"qt-author\">девелоперский фольклор</div></div><div class=\"pager\"><button onclick=\"pager(-1)\">← Пропсы и хуки</button><button onclick=\"pager(1)\" class=\"next\">Дальше: собираем букинг по FSD →</button></div></div>\n<div class=\"page\" id=\"page-booking\"><div class=\"phero\"><div class=\"kicker\">Раздел 05 · Сборка</div><h1>Онлайн-букинг по FSD</h1><p>Финал. Соберём настоящий кусок интерфейса — выбор времени для бронирования — и разложим его по слоям FSD. Тут встретится всё: контейнеры, Tailwind, пропсы, состояние, события, map и тема. Демо ниже полностью кликабельно.</p></div><div class=\"say kyle\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"kFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#b87a48\"/><stop offset=\"100%\" stop-color=\"#9a6238\"/></linearGradient><radialGradient id=\"kCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#e8957a\" stop-opacity=\"0.5\"/><stop offset=\"100%\" stop-color=\"#e8957a\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"58\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"142\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"64\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><ellipse cx=\"136\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><path d=\"M68 58 Q60 22 88 44 Q80 56 72 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M132 58 Q140 22 112 44 Q120 56 128 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M71 54 Q67 36 82 48 Z\" fill=\"#3a3230\"/><path d=\"M129 54 Q133 36 118 48 Z\" fill=\"#3a3230\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#kFur__U)\"/><path d=\"M100 56 Q62 62 60 104 Q100 92 140 104 Q138 62 100 56 Z\" fill=\"#e8cfa8\"/><ellipse cx=\"100\" cy=\"98\" rx=\"40\" ry=\"30\" fill=\"#ecd6b4\"/><ellipse cx=\"100\" cy=\"116\" rx=\"30\" ry=\"24\" fill=\"#f2e1c8\"/><ellipse cx=\"72\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"128\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"100\" cy=\"106\" rx=\"9\" ry=\"7\" fill=\"#3a2a26\"/><ellipse cx=\"97\" cy=\"104\" rx=\"3\" ry=\"2\" fill=\"#5a4a44\" opacity=\"0.7\"/><ellipse cx=\"80\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><ellipse cx=\"120\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><circle cx=\"81\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"119\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"81\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"119\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"84\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"122\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"77\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"115\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M88 120 Q100 130 112 120\" stroke=\"#7a5238\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M74 142 Q100 154 126 142\" stroke=\"#9a4030\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"100\" cy=\"151\" r=\"7\" fill=\"#f0c44e\"/><circle cx=\"100\" cy=\"153\" r=\"1.8\" fill=\"#9a7a1a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Кайл</div><p>Дорогие студенты-Яндексоиды, вот ради чего всё было. Сейчас увидишь, как четыре кита React и архитектура FSD складываются в живой экран бронирования. Каждый кусок — на своём слое.</p></div></div><section><div class=\"sec-num\">01 · РАЗБОР ПО СЛОЯМ</div><h2>Кто за что отвечает</h2><p>Экран букинга по FSD разрезается ровно так:</p><div class=\"ftree\"><span class=\"dir\">src/</span>\n├─ <span class=\"dir\">entities/</span><span class=\"dir\">slot/</span>      <span class=\"cm\"># бизнес-сущность «слот времени»</span>\n│  ├─ <span class=\"dir\">ui/</span> <span class=\"fl\">SlotCard.tsx</span>     <span class=\"cm\"># как выглядит один слот (props: time, price)</span>\n│  ├─ <span class=\"dir\">model/</span> <span class=\"fl\">store.ts</span>     <span class=\"cm\"># zustand: выбранный слот, занятые</span>\n│  └─ <span class=\"dir\">api/</span> <span class=\"fl\">getSlots.ts</span>     <span class=\"cm\"># fetch слотов с сервера</span>\n├─ <span class=\"dir\">features/</span><span class=\"dir\">select-slot/</span> <span class=\"cm\"># действие: выбрать слот (onClick → стор)</span>\n├─ <span class=\"dir\">widgets/</span><span class=\"dir\">BookingBoard/</span> <span class=\"cm\"># сетка слотов + summary (map по слотам)</span>\n└─ <span class=\"dir\">pages/</span><span class=\"dir\">BookingPage/</span>    <span class=\"cm\"># собирает виджет на странице</span></div></section><section><div class=\"sec-num\">02 · ДЕМО</div><h2>Живой экран бронирования</h2><p>Кликай слоты — это <strong>события</strong> + <strong>состояние</strong>. Сетка нарисована через <strong>map()</strong>, каждому слоту передаются <strong>пропсы</strong> (время, цена). Тумблер справа — <strong>глобальная тема</strong>. Кнопка «Забронировать» меняет стор, и сетка перерисовывается.</p><div class=\"booking theme-target\" id=\"booking\"><div class=\"bk-top\"><div><div class=\"bk-h\">Корт №3 · сегодня</div></div><div class=\"theme-toggle\" onclick=\"toggleTheme()\"><span class=\"lab theme-lab\">theme: dark</span><div class=\"knob\"></div></div></div><div class=\"bk-sub\">Выбери свободное время <span class=\"bk-layer\">widgets/BookingBoard</span></div><div class=\"bk-grid\" id=\"bk-grid\"></div><div class=\"bk-summary\"><div><span class=\"lbl\">Выбрано:</span> <span class=\"pick\" id=\"bk-pick\">— не выбрано —</span></div><button class=\"bk-book\" id=\"bk-btn\" onclick=\"bookingConfirm()\">Забронировать</button></div><div class=\"rendertag\" id=\"bk-log\" style=\"margin-top:12px;\">состояние выбора живёт в сторе · клик = событие → setState → рендер</div></div><div class=\"say ren\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"rFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#8893ab\"/><stop offset=\"100%\" stop-color=\"#6e7a94\"/></linearGradient></defs><circle cx=\"70\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"130\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"70\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"130\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"100\" cy=\"102\" r=\"50\" fill=\"url(#rFur__U)\"/><ellipse cx=\"100\" cy=\"116\" rx=\"38\" ry=\"30\" fill=\"#e6eaf2\"/><ellipse cx=\"100\" cy=\"120\" rx=\"30\" ry=\"22\" fill=\"#eef1f7\"/><ellipse cx=\"100\" cy=\"110\" rx=\"11\" ry=\"8\" fill=\"#3e3e48\"/><ellipse cx=\"96\" cy=\"108\" rx=\"3\" ry=\"2\" fill=\"#5e5e68\" opacity=\"0.7\"/><path d=\"M100 117 L100 126\" stroke=\"#3e3e48\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><circle cx=\"120\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><path d=\"M96 94 Q100 90 104 94\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" fill=\"none\"/><circle cx=\"80\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"120\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"83\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"123\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"77\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><circle cx=\"117\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><path d=\"M72 88 Q78 84 84 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M112 88 Q118 84 124 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M78 116 Q60 114 52 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M78 122 Q60 124 54 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 116 Q140 114 148 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 122 Q140 124 146 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M90 124 Q100 131 110 124\" stroke=\"#525c70\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Рен</div><p>Разбери глазами: серые перечёркнутые слоты — taken из данных, на них нет onClick. Выбранный красный — это поле selected в сторе. Сумма и кнопка реагируют на стор. Нажал «Забронировать» — слот стал taken, стор обновился, map перерисовал сетку. Никакого ручного трогания DOM.</p></div></div></section><section><div class=\"sec-num\">03 · КОД ВИДЖЕТА</div><h2>Всё вместе в одном компоненте</h2><p>Вот как это выглядит в коде. Состояние из стора, map по слотам, пропсы вниз в SlotCard, onClick наверх в стор, Tailwind для вида, dark: для темы.</p><div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">BookingBoard.tsx</span></div>\n  <pre><code><span class=\"tk\">function</span> <span class=\"ty\">BookingBoard</span><span class=\"tx\">(</span><span class=\"tx\">)</span> <span class=\"tx\">{</span>\n  <span class=\"tk\">const</span> <span class=\"tx\">{</span> <span class=\"tx\">slots</span><span class=\"tx\">,</span> <span class=\"tx\">selected</span><span class=\"tx\">,</span> <span class=\"tx\">select</span> <span class=\"tx\">}</span> <span class=\"to\">=</span> <span class=\"tf\">useBooking</span><span class=\"tx\">(</span><span class=\"tx\">)</span><span class=\"tx\">;</span>   <span class=\"tc\">// глобальный стор</span>\n\n  <span class=\"tk\">return</span> <span class=\"tx\">(</span>\n    <span class=\"to\">&lt;</span><span class=\"tx\">div</span> <span class=\"tx\">className</span><span class=\"to\">=</span><span class=\"ts2\">\"grid grid-cols-4 gap-3 dark:bg-slate-900\"</span><span class=\"to\">&gt;</span>\n      <span class=\"tx\">{</span><span class=\"tx\">slots</span><span class=\"tx\">.</span><span class=\"tf\">map</span><span class=\"tx\">(</span><span class=\"tx\">(</span><span class=\"tx\">slot</span><span class=\"tx\">)</span> <span class=\"to\">=&gt;</span> <span class=\"tx\">(</span>              <span class=\"tc\">// map по коллекции</span>\n        <span class=\"to\">&lt;</span><span class=\"ty\">SlotCard</span>\n          <span class=\"tx\">key</span><span class=\"to\">=</span><span class=\"tx\">{</span><span class=\"tx\">slot</span><span class=\"tx\">.</span><span class=\"tx\">id</span><span class=\"tx\">}</span>                   <span class=\"tc\">// уникальный key</span>\n          <span class=\"tx\">time</span><span class=\"to\">=</span><span class=\"tx\">{</span><span class=\"tx\">slot</span><span class=\"tx\">.</span><span class=\"tx\">time</span><span class=\"tx\">}</span>                <span class=\"tc\">// props вниз</span>\n          <span class=\"tx\">price</span><span class=\"to\">=</span><span class=\"tx\">{</span><span class=\"tx\">slot</span><span class=\"tx\">.</span><span class=\"tx\">price</span><span class=\"tx\">}</span>\n          <span class=\"tx\">selected</span><span class=\"to\">=</span><span class=\"tx\">{</span><span class=\"tx\">slot</span><span class=\"tx\">.</span><span class=\"tx\">id</span> <span class=\"to\">===</span> <span class=\"tx\">selected</span><span class=\"tx\">}</span>\n          <span class=\"tx\">disabled</span><span class=\"to\">=</span><span class=\"tx\">{</span><span class=\"tx\">slot</span><span class=\"tx\">.</span><span class=\"tx\">taken</span><span class=\"tx\">}</span>\n          <span class=\"tx\">onSelect</span><span class=\"to\">=</span><span class=\"tx\">{</span><span class=\"tx\">(</span><span class=\"tx\">)</span> <span class=\"to\">=&gt;</span> <span class=\"tf\">select</span><span class=\"tx\">(</span><span class=\"tx\">slot</span><span class=\"tx\">.</span><span class=\"tx\">id</span><span class=\"tx\">)</span><span class=\"tx\">}</span> <span class=\"tc\">// событие наверх в стор</span>\n        <span class=\"to\">/</span><span class=\"to\">&gt;</span>\n      <span class=\"tx\">)</span><span class=\"tx\">)</span><span class=\"tx\">}</span>\n    <span class=\"to\">&lt;</span><span class=\"to\">/</span><span class=\"tx\">div</span><span class=\"to\">&gt;</span>\n  <span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">}</span></code></pre>\n</div><div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">SlotCard.tsx</span></div>\n  <pre><code><span class=\"tc\">// чистый презентационный компонент — только props, своего состояния нет</span>\n<span class=\"tk\">function</span> <span class=\"ty\">SlotCard</span><span class=\"tx\">(</span><span class=\"tx\">{</span> <span class=\"tx\">time</span><span class=\"tx\">,</span> <span class=\"tx\">price</span><span class=\"tx\">,</span> <span class=\"tx\">selected</span><span class=\"tx\">,</span> <span class=\"tx\">disabled</span><span class=\"tx\">,</span> <span class=\"tx\">onSelect</span> <span class=\"tx\">}</span><span class=\"tx\">)</span> <span class=\"tx\">{</span>\n  <span class=\"tk\">return</span> <span class=\"tx\">(</span>\n    <span class=\"to\">&lt;</span><span class=\"tx\">button</span>\n      <span class=\"tx\">disabled</span><span class=\"to\">=</span><span class=\"tx\">{</span><span class=\"tx\">disabled</span><span class=\"tx\">}</span>\n      <span class=\"tx\">onClick</span><span class=\"to\">=</span><span class=\"tx\">{</span><span class=\"tx\">onSelect</span><span class=\"tx\">}</span>\n      <span class=\"tx\">className</span><span class=\"to\">=</span><span class=\"tx\">{</span><span class=\"ts2\">`p-3 rounded-xl text-center transition\n        ${selected ? 'bg-red-500 text-white' : 'bg-slate-100 dark:bg-slate-700'}\n        ${disabled ? 'opacity-30 line-through' : 'hover:-translate-y-1'}`</span><span class=\"tx\">}</span>\n    <span class=\"to\">&gt;</span>\n      <span class=\"to\">&lt;</span><span class=\"tx\">div</span> <span class=\"tx\">className</span><span class=\"to\">=</span><span class=\"ts2\">\"font-mono font-bold\"</span><span class=\"to\">&gt;</span><span class=\"tx\">{</span><span class=\"tx\">time</span><span class=\"tx\">}</span><span class=\"to\">&lt;</span><span class=\"to\">/</span><span class=\"tx\">div</span><span class=\"to\">&gt;</span>\n      <span class=\"to\">&lt;</span><span class=\"tx\">div</span> <span class=\"tx\">className</span><span class=\"to\">=</span><span class=\"ts2\">\"text-xs opacity-80\"</span><span class=\"to\">&gt;</span><span class=\"tx\">{</span><span class=\"tx\">price</span><span class=\"tx\">}</span><span class=\"to\">&lt;</span><span class=\"to\">/</span><span class=\"tx\">div</span><span class=\"to\">&gt;</span>\n    <span class=\"to\">&lt;</span><span class=\"to\">/</span><span class=\"tx\">button</span><span class=\"to\">&gt;</span>\n  <span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">}</span></code></pre>\n</div><div class=\"say kyle\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"kFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#b87a48\"/><stop offset=\"100%\" stop-color=\"#9a6238\"/></linearGradient><radialGradient id=\"kCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#e8957a\" stop-opacity=\"0.5\"/><stop offset=\"100%\" stop-color=\"#e8957a\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"58\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"142\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"64\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><ellipse cx=\"136\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><path d=\"M68 58 Q60 22 88 44 Q80 56 72 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M132 58 Q140 22 112 44 Q120 56 128 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M71 54 Q67 36 82 48 Z\" fill=\"#3a3230\"/><path d=\"M129 54 Q133 36 118 48 Z\" fill=\"#3a3230\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#kFur__U)\"/><path d=\"M100 56 Q62 62 60 104 Q100 92 140 104 Q138 62 100 56 Z\" fill=\"#e8cfa8\"/><ellipse cx=\"100\" cy=\"98\" rx=\"40\" ry=\"30\" fill=\"#ecd6b4\"/><ellipse cx=\"100\" cy=\"116\" rx=\"30\" ry=\"24\" fill=\"#f2e1c8\"/><ellipse cx=\"72\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"128\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"100\" cy=\"106\" rx=\"9\" ry=\"7\" fill=\"#3a2a26\"/><ellipse cx=\"97\" cy=\"104\" rx=\"3\" ry=\"2\" fill=\"#5a4a44\" opacity=\"0.7\"/><ellipse cx=\"80\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><ellipse cx=\"120\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><circle cx=\"81\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"119\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"81\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"119\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"84\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"122\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"77\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"115\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M88 120 Q100 130 112 120\" stroke=\"#7a5238\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M74 142 Q100 154 126 142\" stroke=\"#9a4030\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"100\" cy=\"151\" r=\"7\" fill=\"#f0c44e\"/><circle cx=\"100\" cy=\"153\" r=\"1.8\" fill=\"#9a7a1a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Кайл</div><p>Вот и вся картина, Яндексоиды. SlotCard ничего не знает и не помнит — только принимает пропсы и зовёт onSelect. Вся память (что выбрано, что занято) в сторе. Виджет через map раздаёт данные карточкам. Тема сверху красит всё. Каждый кусок на своём слое FSD, и потому его легко найти, заменить и не сломать остальное. Это и есть хорошая архитектура.</p></div></div><div class=\"box info\"><div class=\"bt\">Что дальше</div><p>Это обзорная сборка. Можно копнуть: загрузку слотов с реального API (entities/slot/api + наш fetch и zod из прошлой лекции), оптимистичные апдейты, формы бронирования с валидацией, адаптив под мобилку через md:/lg:. Скажешь — углубим любой кусок.</p></div></section><div class=\"qt\"><div class=\"qt-text\">Болтовня ничего не стоит. Покажи мне код.</div><div class=\"qt-author\">Линус Торвальдс</div></div><div class=\"pager\"><button onclick=\"pager(-1)\">← Темы</button></div><footer><div class=\"big\">Готово 🔴</div><p>Контейнеры · Tailwind · props &amp; hooks · состояние · map · темы · букинг по FSD<br>Кайл, Макси и Рен прощаются с дорогими студентами-Яндексоидами.</p></footer></div>\n</div></div>\n<script>\nconst pageOrder = ['layout','tw','hooks','theme','booking'];\nfunction showPage(id){\n  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));\n  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));\n  document.getElementById('page-'+id).classList.add('active');\n  document.querySelector('.tab[data-page=\"'+id+'\"]').classList.add('active');\n  window.scrollTo({top:0,behavior:'smooth'});\n}\ndocument.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>showPage(t.dataset.page)));\nfunction pager(dir){\n  const cur=document.querySelector('.page.active').id.replace('page-','');\n  const i=pageOrder.indexOf(cur), ni=i+dir;\n  if(ni>=0&&ni<pageOrder.length) showPage(pageOrder[ni]);\n}\nwindow.addEventListener('scroll',()=>{const h=document.documentElement;\n  document.getElementById('prog').style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%';});\n\n// ===== ASYNC JS RUNNER =====\nfunction fmt(v){\n  if(typeof v==='string') return v;\n  if(v===undefined) return 'undefined';\n  if(v===null) return 'null';\n  try{return JSON.stringify(v,null,2);}catch(e){return String(v);}\n}\nasync function runJS(btn){\n  const block=btn.closest('.code');\n  const consoleEl=block.querySelector('.console');\n  const inner=consoleEl.querySelector('.console-inner');\n  const src=decodeURIComponent(btn.dataset.src);\n  const logs=[];\n  const fakeConsole={\n    log:(...a)=>logs.push({t:'log',m:a.map(fmt).join(' ')}),\n    error:(...a)=>logs.push({t:'err',m:a.map(fmt).join(' ')}),\n    warn:(...a)=>logs.push({t:'log',m:a.map(fmt).join(' ')}),\n  };\n  inner.querySelectorAll('.cline').forEach(n=>n.remove());\n  try{\n    const fn=new Function('console','return (async()=>{\\n'+src+'\\n})();');\n    await fn(fakeConsole);\n  }catch(e){ logs.push({t:'err',m:e.name+': '+e.message}); }\n  if(!logs.length){const d=document.createElement('div');d.className='cline dim';d.textContent='(нет вывода — добавь console.log)';inner.appendChild(d);}\n  else logs.forEach(l=>{const d=document.createElement('div');d.className='cline'+(l.t==='err'?' err':'');d.textContent=l.m;inner.appendChild(d);});\n  consoleEl.classList.add('show');\n  btn.querySelector('.rlabel').textContent='Запущено';\n  setTimeout(()=>{btn.querySelector('.rlabel').textContent='Запустить';},1200);\n}\n\n// ===== FLEXBOX PLAYGROUND =====\nconst flexState={dir:'row',justify:'flex-start',align:'stretch'};\nconst twMap={row:'flex-row',column:'flex-col','flex-start':'justify-start',center:'justify-center','space-between':'justify-between','flex-end':'justify-end',stretch:'items-stretch','center-a':'items-center','flex-start-a':'items-start'};\nfunction flexSet(kind,val){\n  flexState[kind]=val;\n  const box=document.getElementById('flexbox');\n  box.style.flexDirection=flexState.dir;\n  box.style.justifyContent=flexState.justify;\n  box.style.alignItems=flexState.align;\n  const a=flexState.align==='center'?'center-a':flexState.align==='flex-start'?'flex-start-a':'stretch';\n  document.getElementById('flex-cls').innerHTML='&lt;div class=\"flex <span class=\"u\">'+twMap[flexState.dir]+'</span> <span class=\"u\">'+twMap[flexState.justify]+'</span> <span class=\"u\">'+twMap[a]+'</span> gap-3\"&gt;';\n}\n\n// ===== TAILWIND CARD TOGGLES =====\nconst tw={pad:false,round:false,shadow:false,accent:false};\nfunction twToggle(k,btn){\n  tw[k]=!tw[k]; btn.classList.toggle('ghost',!tw[k]);\n  const c=document.getElementById('twcard');\n  c.style.padding = tw.pad?'24px':'10px';\n  c.style.borderRadius = tw.round?'18px':'3px';\n  c.style.boxShadow = tw.shadow?'0 12px 30px rgba(0,0,0,.35)':'none';\n  c.style.background = tw.accent?'#e23b50':'#fff';\n  c.style.color = tw.accent?'#fff':'#1a1a2e';\n  c.querySelectorAll('h4,p').forEach(e=>e.style.color = tw.accent?'#fff':'');\n  const parts=['rounded-md','bg-white'];\n  let cls='';\n  cls+= tw.pad?'p-6 ':'p-2 ';\n  cls+= tw.round?'rounded-2xl ':'rounded-sm ';\n  cls+= tw.shadow?'shadow-xl ':'';\n  cls+= tw.accent?'bg-red-500 text-white':'bg-white';\n  document.getElementById('tw-cls').innerHTML='&lt;div class=\"<span class=\"u\">'+cls.trim()+'</span>\"&gt;';\n}\n\n// ===== PROPS DEMO =====\nfunction propsUpdate(){\n  const v=document.getElementById('props-input').value||'Гость';\n  document.getElementById('props-name').textContent=v;\n  document.getElementById('props-initial').textContent=v[0]?v[0].toUpperCase():'?';\n  document.getElementById('props-call').innerHTML='&lt;UserCard name=<span style=\"color:#98c379\">\"'+v.replace(/</g,'')+'\"</span> /&gt;';\n}\n\n// ===== STATE COUNTER =====\nlet count=0, renders=0;\nfunction stateInc(n){\n  count+=n; renders++;\n  document.getElementById('cval').textContent=count;\n  document.getElementById('renders').textContent=renders;\n}\nfunction stateReset(){count=0;renders++;document.getElementById('cval').textContent=0;document.getElementById('renders').textContent=renders;}\n\n// ===== MAP LIST =====\nlet todos=[{id:1,t:'Забронировать отель'},{id:2,t:'Купить билеты'}];\nlet nid=3;\nfunction mapRender(){\n  const el=document.getElementById('maplist');\n  el.innerHTML=todos.map(t=>\n    '<div class=\"mapitem\"><span>'+t.t.replace(/</g,'')+' <span class=\"key\">key={'+t.id+'}</span></span>'+\n    '<button class=\"del\" onclick=\"mapDel('+t.id+')\">×</button></div>').join('')\n    || '<div class=\"mapitem\" style=\"opacity:.5\">список пуст — массив [] рисует ничего</div>';\n  document.getElementById('map-count').textContent=todos.length;\n}\nfunction mapAdd(){\n  const inp=document.getElementById('map-input');\n  const v=inp.value.trim(); if(!v)return;\n  todos.push({id:nid++,t:v}); inp.value=''; mapRender();\n}\nfunction mapDel(id){ todos=todos.filter(t=>t.id!==id); mapRender(); }\n\n// ===== THEME SWITCH =====\nlet lightMode=false;\nfunction toggleTheme(){\n  lightMode=!lightMode;\n  document.querySelectorAll('.theme-target').forEach(el=>el.classList.toggle('light',lightMode));\n  document.querySelectorAll('.theme-toggle').forEach(t=>t.classList.toggle('lighton',lightMode));\n  document.querySelectorAll('.theme-lab').forEach(l=>l.textContent=lightMode?'theme: light':'theme: dark');\n}\n\n// ===== BOOKING SHOWCASE =====\nconst slots=[\n {id:'09',time:'09:00',price:'1200 ₽',taken:false},\n {id:'10',time:'10:30',price:'1200 ₽',taken:true},\n {id:'12',time:'12:00',price:'1500 ₽',taken:false},\n {id:'13',time:'13:30',price:'1500 ₽',taken:false},\n {id:'15',time:'15:00',price:'1500 ₽',taken:true},\n {id:'16',time:'16:30',price:'1800 ₽',taken:false},\n {id:'18',time:'18:00',price:'2000 ₽',taken:false},\n {id:'19',time:'19:30',price:'2000 ₽',taken:false},\n];\nlet selected=null;\nfunction bookingRender(){\n  const grid=document.getElementById('bk-grid');\n  // map() over slots -> slot components, props passed down\n  grid.innerHTML=slots.map(s=>{\n    const cls='bk-slot'+(s.taken?' taken':'')+(selected===s.id?' sel':'');\n    const click=s.taken?'':'onclick=\"bookingSelect(\\''+s.id+'\\')\"';\n    return '<div class=\"'+cls+'\" '+click+'><div class=\"bk-time\">'+s.time+'</div><div class=\"bk-price\">'+s.price+'</div></div>';\n  }).join('');\n  const sel=slots.find(s=>s.id===selected);\n  document.getElementById('bk-pick').textContent=sel?sel.time+' · '+sel.price:'— не выбрано —';\n  document.getElementById('bk-btn').disabled=!sel;\n}\nfunction bookingSelect(id){ selected=(selected===id?null:id); bookingRender(); }\nfunction bookingConfirm(){\n  const sel=slots.find(s=>s.id===selected); if(!sel)return;\n  sel.taken=true; selected=null; bookingRender();\n  const log=document.getElementById('bk-log');\n  log.textContent='✓ Слот '+sel.time+' забронирован → стор обновился → сетка перерисовалась через map()';\n}\n\n// FSD cake reuse not needed here\nwindow.addEventListener('DOMContentLoaded',()=>{\n  showPage('layout');\n  if(document.getElementById('flexbox')) flexSet('dir','row');\n  if(document.getElementById('twcard')) twToggle('pad',{classList:{toggle:()=>{}}});\n  if(document.getElementById('props-input')) propsUpdate();\n  if(document.getElementById('maplist')) mapRender();\n  if(document.getElementById('bk-grid')) bookingRender();\n});\n<\/script>\n</body>\n</html>", "data": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Дата-менеджмент · fetch · Zod · Zustand · FSD — большая лекция</title>\n<style>\n  @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;800&family=Nunito:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');\n  :root{\n    --bg:#120e15; --bg2:#1a121c; --card:#241823; --card2:#2f1f2d; --line:#43293c;\n    --ink:#f3e9ef; --muted:#b291a4;\n    --acc:#e23b50; --acc2:#ff7a5c; --acc3:#ff5470; --acc-deep:#b1283b;\n    --kyle:#d98b54; --maxi:#46b877; --ren:#9aa6c0;\n    --yellow:#f7df1e; --blue:#61afef; --react:#61dafb; --ts:#5aa6f0;\n    --purple:#c678dd; --green:#98c379; --orange:#e5a35a; --red:#e06c75; --cyan:#56b6c2;\n  }\n  *{box-sizing:border-box;margin:0;padding:0;}\n  html{scroll-behavior:smooth;}\n  body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;}\n  body::before{content:\"\";position:fixed;inset:0;z-index:0;pointer-events:none;\n    background-image:radial-gradient(circle, rgba(226,59,80,0.06) 1px, transparent 1px);background-size:34px 34px;}\n  .progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--acc-deep),var(--acc),var(--acc2));z-index:200;width:0;}\n\n  .topbar{position:sticky;top:0;z-index:100;background:rgba(18,14,21,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}\n  .topbar-inner{max-width:1040px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:16px;height:62px;}\n  .brand{font-family:'Unbounded',sans-serif;font-weight:700;font-size:15px;white-space:nowrap;color:var(--acc2);}\n  .brand b{color:var(--acc3);}\n  .tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none;}\n  .tabs::-webkit-scrollbar{display:none;}\n  .tab{font-family:'Nunito',sans-serif;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;\n    background:transparent;border:1px solid transparent;border-radius:10px;padding:8px 13px;color:var(--muted);transition:all .15s;}\n  .tab:hover{color:var(--ink);background:var(--card);}\n  .tab.active{color:var(--ink);background:var(--card2);border-color:var(--acc);}\n  .tab .n{font-family:'JetBrains Mono',monospace;font-size:11px;opacity:.6;margin-right:6px;color:var(--acc2);}\n\n  .wrap{max-width:1040px;margin:0 auto;padding:0 20px;position:relative;z-index:1;}\n  .page{display:none;animation:fade .4s;}\n  .page.active{display:block;}\n  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}\n\n  .phero{padding:46px 0 30px;border-bottom:1px solid var(--line);margin-bottom:8px;}\n  .phero .kicker{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:3px;text-transform:uppercase;margin-bottom:14px;color:var(--acc2);}\n  .phero h1{font-family:'Unbounded',sans-serif;font-weight:800;font-size:clamp(30px,6vw,50px);line-height:1.06;margin-bottom:14px;}\n  .phero p{color:var(--muted);font-size:17px;max-width:640px;}\n\n  section{padding:30px 0;}\n  section + section{border-top:1px solid var(--line);}\n  .sec-num{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--acc);letter-spacing:2px;margin-bottom:8px;}\n  h2{font-family:'Unbounded',sans-serif;font-weight:700;font-size:clamp(23px,4vw,33px);margin-bottom:10px;line-height:1.14;}\n  h3{font-family:'Unbounded',sans-serif;font-weight:600;font-size:20px;margin:26px 0 10px;}\n  h4{font-family:'Unbounded',sans-serif;font-weight:600;font-size:15.5px;margin:18px 0 8px;color:var(--acc2);}\n  p{margin-bottom:14px;color:#dccad4;}\n  p strong{color:#fff;}\n  ul.plain{margin:0 0 16px 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px;}\n  ul.plain li{padding-left:24px;position:relative;color:#dccad4;}\n  ul.plain li::before{content:\"▸\";position:absolute;left:4px;color:var(--acc);}\n  .lead{font-size:18px;color:#ecdde6;}\n  code:not(pre code){font-family:'JetBrains Mono',monospace;font-size:.87em;background:#3a2433;color:var(--acc2);padding:2px 7px;border-radius:6px;}\n\n  .say{display:flex;gap:13px;align-items:flex-start;margin:20px 0;}\n  .say .ava{flex-shrink:0;width:58px;height:58px;border-radius:15px;display:flex;align-items:center;justify-content:center;overflow:hidden;}\n  .say .ava svg{width:54px;height:54px;}\n  .say.kyle .ava{background:rgba(217,139,84,.16);border:1.5px solid rgba(217,139,84,.42);}\n  .say.maxi .ava{background:rgba(70,184,119,.16);border:1.5px solid rgba(70,184,119,.42);}\n  .say.ren .ava{background:rgba(154,166,192,.16);border:1.5px solid rgba(154,166,192,.42);}\n  .bubble{background:var(--card);border:1px solid var(--line);border-radius:5px 16px 16px 16px;padding:13px 17px;flex:1;}\n  .bubble .who{font-family:'Unbounded',sans-serif;font-weight:600;font-size:12.5px;margin-bottom:3px;}\n  .say.kyle .who{color:var(--kyle);} .say.maxi .who{color:var(--maxi);} .say.ren .who{color:var(--ren);}\n  .bubble p{margin:0;font-size:15px;color:#e6d6e0;}\n\n  .code{background:#1c1320;border:1px solid var(--line);border-radius:13px;margin:18px 0;overflow:hidden;}\n  .code-top{display:flex;align-items:center;gap:7px;padding:10px 14px;background:#160e19;border-bottom:1px solid var(--line);}\n  .code-top .dot{width:10px;height:10px;border-radius:50%;}\n  .dot.r{background:#ff5f57;}.dot.y{background:#febc2e;}.dot.g{background:#28c840;}\n  .code-top .fn{margin-left:6px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--muted);flex:1;}\n  .runbtn{font-family:'Nunito',sans-serif;font-weight:700;font-size:12.5px;cursor:pointer;\n    background:var(--acc);color:#fff;border:none;border-radius:8px;padding:6px 14px;display:flex;align-items:center;gap:6px;transition:all .15s;}\n  .runbtn:hover{filter:brightness(1.12);transform:translateY(-1px);}\n  .runbtn:active{transform:translateY(0);}\n  pre{margin:0;padding:16px 18px;overflow-x:auto;}\n  pre code{font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.62;}\n  .tk{color:var(--purple);}.ts2{color:var(--green);}.tn{color:var(--orange);}.tc{color:#6b5566;font-style:italic;}\n  .tf{color:var(--blue);}.tp{color:var(--red);}.to{color:var(--cyan);}.ty{color:#e5c07b;}.tx{color:#cdbcca;}\n\n  .console{background:#0e0a11;border-top:1px solid var(--line);padding:0;max-height:0;overflow:hidden;transition:max-height .3s ease;}\n  .console.show{max-height:500px;overflow:auto;}\n  .console-inner{padding:14px 18px;font-family:'JetBrains Mono',monospace;font-size:12.5px;}\n  .console-label{color:#6b5566;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:6px;}\n  .console-label::before{content:\"▶\";color:var(--acc);font-size:9px;}\n  .cline{color:#d8c6d2;white-space:pre-wrap;padding:1px 0;}\n  .cline.err{color:var(--red);}\n  .cline.dim{color:#6b5566;}\n\n  .box{border-radius:13px;padding:15px 18px;margin:18px 0;border-left:4px solid;}\n  .box .bt{font-family:'Unbounded',sans-serif;font-weight:600;font-size:13.5px;margin-bottom:5px;}\n  .box p{margin:0;font-size:14.5px;}\n  .box.tip{background:rgba(247,223,30,.07);border-color:var(--yellow);} .box.tip .bt{color:var(--yellow);}\n  .box.warn{background:rgba(224,108,117,.09);border-color:var(--red);} .box.warn .bt{color:var(--red);}\n  .box.info{background:rgba(226,59,80,.08);border-color:var(--acc);} .box.info .bt{color:var(--acc2);}\n  .box.ts{background:rgba(90,166,240,.1);border-color:var(--ts);} .box.ts .bt{color:#7bb4f0;}\n\n  .viz{background:linear-gradient(160deg,#241723,#1a121c);border:1px solid var(--line);border-radius:16px;padding:24px;margin:20px 0;}\n  .viz-title{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;text-align:center;margin-bottom:18px;}\n  .flow{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;}\n  .flow .pill{background:var(--card2);border-radius:11px;padding:11px 14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;border:1px solid var(--line);}\n  .flow .lbl{font-size:11px;color:var(--muted);margin-top:6px;font-family:'JetBrains Mono',monospace;text-align:center;}\n  .flow .op{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--acc2);background:rgba(255,122,92,.12);border:1px solid rgba(255,122,92,.3);border-radius:100px;padding:5px 11px;white-space:nowrap;}\n  .flow .arr-ico{color:var(--acc);font-size:20px;}\n\n  .meme-row{text-align:center;margin:22px 0;}\n  .meme{display:inline-flex;align-items:center;gap:9px;background:var(--card2);border:1px dashed var(--line);border-radius:100px;padding:5px 15px 5px 7px;margin:5px 4px;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--muted);}\n  .meme .mava{width:28px;height:28px;border-radius:50%;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;}\n  .meme .mava svg{width:28px;height:28px;}\n\n  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:13px;overflow:hidden;margin:18px 0;}\n  @media(max-width:640px){.cmp{grid-template-columns:1fr;}}\n  .cmp .ch{padding:10px 14px;font-family:'Unbounded',sans-serif;font-weight:600;font-size:13px;}\n  .cmp .ch.a{background:rgba(70,184,119,.14);color:var(--maxi);}\n  .cmp .ch.b{background:rgba(226,59,80,.16);color:var(--acc2);}\n  .cmp .cc{padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:12px;background:#1c1320;border-top:1px solid var(--line);white-space:pre-wrap;line-height:1.6;color:#cdbcca;}\n\n  /* ===== FILE TREE ===== */\n  .ftree{background:#160e19;border:1px solid var(--line);border-radius:12px;padding:16px 18px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.85;margin:18px 0;overflow-x:auto;}\n  .ftree .dir{color:var(--acc2);}\n  .ftree .fl{color:#c4b4c0;}\n  .ftree .cm{color:#6b5566;}\n\n  /* ===== HTTP STATUS EXPLORER ===== */\n  .stx{margin:20px 0;}\n  .stx-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}\n  .stx-chip{cursor:pointer;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;padding:9px 15px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);transition:all .15s;}\n  .stx-chip:hover{transform:translateY(-2px);}\n  .stx-chip.c2{border-color:#2faf6a;} .stx-chip.c3{border-color:#d6a13a;}\n  .stx-chip.c4{border-color:var(--acc);} .stx-chip.c5{border-color:#a03048;}\n  .stx-chip.active{background:var(--card2);box-shadow:0 0 0 2px var(--acc) inset;}\n  .stx-detail{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px 20px;min-height:90px;}\n  .stx-detail .stx-code{font-family:'Unbounded',sans-serif;font-weight:800;font-size:30px;}\n  .stx-detail .stx-name{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted);margin-bottom:8px;}\n  .stx-detail .stx-desc{font-size:14.5px;color:#e6d6e0;}\n\n  /* ===== STORE / CART WIDGET ===== */\n  .widget{background:linear-gradient(160deg,#241723,#1a121c);border:1px solid var(--line);border-radius:16px;padding:20px;mar );border-radius:10px;padding:12px;min-height:120px;resize:vertical;line-height:1.5;}\n  .zod .zrow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;}\n  .zod-result{border-radius:10px;padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;white-space:pre-wrap;min-height:50px;line-height:1.55;}\n  .zod-result.ok{background:rgba(70,184,119,.1);border:1px solid rgba(70,184,119,.4);color:#9fe0bb;}\n  .zod-result.bad{background:rgba(226,59,80,.1);border:1px solid rgba(226,59,80,.4);color:#f0a4b0;}\n  .zod-result.idle{background:#160e19;border:1px solid var(--line);color:var(--muted);}\n\n  /* ===== FETCH DEMO ===== */\n  .fetchout{background:#0e0a11;border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:10px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#cdbcca;white-space:pre-wrap;max-height:260px;overflow:auto;min-height:46px;line-height:1.5;}\n  .fetchout .k{color:var(--acc2);}.fetchout .v{color:var(--green);}.fetchout .num{color:var(--orange);}.fetchout .muted{color:#6b5566;}\n\n  /* ===== NETWORK ANIMATION ===== */\n  .net{background:linear-gradient(160deg,#241723,#1a121c);border:1px solid var(--line);border-radius:16px;padding:26px 20px;margin:20px 0;}\n  .net-stage{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;}\n  .net-node{flex-shrink:0;text-align:center;width:120px;}\n  .net-node .nbox{font-size:32px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px 0;}\n  .net-node .nlbl{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);margin-top:8px;}\n  .net-wire{flex:1;height:3px;background:var(--line);border-radius:2px;position:relative;margin:0 4px;align-self:flex-start;margin-top:36px;}\n  .net-packet{position:absolute;top:-7px;left:0;width:16px;height:16px;border-radius:4px;font-size:10px;display:flex;align-items:center;justify-content:center;opacity:0;}\n  .net-packet.req{background:var(--acc);}\n  .net-packet.res{background:var(--maxi);}\n  @keyframes flyR{0%{left:0;opacity:1;}100%{left:calc(100% - 16px);opacity:1;}}\n  @keyframes flyL{0%{left:calc(100% - 16px);opacity:1;}100%{left:0;opacity:1;}}\n  .net-packet.go-req{animation:flyR 1s ease forwards;}\n  .net-packet.go-res{animation:flyL 1s ease forwards;}\n  .net-log{margin-top:18px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#cdbcca;min-height:24px;}\n\n  /* ===== FSD CAKE (тортик) ===== */\n  .cake{display:flex;flex-direction:column;align-items:center;gap:0;margin:24px 0 8px;perspective:1000px;}\n  .cake-layer{width:100%;max-width:560px;color:#fff;border-radius:10px;padding:13px 20px;margin-top:-2px;cursor:pointer;transition:transform .2s, box-shadow .2s;\n    transform:rotateX(8deg);box-shadow:0 4px 0 rgba(0,0,0,.25);display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid rgba(255,255,255,.12);}\n  .cake-layer:hover{transform:rotateX(8deg) translateY(-3px) scale(1.015);box-shadow:0 10px 22px rgba(0,0,0,.4);}\n  .cake-layer .cl-name{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;}\n  .cake-layer .cl-tag{font-size:12px;opacity:.92;text-align:right;}\n  .cl-app{background:#c0392b;width:46%;} .cl-pages{background:#d96a2e;width:56%;}\n  .cl-widgets{background:#cf9a2c;width:66%;} .cl-features{background:#3a9a5e;width:76%;}\n  .cl-entities{background:#3a72b8;width:86%;} .cl-shared{background:#6b5a86;width:96%;}\n  .cake-detail{max-width:560px;margin:14px auto 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;font-size:14px;color:#e6d6e0;min-height:60px;}\n  .cake-detail .cd-t{font-family:'Unbounded';font-weight:600;font-size:14px;margin-bottom:5px;}\n\n  /* ===== DATA PIPELINE (the payoff) ===== */\n  .pipe{background:linear-gradient(160deg,#241723,#1a121c);border:1px solid var(--line);border-radius:16px;padding:22px;margin:20px 0;}\n  .pipe-track{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;}\n  .pipe-step{flex:1;min-width:150px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin:5px;transition:all .3s;opacity:.45;}\n  .pipe-step.lit{opacity:1;border-color:var(--acc);box-shadow:0 0 18px rgba(226,59,80,.3);transform:translateY(-3px);}\n  .pipe-step .ps-layer{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--acc2);margin-bottom:5px;}\n  .pipe-step .ps-t{font-weight:700;font-size:14px;margin-bottom:4px;}\n  .pipe-step .ps-d{font-size:12px;color:var(--muted);line-height:1.4;}\n  .pipe-step .ps-ico{font-size:20px;margin-bottom:6px;}\n\n  footer{text-align:center;padding:44px 20px 70px;border-top:1px solid var(--line);margin-top:24px;}\n  footer .big{font-family:'Unbounded',sans-serif;font-weight:700;font-size:22px;color:var(--acc2);margin-bottom:8px;}\n  footer p{color:var(--muted);}\n  .pager{display:flex;justify-content:space-between;gap:12px;padding:24px 0 8px;}\n  .pager button{font-family:'Nunito',sans-serif;font-weight:700;font-size:14px;cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 20px;transition:all .15s;}\n  .pager button:hover{border-color:var(--acc);color:var(--acc2);}\n  .pager button:disabled{opacity:.3;cursor:not-allowed;}\n  .pager button.next{margin-left:auto;}\n</style>\n</head>\n<body>\n<div class=\"progress\" id=\"prog\"></div>\n<div class=\"topbar\"><div class=\"topbar-inner\">\n  <div class=\"brand\">DATA<b>·</b>FLOW</div>\n  <div class=\"tabs\" id=\"tabs\"><button class=\"tab active\" data-page=\"net\"><span class=\"n\">01</span>Сеть</button><button class=\"tab\" data-page=\"tools\"><span class=\"n\">02</span>fetch / axios</button><button class=\"tab\" data-page=\"types\"><span class=\"n\">03</span>TS &amp; Zod</button><button class=\"tab\" data-page=\"data\"><span class=\"n\">04</span>Дата-менеджмент</button><button class=\"tab\" data-page=\"fsd\"><span class=\"n\">05</span>FSD</button></div>\n</div></div>\n<div class=\"wrap\"><div id=\"PAGES\">\n<div class=\"page active\" id=\"page-net\"><div class=\"phero\"><div class=\"kicker\">Раздел 01 · Сеть</div><h1>Как фронт и бэк разговаривают</h1><p>Прежде чем таскать данные по проекту, надо понять откуда они вообще берутся. Сейчас разберём, что происходит между браузером и сервером, что такое HTTP, коды ответов и JSON. Всё наглядно и кликабельно.</p></div><div class=\"say kyle\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"kFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#b87a48\"/><stop offset=\"100%\" stop-color=\"#9a6238\"/></linearGradient><radialGradient id=\"kCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#e8957a\" stop-opacity=\"0.5\"/><stop offset=\"100%\" stop-color=\"#e8957a\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"58\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"142\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"64\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><ellipse cx=\"136\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><path d=\"M68 58 Q60 22 88 44 Q80 56 72 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M132 58 Q140 22 112 44 Q120 56 128 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M71 54 Q67 36 82 48 Z\" fill=\"#3a3230\"/><path d=\"M129 54 Q133 36 118 48 Z\" fill=\"#3a3230\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#kFur__U)\"/><path d=\"M100 56 Q62 62 60 104 Q100 92 140 104 Q138 62 100 56 Z\" fill=\"#e8cfa8\"/><ellipse cx=\"100\" cy=\"98\" rx=\"40\" ry=\"30\" fill=\"#ecd6b4\"/><ellipse cx=\"100\" cy=\"116\" rx=\"30\" ry=\"24\" fill=\"#f2e1c8\"/><ellipse cx=\"72\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"128\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"100\" cy=\"106\" rx=\"9\" ry=\"7\" fill=\"#3a2a26\"/><ellipse cx=\"97\" cy=\"104\" rx=\"3\" ry=\"2\" fill=\"#5a4a44\" opacity=\"0.7\"/><ellipse cx=\"80\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><ellipse cx=\"120\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><circle cx=\"81\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"119\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"81\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"119\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"84\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"122\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"77\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"115\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M88 120 Q100 130 112 120\" stroke=\"#7a5238\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M74 142 Q100 154 126 142\" stroke=\"#9a4030\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"100\" cy=\"151\" r=\"7\" fill=\"#f0c44e\"/><circle cx=\"100\" cy=\"153\" r=\"1.8\" fill=\"#9a7a1a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Кайл</div><p>Дорогие студенты-Яндексоиды, начнём с фундамента. Фронтенд живёт в браузере, данные живут на сервере. Между ними — сеть. Всё, что мы делаем дальше, это переписка двух программ через интернет.</p></div></div><section><div class=\"sec-num\">01 · КЛИЕНТ И СЕРВЕР</div><h2>Двое на проводе</h2><p class=\"lead\">Браузер (клиент) спрашивает. Сервер (бэкенд) отвечает. Точка.</p><p>Когда ты открываешь страницу, браузер по имени сайта находит его IP через <strong>DNS</strong> (телефонная книга интернета), стучится на сервер и говорит: «дай мне вот это». Сервер думает, лезет в базу, и присылает ответ. Один запрос — один ответ. Сервер сам тебе ничего не шлёт, пока не спросишь (если это не вебсокеты, но это другая история).</p><div class=\"net\"><div class=\"net-stage\"><div class=\"net-node\"><div class=\"nbox\">🧑‍💻</div><div class=\"nlbl\">Браузер<br>(твой фронт)</div></div><div class=\"net-wire\" id=\"net-wire\"></div><div class=\"net-node\"><div class=\"nbox\">🖥️</div><div class=\"nlbl\">Сервер<br>(бэкенд + БД)</div></div></div><div class=\"net-log\" id=\"net-log\">нажми кнопку — отправим запрос</div><div style=\"text-align:center;margin-top:14px;\"><button class=\"minibtn\" onclick=\"flyPacket()\">▶ Отправить запрос</button></div></div><div class=\"say ren\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"rFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#8893ab\"/><stop offset=\"100%\" stop-color=\"#6e7a94\"/></linearGradient></defs><circle cx=\"70\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"130\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"70\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"130\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"100\" cy=\"102\" r=\"50\" fill=\"url(#rFur__U)\"/><ellipse cx=\"100\" cy=\"116\" rx=\"38\" ry=\"30\" fill=\"#e6eaf2\"/><ellipse cx=\"100\" cy=\"120\" rx=\"30\" ry=\"22\" fill=\"#eef1f7\"/><ellipse cx=\"100\" cy=\"110\" rx=\"11\" ry=\"8\" fill=\"#3e3e48\"/><ellipse cx=\"96\" cy=\"108\" rx=\"3\" ry=\"2\" fill=\"#5e5e68\" opacity=\"0.7\"/><path d=\"M100 117 L100 126\" stroke=\"#3e3e48\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><circle cx=\"120\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><path d=\"M96 94 Q100 90 104 94\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" fill=\"none\"/><circle cx=\"80\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"120\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"83\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"123\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"77\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><circle cx=\"117\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><path d=\"M72 88 Q78 84 84 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M112 88 Q118 84 124 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M78 116 Q60 114 52 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M78 122 Q60 124 54 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 116 Q140 114 148 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 122 Q140 124 146 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M90 124 Q100 131 110 124\" stroke=\"#525c70\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Рен</div><p>Красный пакет — запрос, зелёный — ответ. В реальности туда-обратно это десятки миллисекунд, но цикл всегда один: спросил → подождал → получил. Запомни ритм, на нём держится весь async.</p></div></div></section><section><div class=\"sec-num\">02 · HTTP-МЕТОДЫ</div><h2>Глаголы запроса</h2><p>HTTP — это протокол, язык переписки. У каждого запроса есть <strong>метод</strong> — что мы хотим сделать с ресурсом. Их немного, и они читаются как глаголы.</p><div class=\"cmp\"><div class=\"ch a\">Метод</div><div class=\"ch b\">Что делает</div><div class=\"cc\">GET</div><div class=\"cc\">Прочитать. «Дай мне список юзеров.» Ничего не меняет.</div><div class=\"cc\">POST</div><div class=\"cc\">Создать. «Заведи нового юзера вот с этими данными.»</div><div class=\"cc\">PUT / PATCH</div><div class=\"cc\">Обновить. PUT меняет целиком, PATCH — кусочек.</div><div class=\"cc\">DELETE</div><div class=\"cc\">Удалить. «Снеси заказ №42.»</div></div><div class=\"box tip\"><div class=\"bt\">Правило</div><p>GET только читает и не имеет тела. Если ты что-то меняешь на сервере — это никогда не GET. Иначе поисковый робот, зайдя по ссылке, случайно удалит тебе пол-базы.</p></div></section><section><div class=\"sec-num\">03 · КОДЫ ОТВЕТОВ</div><h2>Сервер отвечает цифрой</h2><p>На каждый запрос сервер возвращает трёхзначный <strong>код статуса</strong>. Первая цифра — категория. Это первое, на что смотришь, когда что-то сломалось. Потыкай:</p><div class=\"stx\"><div class=\"stx-chips\"><button class=\"stx-chip c2\" data-code=\"200\" onclick=\"pickStatus('200')\">200</button><button class=\"stx-chip c2\" data-code=\"201\" onclick=\"pickStatus('201')\">201</button><button class=\"stx-chip c3\" data-code=\"301\" onclick=\"pickStatus('301')\">301</button><button class=\"stx-chip c3\" data-code=\"304\" onclick=\"pickStatus('304')\">304</button><button class=\"stx-chip c4\" data-code=\"400\" onclick=\"pickStatus('400')\">400</button><button class=\"stx-chip c4\" data-code=\"401\" onclick=\"pickStatus('401')\">401</button><button class=\"stx-chip c4\" data-code=\"403\" onclick=\"pickStatus('403')\">403</button><button class=\"stx-chip c4\" data-code=\"404\" onclick=\"pickStatus('404')\">404</button><button class=\"stx-chip c4\" data-code=\"429\" onclick=\"pickStatus('429')\">429</button><button class=\"stx-chip c5\" data-code=\"500\" onclick=\"pickStatus('500')\">500</button><button class=\"stx-chip c5\" data-code=\"503\" onclick=\"pickStatus('503')\">503</button></div><div class=\"stx-detail\" id=\"stx-detail\"></div></div><ul class=\"plain\"><li><strong>2xx</strong> — всё хорошо, держи данные.</li><li><strong>3xx</strong> — иди в другое место (редирект, кэш).</li><li><strong>4xx</strong> — ошибся <em>ты</em> (клиент). Кривой запрос, нет прав, не туда.</li><li><strong>5xx</strong> — упал <em>сервер</em>. Не твоя вина, иди к бэкендерам.</li></ul><div class=\"meme-row\"><span class=\"meme\"><span class=\"mava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"mFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#46b877\"/><stop offset=\"100%\" stop-color=\"#359a5e\"/></linearGradient><radialGradient id=\"mCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#f0a890\" stop-opacity=\"0.45\"/><stop offset=\"100%\" stop-color=\"#f0a890\" stop-opacity=\"0\"/></radialGradient></defs><path d=\"M66 56 Q56 18 90 42 Q80 54 72 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M134 56 Q144 18 110 42 Q120 54 128 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M70 50 Q64 30 82 44 Z\" fill=\"#1f1f1f\"/><path d=\"M130 50 Q136 30 118 44 Z\" fill=\"#1f1f1f\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#mFur__U)\"/><path d=\"M100 64 Q66 72 70 112 Q100 128 130 112 Q134 72 100 64 Z\" fill=\"#f2f6f2\"/><ellipse cx=\"100\" cy=\"104\" rx=\"34\" ry=\"26\" fill=\"#f7faf7\"/><ellipse cx=\"74\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"126\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"100\" cy=\"108\" rx=\"6.5\" ry=\"5\" fill=\"#2a2a2a\"/><path d=\"M100 113 L100 120\" stroke=\"#2a2a2a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><ellipse cx=\"82\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><ellipse cx=\"118\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><circle cx=\"83\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"117\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"83\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"117\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"86\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"120\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"79\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"113\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M90 119 Q100 127 110 119\" stroke=\"#1f5a32\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M97 124 Q100 129 103 124 Z\" fill=\"#e87a8a\"/></svg></span>4xx — это «ты дурак», 5xx — это «я дурак»</span></div></section><section><div class=\"sec-num\">04 · JSON</div><h2>Формат, на котором все договорились</h2><p>Данные по сети летят текстом. Нужен формат, который понимают и JS, и Python, и Go, и кто угодно. Этот формат — <strong>JSON</strong> (JavaScript Object Notation). Объекты в фигурных скобках, массивы в квадратных, строки в кавычках. Выглядит как объект JS, но это просто текст.</p><div class=\"say maxi\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"mFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#46b877\"/><stop offset=\"100%\" stop-color=\"#359a5e\"/></linearGradient><radialGradient id=\"mCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#f0a890\" stop-opacity=\"0.45\"/><stop offset=\"100%\" stop-color=\"#f0a890\" stop-opacity=\"0\"/></radialGradient></defs><path d=\"M66 56 Q56 18 90 42 Q80 54 72 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M134 56 Q144 18 110 42 Q120 54 128 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M70 50 Q64 30 82 44 Z\" fill=\"#1f1f1f\"/><path d=\"M130 50 Q136 30 118 44 Z\" fill=\"#1f1f1f\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#mFur__U)\"/><path d=\"M100 64 Q66 72 70 112 Q100 128 130 112 Q134 72 100 64 Z\" fill=\"#f2f6f2\"/><ellipse cx=\"100\" cy=\"104\" rx=\"34\" ry=\"26\" fill=\"#f7faf7\"/><ellipse cx=\"74\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"126\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"100\" cy=\"108\" rx=\"6.5\" ry=\"5\" fill=\"#2a2a2a\"/><path d=\"M100 113 L100 120\" stroke=\"#2a2a2a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><ellipse cx=\"82\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><ellipse cx=\"118\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><circle cx=\"83\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"117\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"83\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"117\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"86\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"120\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"79\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"113\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M90 119 Q100 127 110 119\" stroke=\"#1f5a32\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M97 124 Q100 129 103 124 Z\" fill=\"#e87a8a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Макси</div><p>Ключевая мысль: по сети летит строка. JSON.parse превращает строку в живой объект, JSON.stringify — наоборот. Жми ▶️, увидишь оба превращения.</p></div></div><div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">json.js</span><button class=\"runbtn\" onclick=\"runJS(this)\" data-src=\"%2F%2F%20%D1%82%D0%BE%2C%20%D1%87%D1%82%D0%BE%20%D1%80%D0%B5%D0%B0%D0%BB%D1%8C%D0%BD%D0%BE%20%D0%BF%D1%80%D0%B8%D0%BB%D0%B5%D1%82%D0%B5%D0%BB%D0%BE%20%D1%81%20%D1%81%D0%B5%D1%80%D0%B2%D0%B5%D1%80%D0%B0%20%E2%80%94%20%D1%8D%D1%82%D0%BE%20%D0%A2%D0%95%D0%9A%D0%A1%D0%A2%0Aconst%20raw%20%3D%20%27%7B%22name%22%3A%22%D0%90%D0%BD%D1%8F%22%2C%22age%22%3A27%2C%22skills%22%3A%5B%22js%22%2C%22ts%22%5D%7D%27%3B%0Aconsole.log%28typeof%20raw%29%3B%20%20%20%20%20%20%20%20%20%20%20%20%2F%2F%20string%20%E2%80%94%20%D0%BF%D0%BE%D0%BA%D0%B0%20%D0%BF%D1%80%D0%BE%D1%81%D1%82%D0%BE%20%D1%81%D1%82%D1%80%D0%BE%D0%BA%D0%B0%0A%0A%2F%2F%20%D0%BF%D0%B0%D1%80%D1%81%D0%B8%D0%BC%20%D1%82%D0%B5%D0%BA%D1%81%D1%82%20%D0%B2%20%D0%BD%D0%B0%D1%81%D1%82%D0%BE%D1%8F%D1%89%D0%B8%D0%B9%20%D0%BE%D0%B1%D1%8A%D0%B5%D0%BA%D1%82%0Aconst%20user%20%3D%20JSON.parse%28raw%29%3B%0Aconsole.log%28typeof%20user%29%3B%20%20%20%20%20%20%20%20%20%20%20%2F%2F%20object%0Aconsole.log%28user.name%2C%20user.age%29%3B%20%20%20%2F%2F%20%D0%90%D0%BD%D1%8F%2027%0Aconsole.log%28user.skills%5B0%5D%29%3B%20%20%20%20%20%20%20%20%2F%2F%20js%0A%0A%2F%2F%20%D0%B8%20%D0%BE%D0%B1%D1%80%D0%B0%D1%82%D0%BD%D0%BE%20%E2%80%94%20%D0%BE%D0%B1%D1%8A%D0%B5%D0%BA%D1%82%20%D0%B2%20%D1%81%D1%82%D1%80%D0%BE%D0%BA%D1%83%2C%20%D1%87%D1%82%D0%BE%D0%B1%D1%8B%20%D0%BE%D1%82%D0%BF%D1%80%D0%B0%D0%B2%D0%B8%D1%82%D1%8C%20%D0%BD%D0%B0%20%D1%81%D0%B5%D1%80%D0%B2%D0%B5%D1%80%0Aconst%20back%20%3D%20JSON.stringify%28%7B%20ok%3A%20true%2C%20count%3A%203%20%7D%29%3B%0Aconsole.log%28back%29%3B%20%20%20%20%20%20%20%20%20%20%20%20%20%20%20%20%20%20%2F%2F%20%7B%22ok%22%3Atrue%2C%22count%22%3A3%7D\"><span>▶</span><span class=\"rlabel\">Запустить</span></button></div>\n  <pre><code><span class=\"tc\">// то, что реально прилетело с сервера — это ТЕКСТ</span>\n<span class=\"tk\">const</span> <span class=\"tx\">raw</span> <span class=\"to\">=</span> <span class=\"ts2\">'{\"name\":\"Аня\",\"age\":27,\"skills\":[\"js\",\"ts\"]}'</span><span class=\"tx\">;</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tk\">typeof</span> <span class=\"tx\">raw</span><span class=\"tx\">)</span><span class=\"tx\">;</span>            <span class=\"tc\">// string — пока просто строка</span>\n\n<span class=\"tc\">// парсим текст в настоящий объект</span>\n<span class=\"tk\">const</span> <span class=\"tx\">user</span> <span class=\"to\">=</span> <span class=\"ty\">JSON</span><span class=\"tx\">.</span><span class=\"tf\">parse</span><span class=\"tx\">(</span><span class=\"tx\">raw</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tk\">typeof</span> <span class=\"tx\">user</span><span class=\"tx\">)</span><span class=\"tx\">;</span>           <span class=\"tc\">// object</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tx\">user</span><span class=\"tx\">.</span><span class=\"tx\">name</span><span class=\"tx\">,</span> <span class=\"tx\">user</span><span class=\"tx\">.</span><span class=\"tx\">age</span><span class=\"tx\">)</span><span class=\"tx\">;</span>   <span class=\"tc\">// Аня 27</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tx\">user</span><span class=\"tx\">.</span><span class=\"tx\">skills</span><span class=\"tx\">[</span><span class=\"tn\">0</span><span class=\"tx\">]</span><span class=\"tx\">)</span><span class=\"tx\">;</span>        <span class=\"tc\">// js</span>\n\n<span class=\"tc\">// и обратно — объект в строку, чтобы отправить на сервер</span>\n<span class=\"tk\">const</span> <span class=\"tx\">back</span> <span class=\"to\">=</span> <span class=\"ty\">JSON</span><span class=\"tx\">.</span><span class=\"tf\">stringify</span><span class=\"tx\">(</span><span class=\"tx\">{</span> <span class=\"tx\">ok</span><span class=\"to\">:</span> <span class=\"tn\">true</span><span class=\"tx\">,</span> <span class=\"tx\">count</span><span class=\"to\">:</span> <span class=\"tn\">3</span> <span class=\"tx\">}</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tx\">back</span><span class=\"tx\">)</span><span class=\"tx\">;</span>                  <span class=\"tc\">// {\"ok\":true,\"count\":3}</span></code></pre>\n  <div class=\"console\"><div class=\"console-inner\"><div class=\"console-label\">console</div></div></div>\n</div><div class=\"box info\"><div class=\"bt\">Зачем это знать фронтендеру</div><p>Сервер почти всегда отдаёт JSON. Любой fetch заканчивается на .json(). Любая ошибка «cannot read property of undefined» часто значит, что структура JSON не та, что ты ждал. Поэтому дальше — валидация.</p></div></section><div class=\"meme-row\"><span class=\"meme\"><span class=\"mava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"rFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#8893ab\"/><stop offset=\"100%\" stop-color=\"#6e7a94\"/></linearGradient></defs><circle cx=\"70\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"130\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"70\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"130\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"100\" cy=\"102\" r=\"50\" fill=\"url(#rFur__U)\"/><ellipse cx=\"100\" cy=\"116\" rx=\"38\" ry=\"30\" fill=\"#e6eaf2\"/><ellipse cx=\"100\" cy=\"120\" rx=\"30\" ry=\"22\" fill=\"#eef1f7\"/><ellipse cx=\"100\" cy=\"110\" rx=\"11\" ry=\"8\" fill=\"#3e3e48\"/><ellipse cx=\"96\" cy=\"108\" rx=\"3\" ry=\"2\" fill=\"#5e5e68\" opacity=\"0.7\"/><path d=\"M100 117 L100 126\" stroke=\"#3e3e48\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><circle cx=\"120\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><path d=\"M96 94 Q100 90 104 94\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" fill=\"none\"/><circle cx=\"80\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"120\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"83\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"123\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"77\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><circle cx=\"117\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><path d=\"M72 88 Q78 84 84 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M112 88 Q118 84 124 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M78 116 Q60 114 52 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M78 122 Q60 124 54 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 116 Q140 114 148 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 122 Q140 124 146 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M90 124 Q100 131 110 124\" stroke=\"#525c70\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/></svg></span>DNS — это всегда DNS. Даже когда это не DNS, это всё равно DNS.</span></div><div class=\"pager\"><button onclick=\"pager(1)\" class=\"next\">Дальше: чем делаем запросы →</button></div></div>\n<div class=\"page\" id=\"page-tools\"><div class=\"phero\"><div class=\"kicker\">Раздел 02 · Инструменты</div><h1>Чем делаем запросы: fetch и axios</h1><p>Теперь сами стучимся на сервер из кода. Два инструмента: нативный <code>fetch</code> и библиотека <code>axios</code>. Демки ниже бьют по настоящему публичному API — это реальные запросы, а не картинки.</p></div><div class=\"say kyle\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"kFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#b87a48\"/><stop offset=\"100%\" stop-color=\"#9a6238\"/></linearGradient><radialGradient id=\"kCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#e8957a\" stop-opacity=\"0.5\"/><stop offset=\"100%\" stop-color=\"#e8957a\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"58\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"142\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"64\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><ellipse cx=\"136\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><path d=\"M68 58 Q60 22 88 44 Q80 56 72 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M132 58 Q140 22 112 44 Q120 56 128 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M71 54 Q67 36 82 48 Z\" fill=\"#3a3230\"/><path d=\"M129 54 Q133 36 118 48 Z\" fill=\"#3a3230\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#kFur__U)\"/><path d=\"M100 56 Q62 62 60 104 Q100 92 140 104 Q138 62 100 56 Z\" fill=\"#e8cfa8\"/><ellipse cx=\"100\" cy=\"98\" rx=\"40\" ry=\"30\" fill=\"#ecd6b4\"/><ellipse cx=\"100\" cy=\"116\" rx=\"30\" ry=\"24\" fill=\"#f2e1c8\"/><ellipse cx=\"72\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"128\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"100\" cy=\"106\" rx=\"9\" ry=\"7\" fill=\"#3a2a26\"/><ellipse cx=\"97\" cy=\"104\" rx=\"3\" ry=\"2\" fill=\"#5a4a44\" opacity=\"0.7\"/><ellipse cx=\"80\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><ellipse cx=\"120\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><circle cx=\"81\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"119\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"81\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"119\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"84\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"122\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"77\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"115\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M88 120 Q100 130 112 120\" stroke=\"#7a5238\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M74 142 Q100 154 126 142\" stroke=\"#9a4030\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"100\" cy=\"151\" r=\"7\" fill=\"#f0c44e\"/><circle cx=\"100\" cy=\"153\" r=\"1.8\" fill=\"#9a7a1a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Кайл</div><p>fetch встроен в браузер, ставить ничего не надо. axios — отдельная библиотека, которая делает то же самое, но удобнее. Сначала fetch, потом разберём чем axios лучше.</p></div></div><section><div class=\"sec-num\">01 · FETCH</div><h2>Нативный способ</h2><p class=\"lead\">fetch возвращает <strong>промис</strong> — обещание, что ответ придёт позже. Поэтому его ждут через <code>await</code>.</p><p>Тонкость номер один: fetch отдаёт ответ в два этапа. Сначала прилетают заголовки и статус (первый <code>await</code>), потом распаковываешь тело через <code>.json()</code> (второй <code>await</code>). Тонкость номер два: fetch <strong>не считает ошибкой</strong> коды 404 или 500 — для него «сервер ответил» уже успех. Проверять <code>response.ok</code> приходится руками.</p><div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">fetch.js</span><button class=\"runbtn\" onclick=\"runJS(this)\" data-src=\"%2F%2F%20%D1%80%D0%B5%D0%B0%D0%BB%D1%8C%D0%BD%D1%8B%D0%B9%20%D0%B7%D0%B0%D0%BF%D1%80%D0%BE%D1%81%20%D0%BD%D0%B0%20%D0%BF%D1%83%D0%B1%D0%BB%D0%B8%D1%87%D0%BD%D1%8B%D0%B9%20%D1%82%D0%B5%D1%81%D1%82%D0%BE%D0%B2%D1%8B%D0%B9%20API%0Aconst%20res%20%3D%20await%20fetch%28%27https%3A%2F%2Fjsonplaceholder.typicode.com%2Fusers%2F2%27%29%3B%0A%0Aconsole.log%28%27%D1%81%D1%82%D0%B0%D1%82%D1%83%D1%81%3A%27%2C%20res.status%29%3B%20%20%20%2F%2F%20200%0Aconsole.log%28%27%D0%B2%D1%81%D1%91%20%D0%BE%D0%BA%3F%27%2C%20res.ok%29%3B%20%20%20%20%20%20%20%2F%2F%20true%0A%0A%2F%2F%20%D0%B2%D1%82%D0%BE%D1%80%D0%BE%D0%B9%20await%20%E2%80%94%20%D1%80%D0%B0%D1%81%D0%BF%D0%B0%D0%BA%D0%BE%D0%B2%D1%8B%D0%B2%D0%B0%D0%B5%D0%BC%20%D1%82%D0%B5%D0%BB%D0%BE%20%D0%B8%D0%B7%20JSON%0Aconst%20user%20%3D%20await%20res.json%28%29%3B%0Aconsole.log%28%27%D0%B8%D0%BC%D1%8F%3A%27%2C%20user.name%29%3B%0Aconsole.log%28%27%D0%B3%D0%BE%D1%80%D0%BE%D0%B4%3A%27%2C%20user.address.city%29%3B\"><span>▶</span><span class=\"rlabel\">Запустить</span></button></div>\n  <pre><code><span class=\"tc\">// реальный запрос на публичный тестовый API</span>\n<span class=\"tk\">const</span> <span class=\"tx\">res</span> <span class=\"to\">=</span> <span class=\"tk\">await</span> <span class=\"tf\">fetch</span><span class=\"tx\">(</span><span class=\"ts2\">'https://jsonplaceholder.typicode.com/users/2'</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"ts2\">'статус:'</span><span class=\"tx\">,</span> <span class=\"tx\">res</span><span class=\"tx\">.</span><span class=\"tx\">status</span><span class=\"tx\">)</span><span class=\"tx\">;</span>   <span class=\"tc\">// 200</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"ts2\">'всё ок?'</span><span class=\"tx\">,</span> <span class=\"tx\">res</span><span class=\"tx\">.</span><span class=\"tx\">ok</span><span class=\"tx\">)</span><span class=\"tx\">;</span>       <span class=\"tc\">// true</span>\n\n<span class=\"tc\">// второй await — распаковываем тело из JSON</span>\n<span class=\"tk\">const</span> <span class=\"tx\">user</span> <span class=\"to\">=</span> <span class=\"tk\">await</span> <span class=\"tx\">res</span><span class=\"tx\">.</span><span class=\"tf\">json</span><span class=\"tx\">(</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"ts2\">'имя:'</span><span class=\"tx\">,</span> <span class=\"tx\">user</span><span class=\"tx\">.</span><span class=\"tx\">name</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"ts2\">'город:'</span><span class=\"tx\">,</span> <span class=\"tx\">user</span><span class=\"tx\">.</span><span class=\"tx\">address</span><span class=\"tx\">.</span><span class=\"tx\">city</span><span class=\"tx\">)</span><span class=\"tx\">;</span></code></pre>\n  <div class=\"console\"><div class=\"console-inner\"><div class=\"console-label\">console</div></div></div>\n</div><div style=\"text-align:center;margin:6px 0 0;\"><button class=\"minibtn\" onclick=\"realFetch(this,'fetch')\">▶ Сделать реальный GET-запрос</butt
