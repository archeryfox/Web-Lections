class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tx\">service</span><span class=\"tx\">.</span><span class=\"tf\">book</span><span class=\"tx\">(</span><span class=\"tn\">1</span><span class=\"tx\">,</span> <span class=\"ts2\">'12:00'</span><span class=\"tx\">)</span><span class=\"tx\">)</span><span class=\"tx\">;</span>   <span class=\"tc\">// ok, id 42</span></code></pre>\n  <div class=\"console\"><div class=\"console-inner\"><div class=\"console-label\">console</div></div></div>\n</div><div class=\"qt\"><div class=\"qt-text\">Любой код, который ты не открывал полгода, с тем же успехом мог написать кто-то другой.</div><div class=\"qt-author\">закон Иглсона</div></div></section><div class=\"pager\"><button onclick=\"pager(-1)\">← Роутинг</button><button onclick=\"pager(1)\" class=\"next\">Дальше: слоистая архитектура →</button></div></div>\n<div class=\"page\" id=\"page-layers\"><div class=\"phero\"><div class=\"kicker\">Раздел 04 · Архитектура</div><h1>Слоистая архитектура</h1><p>SOLID на уровне всего приложения превращается в слои. Запрос проходит сверху вниз через чёткие уровни, каждый знает только соседа. Это бэкенд-родственник FSD из прошлых лекций: те же границы, та же дисциплина.</p></div><div class=\"say kyle\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"kFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#b87a48\"/><stop offset=\"100%\" stop-color=\"#9a6238\"/></linearGradient><radialGradient id=\"kCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#e8957a\" stop-opacity=\"0.5\"/><stop offset=\"100%\" stop-color=\"#e8957a\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"58\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"142\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"64\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><ellipse cx=\"136\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><path d=\"M68 58 Q60 22 88 44 Q80 56 72 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M132 58 Q140 22 112 44 Q120 56 128 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M71 54 Q67 36 82 48 Z\" fill=\"#3a3230\"/><path d=\"M129 54 Q133 36 118 48 Z\" fill=\"#3a3230\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#kFur__U)\"/><path d=\"M100 56 Q62 62 60 104 Q100 92 140 104 Q138 62 100 56 Z\" fill=\"#e8cfa8\"/><ellipse cx=\"100\" cy=\"98\" rx=\"40\" ry=\"30\" fill=\"#ecd6b4\"/><ellipse cx=\"100\" cy=\"116\" rx=\"30\" ry=\"24\" fill=\"#f2e1c8\"/><ellipse cx=\"72\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"128\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"100\" cy=\"106\" rx=\"9\" ry=\"7\" fill=\"#3a2a26\"/><ellipse cx=\"97\" cy=\"104\" rx=\"3\" ry=\"2\" fill=\"#5a4a44\" opacity=\"0.7\"/><ellipse cx=\"80\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><ellipse cx=\"120\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><circle cx=\"81\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"119\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"81\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"119\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"84\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"122\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"77\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"115\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M88 120 Q100 130 112 120\" stroke=\"#7a5238\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M74 142 Q100 154 126 142\" stroke=\"#9a4030\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"100\" cy=\"151\" r=\"7\" fill=\"#f0c44e\"/><circle cx=\"100\" cy=\"153\" r=\"1.8\" fill=\"#9a7a1a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Кайл</div><p>Три главных слоя: контроллер ловит HTTP, сервис думает бизнес-логику, репозиторий говорит с базой. Чужую работу никто не делает. Поменял базу — трогаешь только репозиторий. Поменял правило — только сервис.</p></div></div><section><div class=\"sec-num\">01 · СЛОИ</div><h2>Кто за что отвечает</h2><ul class=\"plain\"><li><strong>Controller / Router</strong> — граница с HTTP. Достал params/body, позвал сервис, отдал res.json(). Бизнес-логики тут нет.</li><li><strong>Service</strong> — чистая бизнес-логика. Правила, проверки, расчёты. Не знает про HTTP и не знает про SQL.</li><li><strong>Repository</strong> — доступ к данным. Прячет за собой SQL/ORM. Сервис просит «дай брони на корт 3», репозиторий разбирается как.</li><li><strong>Database</strong> — Postgres, источник правды.</li></ul><div class=\"ftree\"><span class=\"dir\">src/</span>\n├─ <span class=\"dir\">routes/</span> <span class=\"fl\">bookings.routes.js</span>   <span class=\"cm\"># пути → контроллеры</span>\n├─ <span class=\"dir\">controllers/</span> <span class=\"fl\">bookings.controller.js</span> <span class=\"cm\"># HTTP-граница</span>\n├─ <span class=\"dir\">services/</span> <span class=\"fl\">bookings.service.js</span>   <span class=\"cm\"># бизнес-логика</span>\n├─ <span class=\"dir\">repositories/</span> <span class=\"fl\">bookings.repo.js</span>   <span class=\"cm\"># доступ к БД</span>\n└─ <span class=\"dir\">db/</span> <span class=\"fl\">pool.js</span>                  <span class=\"cm\"># подключение к Postgres</span></div><div class=\"box info\"><div class=\"bt\">Связь с FSD</div><p>Тот же принцип, что правило импортов в FSD: зависимости текут в одну сторону. Контроллер знает сервис, сервис знает репозиторий, репозиторий знает базу. Назад — никогда. База ничего не знает о контроллере.</p></div></section><section><div class=\"sec-num\">02 · ПОТОК ЗАПРОСА</div><h2>Запрос едет по слоям</h2><p>Запусти и посмотри, как один GET /bookings проходит сверху вниз и возвращается. Каждый слой делает ровно своё:</p><div class=\"pipe\"><div class=\"pipe-track\"><div class=\"pipe-step\" id=\"ps-ctrl\"><div class=\"ps-ico\">🚦</div><div class=\"ps-layer\">controller</div><div class=\"ps-t\">HTTP</div><div class=\"ps-d\">Достал params, позвал сервис</div></div><div class=\"pipe-step\" id=\"ps-svc\"><div class=\"ps-ico\">🧠</div><div class=\"ps-layer\">service</div><div class=\"ps-t\">Логика</div><div class=\"ps-d\">Применил правила и права</div></div><div class=\"pipe-step\" id=\"ps-repo\"><div class=\"ps-ico\">🗄️</div><div class=\"ps-layer\">repository</div><div class=\"ps-t\">SQL</div><div class=\"ps-d\">Собрал запрос к данным</div></div><div class=\"pipe-step\" id=\"ps-db\"><div class=\"ps-ico\">🐘</div><div class=\"ps-layer\">postgres</div><div class=\"ps-t\">Данные</div><div class=\"ps-d\">Вернул строки таблицы</div></div><div class=\"pipe-step\" id=\"ps-resp\"><div class=\"ps-ico\">📤</div><div class=\"ps-layer\">controller</div><div class=\"ps-t\">Ответ</div><div class=\"ps-d\">res.json() обратно фронту</div></div></div><div class=\"net-log\" id=\"pipe-log\" style=\"margin-top:16px;\">нажми — запрос проедет по слоям</div><div style=\"text-align:center;margin-top:12px;\"><button class=\"minibtn\" onclick=\"runPipe()\">▶ Прогнать запрос</button></div></div></section><section><div class=\"sec-num\">03 · В КОДЕ</div><h2>Один эндпоинт, три слоя</h2><p>Тот же GET /bookings/:id, разрезанный по слоям. Видно, как каждый зовёт только следующего и не лезет в чужое.</p><div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">layers.js</span></div>\n  <pre><code><span class=\"tc\">// --- controller: только HTTP ---</span>\n<span class=\"tk\">async</span> <span class=\"tk\">function</span> <span class=\"tf\">getBookingById</span><span class=\"tx\">(</span><span class=\"tx\">req</span><span class=\"tx\">,</span> <span class=\"tx\">res</span><span class=\"tx\">)</span> <span class=\"tx\">{</span>\n  <span class=\"tk\">const</span> <span class=\"tx\">booking</span> <span class=\"to\">=</span> <span class=\"tk\">await</span> <span class=\"tx\">bookingService</span><span class=\"tx\">.</span><span class=\"tf\">getById</span><span class=\"tx\">(</span><span class=\"tx\">req</span><span class=\"tx\">.</span><span class=\"tx\">params</span><span class=\"tx\">.</span><span class=\"tx\">id</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n  <span class=\"tk\">if</span> <span class=\"tx\">(</span><span class=\"to\">!</span><span class=\"tx\">booking</span><span class=\"tx\">)</span> <span class=\"tk\">return</span> <span class=\"tx\">res</span><span class=\"tx\">.</span><span class=\"tf\">status</span><span class=\"tx\">(</span><span class=\"tn\">404</span><span class=\"tx\">)</span><span class=\"tx\">.</span><span class=\"tf\">json</span><span class=\"tx\">(</span><span class=\"tx\">{</span> <span class=\"tx\">error</span><span class=\"to\">:</span> <span class=\"ts2\">'не найдено'</span> <span class=\"tx\">}</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n  <span class=\"tx\">res</span><span class=\"tx\">.</span><span class=\"tf\">status</span><span class=\"tx\">(</span><span class=\"tn\">200</span><span class=\"tx\">)</span><span class=\"tx\">.</span><span class=\"tf\">json</span><span class=\"tx\">(</span><span class=\"tx\">booking</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">}</span>\n\n<span class=\"tc\">// --- service: только логика, не знает про SQL ---</span>\n<span class=\"tk\">const</span> <span class=\"tx\">bookingService</span> <span class=\"to\">=</span> <span class=\"tx\">{</span>\n  <span class=\"tk\">async</span> <span class=\"tf\">getById</span><span class=\"tx\">(</span><span class=\"tx\">id</span><span class=\"tx\">)</span> <span class=\"tx\">{</span>\n    <span class=\"tk\">const</span> <span class=\"tx\">b</span> <span class=\"to\">=</span> <span class=\"tk\">await</span> <span class=\"tx\">bookingRepo</span><span class=\"tx\">.</span><span class=\"tf\">findById</span><span class=\"tx\">(</span><span class=\"tx\">id</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n    <span class=\"tk\">return</span> <span class=\"tx\">b</span> <span class=\"to\">&amp;&amp;</span> <span class=\"tx\">b</span><span class=\"tx\">.</span><span class=\"tx\">isPublic</span> <span class=\"to\">?</span> <span class=\"tx\">b</span> <span class=\"to\">:</span> <span class=\"tn\">null</span><span class=\"tx\">;</span>     <span class=\"tc\">// бизнес-правило</span>\n  <span class=\"tx\">}</span><span class=\"tx\">,</span>\n<span class=\"tx\">}</span><span class=\"tx\">;</span>\n\n<span class=\"tc\">// --- repository: только данные, прячет SQL ---</span>\n<span class=\"tk\">const</span> <span class=\"tx\">bookingRepo</span> <span class=\"to\">=</span> <span class=\"tx\">{</span>\n  <span class=\"tk\">async</span> <span class=\"tf\">findById</span><span class=\"tx\">(</span><span class=\"tx\">id</span><span class=\"tx\">)</span> <span class=\"tx\">{</span>\n    <span class=\"tk\">const</span> <span class=\"tx\">{</span> <span class=\"tx\">rows</span> <span class=\"tx\">}</span> <span class=\"to\">=</span> <span class=\"tk\">await</span> <span class=\"tx\">pool</span><span class=\"tx\">.</span><span class=\"tf\">query</span><span class=\"tx\">(</span>\n      <span class=\"ts2\">'SELECT * FROM bookings WHERE id = $1'</span><span class=\"tx\">,</span> <span class=\"tx\">[</span><span class=\"tx\">id</span><span class=\"tx\">]</span>\n    <span class=\"tx\">)</span><span class=\"tx\">;</span>\n    <span class=\"tk\">return</span> <span class=\"tx\">rows</span><span class=\"tx\">[</span><span class=\"tn\">0</span><span class=\"tx\">]</span><span class=\"tx\">;</span>\n  <span class=\"tx\">}</span><span class=\"tx\">,</span>\n<span class=\"tx\">}</span><span class=\"tx\">;</span></code></pre>\n</div><div class=\"meme-row\"><span class=\"meme\"><span class=\"mava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"mFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#46b877\"/><stop offset=\"100%\" stop-color=\"#359a5e\"/></linearGradient><radialGradient id=\"mCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#f0a890\" stop-opacity=\"0.45\"/><stop offset=\"100%\" stop-color=\"#f0a890\" stop-opacity=\"0\"/></radialGradient></defs><path d=\"M66 56 Q56 18 90 42 Q80 54 72 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M134 56 Q144 18 110 42 Q120 54 128 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M70 50 Q64 30 82 44 Z\" fill=\"#1f1f1f\"/><path d=\"M130 50 Q136 30 118 44 Z\" fill=\"#1f1f1f\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#mFur__U)\"/><path d=\"M100 64 Q66 72 70 112 Q100 128 130 112 Q134 72 100 64 Z\" fill=\"#f2f6f2\"/><ellipse cx=\"100\" cy=\"104\" rx=\"34\" ry=\"26\" fill=\"#f7faf7\"/><ellipse cx=\"74\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"126\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"100\" cy=\"108\" rx=\"6.5\" ry=\"5\" fill=\"#2a2a2a\"/><path d=\"M100 113 L100 120\" stroke=\"#2a2a2a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><ellipse cx=\"82\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><ellipse cx=\"118\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><circle cx=\"83\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"117\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"83\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"117\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"86\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"120\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"79\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"113\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M90 119 Q100 127 110 119\" stroke=\"#1f5a32\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M97 124 Q100 129 103 124 Z\" fill=\"#e87a8a\"/></svg></span>Контроллер, который сам пишет SQL — это сантехник, который заодно проектирует дом</span></div><div class=\"say ren\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"rFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#8893ab\"/><stop offset=\"100%\" stop-color=\"#6e7a94\"/></linearGradient></defs><circle cx=\"70\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"130\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"70\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"130\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"100\" cy=\"102\" r=\"50\" fill=\"url(#rFur__U)\"/><ellipse cx=\"100\" cy=\"116\" rx=\"38\" ry=\"30\" fill=\"#e6eaf2\"/><ellipse cx=\"100\" cy=\"120\" rx=\"30\" ry=\"22\" fill=\"#eef1f7\"/><ellipse cx=\"100\" cy=\"110\" rx=\"11\" ry=\"8\" fill=\"#3e3e48\"/><ellipse cx=\"96\" cy=\"108\" rx=\"3\" ry=\"2\" fill=\"#5e5e68\" opacity=\"0.7\"/><path d=\"M100 117 L100 126\" stroke=\"#3e3e48\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><circle cx=\"120\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><path d=\"M96 94 Q100 90 104 94\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" fill=\"none\"/><circle cx=\"80\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"120\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"83\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"123\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"77\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><circle cx=\"117\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><path d=\"M72 88 Q78 84 84 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M112 88 Q118 84 124 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M78 116 Q60 114 52 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M78 122 Q60 124 54 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 116 Q140 114 148 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 122 Q140 124 146 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M90 124 Q100 131 110 124\" stroke=\"#525c70\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Рен</div><p>Заметь $1 в SQL вместо склейки строк. Это параметризованный запрос — защита от SQL-инъекций. Никогда не вставляй данные пользователя прямо в текст запроса, только через параметры. Это правило не обсуждается.</p></div></div></section><div class=\"pager\"><button onclick=\"pager(-1)\">← SOLID</button><button onclick=\"pager(1)\" class=\"next\">Дальше: Postgres и библиотеки →</button></div></div>\n<div class=\"page\" id=\"page-db\"><div class=\"phero\"><div class=\"kicker\">Раздел 05 · База данных</div><h1>Postgres, SQL и базовые библиотеки</h1><p>Под всем этим лежит база. Postgres — реляционная: данные в таблицах, связанных ключами. Разберём таблицы, базовый SQL с живой песочницей, как Node с базой говорит, и набор библиотек, без которых не обходится ни один проект.</p></div><div class=\"say kyle\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"kFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#b87a48\"/><stop offset=\"100%\" stop-color=\"#9a6238\"/></linearGradient><radialGradient id=\"kCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#e8957a\" stop-opacity=\"0.5\"/><stop offset=\"100%\" stop-color=\"#e8957a\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"58\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"142\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"64\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><ellipse cx=\"136\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><path d=\"M68 58 Q60 22 88 44 Q80 56 72 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M132 58 Q140 22 112 44 Q120 56 128 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M71 54 Q67 36 82 48 Z\" fill=\"#3a3230\"/><path d=\"M129 54 Q133 36 118 48 Z\" fill=\"#3a3230\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#kFur__U)\"/><path d=\"M100 56 Q62 62 60 104 Q100 92 140 104 Q138 62 100 56 Z\" fill=\"#e8cfa8\"/><ellipse cx=\"100\" cy=\"98\" rx=\"40\" ry=\"30\" fill=\"#ecd6b4\"/><ellipse cx=\"100\" cy=\"116\" rx=\"30\" ry=\"24\" fill=\"#f2e1c8\"/><ellipse cx=\"72\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"128\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"100\" cy=\"106\" rx=\"9\" ry=\"7\" fill=\"#3a2a26\"/><ellipse cx=\"97\" cy=\"104\" rx=\"3\" ry=\"2\" fill=\"#5a4a44\" opacity=\"0.7\"/><ellipse cx=\"80\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><ellipse cx=\"120\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><circle cx=\"81\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"119\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"81\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"119\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"84\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"122\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"77\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"115\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M88 120 Q100 130 112 120\" stroke=\"#7a5238\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M74 142 Q100 154 126 142\" stroke=\"#9a4030\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"100\" cy=\"151\" r=\"7\" fill=\"#f0c44e\"/><circle cx=\"100\" cy=\"153\" r=\"1.8\" fill=\"#9a7a1a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Кайл</div><p>Реляционная база — это таблицы, как листы в Excel, только строгие и связанные. У каждой строки есть id (первичный ключ). Ссылка из одной таблицы на другую — внешний ключ. Вот и вся базовая идея.</p></div></div><section><div class=\"sec-num\">01 · ТАБЛИЦЫ</div><h2>Строки, столбцы, ключи</h2><p>Две таблицы из нашего букинга. У <code>users</code> свой id. В <code>bookings</code> поле <code>user_id</code> ссылается на <code>users.id</code> — это связь «чья бронь».</p><div style=\"margin:18px 0;\"><div class=\"dbtable\"><div class=\"tt\">users</div><div class=\"col\"><span>id</span><span class=\"ty\">serial <span class=\"pk\">PK</span></span></div><div class=\"col\"><span>name</span><span class=\"ty\">text</span></div><div class=\"col\"><span>city</span><span class=\"ty\">text</span></div></div><div class=\"dbtable\"><div class=\"tt\">bookings</div><div class=\"col\"><span>id</span><span class=\"ty\">serial <span class=\"pk\">PK</span></span></div><div class=\"col\"><span>court</span><span class=\"ty\">int</span></div><div class=\"col\"><span>user_id</span><span class=\"ty\">int <span class=\"pk\">FK→users</span></span></div></div></div><div class=\"box tip\"><div class=\"bt\">Зачем ключи</div><p>Первичный ключ (PK) — уникальный паспорт строки. Внешний ключ (FK) — связь между таблицами. По ним делают JOIN: «дай брони вместе с именами их владельцев». База сама следит, чтобы ссылки не висели в пустоту.</p></div></section><section><div class=\"sec-num\">02 · SQL</div><h2>Язык запросов к базе</h2><p>SQL — это как ты разговариваешь с базой. Четыре главных глагола: читать, создавать, менять, удалять.</p><div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">queries.sql</span></div>\n  <pre><code><span class=\"to\">-</span><span class=\"to\">-</span> \n<span class=\"ty\">SELECT</span> <span class=\"tx\">name</span><span class=\"tx\">,</span> <span class=\"tx\">city</span> <span class=\"ty\">FROM</span> <span class=\"tx\">users</span> <span class=\"ty\">WHERE</span> <span class=\"tx\">city</span> <span class=\"to\">=</span> <span class=\"ts2\">'Москва'</span><span class=\"tx\">;</span>\n\n<span class=\"to\">-</span><span class=\"to\">-</span> \n<span class=\"ty\">INSERT</span> <span class=\"ty\">INTO</span> <span class=\"tf\">users</span> <span class=\"tx\">(</span><span class=\"tx\">name</span><span class=\"tx\">,</span> <span class=\"tx\">city</span><span class=\"tx\">)</span> <span class=\"ty\">VALUES</span> <span class=\"tx\">(</span><span class=\"ts2\">'Аня'</span><span class=\"tx\">,</span> <span class=\"ts2\">'Москва'</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n\n<span class=\"to\">-</span><span class=\"to\">-</span> \n<span class=\"ty\">UPDATE</span> <span class=\"tx\">bookings</span> <span class=\"ty\">SET</span> <span class=\"tx\">court</span> <span class=\"to\">=</span> <span class=\"tn\">2</span> <span class=\"ty\">WHERE</span> <span class=\"tx\">id</span> <span class=\"to\">=</span> <span class=\"tn\">1</span><span class=\"tx\">;</span>\n\n<span class=\"to\">-</span><span class=\"to\">-</span> \n<span class=\"ty\">DELETE</span> <span class=\"ty\">FROM</span> <span class=\"tx\">bookings</span> <span class=\"ty\">WHERE</span> <span class=\"tx\">id</span> <span class=\"to\">=</span> <span class=\"tn\">1</span><span class=\"tx\">;</span>\n\n<span class=\"to\">-</span><span class=\"to\">-</span>   <span class=\"tx\">(</span><span class=\"ty\">JOIN</span><span class=\"tx\">)</span><span class=\"to\">:</span>     \n<span class=\"ty\">SELECT</span> <span class=\"tx\">b</span><span class=\"tx\">.</span><span class=\"tx\">court</span><span class=\"tx\">,</span> <span class=\"tx\">u</span><span class=\"tx\">.</span><span class=\"tx\">name</span>\n<span class=\"ty\">FROM</span> <span class=\"tx\">bookings</span> <span class=\"tx\">b</span>\n<span class=\"ty\">JOIN</span> <span class=\"tx\">users</span> <span class=\"tx\">u</span> <span class=\"ty\">ON</span> <span class=\"tx\">u</span><span class=\"tx\">.</span><span class=\"tx\">id</span> <span class=\"to\">=</span> <span class=\"tx\">b</span><span class=\"tx\">.</span><span class=\"tx\">user_id</span><span class=\"tx\">;</span></code></pre>\n</div><div class=\"say maxi\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"mFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#46b877\"/><stop offset=\"100%\" stop-color=\"#359a5e\"/></linearGradient><radialGradient id=\"mCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#f0a890\" stop-opacity=\"0.45\"/><stop offset=\"100%\" stop-color=\"#f0a890\" stop-opacity=\"0\"/></radialGradient></defs><path d=\"M66 56 Q56 18 90 42 Q80 54 72 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M134 56 Q144 18 110 42 Q120 54 128 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M70 50 Q64 30 82 44 Z\" fill=\"#1f1f1f\"/><path d=\"M130 50 Q136 30 118 44 Z\" fill=\"#1f1f1f\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#mFur__U)\"/><path d=\"M100 64 Q66 72 70 112 Q100 128 130 112 Q134 72 100 64 Z\" fill=\"#f2f6f2\"/><ellipse cx=\"100\" cy=\"104\" rx=\"34\" ry=\"26\" fill=\"#f7faf7\"/><ellipse cx=\"74\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"126\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"100\" cy=\"108\" rx=\"6.5\" ry=\"5\" fill=\"#2a2a2a\"/><path d=\"M100 113 L100 120\" stroke=\"#2a2a2a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><ellipse cx=\"82\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><ellipse cx=\"118\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><circle cx=\"83\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"117\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"83\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"117\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"86\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"120\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"79\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"113\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M90 119 Q100 127 110 119\" stroke=\"#1f5a32\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M97 124 Q100 129 103 124 Z\" fill=\"#e87a8a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Макси</div><p>Ниже — живая SQL-песочница на наших двух таблицах. Поддерживает SELECT с WHERE. Жми пресеты или правь запрос руками — увидишь реальную выборку.</p></div></div><div class=\"sqlbox\"><div class=\"api-head\" style=\"margin-bottom:10px;\">live sql · таблицы: users, bookings</div><div class=\"ctrl-row\"><button class=\"minibtn ghost\" onclick=\"sqlPreset('SELECT * FROM users')\">все users</button><button class=\"minibtn ghost\" onclick=\"sqlPreset(&quot;SELECT name, city FROM users WHERE city = 'Москва'&quot;)\">кто из Москвы</button><button class=\"minibtn ghost\" onclick=\"sqlPreset('SELECT * FROM bookings WHERE court = 3')\">брони корта 3</button><button class=\"minibtn ghost\" onclick=\"sqlPreset('SELECT * FROM users WHERE id > 2')\">id больше 2</button></div><textarea id=\"sql-input\">SELECT * FROM users</textarea><div class=\"ctrl-row\"><button class=\"minibtn\" onclick=\"runSQL()\">▶ Выполнить</button></div><div class=\"sql-out\" id=\"sql-out\"></div></div></section><section><div class=\"sec-num\">03 · NODE ↔ POSTGRES</div><h2>Как код говорит с базой</h2><p>Два пути. Драйвер <code>pg</code> — ты пишешь SQL руками (максимум контроля). ORM вроде <code>Prisma</code>/<code>TypeORM</code> — пишешь на объектах, SQL генерится сам (быстрее, но магия).</p><div class=\"cmp\"><div class=\"ch a\">pg (сырой SQL)</div><div class=\"ch b\">Prisma (ORM)</div><div class=\"cc\">const { rows } = await pool.query(\n  'SELECT * FROM users WHERE id=$1',\n  [id]\n);\nconst user = rows[0];</div><div class=\"cc\">const user = await prisma.user\n  .findUnique({\n    where: { id }\n  });\n// SQL сгенерится сам</div></div><div class=\"box warn\"><div class=\"bt\">Параметры, не склейка</div><p>И там, и там данные идут параметрами ($1 или { id }), а не вклеиваются в строку запроса. Склеишь руками — получишь SQL-инъекцию, классическую дыру, через которую сливают базы.</p></div></section><section><div class=\"sec-num\">04 · БАЗОВЫЕ БИБЛИОТЕКИ</div><h2>Джентльменский набор бэкендера</h2><p>Что почти всегда стоит в package.json реального Node-бэка:</p><div class=\"libgrid\"><div class=\"libcard\"><div class=\"ln\">express</div><div class=\"ld\">сам веб-сервер: роутинг, middleware, запросы.</div></div><div class=\"libcard\"><div class=\"ln\">pg / prisma</div><div class=\"ld\">общение с Postgres: драйвер или ORM.</div></div><div class=\"libcard\"><div class=\"ln\">dotenv</div><div class=\"ld\">секреты и конфиг из .env, а не в коде.</div></div><div class=\"libcard\"><div class=\"ln\">cors</div><div class=\"ld\">разрешить фронту с другого домена стучаться к API.</div></div><div class=\"libcard\"><div class=\"ln\">zod</div><div class=\"ld\">валидация входящих данных (та самая, с фронта).</div></div><div class=\"libcard\"><div class=\"ln\">bcrypt</div><div class=\"ld\">хэширование паролей. Пароли в базе — только хэшами.</div></div><div class=\"libcard\"><div class=\"ln\">jsonwebtoken</div><div class=\"ld\">JWT-токены для аутентификации.</div></div><div class=\"libcard\"><div class=\"ln\">pino / morgan</div><div class=\"ld\">логирование запросов и событий.</div></div></div><div class=\"say kyle\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"kFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#b87a48\"/><stop offset=\"100%\" stop-color=\"#9a6238\"/></linearGradient><radialGradient id=\"kCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#e8957a\" stop-opacity=\"0.5\"/><stop offset=\"100%\" stop-color=\"#e8957a\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"58\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"142\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"64\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><ellipse cx=\"136\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><path d=\"M68 58 Q60 22 88 44 Q80 56 72 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M132 58 Q140 22 112 44 Q120 56 128 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M71 54 Q67 36 82 48 Z\" fill=\"#3a3230\"/><path d=\"M129 54 Q133 36 118 48 Z\" fill=\"#3a3230\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#kFur__U)\"/><path d=\"M100 56 Q62 62 60 104 Q100 92 140 104 Q138 62 100 56 Z\" fill=\"#e8cfa8\"/><ellipse cx=\"100\" cy=\"98\" rx=\"40\" ry=\"30\" fill=\"#ecd6b4\"/><ellipse cx=\"100\" cy=\"116\" rx=\"30\" ry=\"24\" fill=\"#f2e1c8\"/><ellipse cx=\"72\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"128\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"100\" cy=\"106\" rx=\"9\" ry=\"7\" fill=\"#3a2a26\"/><ellipse cx=\"97\" cy=\"104\" rx=\"3\" ry=\"2\" fill=\"#5a4a44\" opacity=\"0.7\"/><ellipse cx=\"80\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><ellipse cx=\"120\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><circle cx=\"81\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"119\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"81\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"119\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"84\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"122\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"77\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"115\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M88 120 Q100 130 112 120\" stroke=\"#7a5238\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M74 142 Q100 154 126 142\" stroke=\"#9a4030\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"100\" cy=\"151\" r=\"7\" fill=\"#f0c44e\"/><circle cx=\"100\" cy=\"153\" r=\"1.8\" fill=\"#9a7a1a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Кайл</div><p>И вот вся картина, Яндексоиды, от края до края: React на фронте жмёт кнопку → летит HTTP-запрос → Express ловит его роутером → middleware валидирует через zod → контроллер зовёт сервис → сервис зовёт репозиторий → репозиторий делает SQL к Postgres → строки едут обратно вверх → res.json() → фронт рисует. Каждый кусок на своём слое, каждый слой можно заменить, не трогая соседей. Это и есть бэкенд.</p></div></div><div class=\"qt\"><div class=\"qt-text\">Сначала заставь работать, потом сделай правильно, потом сделай быстро.</div><div class=\"qt-author\">Кент Бек</div></div></section><div class=\"pager\"><button onclick=\"pager(-1)\">← Архитектура</button></div><footer><div class=\"big\">Готово 🔴</div><p>Express · роутинг · SOLID · слои · Postgres &amp; SQL<br>Кайл, Макси и Рен прощаются с дорогими студентами-Яндексоидами.</p></footer></div>\n</div></div>\n<script>\nconst pageOrder = ['intro','routing','solid','layers','db'];\nfunction showPage(id){\n  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));\n  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));\n  document.getElementById('page-'+id).classList.add('active');\n  document.querySelector('.tab[data-page=\"'+id+'\"]').classList.add('active');\n  window.scrollTo({top:0,behavior:'smooth'});\n}\ndocument.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>showPage(t.dataset.page)));\nfunction pager(dir){\n  const cur=document.querySelector('.page.active').id.replace('page-','');\n  const i=pageOrder.indexOf(cur), ni=i+dir;\n  if(ni>=0&&ni<pageOrder.length) showPage(pageOrder[ni]);\n}\nwindow.addEventListener('scroll',()=>{const h=document.documentElement;\n  document.getElementById('prog').style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%';});\n\n// ===== ASYNC JS RUNNER =====\nfunction fmt(v){\n  if(typeof v==='string') return v;\n  if(v===undefined) return 'undefined';\n  if(v===null) return 'null';\n  try{return JSON.stringify(v,null,2);}catch(e){return String(v);}\n}\nasync function runJS(btn){\n  const block=btn.closest('.code');\n  const inner=block.querySelector('.console-inner');\n  const consoleEl=block.querySelector('.console');\n  const src=decodeURIComponent(btn.dataset.src);\n  const logs=[];\n  const fakeConsole={log:(...a)=>logs.push({t:'log',m:a.map(fmt).join(' ')}),\n    error:(...a)=>logs.push({t:'err',m:a.map(fmt).join(' ')}),warn:(...a)=>logs.push({t:'log',m:a.map(fmt).join(' ')})};\n  inner.querySelectorAll('.cline').forEach(n=>n.remove());\n  try{const fn=new Function('console','return (async()=>{\\n'+src+'\\n})();');await fn(fakeConsole);}\n  catch(e){logs.push({t:'err',m:e.name+': '+e.message});}\n  if(!logs.length){const d=document.createElement('div');d.className='cline dim';d.textContent='(нет вывода)';inner.appendChild(d);}\n  else logs.forEach(l=>{const d=document.createElement('div');d.className='cline'+(l.t==='err'?' err':'');d.textContent=l.m;inner.appendChild(d);});\n  consoleEl.classList.add('show');\n  btn.querySelector('.rlabel').textContent='Запущено';\n  setTimeout(()=>{btn.querySelector('.rlabel').textContent='Запустить';},1200);\n}\n\n// ===== NETWORK FLIGHT (front <-> express) =====\nfunction flyPacket(){\n  const wire=document.getElementById('net-wire'),log=document.getElementById('net-log');\n  if(!wire)return;\n  wire.querySelectorAll('.net-packet').forEach(p=>p.remove());\n  const req=document.createElement('div');req.className='net-packet req go-req';req.textContent='?';wire.appendChild(req);\n  log.textContent='→ GET /api/bookings  (фронт шлёт HTTP-запрос)';\n  setTimeout(()=>{req.remove();const res=document.createElement('div');res.className='net-packet res go-res';res.textContent='✓';wire.appendChild(res);\n    log.textContent='← 200 OK  [{...}]  (Express вернул JSON)';setTimeout(()=>res.remove(),1100);},1050);\n}\n\n// ===== SOLID EXPLORER =====\nconst SOLID={\n S:['Single Responsibility','Один модуль — одна причина измениться','Контроллер принимает запрос. Сервис считает бизнес-логику. Репозиторий лезет в БД. Если контроллер сам пишет SQL — он отвечает за два, и сломается от любого из двух изменений.'],\n O:['Open/Closed','Открыт для расширения, закрыт для изменения','Новый способ оплаты добавляешь новым классом-стратегией, а не дописываешь if в старый метод оплаты. Старый код не трогаешь — значит не ломаешь.'],\n L:['Liskov Substitution','Подтип заменяет базовый тип без сюрпризов','Если функция ждёт Repository, любой его наследник (PostgresRepo, InMemoryRepo) должен работать на его месте, не ломая ожиданий вызывающего.'],\n I:['Interface Segregation','Тонкие интерфейсы вместо одного жирного','Не заставляй класс реализовывать методы, которые ему не нужны. Лучше пять маленьких интерфейсов, чем один на двадцать методов.'],\n D:['Dependency Inversion','Зависим от абстракций, не от конкретики','Сервис зависит от интерфейса BookingRepo, а не от конкретного Postgres. Подменил реализацию (на мок в тестах) — сервис не заметил. Это и склеивает слои.'],\n};\nfunction pickSolid(k){\n  document.querySelectorAll('.stx-chip').forEach(c=>c.classList.toggle('active',c.dataset.code===k));\n  const [t,sub,desc]=SOLID[k];\n  document.getElementById('stx-detail').innerHTML=\n    '<div class=\"stx-code\" style=\"color:var(--acc2);font-size:24px\">'+k+' · '+t+'</div><div class=\"stx-name\">'+sub+'</div><div class=\"stx-desc\">'+desc+'</div>';\n}\n\n// ===== LAYERED PIPELINE =====\nconst pipeSteps=['ps-ctrl','ps-svc','ps-repo','ps-db','ps-resp'];\nconst pipeLog=['Controller: принял GET /bookings, достал параметры',\n  'Service: применил бизнес-правила (фильтры, права)',\n  'Repository: сформировал SQL-запрос к данным',\n  'Postgres: вернул строки из таблицы',\n  'Controller: отдал res.status(200).json(data) фронту'];\nasync function runPipe(){\n  pipeSteps.forEach(id=>document.getElementById(id).classList.remove('lit'));\n  const logEl=document.getElementById('pipe-log');\n  for(let i=0;i<pipeSteps.length;i++){\n    document.getElementById(pipeSteps[i]).classList.add('lit');\n    logEl.textContent='› '+pipeLog[i];\n    await new Promise(r=>setTimeout(r,780));\n  }\n  logEl.textContent='✓ запрос прошёл все слои — каждый сделал ровно свою работу и ничего чужого';\n}\n\n// ===== EXPRESS API PLAYGROUND (mock) =====\nconst db={bookings:[\n  {id:1,court:3,time:'09:00',user:'Аня'},\n  {id:2,court:1,time:'12:00',user:'Макс'},\n], nextId:3};\nfunction matchRoute(method,path){\n  const routes=[\n   {m:'GET',p:'/bookings',h:()=>({status:200,body:db.bookings})},\n   {m:'GET',p:'/bookings/:id',h:(pr)=>{const b=db.bookings.find(x=>String(x.id)===pr.id);return b?{status:200,body:b}:{status:404,body:{error:'booking '+pr.id+' not found'}};}},\n   {m:'POST',p:'/bookings',h:(pr,body)=>{const nb={id:db.nextId++,...body};db.bookings.push(nb);return {status:201,body:nb};}},\n   {m:'DELETE',p:'/bookings/:id',h:(pr)=>{const i=db.bookings.findIndex(x=>String(x.id)===pr.id);if(i<0)return{status:404,body:{error:'booking '+pr.id+' not found'}};const rm=db.bookings.splice(i,1)[0];return{status:200,body:{deleted:rm.id}};}},\n   {m:'GET',p:'/health',h:()=>({status:200,body:{status:'ok'}})},\n  ];\n  const segs=path.split('/').filter(Boolean);\n  for(const r of routes){\n    if(r.m!==method)continue;\n    const rp=r.p.split('/').filter(Boolean);\n    if(rp.length!==segs.length)continue;\n    const params={};let ok=true;\n    for(let i=0;i<rp.length;i++){\n      if(rp[i].startsWith(':'))params[rp[i].slice(1)]=segs[i];\n      else if(rp[i]!==segs[i]){ok=false;break;}\n    }\n    if(ok)return {route:r,params};\n  }\n  return null;\n}\nfunction colorJSON(obj){\n  let s=JSON.stringify(obj,null,2).replace(/&/g,'&amp;').replace(/</g,'&lt;');\n  s=s.replace(/\"([^\"]+)\":/g,'<span class=\"k\">\"$1\"</span>:');\n  s=s.replace(/: \"([^\"]*)\"/g,': <span class=\"v\">\"$1\"</span>');\n  s=s.replace(/: (\\d+\\.?\\d*)/g,': <span class=\"num\">$1</span>');\n  return s;\n}\nlet postCount=0;\nasync function apiSend(method,path){\n  const out=document.getElementById('api-out');\n  let body=null;\n  if(method==='POST'){ postCount++; body={court:2,time:'1'+(4+postCount)+':30',user:'Гость'+postCount}; }\n  const m=matchRoute(method,path);\n  const matched=m?(method+' '+m.route.p):null;\n  out.innerHTML='<div class=\"api-req\">'+method+' '+path+(body?'   body: '+JSON.stringify(body):'')+'</div>'+\n    '<div class=\"api-trace\" id=\"api-trace\"></div><div class=\"api-resp\" id=\"api-resp\"></div>';\n  const trace=document.getElementById('api-trace');\n  const steps=[];\n  if(m){\n    steps.push('express.json() — распарсил тело');\n    steps.push('router → совпал маршрут <span class=\"hit\">'+matched+'</span>');\n    steps.push('controller → service → repository');\n    steps.push('<span class=\"ok\">обработчик вернул ответ</span>');\n  }else{\n    steps.push('router → <span style=\"color:#f0a4b0\">ни один маршрут не совпал</span>');\n    steps.push('fallback 404 handler');\n  }\n  let r=m?m.route.h(m.params,body):{status:404,body:{error:'Cannot '+method+' '+path}};\n  for(let i=0;i<steps.length;i++){\n    const d=document.createElement('div');d.className='step';d.style.animationDelay=(i*0.12)+'s';d.innerHTML='↳ '+steps[i];trace.appendChild(d);\n  }\n  setTimeout(()=>{\n    const sc=r.status<400?'s2':'s4';\n    document.getElementById('api-resp').innerHTML='<span class=\"api-status '+sc+'\">'+r.status+'</span>\\n'+colorJSON(r.body);\n  }, steps.length*120+150);\n}\nfunction apiReset(){db.bookings=[{id:1,court:3,time:'09:00',user:'Аня'},{id:2,court:1,time:'12:00',user:'Макс'}];db.nextId=3;postCount=0;\n  document.getElementById('api-out').innerHTML='<div class=\"api-req\" style=\"border:none\">база сброшена · 2 брони</div>';}\n\n// ===== SQL PLAYGROUND =====\nconst sqlDB={\n users:[{id:1,name:'Аня',city:'Москва'},{id:2,name:'Макс',city:'Казань'},{id:3,name:'Лена',city:'Москва'},{id:4,name:'Игорь',city:'Сочи'}],\n bookings:[{id:1,court:3,user_id:1},{id:2,court:1,user_id:2},{id:3,court:3,user_id:3}],\n};\nfunction runSQL(){\n  const q=document.getElementById('sql-input').value.trim().replace(/;$/,'');\n  const out=document.getElementById('sql-out');\n  const m=q.match(/^select\\s+(.+?)\\s+from\\s+(\\w+)(?:\\s+where\\s+(\\w+)\\s*(=|!=|>|<)\\s*('?[^']*'?))?$/i);\n  if(!m){out.innerHTML='<div class=\"sql-err\">Не разобрал запрос. Поддерживается:\\nSELECT * FROM table [WHERE col =|!=|>|< value]</div>';return;}\n  const [,cols,table,wcol,wop,wvalRaw]=m;\n  const data=sqlDB[table.toLowerCase()];\n  if(!data){out.innerHTML='<div class=\"sql-err\">Нет таблицы \"'+table+'\". Есть: users, bookings.</div>';return;}\n  let rows=data;\n  if(wcol){\n    let wval=wvalRaw;\n    if(/^'.*'$/.test(wval))wval=wval.slice(1,-1); else if(!isNaN(Number(wval)))wval=Number(wval);\n    rows=data.filter(r=>{const v=r[wcol.toLowerCase()];\n      switch(wop){case'=':return v==wval;case'!=':return v!=wval;case'>':return v>wval;case'<':return v<wval;}return false;});\n  }\n  let keys = cols.trim()==='*'?Object.keys(data[0]):cols.split(',').map(c=>c.trim().toLowerCase());\n  const head='<tr>'+keys.map(k=>'<th>'+k+'</th>').join('')+'</tr>';\n  const bodyRows=rows.map(r=>'<tr>'+keys.map(k=>'<td>'+(r[k]!==undefined?r[k]:'NULL')+'</td>').join('')+'</tr>').join('');\n  out.innerHTML='<table class=\"sqltable\">'+head+bodyRows+'</table><div class=\"sql-meta\">'+rows.length+' '+(rows.length===1?'строка':'строк')+' · таблица '+table+'</div>';\n}\nfunction sqlPreset(q){document.getElementById('sql-input').value=q;runSQL();}\n\nwindow.addEventListener('DOMContentLoaded',()=>{\n  showPage('intro');\n  if(document.getElementById('stx-detail')) pickSolid('S');\n  if(document.getElementById('api-out')) apiSend('GET','/bookings');\n  if(document.getElementById('sql-input')) runSQL();\n});\n<\/script>\n</body>\n</html>", "__quizzes__": {"quiz1": {"title": "Тест 1 — Основы языка", "sub": "JavaScript и TypeScript: функции, массивы, типы", "who": "kyle", "questions": [{"q": "Что выведет этот код?", "code": "const double = n => n * 2;\nconsole.log(double(21));", "opts": ["42", "21", "\"42\"", "ошибка"], "correct": 0, "explain": "Стрелочная функция с одним выражением возвращает результат без слова return. <code>21 * 2 = 42</code>."}, {"q": "Чем <code>filter()</code> отличается от <code>map()</code>?", "opts": ["filter меняет длину массива, map — нет", "map меняет длину, filter — нет", "они идентичны", "оба всегда возвращают одно число"], "correct": 0, "explain": "<b>filter</b> отсеивает по условию — длина может уменьшиться. <b>map</b> преобразует каждый элемент — длина всегда та же."}, {"q": "Что выведет цепочка методов?", "code": "const r = [1,2,3,4]\n  .filter(n => n % 2 === 0)\n  .map(n => n * 10);\nconsole.log(r);", "opts": ["[20, 40]", "[10, 20, 30, 40]", "[2, 4]", "[1, 2, 3, 4]"], "correct": 0, "explain": "Сначала filter оставляет чётные <code>[2, 4]</code>, потом map умножает на 10 → <code>[20, 40]</code>."}, {"q": "Зачем нужен TypeScript?", "opts": ["Ловит ошибки типов до запуска кода", "Делает код быстрее в браузере", "Заменяет JavaScript полностью", "Нужен только для бэкенда"], "correct": 0, "explain": "TS добавляет проверку типов на этапе написания. Ошибку видно в редакторе <b>до того</b>, как код запустится."}, {"q": "Что описывает <code>interface</code> в TypeScript?", "opts": ["Форму объекта: какие поля и каких типов", "Дизайн интерфейса пользователя", "Скорость работы функции", "Цвет кнопок"], "correct": 0, "explain": "Интерфейс — это «договор» о структуре объекта. Он задаёт, какие поля обязательны и какого они типа."}]}, "quiz2": {"title": "Тест 2 — React и вёрстка", "sub": "Компоненты, props, состояние, Tailwind", "who": "maxi", "questions": [{"q": "Что такое компонент в React?", "opts": ["Функция, возвращающая кусок интерфейса", "Переменная с числом", "CSS-файл", "Запрос к серверу"], "correct": 0, "explain": "Компонент — это функция (станок), которая возвращает разметку JSX. Из компонентов собирается весь интерфейс."}, {"q": "В какую сторону текут props?", "opts": ["Сверху вниз: от родителя к ребёнку", "Снизу вверх", "В обе стороны одновременно", "Случайно"], "correct": 0, "explain": "Данные в React текут <b>сверху вниз</b> — родитель передаёт props ребёнку. Это делает поведение предсказуемым."}, {"q": "Что делает useState?", "opts": ["Даёт компоненту память, которая меняется", "Отправляет запрос на сервер", "Создаёт CSS-класс", "Удаляет компонент"], "correct": 0, "explain": "<code>useState</code> хранит состояние компонента. Когда оно меняется через setter — React сам перерисовывает компонент."}, {"q": "Зачем нужен <code>key</code> при отрисовке списка через map?", "opts": ["Чтобы React понимал, что изменилось", "Для красоты", "Это цена товара", "Чтобы скрыть элемент"], "correct": 0, "explain": "<code>key</code> — уникальный идентификатор элемента. По нему React понимает, что поменялось, и не перерисовывает весь список."}, {"q": "Что такое utility-first в Tailwind?", "opts": ["Стили задаются маленькими классами прямо в разметке", "Один большой CSS-файл на всё", "Стили пишутся на Python", "Запрет на использование CSS"], "correct": 0, "explain": "Tailwind даёт мелкие классы-утилиты (<code>flex</code>, <code>p-4</code>, <code>text-red</code>), которые комбинируются прямо в разметке."}]}, "quiz3": {"title": "Тест 3 — Данные", "sub": "HTTP, fetch, Zod, дата-менеджмент", "who": "ren", "questions": [{"q": "Что такое HTTP-запрос?", "opts": ["Способ, которым фронт и бэк обмениваются данными", "Язык программирования", "Тип переменной", "CSS-свойство"], "correct": 0, "explain": "HTTP — протокол общения. Фронтенд отправляет запрос (метод + путь), сервер отвечает данными и кодом статуса."}, {"q": "Что означает статус-код 200?", "opts": ["Успешно", "Не найдено", "Ошибка сервера", "Нет доступа"], "correct": 0, "explain": "<b>200</b> — всё ок. <code>404</code> — не найдено, <code>500</code> — ошибка сервера, <code>403</code> — нет доступа."}, {"q": "Зачем нужен Zod, если есть TypeScript?", "opts": ["TS-типы исчезают в рантайме, Zod проверяет данные с сервера", "Zod быстрее рисует кнопки", "Zod заменяет React", "Они одно и то же"], "correct": 0, "explain": "Типы TS существуют только при написании кода. На границе сети данные приходят «неизвестно какие» — Zod проверяет их уже в рантайме."}, {"q": "В чём идея Zustand?", "opts": ["Хранить глобальное состояние в одном простом сторе", "Это язык запросов к базе", "Это CSS-фреймворк", "Это сервер на Express"], "correct": 0, "explain": "Zustand — лёгкий менеджер состояния. Один стор-объект, к которому обращаются разные компоненты, без церемоний Redux."}, {"q": "Что такое async/await?", "opts": ["Способ читать асинхронный код как обычный, сверху вниз", "Тип данных", "CSS-анимация", "Команда базы данных"], "correct": 0, "explain": "<code>await</code> ждёт результат асинхронной операции (например запроса), позволяя писать код линейно, а не через вложенные колбэки."}]}, "quiz4": {"title": "Тест 4 — Бэкенд", "sub": "Express, SOLID, слои, Postgres", "who": "ren", "questions": [{"q": "Что такое бэкенд?", "opts": ["Серверная часть: логика, база данных, API", "Стили сайта", "Только HTML-страницы", "Браузер пользователя"], "correct": 0, "explain": "Бэкенд живёт на сервере: обрабатывает запросы, хранит данные в базе, отдаёт их фронту. Браузеру нельзя доверять — проверки тут."}, {"q": "Что делает Express?", "opts": ["Помогает быстро создать сервер и маршруты", "Рисует интерфейс", "Это база данных", "Это язык разметки"], "correct": 0, "explain": "Express — фреймворк для Node.js. В несколько строк поднимает сервер и описывает маршруты (метод + путь → обработчик)."}, {"q": "Буква S в SOLID — это...", "opts": ["Single Responsibility: один модуль — одна задача", "Speed: скорость", "SQL", "Server"], "correct": 0, "explain": "<b>Single Responsibility</b> — принцип единственной ответственности. У каждого модуля одна причина для изменения."}, {"q": "Зачем слоистая // flat list of all nodes for prev/next
const FLAT = [];

// progress (in-memory; resets on reload — no storage in artifacts)
const doneSet = new Set();

// ============ BUILD SIDEBAR ============
function buildSidebar(){
  const nav = document.getElementById('sbNav');
  nav.innerHTML = COURSE.map(p => `

}

        <div class="t">▸ Как проходить</div>
        <p>Иди сверху вниз — материал выстроен последовательно, каждая часть опирается на предыдущую. После каждой части — тест на закрепление. Слева всегда видно, где ты находишься и сколько пройдено. Жми на любой модуль, чтобы открыть.</p>

          <div class="rm-part">
            <div class="rm-dot">${p.pn}</div>
            <h3>${p.title}</h3>

            <div class="rm-mods">
              ${p.nodes.map(n => `
                <div class="rm-card ${n.type==='quiz'?'q':''}" onclick="openNode('${n.id}')">
                  <div class="ic" style="${n.type==='quiz'?'':'background:'+hexA(n.col,0.16)+';color:'+n.col}">${n.icon}</div>
                  <div><div class="ci">${n.title}</div><div class="cs">${n.sub}</div></div>
                </div>`).join('')}
            </div>
          </div>`).join('')}
      </div>
    </div>`;
}
function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${a})`;}

// ============ NAVIGATION ============
function showView(which){
  document.getElementById('hub').classList.toggle('show', which==='hub');
  document.getElementById('moduleFrame').style.display = which==='module' ? 'block':'none';
  document.getElementById('quizwrap').classList.toggle('show', which==='quiz');
}

function goHub(){
  currentId=null;
  showView('hub');
  document.getElementById('crumb').innerHTML='Оглавление';
  setActiveSidebar(null);
  updatePagerButtons();
  closeSidebar();
}

function openNode(id){
  const node = FLAT.find(n=>n.id===id);
  if(!node) return;
  currentId=id;
  setActiveSidebar(id);
  // mark done (visiting counts; quizzes mark done on pass)
  if(node.type==='module'){ markDone(id); }
  const part = COURSE.find(p=>p.nodes.includes(node));
  document.getElementById('crumb').innerHTML = `${part.title} / <b>${node.title}</b>`;

  if(node.type==='module'){
    showView('module');
    loadModule(node);
  } else {
    showView('quiz');
    renderQuiz(node.quiz, id);
  }
  updatePagerButtons();
  closeSidebar();
  document.querySelector('.stage').scrollTop=0;
}

function loadModule(node){
  const frame = document.getElementById('moduleFrame');
  let html = MODULES[node.src];
  // Inject an auto-activator so the iframe opens directly on the right page (anchor)
  const inject = `<script>window.addEventListener('DOMContentLoaded',function(){try{if(typeof showPage==='function'){showPage('${node.anchor}');}}catch(e){}});<\/script>`;
  html = html.replace('</body>', inject+'</body>');
  frame.srcdoc = html;
}

function navStep(dir){
  if(currentId===null){
    if(dir>0) openNode(FLAT[0].id);
    return;
  }
  const i = FLAT.findIndex(n=>n.id===currentId);
  const ni = i+dir;
  if(ni<0){ goHub(); return; }
  if(ni>=FLAT.length) return;
  openNode(FLAT[ni].id);
}

function updatePagerButtons(){
  const prev=document.getElementById('prevBtn'), next=document.getElementById('nextBtn');
  if(currentId===null){ prev.disabled=true; next.disabled=false; next.textContent='Начать курс →'; return; }
  const i=FLAT.findIndex(n=>n.id===currentId);
  prev.disabled=false;
  next.disabled = i>=FLAT.length-1;
  next.textContent = i>=FLAT.length-1 ? 'Готово ✓' : 'Дальше →';
}

function setActiveSidebar(id){
  document.querySelectorAll('.mod').forEach(m=>m.classList.toggle('active', m.dataset.id===id));
}
function markDone(id){
  doneSet.add(id);
  document.querySelectorAll('.mod').forEach(m=>{ if(m.dataset.id===id) m.classList.add('done'); });
  updateProgress();
}
function updateProgress(){
  const total=FLAT.length, done=doneSet.size;
  document.getElementById('progFill').style.width=(done/total*100)+'%';
  document.getElementById('progTxt').textContent=`${done} из ${total} пройдено`;
}

// ============ QUIZ ENGINE ============
let quizState={};
function renderQuiz(qid, nodeId){
  const Q=QUIZZES[qid];
  const wrap=document.getElementById('quizwrap');
  quizState={qid, nodeId, answers:{}, submitted:false, n:Q.questions.length};
  wrap.innerHTML=`
    <div class="quiz-inner">
      <div class="quiz-head">
        <div style="display:flex;justify-content:center;margin-bottom:14px;">
          <div style="width:70px;height:70px;border-radius:18px;overflow:hidden;background:${Q.who==='kyle'?'rgba(217,139,84,.16)':Q.who==='maxi'?'rgba(70,184,119,.16)':'rgba(154,166,192,.16)'};display:flex;align-items:center;justify-content:center;">${AV[Q.who]}</div>
        </div>
        <div class="kick">${Q.sub}</div>
        <h1>${Q.title}</h1>
        <p>Ответь на ${Q.questions.length} вопросов. Можно менять выбор до проверки.</p>
      </div>
      <div id="qcards">
        ${Q.questions.map((qq,qi)=>`
          <div class="q-card" data-qi="${qi}">
            <div class="q-num">Вопрос ${qi+1} из ${Q.questions.length}</div>
            <div class="q-text">${qq.q}</div>
            ${qq.code?`<div class="q-code">${escapeHtml(qq.code)}</div>`:''}
            <div class="q-opts">
              ${qq.opts.map((op,oi)=>`
                <div class="q-opt" data-qi="${qi}" data-oi="${oi}" onclick="pickAnswer(${qi},${oi})">
                  <span class="mk">${String.fromCharCode(65+oi)}</span>
                  <span>${op}</span>
                </div>`).join('')}
            </div>
            <div class="q-explain" data-qi="${qi}"></div>
          </div>`).join('')}
      </div>
      <div class="quiz-submit"><button onclick="submitQuiz()">Проверить ответы</button></div>
      <div class="quiz-result" id="quizResult"></div>
      <div class="quiz-foot">
        <button onclick="goHub()">↑ К оглавлению</button>
        <button onclick="navStep(1)">Следующий раздел →</button>
      </div>
    </div>`;
}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function pickAnswer(qi,oi){
  if(quizState.submitted) return;
  quizState.answers[qi]=oi;
  document.querySelectorAll(`.q-opt[data-qi="${qi}"]`).forEach(o=>{
    o.classList.toggle('sel', +o.dataset.oi===oi);
  });
}

function submitQuiz(){
  if(quizState.submitted) return;
  const Q=QUIZZES[quizState.qid];
  let correct=0;
  Q.questions.forEach((qq,qi)=>{
    const chosen=quizState.answers[qi];
    const exp=document.querySelector(`.q-explain[data-qi="${qi}"]`);
    document.querySelectorAll(`.q-opt[data-qi="${qi}"]`).forEach(o=>{
      const oi=+o.dataset.oi;
      o.classList.add('locked');
      if(oi===qq.correct) o.classList.add('correct');
      else if(oi===chosen) o.classList.add('wrong');
    });
    if(chosen===qq.correct){correct++; exp.classList.remove('bad'); exp.innerHTML='✓ Верно. '+qq.explain;}
    else { exp.classList.add('bad'); exp.innerHTML=(chosen===undefined?'Не отвечено. ':'✗ Неверно. ')+qq.explain; }
    exp.classList.add('show');
  });
  quizState.submitted=true;
  const pct=Math.round(correct/Q.questions.length*100);
  const res=document.getElementById('quizResult');
  let color = pct>=80?'var(--ok)':pct>=50?'var(--acc2)':'var(--err)';
  let msg = pct>=80?'Отлично, материал усвоен. Двигай дальше.':pct>=50?'Неплохо, но советую перечитать слабые места.':'Стоит вернуться к разделу и пройти заново.';
  res.innerHTML=`<div class="score" style="color:${color}">${correct} / ${Q.questions.length}</div>
    <div class="msg">${msg}</div>
    <button class="nextbtn" onclick="navStep(1)">Следующий раздел →</button>`;
  res.classList.add('show');
  if(pct>=60) markDone(quizState.nodeId);
  res.scrollIntoView({behavior:'smooth',block:'center'});
}

// ============ SIDEBAR MOBILE ============
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('scrim').classList.toggle('show');}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('scrim').classList.remove('show');}

// progress bar within frame scroll — track stage scroll
document.addEventListener('DOMContentLoaded',()=>{
  buildSidebar(); buildHub(); updateProgress(); updatePagerButtons();
});
</script>
