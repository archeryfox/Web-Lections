<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Веб-разработка с нуля · Полный курс для Яндексоидов</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;800&family=Nunito:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --bg:#120e15; --bg2:#1a121c; --card:#241823; --card2:#2f1f2d; --line:#43293c;
    --ink:#f3e9ef; --muted:#b291a4;
    --acc:#e23b50; --acc2:#ff7a5c; --acc3:#ff5470; --acc-deep:#b1283b;
    --kyle:#d98b54; --maxi:#46b877; --ren:#9aa6c0;
    --yellow:#f7df1e; --blue:#61afef; --react:#61dafb; --ts:#5aa6f0;
    --green:#98c379; --ok:#46b877; --err:#e0506a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:radial-gradient(circle, rgba(226,59,80,0.05) 1px, transparent 1px);background-size:34px 34px;}

  .progress-top{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--acc),var(--acc2));z-index:300;width:0;transition:width .2s;}

  /* ====== APP LAYOUT ====== */
  .app{display:flex;min-height:100vh;position:relative;z-index:1;}

  /* sidebar */
  .sidebar{width:300px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);
    position:sticky;top:0;height:100vh;overflow-y:auto;padding:0;transition:transform .3s;}
  .sidebar::-webkit-scrollbar{width:6px;} .sidebar::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
  .sb-head{padding:22px 22px 16px;border-bottom:1px solid var(--line);cursor:pointer;}
  .sb-head .logo{font-family:'Unbounded',sans-serif;font-weight:800;font-size:17px;line-height:1.2;}
  .sb-head .logo .a{color:var(--acc);}
  .sb-head .sub{font-size:11.5px;color:var(--muted);margin-top:4px;font-family:'JetBrains Mono',monospace;}
  .sb-prog{padding:14px 22px;border-bottom:1px solid var(--line);}
  .sb-prog .bar{height:6px;background:var(--card2);border-radius:100px;overflow:hidden;}
  .sb-prog .fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0;transition:width .4s;border-radius:100px;}
  .sb-prog .txt{font-size:11px;color:var(--muted);margin-top:7px;font-family:'JetBrains Mono',monospace;}

  .sb-nav{padding:10px 0 30px;}
  .part{margin-top:8px;}
  .part-h{padding:12px 22px 6px;font-family:'Unbounded',sans-serif;font-weight:600;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--acc2);display:flex;align-items:center;gap:8px;}
  .part-h .pn{font-family:'JetBrains Mono',monospace;opacity:.6;}
  .mod{display:flex;align-items:center;gap:11px;padding:9px 22px 9px 26px;cursor:pointer;font-size:14px;color:var(--muted);border-left:3px solid transparent;transition:all .15s;}
  .mod:hover{color:var(--ink);background:var(--card);}
  .mod.active{color:var(--ink);background:var(--card);border-left-color:var(--acc);font-weight:700;}
  .mod.done .dot{background:var(--ok);border-color:var(--ok);}
  .mod.done .dot::after{content:"✓";color:#0c2417;font-size:9px;font-weight:900;display:flex;align-items:center;justify-content:center;height:100%;}
  .mod .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;transition:all .2s;}
  .mod.active .dot{border-color:var(--acc);}
  .mod .mt{flex:1;line-height:1.3;}
  .mod.quiz{font-style:italic;}
  .mod.quiz .dot{border-radius:4px;border-color:var(--acc2);}
  .mod.quiz.done .dot{background:var(--acc2);border-color:var(--acc2);}

  /* main */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{height:54px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:14px;background:rgba(18,14,21,.9);backdrop-filter:blur(10px);position:sticky;top:0;z-index:50;}
  .burger{display:none;background:none;border:none;color:var(--ink);font-size:22px;cursor:pointer;}
  .crumb{font-size:13.5px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
  .crumb b{color:var(--ink);}
  .topnav{margin-left:auto;display:flex;gap:8px;}
  .topnav button{font-family:'Nunito',sans-serif;font-weight:700;font-size:13px;cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:7px 14px;transition:all .15s;}
  .topnav button:hover:not(:disabled){border-color:var(--acc);color:var(--acc2);}
  .topnav button:disabled{opacity:.3;cursor:not-allowed;}

  .stage{flex:1;position:relative;}
  #moduleFrame{width:100%;height:calc(100vh - 54px);border:none;display:block;background:var(--bg);}

  /* ====== LANDING (hub) ====== */
  .hub{display:none;padding:0;overflow-y:auto;height:calc(100vh - 54px);}
  .hub.show{display:block;}
  .hub-hero{padding:60px 40px 44px;text-align:center;border-bottom:1px solid var(--line);background:linear-gradient(160deg,#1c1018,#160e16);}
  .hub-hero .kick{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--acc2);margin-bottom:16px;}
  .hub-hero h1{font-family:'Unbounded',sans-serif;font-weight:800;font-size:clamp(32px,6vw,60px);line-height:1.04;margin-bottom:16px;}
  .hub-hero h1 .g{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .hub-hero p{color:var(--muted);font-size:18px;max-width:640px;margin:0 auto;}
  .hub-cast{display:flex;gap:20px;justify-content:center;margin-top:30px;flex-wrap:wrap;}
  .hub-cast .c{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .hub-cast .c svg{width:64px;height:64px;}
  .hub-cast .c .n{font-family:'Unbounded',sans-serif;font-weight:600;font-size:13px;}
  .hub-cast .c.k .n{color:var(--kyle);} .hub-cast .c.m .n{color:var(--maxi);} .hub-cast .c.r .n{color:var(--ren);}
  .hub-cast .c .r{font-size:11px;color:var(--muted);}

  .hub-body{max-width:920px;margin:0 auto;padding:40px 24px 80px;}
  .hub-intro{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:14px;padding:20px 24px;margin-bottom:36px;}
  .hub-intro .t{font-family:'Unbounded',sans-serif;font-weight:600;font-size:15px;color:var(--acc2);margin-bottom:6px;}
  .hub-intro p{margin:0;font-size:15px;color:#e0d2da;}

  .roadmap{display:flex;flex-direction:column;gap:0;}
  .rm-part{position:relative;padding-left:36px;padding-bottom:14px;}
  .rm-part::before{content:"";position:absolute;left:11px;top:6px;bottom:0;width:2px;background:var(--line);}
  .rm-part:last-child::before{display:none;}
  .rm-dot{position:absolute;left:0;top:2px;width:24px;height:24px;border-radius:50%;background:var(--acc-deep);border:3px solid var(--bg);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:#fff;z-index:1;}
  .rm-part h3{font-family:'Unbounded',sans-serif;font-weight:700;font-size:20px;margin-bottom:3px;}
  .rm-part .pd{font-size:13.5px;color:var(--muted);margin-bottom:14px;}
  .rm-mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;}
  .rm-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;transition:all .18s;display:flex;align-items:flex-start;gap:11px;}
  .rm-card:hover{border-color:var(--acc);transform:translateY(-2px);background:var(--card2);}
  .rm-card .ic{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;font-family:'JetBrains Mono',monospace;}
  .rm-card .ci{font-size:13.5px;font-weight:700;line-height:1.3;color:var(--ink);}
  .rm-card .cs{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .rm-card.q{border-style:dashed;border-color:var(--acc2);}
  .rm-card.q .ic{background:rgba(226,59,80,.16);color:var(--acc2);}

  /* ====== QUIZ ====== */
  .quizwrap{display:none;height:calc(100vh - 54px);overflow-y:auto;}
  .quizwrap.show{display:block;}
  .quiz-inner{max-width:760px;margin:0 auto;padding:46px 24px 80px;}
  .quiz-head{text-align:center;margin-bottom:36px;}
  .quiz-head .kick{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--acc2);margin-bottom:10px;}
  .quiz-head h1{font-family:'Unbounded',sans-serif;font-weight:800;font-size:clamp(26px,5vw,42px);margin-bottom:10px;}
  .quiz-head p{color:var(--muted);font-size:16px;}
  .q-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:18px;}
  .q-num{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--acc2);margin-bottom:8px;}
  .q-text{font-family:'Unbounded',sans-serif;font-weight:600;font-size:17px;margin-bottom:8px;line-height:1.35;}
  .q-text code{font-family:'JetBrains Mono',monospace;font-size:.85em;background:var(--card2);color:var(--acc2);padding:2px 7px;border-radius:5px;}
  .q-code{background:#160e19;border:1px solid var(--line);border-radius:10px;padding:13px 16px;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.6;margin:10px 0 16px;white-space:pre-wrap;color:#d4c0cc;}
  .q-opts{display:flex;flex-direction:column;gap:9px;}
  .q-opt{background:var(--card2);border:1.5px solid var(--line);border-radius:11px;padding:13px 16px;cursor:pointer;font-size:14.5px;transition:all .15s;display:flex;align-items:center;gap:11px;}
  .q-opt:hover{border-color:var(--acc);}
  .q-opt .mk{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;transition:all .15s;}
  .q-opt.sel{border-color:var(--acc);background:rgba(226,59,80,.08);}
  .q-opt.sel .mk{border-color:var(--acc);background:var(--acc);color:#fff;}
  .q-opt.correct{border-color:var(--ok);background:rgba(70,184,119,.12);}
  .q-opt.correct .mk{border-color:var(--ok);background:var(--ok);color:#0c2417;}
  .q-opt.wrong{border-color:var(--err);background:rgba(224,80,106,.12);}
  .q-opt.wrong .mk{border-color:var(--err);background:var(--err);color:#fff;}
  .q-opt.locked{cursor:default;pointer-events:none;}
  .q-explain{margin-top:14px;padding:13px 16px;background:rgba(70,184,119,.08);border-left:3px solid var(--ok);border-radius:9px;font-size:14px;color:#d8e8df;display:none;}
  .q-explain.show{display:block;}
  .q-explain.bad{background:rgba(224,80,106,.08);border-left-color:var(--err);color:#f0d8de;}
  .q-explain b{color:#fff;}

  .quiz-submit{display:flex;justify-content:center;margin-top:24px;}
  .quiz-submit button{font-family:'Unbounded',sans-serif;font-weight:600;font-size:15px;cursor:pointer;background:var(--acc);color:#fff;border:none;border-radius:12px;padding:14px 32px;transition:all .15s;}
  .quiz-submit button:hover{filter:brightness(1.1);transform:translateY(-1px);}
  .quiz-result{display:none;text-align:center;padding:30px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:20px;}
  .quiz-result.show{display:block;animation:pop .4s;}
  @keyframes pop{from{transform:scale(.9);opacity:0;}to{transform:scale(1);opacity:1;}}
  .quiz-result .score{font-family:'Unbounded',sans-serif;font-weight:800;font-size:40px;}
  .quiz-result .msg{font-size:16px;color:var(--muted);margin-top:8px;}
  .quiz-result .nextbtn{margin-top:20px;font-family:'Nunito';font-weight:700;font-size:14px;cursor:pointer;background:var(--card2);border:1px solid var(--acc);color:var(--acc2);border-radius:11px;padding:12px 24px;}

  .quiz-foot{display:flex;justify-content:space-between;margin-top:30px;gap:12px;}
  .quiz-foot button{font-family:'Nunito';font-weight:700;font-size:14px;cursor:pointer;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:12px 22px;}
  .quiz-foot button:hover{border-color:var(--acc);color:var(--acc2);}

  /* responsive */
  @media(max-width:860px){
    .sidebar{position:fixed;z-index:200;transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.5);}
    .sidebar.open{transform:translateX(0);}
    .burger{display:block;}
    .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150;}
    .scrim.show{display:block;}
  }
</style>
</head>
<body>
<div class="progress-top" id="ptop"></div>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-head" onclick="goHub()">
      <div class="logo">Веб-разработка <span class="a">с нуля</span></div>
      <div class="sub">полный курс · Яндекс</div>
    </div>
    <div class="sb-prog">
      <div class="bar"><div class="fill" id="progFill"></div></div>
      <div class="txt" id="progTxt">0 из 0 пройдено</div>
    </div>
    <nav class="sb-nav" id="sbNav"></nav>
  </aside>
  <div class="scrim" id="scrim" onclick="closeSidebar()"></div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <button class="burger" onclick="toggleSidebar()">☰</button>
      <div class="crumb" id="crumb">Оглавление</div>
      <div class="topnav">
        <button id="prevBtn" onclick="navStep(-1)">← Назад</button>
        <button id="nextBtn" onclick="navStep(1)">Дальше →</button>
      </div>
    </div>
    <div class="stage">
      <!-- HUB / LANDING -->
      <div class="hub show" id="hub"></div>
      <!-- MODULE IFRAME -->
      <iframe id="moduleFrame" style="display:none;" title="Модуль"></iframe>
      <!-- QUIZ -->
      <div class="quizwrap" id="quizwrap"></div>
    </div>
  </div>
</div>

border:none;border-radius:8px;padding:6px 14px;display:flex;align-items:center;gap:6px;transition:all .15s;}\n  .runbtn:hover{filter:brightness(1.12);transform:translateY(-1px);}\n  .runbtn:active{transform:translateY(0);}\n  .runbtn.react{background:var(--react);color:#06222a;}\n  pre{margin:0;padding:16px 18px;overflow-x:auto;}\n  pre code{font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.62;}\n  .tk{color:var(--purple);}.ts2{color:var(--green);}.tn{color:var(--orange);}.tc{color:#5c6680;font-style:italic;}\n  .tf{color:var(--blue);}.tp{color:var(--red);}.to{color:var(--cyan);}.ty{color:#e5c07b;}.tx{color:#abb2bf;}\n\n  /* console output */\n  .console{background:#0b0f1c;border-top:1px solid var(--line);padding:0;max-height:0;overflow:hidden;transition:max-height .3s ease;}\n  .console.show{max-height:400px;}\n  .console-inner{padding:14px 18px;font-family:'JetBrains Mono',monospace;font-size:12.5px;}\n  .console-label{color:#4a5570;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:6px;}\n  .console-label::before{content:\"▶\";color:var(--maxi);font-size:9px;}\n  .cline{color:#b8c2da;white-space:pre-wrap;padding:1px 0;}\n  .cline.err{color:var(--red);}\n  .cline .ctype{color:#5c6680;}\n\n  /* react result preview */\n  .rresult{background:#0d1322;border-top:1px solid var(--line);max-height:0;overflow:hidden;transition:max-height .35s ease;}\n  .rresult.show{max-height:600px;}\n  .rresult-inner{padding:16px 18px;}\n  .rresult-label{color:#4a5570;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:6px;}\n  .rresult-label::before{content:\"▶\";color:var(--react);font-size:9px;}\n  .browser{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.4);}\n  .browser-bar{background:#e8e8ec;padding:8px 12px;display:flex;align-items:center;gap:6px;}\n  .browser-bar .bd{width:9px;height:9px;border-radius:50%;}\n  .browser-bar .url{margin-left:8px;background:#fff;border-radius:6px;padding:3px 12px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#999;flex:1;}\n  .browser-body{padding:20px;color:#1a1a2e;font-family:'Nunito',sans-serif;min-height:60px;}\n\n  /* ===== CALLOUTS ===== */\n  .box{border-radius:13px;padding:15px 18px;margin:18px 0;border-left:4px solid;}\n  .box .bt{font-family:'Unbounded',sans-serif;font-weight:600;font-size:13.5px;margin-bottom:5px;}\n  .box p{margin:0;font-size:14.5px;}\n  .box.tip{background:rgba(247,223,30,.07);border-color:var(--yellow);} .box.tip .bt{color:var(--yellow);}\n  .box.warn{background:rgba(224,108,117,.08);border-color:var(--red);} .box.warn .bt{color:var(--red);}\n  .box.info{background:rgba(97,175,239,.07);border-color:var(--blue);} .box.info .bt{color:var(--blue);}\n  .box.ts{background:rgba(49,120,198,.1);border-color:var(--ts);} .box.ts .bt{color:#6aa3e0;}\n\n  /* ===== VIZ ===== */\n  .viz{background:linear-gradient(160deg,#181f3a,#13192e);border:1px solid var(--line);border-radius:16px;padding:24px;margin:20px 0;}\n  .viz-title{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;text-align:center;margin-bottom:18px;}\n  .flow{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;}\n  .flow .pill{background:var(--card2);border-radius:11px;padding:11px 14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;}\n  .flow .lbl{font-size:11px;color:var(--muted);margin-top:6px;font-family:'JetBrains Mono',monospace;text-align:center;}\n  .flow .op{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--maxi);background:rgba(70,184,119,.12);border:1px solid rgba(70,184,119,.3);border-radius:100px;padding:5px 11px;white-space:nowrap;}\n  .flow .arr-ico{color:var(--muted);font-size:20px;}\n\n  /* meme */\n  .meme-row{text-align:center;margin:22px 0;}\n  .meme{display:inline-flex;align-items:center;gap:9px;background:var(--card2);border:1px dashed var(--line);border-radius:100px;padding:5px 15px 5px 7px;margin:5px 4px;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--muted);}\n  .meme .mava{width:28px;height:28px;border-radius:50%;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;}\n  .meme .mava svg{width:28px;height:28px;}\n\n  /* tables / comparison */\n  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:13px;overflow:hidden;margin:18px 0;}\n  @media(max-width:600px){.cmp{grid-template-columns:1fr;}}\n  .cmp .ch{padding:10px 14px;font-family:'Unbounded',sans-serif;font-weight:600;font-size:13px;}\n  .cmp .ch.js{background:rgba(247,223,30,.12);color:var(--yellow);}\n  .cmp .ch.ts{background:rgba(49,120,198,.16);color:#6aa3e0;}\n  .cmp .cc{padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:12px;background:#161c30;border-top:1px solid var(--line);white-space:pre-wrap;line-height:1.6;}\n\n  /* fsd layers */\n  .fsd{display:flex;flex-direction:column;gap:6px;margin:18px 0;}\n  .layer{border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:14px;border:1px solid var(--line);}\n  .layer .lname{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;min-width:96px;}\n  .layer .ldesc{font-size:13.5px;color:#c4cde2;}\n  .layer.app{background:rgba(224,108,117,.1);} .layer.app .lname{color:var(--red);}\n  .layer.pages{background:rgba(229,163,90,.1);} .layer.pages .lname{color:var(--orange);}\n  .layer.widgets{background:rgba(247,223,30,.08);} .layer.widgets .lname{color:var(--yellow);}\n  .layer.features{background:rgba(70,184,119,.1);} .layer.features .lname{color:var(--maxi);}\n  .layer.entities{background:rgba(97,175,239,.1);} .layer.entities .lname{color:var(--blue);}\n  .layer.shared{background:rgba(136,147,171,.1);} .layer.shared .lname{color:var(--ren);}\n\n  /* file tree */\n  .ftree{background:#11162a;border:1px solid var(--line);border-radius:12px;padding:16px 18px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.8;margin:18px 0;}\n  .ftree .dir{color:var(--blue);}\n  .ftree .fl{color:#b8c2da;}\n  .ftree .cm{color:#5c6680;}\n\n  /* footer */\n  footer{text-align:center;padding:44px 20px 64px;border-top:1px solid var(--line);margin-top:24px;}\n  footer .big{font-family:'Unbounded',sans-serif;font-weight:700;font-size:22px;color:var(--react);margin-bottom:8px;}\n  footer p{color:var(--muted);}\n\n  /* next-prev */\n  .pager{display:flex;justify-content:space-between;gap:12px;padding:24px 0 8px;}\n  .pager button{font-family:'Nunito',sans-serif;font-weight:700;font-size:14px;cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 20px;transition:all .15s;}\n  .pager button:hover{border-color:var(--acc);color:var(--acc2);}\n  .pager button:disabled{opacity:.3;cursor:not-allowed;}\n  .pager button.next{margin-left:auto;}\n</style>\n</head>\n<body>\n<div class=\"progress\" id=\"prog\"></div>\n\n<!-- ===== TOP NAV ===== -->\n<div class=\"topbar\">\n  <div class=\"topbar-inner\">\n    <div class=\"brand\"><span class=\"d1\">JS</span> · <span class=\"d2\">TS</span> · <span class=\"d3\">React</span></div>\n    <div class=\"tabs\" id=\"tabs\">\n      <button class=\"tab active\" data-page=\"basics\"><span class=\"n\">00</span>Азы</button>\n      <button class=\"tab\" data-page=\"js\"><span class=\"n\">01</span>Функции</button>\n      <button class=\"tab\" data-page=\"ts\"><span class=\"n\">02</span>TypeScript</button>\n      <button class=\"tab\" data-page=\"react\"><span class=\"n\">03</span>React</button>\n      <button class=\"tab\" data-page=\"arch\"><span class=\"n\">04</span>TS + Архитектура</button>\n    </div>\n  </div>\n</div>\n\n<div class=\"wrap\">\n  <div id=\"PAGES\">\n\n\n<div class=\"page active\" id=\"page-basics\">\n  <div class=\"phero k-js\">\n    <div class=\"kicker\">Раздел 00 · Самое начало</div>\n    <h1>Переменные, массивы, объекты</h1>\n    <p>Этот раздел — для тех, кто видит код впервые. Объясняю на пальцах, без терминов, которые сами надо гуглить. Прочитал, нажал ▶️, увидел результат. Поехали с самых азов.</p>\n  </div>\n\n  <div class=\"say kyle\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"kFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#b87a48\"/><stop offset=\"100%\" stop-color=\"#9a6238\"/></linearGradient><radialGradient id=\"kCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#e8957a\" stop-opacity=\"0.5\"/><stop offset=\"100%\" stop-color=\"#e8957a\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"58\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"142\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"64\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><ellipse cx=\"136\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><path d=\"M68 58 Q60 22 88 44 Q80 56 72 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M132 58 Q140 22 112 44 Q120 56 128 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M71 54 Q67 36 82 48 Z\" fill=\"#3a3230\"/><path d=\"M129 54 Q133 36 118 48 Z\" fill=\"#3a3230\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#kFur__U)\"/><path d=\"M100 56 Q62 62 60 104 Q100 92 140 104 Q138 62 100 56 Z\" fill=\"#e8cfa8\"/><ellipse cx=\"100\" cy=\"98\" rx=\"40\" ry=\"30\" fill=\"#ecd6b4\"/><ellipse cx=\"100\" cy=\"116\" rx=\"30\" ry=\"24\" fill=\"#f2e1c8\"/><ellipse cx=\"72\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"128\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"100\" cy=\"106\" rx=\"9\" ry=\"7\" fill=\"#3a2a26\"/><ellipse cx=\"97\" cy=\"104\" rx=\"3\" ry=\"2\" fill=\"#5a4a44\" opacity=\"0.7\"/><ellipse cx=\"80\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><ellipse cx=\"120\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><circle cx=\"81\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"119\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"81\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"119\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"84\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"122\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"77\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"115\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M88 120 Q100 130 112 120\" stroke=\"#7a5238\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M74 142 Q100 154 126 142\" stroke=\"#9a4030\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"100\" cy=\"151\" r=\"7\" fill=\"#f0c44e\"/><circle cx=\"100\" cy=\"153\" r=\"1.8\" fill=\"#9a7a1a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Кайл</div><p>Дорогие студенты-Яндексоиды. Если слова «переменная» и «массив» для вас пока пустой звук — вы по адресу. Объясню так, будто рассказываю другу за чаем. Никакой магии тут нет.</p></div></div>\n\n  <section>\n    <div class=\"sec-num\">00 · ПЕРЕМЕННЫЕ</div>\n    <h2>Переменная — это коробка с именем</h2>\n    <p class=\"lead\">Ты кладёшь в коробку значение и пишешь на ней имя. Потом обращаешься к коробке по имени — и достаёшь, что положил.</p>\n\n    <p>Вот и всё. Компьютеру нужно где-то хранить данные — имя пользователя, его возраст, цену товара. Для этого и есть переменные: именованные коробки, куда складывают значения.</p>\n\n    <div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">box.js</span><button class=\"runbtn\" onclick=\"runJS(this)\" data-src=\"//%20%D1%81%D0%BE%D0%B7%D0%B4%D0%B0%D1%91%D0%BC%20%D0%BA%D0%BE%D1%80%D0%BE%D0%B1%D0%BA%D1%83%20%D1%81%20%D0%B8%D0%BC%D0%B5%D0%BD%D0%B5%D0%BC%20name%20%D0%B8%20%D0%BA%D0%BB%D0%B0%D0%B4%D1%91%D0%BC%20%D0%B2%20%D0%BD%D0%B5%D1%91%20%D1%81%D1%82%D1%80%D0%BE%D0%BA%D1%83%0Alet%20name%20%3D%20%27%D0%90%D0%BD%D1%8F%27%3B%0A%0A//%20%D1%81%D0%BE%D0%B7%D0%B4%D0%B0%D1%91%D0%BC%20%D0%BA%D0%BE%D1%80%D0%BE%D0%B1%D0%BA%D1%83%20age%20%D1%81%20%D1%87%D0%B8%D1%81%D0%BB%D0%BE%D0%BC%0Alet%20age%20%3D%2025%3B%0A%0A//%20%D0%B4%D0%BE%D1%81%D1%82%D0%B0%D1%91%D0%BC%2C%20%D1%87%D1%82%D0%BE%20%D0%B2%D0%BD%D1%83%D1%82%D1%80%D0%B8%2C%20%D0%BF%D0%BE%20%D0%B8%D0%BC%D0%B5%D0%BD%D0%B8%0Aconsole.log%28name%29%3B%0Aconsole.log%28age%29%3B\"><span>▶</span><span class=\"rlabel\">Запустить</span></button></div>\n  <pre><code><span class=\"tc\">// создаём коробку с именем name и кладём в неё строку</span>\n<span class=\"tk\">let</span><span class=\"tx\"> </span><span class=\"tx\">name</span><span class=\"tx\"> </span><span class=\"to\">=</span><span class=\"tx\"> </span><span class=\"ts2\">&#x27;Аня&#x27;</span><span class=\"tx\">;</span>\n \n<span class=\"tc\">// создаём коробку age с числом</span>\n<span class=\"tk\">let</span><span class=\"tx\"> </span><span class=\"tx\">age</span><span class=\"tx\"> </span><span class=\"to\">=</span><span class=\"tx\"> </span><span class=\"tn\">25</span><span class=\"tx\">;</span>\n \n<span class=\"tc\">// достаём, что внутри, по имени</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tx\">name</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tx\">age</span><span class=\"tx\">)</span><span class=\"tx\">;</span></code></pre>\n  <div class=\"console\"><div class=\"console-inner\"><div class=\"console-label\">console</div></div></div>\n</div>\n\n    <div class=\"say maxi\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"mFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#46b877\"/><stop offset=\"100%\" stop-color=\"#359a5e\"/></linearGradient><radialGradient id=\"mCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#f0a890\" stop-opacity=\"0.45\"/><stop offset=\"100%\" stop-color=\"#f0a890\" stop-opacity=\"0\"/></radialGradient></defs><path d=\"M66 56 Q56 18 90 42 Q80 54 72 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M134 56 Q144 18 110 42 Q120 54 128 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M70 50 Q64 30 82 44 Z\" fill=\"#1f1f1f\"/><path d=\"M130 50 Q136 30 118 44 Z\" fill=\"#1f1f1f\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#mFur__U)\"/><path d=\"M100 64 Q66 72 70 112 Q100 128 130 112 Q134 72 100 64 Z\" fill=\"#f2f6f2\"/><ellipse cx=\"100\" cy=\"104\" rx=\"34\" ry=\"26\" fill=\"#f7faf7\"/><ellipse cx=\"74\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"126\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"100\" cy=\"108\" rx=\"6.5\" ry=\"5\" fill=\"#2a2a2a\"/><path d=\"M100 113 L100 120\" stroke=\"#2a2a2a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><ellipse cx=\"82\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><ellipse cx=\"118\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><circle cx=\"83\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"117\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"83\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"117\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"86\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"120\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"79\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"113\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M90 119 Q100 127 110 119\" stroke=\"#1f5a32\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M97 124 Q100 129 103 124 Z\" fill=\"#e87a8a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Макси</div><p>Нажал ▶️ — увидел внизу «Аня» и «25». Это компьютер достал из коробок то, что мы туда положили. Имя коробки слева, значение справа, между ними знак равно — «положи это сюда».</p></div></div>\n\n    <h3>let и const — два вида коробок</h3>\n    <p>Есть два слова для создания коробки. Разница простая: одну коробку можно потом переоткрыть и поменять содержимое, другую — нет.</p>\n    <ul class=\"plain\">\n      <li><code>let</code> — коробку <strong>можно</strong> поменять. Клади новое значение сколько хочешь.</li>\n      <li><code>const</code> — коробка <strong>запечатана</strong>. Положил один раз — всё. Если попробуешь поменять, будет ошибка.</li>\n    </ul>\n\n    <div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">let-const.js</span><button class=\"runbtn\" onclick=\"runJS(this)\" data-src=\"//%20let%20%E2%80%94%20%D0%BC%D0%BE%D0%B6%D0%BD%D0%BE%20%D0%BC%D0%B5%D0%BD%D1%8F%D1%82%D1%8C%0Alet%20score%20%3D%2010%3B%0Aconsole.log%28score%29%3B%20%20%20//%2010%0A%0Ascore%20%3D%2020%3B%20%20%20%20%20%20%20%20%20%20%20//%20%D0%BC%D0%B5%D0%BD%D1%8F%D0%B5%D0%BC%20%D1%81%D0%BE%D0%B4%D0%B5%D1%80%D0%B6%D0%B8%D0%BC%D0%BE%D0%B5%0Aconsole.log%28score%29%3B%20%20%20//%2020%0A%0A//%20const%20%E2%80%94%20%D0%BD%D0%B5%D0%BB%D1%8C%D0%B7%D1%8F%20%D0%BC%D0%B5%D0%BD%D1%8F%D1%82%D1%8C%0Aconst%20city%20%3D%20%27%D0%9C%D0%BE%D1%81%D0%BA%D0%B2%D0%B0%27%3B%0Aconsole.log%28city%29%3B%20%20%20%20//%20%D0%9C%D0%BE%D1%81%D0%BA%D0%B2%D0%B0\"><span>▶</span><span class=\"rlabel\">Запустить</span></button></div>\n  <pre><code><span class=\"tc\">// let — можно менять</span>\n<span class=\"tk\">let</span><span class=\"tx\"> </span><span class=\"tx\">score</span><span class=\"tx\"> </span><span class=\"to\">=</span><span class=\"tx\"> </span><span class=\"tn\">10</span><span class=\"tx\">;</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tx\">score</span><span class=\"tx\">)</span><span class=\"tx\">;</span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tc\">// 10</span>\n \n<span class=\"tx\">score</span><span class=\"tx\"> </span><span class=\"to\">=</span><span class=\"tx\"> </span><span class=\"tn\">20</span><span class=\"tx\">;</span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tc\">// меняем содержимое</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tx\">score</span><span class=\"tx\">)</span><span class=\"tx\">;</span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tc\">// 20</span>\n \n<span class=\"tc\">// const — нельзя менять</span>\n<span class=\"tk\">const</span><span class=\"tx\"> </span><span class=\"tx\">city</span><span class=\"tx\"> </span><span class=\"to\">=</span><span class=\"tx\"> </span><span class=\"ts2\">&#x27;Москва&#x27;</span><span class=\"tx\">;</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tx\">city</span><span class=\"tx\">)</span><span class=\"tx\">;</span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tc\">// Москва</span></code></pre>\n  <div class=\"console\"><div class=\"console-inner\"><div class=\"console-label\">console</div></div></div>\n</div>\n\n    <div class=\"box tip\">\n      <div class=\"bt\">▸ Простое правило</div>\n      <p>Не знаешь, какое слово взять — бери <code>const</code>. Если потом окажется, что значение должно меняться — поменяешь на <code>let</code>. Так советуют делать почти все.</p>\n    </div>\n  </section>\n\n  <section>\n    <div class=\"sec-num\">00 · ТИПЫ ДАННЫХ</div>\n    <h2>Что можно класть в коробку</h2>\n    <p class=\"lead\">В коробку кладут значения разных видов. Их называют «типы данных». Базовых — всего несколько, и они интуитивны.</p>\n\n    <div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">types.js</span><button class=\"runbtn\" onclick=\"runJS(this)\" data-src=\"//%20%D1%81%D1%82%D1%80%D0%BE%D0%BA%D0%B0%20%E2%80%94%20%D0%BB%D1%8E%D0%B1%D0%BE%D0%B9%20%D1%82%D0%B5%D0%BA%D1%81%D1%82%2C%20%D0%B2%D1%81%D0%B5%D0%B3%D0%B4%D0%B0%20%D0%B2%20%D0%BA%D0%B0%D0%B2%D1%8B%D1%87%D0%BA%D0%B0%D1%85%0Alet%20text%20%3D%20%27%D0%BF%D1%80%D0%B8%D0%B2%D0%B5%D1%82%27%3B%0A%0A//%20%D1%87%D0%B8%D1%81%D0%BB%D0%BE%20%E2%80%94%20%D0%B1%D0%B5%D0%B7%20%D0%BA%D0%B0%D0%B2%D1%8B%D1%87%D0%B5%D0%BA%0Alet%20count%20%3D%2042%3B%0A%0A//%20%D0%B1%D1%83%D0%BB%D0%B5%D0%B2%D0%BE%20%E2%80%94%20%D1%82%D0%BE%D0%BB%D1%8C%D0%BA%D0%BE%20true%20%28%D0%B4%D0%B0%29%20%D0%B8%D0%BB%D0%B8%20false%20%28%D0%BD%D0%B5%D1%82%29%0Alet%20isOpen%20%3D%20true%3B%0A%0Aconsole.log%28text%29%3B%0Aconsole.log%28count%29%3B%0Aconsole.log%28isOpen%29%3B\"><span>▶</span><span class=\"rlabel\">Запустить</span></button></div>\n  <pre><code><span class=\"tc\">// строка — любой текст, всегда в кавычках</span>\n<span class=\"tk\">let</span><span class=\"tx\"> </span><span class=\"tx\">text</span><span class=\"tx\"> </span><span class=\"to\">=</span><span class=\"tx\"> </span><span class=\"ts2\">&#x27;привет&#x27;</span><span class=\"tx\">;</span>\n \n<span class=\"tc\">// число — без кавычек</span>\n<span class=\"tk\">let</span><span class=\"tx\"> </span><span class=\"tx\">count</span><span class=\"tx\"> </span><span class=\"to\">=</span><span class=\"tx\"> </span><span class=\"tn\">42</span><span class=\"tx\">;</span>\n \n<span class=\"tc\">// булево — только true (да) или false (нет)</span>\n<span class=\"tk\">let</span><span class=\"tx\"> </span><span class=\"tx\">isOpen</span><span class=\"tx\"> </span><span class=\"to\">=</span><span class=\"tx\"> </span><span class=\"tp\">true</span><span class=\"tx\">;</span>\n \n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tx\">text</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tx\">count</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tx\">isOpen</span><span class=\"tx\">)</span><span class=\"tx\">;</span></code></pre>\n  <div class=\"console\"><div class=\"console-inner\"><div class=\"console-label\">console</div></div></div>\n</div>\n\n    <div class=\"say ren\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"rFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#8893ab\"/><stop offset=\"100%\" stop-color=\"#6e7a94\"/></linearGradient></defs><circle cx=\"70\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"130\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"70\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"130\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"100\" cy=\"102\" r=\"50\" fill=\"url(#rFur__U)\"/><ellipse cx=\"100\" cy=\"116\" rx=\"38\" ry=\"30\" fill=\"#e6eaf2\"/><ellipse cx=\"100\" cy=\"120\" rx=\"30\" ry=\"22\" fill=\"#eef1f7\"/><ellipse cx=\"100\" cy=\"110\" rx=\"11\" ry=\"8\" fill=\"#3e3e48\"/><ellipse cx=\"96\" cy=\"108\" rx=\"3\" ry=\"2\" fill=\"#5e5e68\" opacity=\"0.7\"/><path d=\"M100 117 L100 126\" stroke=\"#3e3e48\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><circle cx=\"120\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><path d=\"M96 94 Q100 90 104 94\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" fill=\"none\"/><circle cx=\"80\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"120\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"83\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"123\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"77\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><circle cx=\"117\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><path d=\"M72 88 Q78 84 84 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M112 88 Q118 84 124 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M78 116 Q60 114 52 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M78 122 Q60 124 54 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 116 Q140 114 148 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 122 Q140 124 146 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M90 124 Q100 131 110 124\" stroke=\"#525c70\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Рен</div><p>Запомните разницу инженерно. Текст всегда в кавычках — строка в кавычках это строка. Без кавычек число это число. Кавычки решают всё. Перепутаете — компьютер будет думать, что складывает текст, а не числа.</p></div></div>\n\n    <div class=\"box warn\">\n      <div class=\"bt\">▸ Кавычки = текст</div>\n      <p><code>'42'</code> и <code>42</code> — разные вещи. Первое строка (текст), второе число. С числом можно считать, с текстом — нет. Это сбивает новичков чаще всего.</p>\n    </div>\n  </section>\n\n  <section>\n    <div class=\"sec-num\">00 · МАССИВЫ</div>\n    <h2>Массив — это список в одной коробке</h2>\n    <p class=\"lead\">Иногда нужно хранить не одно значение, а целый список. Для этого есть массив — одна коробка, в которой лежит несколько значений по порядку.</p>\n\n    <p>Список покупок, список друзей, список товаров. Вместо того чтобы делать сто коробок, делают одну — массив. Значения внутри пишут через запятую в квадратных скобках <code>[ ]</code>.</p>\n\n    <div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">array.js</span><button class=\"runbtn\" onclick=\"runJS(this)\" data-src=\"//%20%D0%BC%D0%B0%D1%81%D1%81%D0%B8%D0%B2%20%E2%80%94%20%D1%81%D0%BF%D0%B8%D1%81%D0%BE%D0%BA%20%D1%84%D1%80%D1%83%D0%BA%D1%82%D0%BE%D0%B2%20%D0%B2%20%D0%BA%D0%B2%D0%B0%D0%B4%D1%80%D0%B0%D1%82%D0%BD%D1%8B%D1%85%20%D1%81%D0%BA%D0%BE%D0%B1%D0%BA%D0%B0%D1%85%0Alet%20fruits%20%3D%20%5B%27%D1%8F%D0%B1%D0%BB%D0%BE%D0%BA%D0%BE%27%2C%20%27%D0%B1%D0%B0%D0%BD%D0%B0%D0%BD%27%2C%20%27%D0%BC%D0%B0%D0%BD%D0%B3%D0%BE%27%5D%3B%0A%0A//%20%D0%B2%D0%B5%D1%81%D1%8C%20%D1%81%D0%BF%D0%B8%D1%81%D0%BE%D0%BA%20%D1%86%D0%B5%D0%BB%D0%B8%D0%BA%D0%BE%D0%BC%0Aconsole.log%28fruits%29%3B%0A%0A//%20%D1%81%D0%BA%D0%BE%D0%BB%D1%8C%D0%BA%D0%BE%20%D1%8D%D0%BB%D0%B5%D0%BC%D0%B5%D0%BD%D1%82%D0%BE%D0%B2%20%D0%B2%20%D1%81%D0%BF%D0%B8%D1%81%D0%BA%D0%B5%0Aconsole.log%28fruits.length%29%3B\"><span>▶</span><span class=\"rlabel\">Запустить</span></button></div>\n  <pre><code><span class=\"tc\">// массив — список фруктов в квадратных скобках</span>\n<span class=\"tk\">let</span><span class=\"tx\"> </span><span class=\"tx\">fruits</span><span class=\"tx\"> </span><span class=\"to\">=</span><span class=\"tx\"> </span><span class=\"tx\">[</span><span class=\"ts2\">&#x27;яблоко&#x27;</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"ts2\">&#x27;банан&#x27;</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"ts2\">&#x27;манго&#x27;</span><span class=\"tx\">]</span><span class=\"tx\">;</span>\n \n<span class=\"tc\">// весь список целиком</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tx\">fruits</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n \n<span class=\"tc\">// сколько элементов в списке</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tx\">fruits</span><span class=\"tx\">.</span><span class=\"tx\">length</span><span class=\"tx\">)</span><span class=\"tx\">;</span></code></pre>\n  <div class=\"console\"><div class=\"console-inner\"><div class=\"console-label\">console</div></div></div>\n</div>\n\n    <h3>Как достать один элемент</h3>\n    <p>У каждого элемента в списке есть номер — его называют <strong>индекс</strong>. Важно: счёт идёт <strong>с нуля</strong>, не с единицы. Первый элемент — это номер 0, второй — номер 1, и так далее.</p>\n\n    <div class=\"viz\">\n      <div class=\"viz-title\">массив fruits и номера (индексы)</div>\n      <div style=\"display:flex;gap:8px;justify-content:center;flex-wrap:wrap;\">\n        <div style=\"text-align:center;\"><div style=\"background:var(--card2);border:2px solid var(--acc);border-radius:10px;padding:12px 14px;font-family:'JetBrains Mono',monospace;font-weight:700;\">'яблоко'</div><div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);margin-top:6px;\">[0]</div></div>\n        <div style=\"text-align:center;\"><div style=\"background:var(--card2);border:2px solid var(--acc);border-radius:10px;padding:12px 14px;font-family:'JetBrains Mono',monospace;font-weight:700;\">'банан'</div><div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);margin-top:6px;\">[1]</div></div>\n        <div style=\"text-align:center;\"><div style=\"background:var(--card2);border:2px solid var(--acc);border-radius:10px;padding:12px 14px;font-family:'JetBrains Mono',monospace;font-weight:700;\">'манго'</div><div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);margin-top:6px;\">[2]</div></div>\n      </div>\n    </div>\n\n    <div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">index.js</span><button class=\"runbtn\" onclick=\"runJS(this)\" data-src=\"let%20fruits%20%3D%20%5B%27%D1%8F%D0%B1%D0%BB%D0%BE%D0%BA%D0%BE%27%2C%20%27%D0%B1%D0%B0%D0%BD%D0%B0%D0%BD%27%2C%20%27%D0%BC%D0%B0%D0%BD%D0%B3%D0%BE%27%5D%3B%0A%0A//%20%D0%B4%D0%BE%D1%81%D1%82%D0%B0%D1%91%D0%BC%20%D0%BF%D0%BE%20%D0%BD%D0%BE%D0%BC%D0%B5%D1%80%D1%83%20%28%D0%B2%20%D0%BA%D0%B2%D0%B0%D0%B4%D1%80%D0%B0%D1%82%D0%BD%D1%8B%D1%85%20%D1%81%D0%BA%D0%BE%D0%B1%D0%BA%D0%B0%D1%85%29%0Aconsole.log%28fruits%5B0%5D%29%3B%20%20%20//%20%27%D1%8F%D0%B1%D0%BB%D0%BE%D0%BA%D0%BE%27%20%E2%80%94%20%D1%81%D0%B0%D0%BC%D1%8B%D0%B9%20%D0%BF%D0%B5%D1%80%D0%B2%D1%8B%D0%B9%0Aconsole.log%28fruits%5B1%5D%29%3B%20%20%20//%20%27%D0%B1%D0%B0%D0%BD%D0%B0%D0%BD%27%0Aconsole.log%28fruits%5B2%5D%29%3B%20%20%20//%20%27%D0%BC%D0%B0%D0%BD%D0%B3%D0%BE%27\"><span>▶</span><span class=\"rlabel\">Запустить</span></button></div>\n  <pre><code><span class=\"tk\">let</span><span class=\"tx\"> </span><span class=\"tx\">fruits</span><span class=\"tx\"> </span><span class=\"to\">=</span><span class=\"tx\"> </span><span class=\"tx\">[</span><span class=\"ts2\">&#x27;яблоко&#x27;</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"ts2\">&#x27;банан&#x27;</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"ts2\">&#x27;манго&#x27;</span><span class=\"tx\">]</span><span class=\"tx\">;</span>\n \n<span class=\"tc\">// достаём по номеру (в квадратных скобках)</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tx\">fruits</span><span class=\"tx\">[</span><span class=\"tn\">0</span><span class=\"tx\">]</span><span class=\"tx\">)</span><span class=\"tx\">;</span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tc\">// &#x27;яблоко&#x27; — самый первый</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tx\">fruits</span><span class=\"tx\">[</span><span class=\"tn\">1</span><span class=\"tx\">]</span><span class=\"tx\">)</span><span class=\"tx\">;</span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tc\">// &#x27;банан&#x27;</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tx\">fruits</span><span class=\"tx\">[</span><span class=\"tn\">2</span><span class=\"tx\">]</span><span class=\"tx\">)</span><span class=\"tx\">;</span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tc\">// &#x27;манго&#x27;</span></code></pre>\n  <div class=\"console\"><div class=\"console-inner\"><div class=\"console-label\">console</div></div></div>\n</div>\n\n    <div class=\"say maxi\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"mFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#46b877\"/><stop offset=\"100%\" stop-color=\"#359a5e\"/></linearGradient><radialGradient id=\"mCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#f0a890\" stop-opacity=\"0.45\"/><stop offset=\"100%\" stop-color=\"#f0a890\" stop-opacity=\"0\"/></radialGradient></defs><path d=\"M66 56 Q56 18 90 42 Q80 54 72 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M134 56 Q144 18 110 42 Q120 54 128 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M70 50 Q64 30 82 44 Z\" fill=\"#1f1f1f\"/><path d=\"M130 50 Q136 30 118 44 Z\" fill=\"#1f1f1f\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#mFur__U)\"/><path d=\"M100 64 Q66 72 70 112 Q100 128 130 112 Q134 72 100 64 Z\" fill=\"#f2f6f2\"/><ellipse cx=\"100\" cy=\"104\" rx=\"34\" ry=\"26\" fill=\"#f7faf7\"/><ellipse cx=\"74\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"126\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"100\" cy=\"108\" rx=\"6.5\" ry=\"5\" fill=\"#2a2a2a\"/><path d=\"M100 113 L100 120\" stroke=\"#2a2a2a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><ellipse cx=\"82\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><ellipse cx=\"118\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><circle cx=\"83\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"117\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"83\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"117\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"86\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"120\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"79\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"113\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M90 119 Q100 127 110 119\" stroke=\"#1f5a32\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M97 124 Q100 129 103 124 Z\" fill=\"#e87a8a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Макси</div><p>С нуля — это не баг, это так у всех языков. Думай так: индекс это «на сколько шагов отойти от начала». Первый элемент уже в начале, отходить не надо — ноль шагов. Поэтому [0].</p></div></div>\n\n    <div class=\"box tip\">\n      <div class=\"bt\">▸ Квадратные скобки в двух ролях</div>\n      <p>Когда создаёшь массив — <code>[ ]</code> оборачивают весь список. Когда достаёшь элемент — <code>fruits[0]</code> берут один по номеру. Скобки те же, смысл по контексту.</p>\n    </div>\n  </section>\n\n  <section>\n    <div class=\"sec-num\">00 · ОБЪЕКТЫ</div>\n    <h2>Объект — коробка с подписанными отделениями</h2>\n    <p class=\"lead\">Массив хранит список по номерам. А объект хранит данные по <strong>названиям</strong>. Удобно, когда у одной вещи много свойств.</p>\n\n    <p>Представь карточку человека: имя, возраст, город. Это всё про одного человека, но разные свойства. Объект — это коробка с подписанными отделениями: в отделении «имя» лежит имя, в «возраст» — возраст. Пишут в фигурных скобках <code>{ }</code>.</p>\n\n    <div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">object.js</span><button class=\"runbtn\" onclick=\"runJS(this)\" data-src=\"//%20%D0%BE%D0%B1%D1%8A%D0%B5%D0%BA%D1%82%20%E2%80%94%20%D0%B4%D0%B0%D0%BD%D0%BD%D1%8B%D0%B5%20%D1%81%20%D0%BD%D0%B0%D0%B7%D0%B2%D0%B0%D0%BD%D0%B8%D1%8F%D0%BC%D0%B8%2C%20%D0%B2%20%D1%84%D0%B8%D0%B3%D1%83%D1%80%D0%BD%D1%8B%D1%85%20%D1%81%D0%BA%D0%BE%D0%B1%D0%BA%D0%B0%D1%85%0Alet%20user%20%3D%20%7B%0A%20%20name%3A%20%27%D0%90%D0%BD%D1%8F%27%2C%0A%20%20age%3A%2025%2C%0A%20%20city%3A%20%27%D0%9C%D0%BE%D1%81%D0%BA%D0%B2%D0%B0%27%2C%0A%7D%3B%0A%0A//%20%D0%B4%D0%BE%D1%81%D1%82%D0%B0%D1%91%D0%BC%20%D0%BF%D0%BE%20%D0%BD%D0%B0%D0%B7%D0%B2%D0%B0%D0%BD%D0%B8%D1%8E%20%D1%87%D0%B5%D1%80%D0%B5%D0%B7%20%D1%82%D0%BE%D1%87%D0%BA%D1%83%0Aconsole.log%28user.name%29%3B%20%20%20//%20%27%D0%90%D0%BD%D1%8F%27%0Aconsole.log%28user.age%29%3B%20%20%20%20//%2025%0Aconsole.log%28user.city%29%3B%20%20%20//%20%27%D0%9C%D0%BE%D1%81%D0%BA%D0%B2%D0%B0%27\"><span>▶</span><span class=\"rlabel\">Запустить</span></button></div>\n  <pre><code><span class=\"tc\">// объект — данные с названиями, в фигурных скобках</span>\n<span class=\"tk\">let</span><span class=\"tx\"> </span><span class=\"tx\">user</span><span class=\"tx\"> </span><span class=\"to\">=</span><span class=\"tx\"> </span><span class=\"tx\">{</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">name</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"ts2\">&#x27;Аня&#x27;</span><span class=\"tx\">,</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">age</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tn\">25</span><span class=\"tx\">,</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">city</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"ts2\">&#x27;Москва&#x27;</span><span class=\"tx\">,</span>\n<span class=\"tx\">}</span><span class=\"tx\">;</span>\n \n<span class=\"tc\">// достаём по названию через точку</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tx\">user</span><span class=\"tx\">.</span><span class=\"tx\">name</span><span class=\"tx\">)</span><span class=\"tx\">;</span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tc\">// &#x27;Аня&#x27;</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tx\">user</span><span class=\"tx\">.</span><span class=\"tx\">age</span><span class=\"tx\">)</span><span class=\"tx\">;</span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tc\">// 25</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tx\">user</span><span class=\"tx\">.</span><span class=\"tx\">city</span><span class=\"tx\">)</span><span class=\"tx\">;</span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tc\">// &#x27;Москва&#x27;</span></code></pre>\n  <div class=\"console\"><div class=\"console-inner\"><div class=\"console-label\">console</div></div></div>\n</div>\n\n    <div class=\"say ren\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"rFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#8893ab\"/><stop offset=\"100%\" stop-color=\"#6e7a94\"/></linearGradient></defs><circle cx=\"70\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"130\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"70\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"130\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"100\" cy=\"102\" r=\"50\" fill=\"url(#rFur__U)\"/><ellipse cx=\"100\" cy=\"116\" rx=\"38\" ry=\"30\" fill=\"#e6eaf2\"/><ellipse cx=\"100\" cy=\"120\" rx=\"30\" ry=\"22\" fill=\"#eef1f7\"/><ellipse cx=\"100\" cy=\"110\" rx=\"11\" ry=\"8\" fill=\"#3e3e48\"/><ellipse cx=\"96\" cy=\"108\" rx=\"3\" ry=\"2\" fill=\"#5e5e68\" opacity=\"0.7\"/><path d=\"M100 117 L100 126\" stroke=\"#3e3e48\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><circle cx=\"120\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><path d=\"M96 94 Q100 90 104 94\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" fill=\"none\"/><circle cx=\"80\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"120\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"83\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"123\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"77\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><circle cx=\"117\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><path d=\"M72 88 Q78 84 84 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M112 88 Q118 84 124 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M78 116 Q60 114 52 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M78 122 Q60 124 54 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 116 Q140 114 148 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 122 Q140 124 146 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M90 124 Q100 131 110 124\" stroke=\"#525c70\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Рен</div><p>Разница простая. Массив — когда вещи однотипные и важен порядок (список фруктов). Объект — когда у одной вещи разные свойства (имя, возраст, город). Достаём из массива по номеру <code>[0]</code>, из объекта по названию <code>.name</code>.</p></div></div>\n\n    <h3>Название свойства = ключ, значение = значение</h3>\n    <p>Внутри объекта каждая строчка — это пара «ключ: значение». Слева название (ключ), справа само значение. Между ними двоеточие. Через точку потом достаёшь нужное.</p>\n\n    <div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">object2.js</span><button class=\"runbtn\" onclick=\"runJS(this)\" data-src=\"let%20product%20%3D%20%7B%0A%20%20title%3A%20%27%D0%A2%D0%B5%D0%BB%D0%B5%D1%84%D0%BE%D0%BD%27%2C%0A%20%20price%3A%2015000%2C%0A%20%20inStock%3A%20true%2C%0A%7D%3B%0A%0Aconsole.log%28product.title%29%3B%20%20%20%20//%20%27%D0%A2%D0%B5%D0%BB%D0%B5%D1%84%D0%BE%D0%BD%27%0Aconsole.log%28product.price%29%3B%20%20%20%20//%2015000%0Aconsole.log%28product.inStock%29%3B%20%20//%20true\"><span>▶</span><span class=\"rlabel\">Запустить</span></button></div>\n  <pre><code><span class=\"tk\">let</span><span class=\"tx\"> </span><span class=\"tx\">product</span><span class=\"tx\"> </span><span class=\"to\">=</span><span class=\"tx\"> </span><span class=\"tx\">{</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">title</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"ts2\">&#x27;Телефон&#x27;</span><span class=\"tx\">,</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">price</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tn\">15000</span><span class=\"tx\">,</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">inStock</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tp\">true</span><span class=\"tx\">,</span>\n<span class=\"tx\">}</span><span class=\"tx\">;</span>\n \n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tx\">product</span><span class=\"tx\">.</span><span class=\"tx\">title</span><span class=\"tx\">)</span><span class=\"tx\">;</span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tc\">// &#x27;Телефон&#x27;</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tx\">product</span><span class=\"tx\">.</span><span class=\"tx\">price</span><span class=\"tx\">)</span><span class=\"tx\">;</span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tc\">// 15000</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tx\">product</span><span class=\"tx\">.</span><span class=\"tx\">inStock</span><span class=\"tx\">)</span><span class=\"tx\">;</span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tc\">// true</span></code></pre>\n  <div class=\"console\"><div class=\"console-inner\"><div class=\"console-label\">console</div></div></div>\n</div>\n  </section>\n\n  <section>\n    <div class=\"sec-num\">00 · ВСЁ ВМЕСТЕ</div>\n    <h2>Массив объектов — список карточек</h2>\n    <p class=\"lead\">А теперь главное сочетание, которое ты будешь видеть постоянно. Список, в котором каждый элемент — объект. Так приходят данные с сервера.</p>\n\n    <p>Смотри: список товаров. Каждый товар — объект со своими свойствами (название, цена). А все товары вместе — массив. Получается массив объектов. Это основа всего, что ты будешь делать дальше.</p>\n\n    <div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">array-of-objects.js</span><button class=\"runbtn\" onclick=\"runJS(this)\" data-src=\"//%20%D0%BC%D0%B0%D1%81%D1%81%D0%B8%D0%B2%2C%20%D0%B3%D0%B4%D0%B5%20%D0%BA%D0%B0%D0%B6%D0%B4%D1%8B%D0%B9%20%D1%8D%D0%BB%D0%B5%D0%BC%D0%B5%D0%BD%D1%82%20%E2%80%94%20%D0%BE%D0%B1%D1%8A%D0%B5%D0%BA%D1%82%0Alet%20products%20%3D%20%5B%0A%20%20%7B%20title%3A%20%27%D0%A2%D0%B5%D0%BB%D0%B5%D1%84%D0%BE%D0%BD%27%2C%20price%3A%2015000%20%7D%2C%0A%20%20%7B%20title%3A%20%27%D0%9D%D0%BE%D1%83%D1%82%D0%B1%D1%83%D0%BA%27%2C%20price%3A%2080000%20%7D%2C%0A%20%20%7B%20title%3A%20%27%D0%9F%D0%BB%D0%B0%D0%BD%D1%88%D0%B5%D1%82%27%2C%20price%3A%2025000%20%7D%2C%0A%5D%3B%0A%0A//%20%D0%B2%D0%B5%D1%81%D1%8C%20%D1%81%D0%BF%D0%B8%D1%81%D0%BE%D0%BA%0Aconsole.log%28products.length%29%3B%20%20%20//%203%20%D1%82%D0%BE%D0%B2%D0%B0%D1%80%D0%B0%0A%0A//%20%D0%BF%D0%B5%D1%80%D0%B2%D1%8B%D0%B9%20%D1%82%D0%BE%D0%B2%D0%B0%D1%80%20%D1%86%D0%B5%D0%BB%D0%B8%D0%BA%D0%BE%D0%BC%0Aconsole.log%28products%5B0%5D%29%3B%20%20%20%20%20%20%20//%20%7B%20title%3A%20%27%D0%A2%D0%B5%D0%BB%D0%B5%D1%84%D0%BE%D0%BD%27%2C%20price%3A%2015000%20%7D%0A%0A//%20%D0%BD%D0%B0%D0%B7%D0%B2%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BF%D0%B5%D1%80%D0%B2%D0%BE%D0%B3%D0%BE%20%D1%82%D0%BE%D0%B2%D0%B0%D1%80%D0%B0%3A%20%D1%81%D0%BD%D0%B0%D1%87%D0%B0%D0%BB%D0%B0%20%5B0%5D%2C%20%D0%BF%D0%BE%D1%82%D0%BE%D0%BC%20.title%0Aconsole.log%28products%5B0%5D.title%29%3B%20//%20%27%D0%A2%D0%B5%D0%BB%D0%B5%D1%84%D0%BE%D0%BD%27%0A%0A//%20%D1%86%D0%B5%D0%BD%D0%B0%20%D1%82%D1%80%D0%B5%D1%82%D1%8C%D0%B5%D0%B3%D0%BE%20%D1%82%D0%BE%D0%B2%D0%B0%D1%80%D0%B0%0Aconsole.log%28products%5B2%5D.price%29%3B%20//%2025000\"><span>▶</span><span class=\"rlabel\">Запустить</span></button></div>\n  <pre><code><span class=\"tc\">// массив, где каждый элемент — объект</span>\n<span class=\"tk\">let</span><span class=\"tx\"> </span><span class=\"tx\">products</span><span class=\"tx\"> </span><span class=\"to\">=</span><span class=\"tx\"> </span><span class=\"tx\">[</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">{</span><span class=\"tx\"> </span><span class=\"tx\">title</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"ts2\">&#x27;Телефон&#x27;</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tx\">price</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tn\">15000</span><span class=\"tx\"> </span><span class=\"tx\">}</span><span class=\"tx\">,</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">{</span><span class=\"tx\"> </span><span class=\"tx\">title</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"ts2\">&#x27;Ноутбук&#x27;</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tx\">price</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tn\">80000</span><span class=\"tx\"> </span><span class=\"tx\">}</span><span class=\"tx\">,</span>\n<span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\">{</span><span class=\"tx\"> </span><span class=\"tx\">title</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"ts2\">&#x27;Планшет&#x27;</span><span class=\"tx\">,</span><span class=\"tx\"> </span><span class=\"tx\">price</span><span class=\"to\">:</span><span class=\"tx\"> </span><span class=\"tn\">25000</span><span class=\"tx\"> </span><span class=\"tx\">}</span><span class=\"tx\">,</span>\n<span class=\"tx\">]</span><span class=\"tx\">;</span>\n \n<span class=\"tc\">// весь список</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tx\">products</span><span class=\"tx\">.</span><span class=\"tx\">length</span><span class=\"tx\">)</span><span class=\"tx\">;</span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tc\">// 3 товара</span>\n \n<span class=\"tc\">// первый товар целиком</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tx\">products</span><span class=\"tx\">[</span><span class=\"tn\">0</span><span class=\"tx\">]</span><span class=\"tx\">)</span><span class=\"tx\">;</span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tx\"> </span><span class=\"tc\">// { title: &#x27;Телефон&#x27;, price: 15000 }</span>\n \n<span class=\"tc\">// название первого товара: сначала [0], потом .title</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tx\">products</span><span class=\"tx\">[</span><span class=\"tn\">0</span><span class=\"tx\">]</span><span class=\"tx\">.</span><span class=\"tx\">title</span><span class=\"tx\">)</span><span class=\"tx\">;</span><span class=\"tx\"> </span><span class=\"tc\">// &#x27;Телефон&#x27;</span>\n \n<span class=\"tc\">// цена третьего товара</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tx\">products</span><span class=\"tx\">[</span><span class=\"tn\">2</span><span class=\"tx\">]</span><span class=\"tx\">.</span><span class=\"tx\">price</span><span class=\"tx\">)</span><span class=\"tx\">;</span><span class=\"tx\"> </span><span class=\"tc\">// 25000</span></code></pre>\n  <div class=\"console\"><div class=\"console-inner\"><div class=\"console-label\">console</div></div></div>\n</div>\n\n    <div class=\"say kyle\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"kFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#b87a48\"/><stop offset=\"100%\" stop-color=\"#9a6238\"/></linearGradient><radialGradient id=\"kCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#e8957a\" stop-opacity=\"0.5\"/><stop offset=\"100%\" stop-color=\"#e8957a\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"58\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"142\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"64\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><ellipse cx=\"136\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><path d=\"M68 58 Q60 22 88 44 Q80 56 72 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M132 58 Q140 22 112 44 Q120 56 128 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M71 54 Q67 36 82 48 Z\" fill=\"#3a3230\"/><path d=\"M129 54 Q133 36 118 48 Z\" fill=\"#3a3230\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#kFur__U)\"/><path d=\"M100 56 Q62 62 60 104 Q100 92 140 104 Q138 62 100 56 Z\" fill=\"#e8cfa8\"/><ellipse cx=\"100\" cy=\"98\" rx=\"40\" ry=\"30\" fill=\"#ecd6b4\"/><ellipse cx=\"100\" cy=\"116\" rx=\"30\" ry=\"24\" fill=\"#f2e1c8\"/><ellipse cx=\"72\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"128\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"100\" cy=\"106\" rx=\"9\" ry=\"7\" fill=\"#3a2a26\"/><ellipse cx=\"97\" cy=\"104\" rx=\"3\" ry=\"2\" fill=\"#5a4a44\" opacity=\"0.7\"/><ellipse cx=\"80\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><ellipse cx=\"120\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><circle cx=\"81\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"119\" cy=\"96\" r=\"9
