span>          <span class=\"cm\"># getProducts.ts (fetch/axios)</span>\n├─ <span class=\"dir\">features/</span>          <span class=\"cm\"># действия: add-to-cart, auth</span>\n├─ <span class=\"dir\">widgets/</span>           <span class=\"cm\"># Header, ProductList</span>\n├─ <span class=\"dir\">pages/</span>             <span class=\"cm\"># CatalogPage собирает виджеты</span>\n└─ <span class=\"dir\">shared/</span>            <span class=\"cm\"># ui-кит, базовый api-клиент, утилиты</span></div><div class=\"box tip\"><div class=\"bt\">Правило импортов</div><p>Слой может импортировать только из слоёв НИЖЕ себя. features берёт из entities и shared, но никогда из widgets. Это правило в одну строку и есть весь секрет: зависимости текут строго вниз, циклов не возникает, клубок не запутывается.</p></div></section><section><div class=\"sec-num\">04 · ВСЁ ВМЕСТЕ</div><h2>Путь данных через слои</h2><p>А вот ради чего всё затевалось. Смотри, как материал всех пяти разделов встаёт по местам, когда пользователь жмёт кнопку. Запусти поток:</p><div class=\"pipe\"><div class=\"pipe-track\"><div class=\"pipe-step\" id=\"ps-feat\"><div class=\"ps-ico\">🖱️</div><div class=\"ps-layer\">features</div><div class=\"ps-t\">Клик</div><div class=\"ps-d\">Юзер нажал «Загрузить товары»</div></div><div class=\"pipe-step\" id=\"ps-api\"><div class=\"ps-ico\">🌐</div><div class=\"ps-layer\">shared / api</div><div class=\"ps-t\">fetch</div><div class=\"ps-d\">Запрос летит на бэкенд, ждём JSON</div></div><div class=\"pipe-step\" id=\"ps-zod\"><div class=\"ps-ico\">🛡️</div><div class=\"ps-layer\">entities / model</div><div class=\"ps-t\">Zod</div><div class=\"ps-d\">Валидируем ответ сервера схемой</div></div><div class=\"pipe-step\" id=\"ps-store\"><div class=\"ps-ico\">📦</div><div class=\"ps-layer\">entities / model</div><div class=\"ps-t\">Zustand</div><div class=\"ps-d\">Кладём проверенные данные в стор</div></div><div class=\"pipe-step\" id=\"ps-entity\"><div class=\"ps-ico\">🎨</div><div class=\"ps-layer\">widgets / ui</div><div class=\"ps-t\">Render</div><div class=\"ps-d\">Компонент перерисовался сам</div></div></div><div class=\"net-log\" id=\"pipe-log\" style=\"margin-top:16px;\">нажми — увидишь, как данные едут по слоям</div><div style=\"text-align:center;margin-top:12px;\"><button class=\"minibtn\" onclick=\"runPipe()\">▶ Запустить поток данных</button></div></div><div class=\"say kyle\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"kFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#b87a48\"/><stop offset=\"100%\" stop-color=\"#9a6238\"/></linearGradient><radialGradient id=\"kCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#e8957a\" stop-opacity=\"0.5\"/><stop offset=\"100%\" stop-color=\"#e8957a\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"58\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"142\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"64\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><ellipse cx=\"136\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><path d=\"M68 58 Q60 22 88 44 Q80 56 72 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M132 58 Q140 22 112 44 Q120 56 128 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M71 54 Q67 36 82 48 Z\" fill=\"#3a3230\"/><path d=\"M129 54 Q133 36 118 48 Z\" fill=\"#3a3230\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#kFur__U)\"/><path d=\"M100 56 Q62 62 60 104 Q100 92 140 104 Q138 62 100 56 Z\" fill=\"#e8cfa8\"/><ellipse cx=\"100\" cy=\"98\" rx=\"40\" ry=\"30\" fill=\"#ecd6b4\"/><ellipse cx=\"100\" cy=\"116\" rx=\"30\" ry=\"24\" fill=\"#f2e1c8\"/><ellipse cx=\"72\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"128\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"100\" cy=\"106\" rx=\"9\" ry=\"7\" fill=\"#3a2a26\"/><ellipse cx=\"97\" cy=\"104\" rx=\"3\" ry=\"2\" fill=\"#5a4a44\" opacity=\"0.7\"/><ellipse cx=\"80\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><ellipse cx=\"120\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><circle cx=\"81\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"119\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"81\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"119\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"84\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"122\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"77\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"115\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M88 120 Q100 130 112 120\" stroke=\"#7a5238\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M74 142 Q100 154 126 142\" stroke=\"#9a4030\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"100\" cy=\"151\" r=\"7\" fill=\"#f0c44e\"/><circle cx=\"100\" cy=\"153\" r=\"1.8\" fill=\"#9a7a1a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Кайл</div><p>Вот и вся картина, Яндексоиды. Сеть приносит данные → fetch их забирает → Zod проверяет → Zustand хранит → React рисует. А FSD говорит, в какой папке каждый из этих шагов живёт. Архитектура — это не бюрократия, это карта, по которой не заблудишься.</p></div></div><div class=\"box info\"><div class=\"bt\">Что дальше</div><p>Это был обзорный заход. В следующий раз копаем data-management по-взрослому: TanStack Query для server state, нормализация, кэш-инвалидация, и FSD глубоко — публичные API слоёв, cross-import правила, реальная структура крупного проекта.</p></div></section><div class=\"meme-row\"><span class=\"meme\"><span class=\"mava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"rFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#8893ab\"/><stop offset=\"100%\" stop-color=\"#6e7a94\"/></linearGradient></defs><circle cx=\"70\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"130\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"70\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"130\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"100\" cy=\"102\" r=\"50\" fill=\"url(#rFur__U)\"/><ellipse cx=\"100\" cy=\"116\" rx=\"38\" ry=\"30\" fill=\"#e6eaf2\"/><ellipse cx=\"100\" cy=\"120\" rx=\"30\" ry=\"22\" fill=\"#eef1f7\"/><ellipse cx=\"100\" cy=\"110\" rx=\"11\" ry=\"8\" fill=\"#3e3e48\"/><ellipse cx=\"96\" cy=\"108\" rx=\"3\" ry=\"2\" fill=\"#5e5e68\" opacity=\"0.7\"/><path d=\"M100 117 L100 126\" stroke=\"#3e3e48\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><circle cx=\"120\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><path d=\"M96 94 Q100 90 104 94\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" fill=\"none\"/><circle cx=\"80\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"120\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"83\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"123\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"77\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><circle cx=\"117\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><path d=\"M72 88 Q78 84 84 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M112 88 Q118 84 124 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M78 116 Q60 114 52 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M78 122 Q60 124 54 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 116 Q140 114 148 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 122 Q140 124 146 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M90 124 Q100 131 110 124\" stroke=\"#525c70\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/></svg></span>FSD: место для всего и всё на своём месте. Кроме utils. utils везде.</span></div><div class=\"meme-row\"><span class=\"meme\"><span class=\"mava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"mFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#46b877\"/><stop offset=\"100%\" stop-color=\"#359a5e\"/></linearGradient><radialGradient id=\"mCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#f0a890\" stop-opacity=\"0.45\"/><stop offset=\"100%\" stop-color=\"#f0a890\" stop-opacity=\"0\"/></radialGradient></defs><path d=\"M66 56 Q56 18 90 42 Q80 54 72 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M134 56 Q144 18 110 42 Q120 54 128 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M70 50 Q64 30 82 44 Z\" fill=\"#1f1f1f\"/><path d=\"M130 50 Q136 30 118 44 Z\" fill=\"#1f1f1f\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#mFur__U)\"/><path d=\"M100 64 Q66 72 70 112 Q100 128 130 112 Q134 72 100 64 Z\" fill=\"#f2f6f2\"/><ellipse cx=\"100\" cy=\"104\" rx=\"34\" ry=\"26\" fill=\"#f7faf7\"/><ellipse cx=\"74\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"126\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"100\" cy=\"108\" rx=\"6.5\" ry=\"5\" fill=\"#2a2a2a\"/><path d=\"M100 113 L100 120\" stroke=\"#2a2a2a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><ellipse cx=\"82\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><ellipse cx=\"118\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><circle cx=\"83\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"117\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"83\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"117\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"86\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"120\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"79\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"113\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M90 119 Q100 127 110 119\" stroke=\"#1f5a32\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M97 124 Q100 129 103 124 Z\" fill=\"#e87a8a\"/></svg></span>Хорошая архитектура — когда новый разраб не плачет в первый день. Только во второй.</span></div><div class=\"pager\"><button onclick=\"pager(-1)\">← Состояние</button></div><footer><div class=\"big\">Готово 🔴</div><p>Сеть · fetch/axios · TS &amp; Zod · Zustand vs Redux · FSD<br>Кайл, Макси и Рен прощаются с дорогими студентами-Яндексоидами.</p></footer></div>\n</div></div>\n<script>\nconst pageOrder = ['net','tools','types','data','fsd'];\nfunction showPage(id){\n  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));\n  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));\n  document.getElementById('page-'+id).classList.add('active');\n  document.querySelector('.tab[data-page=\"'+id+'\"]').classList.add('active');\n  window.scrollTo({top:0,behavior:'smooth'});\n}\ndocument.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>showPage(t.dataset.page)));\nfunction pager(dir){\n  const cur=document.querySelector('.page.active').id.replace('page-','');\n  const i=pageOrder.indexOf(cur), ni=i+dir;\n  if(ni>=0&&ni<pageOrder.length) showPage(pageOrder[ni]);\n}\nwindow.addEventListener('scroll',()=>{const h=document.documentElement;\n  document.getElementById('prog').style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%';});\n\n// ===== ASYNC JS RUNNER (supports await + real fetch) =====\nfunction fmt(v){\n  if(typeof v==='string') return v;\n  if(v===undefined) return 'undefined';\n  if(v===null) return 'null';\n  try{return JSON.stringify(v,null,2);}catch(e){return String(v);}\n}\nasync function runJS(btn){\n  const block=btn.closest('.code');\n  const consoleEl=block.querySelector('.console');\n  const inner=consoleEl.querySelector('.console-inner');\n  const src=decodeURIComponent(btn.dataset.src);\n  const logs=[];\n  const fakeConsole={\n    log:(...a)=>logs.push({t:'log',m:a.map(fmt).join(' ')}),\n    error:(...a)=>logs.push({t:'err',m:a.map(fmt).join(' ')}),\n    warn:(...a)=>logs.push({t:'log',m:a.map(fmt).join(' ')}),\n  };\n  inner.querySelectorAll('.cline').forEach(n=>n.remove());\n  const pending=document.createElement('div');pending.className='cline dim';pending.textContent='выполняю…';\n  inner.appendChild(pending); consoleEl.classList.add('show');\n  btn.querySelector('.rlabel').textContent='…';\n  try{\n    const fn=new Function('console','return (async()=>{\\n'+src+'\\n})();');\n    await fn(fakeConsole);\n  }catch(e){ logs.push({t:'err',m:e.name+': '+e.message}); }\n  pending.remove();\n  if(!logs.length){const d=document.createElement('div');d.className='cline dim';d.textContent='(нет вывода — добавь console.log)';inner.appendChild(d);}\n  else logs.forEach(l=>{const d=document.createElement('div');d.className='cline'+(l.t==='err'?' err':'');d.textContent=l.m;inner.appendChild(d);});\n  btn.querySelector('.rlabel').textContent='Запущено';\n  setTimeout(()=>{btn.querySelector('.rlabel').textContent='Запустить';},1200);\n}\n\n// ===== HTTP STATUS EXPLORER =====\nconst STATUS={\n '200':['c2','OK','Запрос удался. Сервер отдал то, что просили. Самый желанный код.'],\n '201':['c2','Created','Создан новый ресурс. Обычно ответ на POST: зарегистрировали юзера, создали заказ.'],\n '301':['c3','Moved Permanently','Адрес переехал навсегда. Браузер запомнит и в следующий раз пойдёт сразу на новый.'],\n '304':['c3','Not Modified','Ничего не поменялось с прошлого раза — бери из кэша, не качай заново.'],\n '400':['c4','Bad Request','Ты прислал кривой запрос. Сервер не понял тело или параметры. Чини фронт.'],\n '401':['c4','Unauthorized','Ты не представился. Нет токена / он протух. Нужно залогиниться.'],\n '403':['c4','Forbidden','Представился, но сюда нельзя. Прав не хватает. Логин не поможет.'],\n '404':['c4','Not Found','Ресурса нет. Самый известный код в интернете.'],\n '429':['c4','Too Many Requests','Ты долбишь сервер слишком часто. Притормози (rate limit).'],\n '500':['c5','Internal Server Error','Сервер упал на своей стороне. Это не твоя вина — это бэкендеры.'],\n '503':['c5','Service Unavailable','Сервер жив, но перегружен или на техработах. Зайди позже.'],\n};\nfunction pickStatus(code){\n  document.querySelectorAll('.stx-chip').forEach(c=>c.classList.toggle('active',c.dataset.code===code));\n  const [cls,name,desc]=STATUS[code];\n  const col={c2:'#2faf6a',c3:'#d6a13a',c4:'#e23b50',c5:'#ff5470'}[cls];\n  document.getElementById('stx-detail').innerHTML=\n    '<div class=\"stx-code\" style=\"color:'+col+'\">'+code+'</div><div class=\"stx-name\">'+name+'</div><div class=\"stx-desc\">'+desc+'</div>';\n}\n\n// ===== JSON formatter helper for output panels =====\nfunction colorJSON(obj){\n  let s=JSON.stringify(obj,null,2);\n  s=s.replace(/&/g,'&amp;').replace(/</g,'&lt;');\n  s=s.replace(/\"([^\"]+)\":/g,'<span class=\"k\">\"$1\"</span>:');\n  s=s.replace(/: \"([^\"]*)\"/g,': <span class=\"v\">\"$1\"</span>');\n  s=s.replace(/: (\\d+\\.?\\d*)/g,': <span class=\"num\">$1</span>');\n  return s;\n}\n\n// ===== REAL FETCH DEMO =====\nasync function realFetch(btn, mode){\n  const out=btn.closest('section').querySelector('.fetchout');\n  out.innerHTML='<span class=\"muted\">лечу на сервер…</span>';\n  const url='https://jsonplaceholder.typicode.com/users/2';\n  try{\n    if(mode==='axios'){\n      // emulate axios surface on top of fetch (axios CDN-free, same idea)\n      const r=await fetch(url);\n      if(!r.ok) throw new Error('HTTP '+r.status);\n      const data=await r.json();\n      out.innerHTML='<span class=\"muted\">// axios сам распарсил JSON, статус '+r.status+'</span>\\n'+\n        colorJSON({name:data.name,email:data.email,city:data.address.city,company:data.company.name});\n    } else {\n      const r=await fetch(url);\n      out.innerHTML='<span class=\"muted\">// статус ответа: '+r.status+' '+r.statusText+'</span>\\n';\n      if(!r.ok){out.innerHTML+='ошибка';return;}\n      const data=await r.json();\n      out.innerHTML+=colorJSON({name:data.name,email:data.email,city:data.address.city,company:data.company.name});\n    }\n  }catch(e){ out.innerHTML='<span style=\"color:#f0a4b0\">сеть недоступна: '+e.message+'</span>\\n<span class=\"muted\">(открой лекцию с интернетом — запрос летит на реальный API)</span>'; }\n}\n\n// ===== MINI ZUSTAND-STYLE STORE (faithful vanilla impl) =====\nfunction createStore(init){\n  let state=init; const subs=new Set();\n  return {\n    getState:()=>state,\n    setState:(patch)=>{state={...state,...(typeof patch==='function'?patch(state):patch)};subs.forEach(f=>f(state));},\n    subscribe:(f)=>{subs.add(f);return ()=>subs.delete(f);}\n  };\n}\nlet cartStore;\nfunction initStore(){\n  cartStore=createStore({items:[],total:0});\n  const renderState=(s)=>{\n    const el=document.getElementById('store-state');\n    el.innerHTML=colorState(s);\n  };\n  const renderBadge=(s)=>{\n    const b=document.getElementById('sub-badge');\n    b.querySelector('.cnt').textContent=s.items.length;\n    b.classList.add('flash');setTimeout(()=>b.classList.remove('flash'),350);\n  };\n  const renderTotal=(s)=>{\n    const t=document.getElementById('sub-total');\n    t.querySelector('.cnt').textContent=s.total+' ₽';\n    t.classList.add('flash');setTimeout(()=>t.classList.remove('flash'),350);\n  };\n  cartStore.subscribe(renderState);\n  cartStore.subscribe(renderBadge);\n  cartStore.subscribe(renderTotal);\n  renderState(cartStore.getState());\n}\nfunction colorState(s){\n  const items=s.items.map(i=>'    <span class=\"v\">\"'+i.n+'\"</span>').join(',\\n');\n  return '{\\n  <span class=\"k\">items</span>: ['+(s.items.length?'\\n'+items+'\\n  ':'')+'],\\n  <span class=\"k\">total</span>: <span class=\"num\">'+s.total+'</span>\\n}';\n}\nfunction cartAdd(name,price){\n  cartStore.setState(s=>({items:[...s.items,{n:name,p:price}],total:s.total+price}));\n}\nfunction cartClear(){ cartStore.setState({items:[],total:0}); }\n\n// ===== ZOD-STYLE VALIDATION PLAYGROUND (faithful) =====\nconst userSchema={\n  name:{type:'string',min:1},\n  age:{type:'number',min:0,max:120},\n  email:{type:'string',email:true},\n};\nfunction validate(data,schema){\n  const errors=[];\n  for(const key in schema){\n    const rule=schema[key]; const val=data[key];\n    if(val===undefined){errors.push(key+': обязательное поле отсутствует');continue;}\n    if(rule.type==='number'&&typeof val!=='number'){errors.push(key+': ожидалось number, пришло '+typeof val);continue;}\n    if(rule.type==='string'&&typeof val!=='string'){errors.push(key+': ожидалось string, пришло '+typeof val);continue;}\n    if(rule.min!==undefined&&rule.type==='number'&&val<rule.min)errors.push(key+': меньше минимума '+rule.min);\n    if(rule.max!==undefined&&val>rule.max)errors.push(key+': больше максимума '+rule.max);\n    if(rule.min!==undefined&&rule.type==='string'&&val.length<rule.min)errors.push(key+': строка пустая');\n    if(rule.email&&!/^[^@]+@[^@]+\\.[^@]+$/.test(val))errors.push(key+': не похоже на email');\n  }\n  return errors;\n}\nfunction runZod(){\n  const ta=document.getElementById('zod-input');\n  const res=document.getElementById('zod-result');\n  let data;\n  try{ data=JSON.parse(ta.value); }\n  catch(e){ res.className='zod-result bad'; res.textContent='❌ Это даже не валидный JSON: '+e.message; return; }\n  const errs=validate(data,userSchema);\n  if(!errs.length){ res.className='zod-result ok'; res.textContent='✅ safeParse({ success: true })\\nДанные прошли схему. Дальше им можно доверять и класть в стор.'; }\n  else{ res.className='zod-result bad'; res.textContent='❌ safeParse({ success: false })\\n'+errs.map(e=>'  • '+e).join('\\n'); }\n}\nfunction zodPreset(kind){\n  const ta=document.getElementById('zod-input');\n  if(kind==='good') ta.value='{\\n  \"name\": \"Аня\",\\n  \"age\": 27,\\n  \"email\": \"anya@yandex.ru\"\\n}';\n  else ta.value='{\\n  \"name\": \"\",\\n  \"age\": \"двадцать семь\",\\n  \"email\": \"не-почта\"\\n}';\n  runZod();\n}\n\n// ===== NETWORK FLIGHT ANIMATION =====\nfunction flyPacket(){\n  const wire=document.getElementById('net-wire');\n  const log=document.getElementById('net-log');\n  wire.querySelectorAll('.net-packet').forEach(p=>p.remove());\n  const req=document.createElement('div');req.className='net-packet req go-req';req.textContent='?';\n  wire.appendChild(req);\n  log.textContent='→ GET /users/2  (летит запрос с заголовками)';\n  setTimeout(()=>{\n    req.remove();\n    const res=document.createElement('div');res.className='net-packet res go-res';res.textContent='✓';\n    wire.appendChild(res);\n    log.textContent='← 200 OK  Content-Type: application/json  (сервер вернул данные)';\n    setTimeout(()=>res.remove(),1100);\n  },1050);\n}\n\n// ===== DATA PIPELINE (the payoff) =====\nconst pipeSteps=['ps-feat','ps-api','ps-zod','ps-store','ps-entity'];\nconst pipeLog=['feature: пользователь нажал «Загрузить»',\n  'shared/api: fetch летит на бэкенд',\n  'entities/model: zod валидирует ответ сервера',\n  'entities/model: zustand-стор обновляется',\n  'widgets/ui: компонент перерисовался с новыми данными'];\nasync function runPipe(){\n  pipeSteps.forEach(id=>document.getElementById(id).classList.remove('lit'));\n  const logEl=document.getElementById('pipe-log');\n  for(let i=0;i<pipeSteps.length;i++){\n    document.getElementById(pipeSteps[i]).classList.add('lit');\n    logEl.textContent='› '+pipeLog[i];\n    await new Promise(r=>setTimeout(r,750));\n  }\n  logEl.textContent='✓ данные проехали весь путь — каждый слой сделал ровно свою работу';\n}\n\n// ===== FSD CAKE LAYER INFO =====\nconst CAKE={\n app:['app — самый верхний корж','Точка входа всего приложения. Тут роутер, глобальные провайдеры, подключение стора и стилей. Знает про всех, его не знает никто.'],\n pages:['pages — страницы','Каждая страница = один экран по адресу (/catalog, /cart). Сама почти ничего не делает: только собирает виджеты в композицию.'],\n widgets:['widgets — крупные блоки','Самостоятельные куски страницы: Header, ProductList, Sidebar. Склеивают несколько фич и сущностей в готовый блок.'],\n features:['features — действия пользователя','То, что юзер ДЕЛАЕТ: залогиниться, добавить в корзину, поставить лайк. Фича = одно осмысленное действие с его логикой и кнопкой.'],\n entities:['entities — бизнес-сущности','Ключевые объекты предметной области: User, Product, Order. Тут их карточки (ui), их сторы и типы (model), их запросы (api). Сердце данных.'],\n shared:['shared — фундамент','Код без привязки к бизнесу: ui-кит (Button, Input), базовый api-клиент, хелперы. Самый нижний корж — ни от кого не зависит, нужен всем.'],\n};\nfunction cakeInfo(id){\n  const [t,d]=CAKE[id];\n  document.getElementById('cake-detail').innerHTML='<div class=\"cd-t\">'+t+'</div>'+d;\n}\n\n// reveal on scroll\nconst io=new IntersectionObserver((es)=>es.forEach(e=>{if(e.isIntersecting)e.target.style.opacity=1;}),{threshold:.05});\nwindow.addEventListener('DOMContentLoaded',()=>{\n  showPage('net');\n  if(document.getElementById('store-state')) initStore();\n  if(document.getElementById('stx-detail')) pickStatus('200');\n});\n<\/script>\n</body>\n</html>", "backend": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Бэкенд · Express · SOLID · Слои · Postgres</title>\n<style>\n  @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;800&family=Nunito:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');\n  :root{\n    --bg:#120e15; --bg2:#1a121c; --card:#241823; --card2:#2f1f2d; --line:#43293c;\n    --ink:#f3e9ef; --muted:#b291a4;\n    --acc:#e23b50; --acc2:#ff7a5c; --acc3:#ff5470; --acc-deep:#b1283b;\n    --kyle:#d98b54; --maxi:#46b877; --ren:#9aa6c0;\n    --yellow:#f7df1e; --blue:#61afef; --react:#61dafb; --ts:#5aa6f0;\n    --purple:#c678dd; --green:#98c379; --orange:#e5a35a; --red:#e06c75; --cyan:#56b6c2;\n  }\n  *{box-sizing:border-box;margin:0;padding:0;}\n  html{scroll-behavior:smooth;}\n  body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;}\n  body::before{content:\"\";position:fixed;inset:0;z-index:0;pointer-events:none;\n    background-image:radial-gradient(circle, rgba(226,59,80,0.06) 1px, transparent 1px);background-size:34px 34px;}\n  .progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--acc-deep),var(--acc),var(--acc2));z-index:200;width:0;}\n\n  .topbar{position:sticky;top:0;z-index:100;background:rgba(18,14,21,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}\n  .topbar-inner{max-width:1040px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:16px;height:62px;}\n  .brand{font-family:'Unbounded',sans-serif;font-weight:700;font-size:15px;white-space:nowrap;color:var(--acc2);}\n  .brand b{color:var(--acc3);}\n  .tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none;}\n  .tabs::-webkit-scrollbar{display:none;}\n  .tab{font-family:'Nunito',sans-serif;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;\n    background:transparent;border:1px solid transparent;border-radius:10px;padding:8px 13px;color:var(--muted);transition:all .15s;}\n  .tab:hover{color:var(--ink);background:var(--card);}\n  .tab.active{color:var(--ink);background:var(--card2);border-color:var(--acc);}\n  .tab .n{font-family:'JetBrains Mono',monospace;font-size:11px;opacity:.6;margin-right:6px;color:var(--acc2);}\n\n  .wrap{max-width:1040px;margin:0 auto;padding:0 20px;position:relative;z-index:1;}\n  .page{display:none;animation:fade .4s;}\n  .page.active{display:block;}\n  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}\n\n  .phero{padding:46px 0 30px;bor padding:16px 20px 16px 54px;margin:22px 0;}\n  .qt::before{content:\"\\201C\";position:absolute;left:14px;top:2px;font-family:'Unbounded',serif;font-size:50px;line-height:1;color:var(--acc);opacity:.85;}\n  .qt .qt-text{font-size:16px;font-style:italic;color:#ecdde6;line-height:1.5;}\n  .qt .qt-author{margin-top:9px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--acc2);}\n  .qt .qt-author::before{content:\"— \";}\n\n  .ctrl-row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;}\n  .ctrl-row .gl{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);align-self:center;margin-right:2px;}\n\n  /* ===== EXPRESS API PLAYGROUND ===== */\n  .api{background:linear-gradient(160deg,#241723,#1a121c);border:1px solid var(--line);border-radius:16px;padding:18px;margin:20px 0;}\n  .api-head{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}\n  .verb{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12.5px;border:none;border-radius:8px;padding:7px 12px;cursor:pointer;color:#fff;transition:all .12s;}\n  .verb:hover{filter:brightness(1.12);transform:translateY(-1px);}\n  .verb.get{background:#3a9a5e;} .verb.post{background:#d6a13a;color:#2a1c00;} .verb.del{background:var(--acc);} .verb.bad{background:#6b5566;}\n  .api-out{background:#0e0a11;border:1px solid var(--line);border-radius:11px;padding:0;margin-top:12px;overflow:hidden;}\n  .api-req{font-family:'JetBrains Mono',monospace;font-size:13px;padding:11px 14px;border-bottom:1px solid var(--line);color:#cdbcca;background:#160e19;}\n  .api-trace{padding:10px 14px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--line);line-height:1.7;}\n  .api-trace .step{opacity:0;animation:traceIn .3s forwards;}\n  @keyframes traceIn{to{opacity:1;}}\n  .api-trace .ok{color:#7fce9e;} .api-trace .hit{color:var(--acc2);}\n  .api-resp{padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;white-space:pre-wrap;line-height:1.55;color:#cdbcca;max-height:280px;overflow:auto;}\n  .api-status{display:inline-block;font-weight:700;border-radius:6px;padding:2px 9px;margin-bottom:8px;font-size:12px;}\n  .api-status.s2{background:rgba(47,175,106,.18);color:#7fce9e;}\n  .api-status.s4{background:rgba(226,59,80,.18);color:#f0a4b0;}\n  .api-resp .k{color:var(--acc2);} .api-resp .v{color:var(--green);} .api-resp .num{color:var(--orange);}\n\n  /* ===== SQL PLAYGROUND ===== */\n  .sqlbox{background:linear-gradient(160deg,#241723,#1a121c);border:1px solid var(--line);border-radius:16px;padding:18px;margin:20px 0;}\n  .sqlbox textarea{width:100%;font-family:'JetBrains Mono',monospace;font-size:13px;background:#160e19;color:#cdbcca;border:1px solid var(--line);border-radius:10px;padding:12px;min-height:64px;resize:vertical;line-height:1.5;}\n  .sql-out{margin-top:12px;}\n  .sqltable{width:100%;border-collapse:collapse;font-family:'JetBrains Mono',monospace;font-size:12.5px;overflow:hidden;border-radius:10px;border:1px solid var(--line);}\n  .sqltable th{background:#2f1f2d;color:var(--acc2);text-align:left;padding:8px 12px;font-weight:700;border-bottom:1px solid var(--line);}\n  .sqltable td{padding:7px 12px;border-bottom:1px solid var(--line);color:#cdbcca;}\n  .sqltable tr:last-child td{border-bottom:none;}\n  .sqltable tr:nth-child(even) td{background:rgba(255,255,255,.02);}\n  .sql-meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);margin-top:8px;}\n  .sql-err{background:rgba(226,59,80,.1);border:1px solid rgba(226,59,80,.4);color:#f0a4b0;border-radius:10px;padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;white-space:pre-wrap;}\n\n  /* ===== LIBRARY CARDS ===== */\n  .libgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0;}\n  @media(max-width:600px){.libgrid{grid-template-columns:1fr;}}\n  .libcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;}\n  .libcard .ln{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;color:var(--acc2);}\n  .libcard .ld{font-size:13px;color:#c4b4c0;margin-top:4px;}\n\n  /* DB table schema viz */\n  .dbtable{display:inline-block;vertical-align:top;background:#160e19;border:1px solid var(--line);border-radius:12px;margin:8px 10px 8px 0;min-width:180px;overflow:hidden;}\n  .dbtable .tt{background:#3a72b8;color:#fff;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;padding:8px 12px;}\n  .dbtable .col{font-family:'JetBrains Mono',monospace;font-size:12px;padding:6px 12px;color:#c4b4c0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;}\n  .dbtable .col:last-child{border-bottom:none;}\n  .dbtable .col .ty{color:var(--muted);} .dbtable .col .pk{color:var(--orange);font-size:10px;}\n</style>\n</head>\n<body>\n<div class=\"progress\" id=\"prog\"></div>\n<div class=\"topbar\"><div class=\"topbar-inner\">\n  <div class=\"brand\">SERVER<b>·</b>SIDE</div>\n  <div class=\"tabs\" id=\"tabs\"><button class=\"tab active\" data-page=\"intro\"><span class=\"n\">01</span>Бэкенд</button><button class=\"tab\" data-page=\"routing\"><span class=\"n\">02</span>Роутинг</button><button class=\"tab\" data-page=\"solid\"><span class=\"n\">03</span>SOLID</button><button class=\"tab\" data-page=\"layers\"><span class=\"n\">04</span>Слои</button><button class=\"tab\" data-page=\"db\"><span class=\"n\">05</span>Postgres</button></div>\n</div></div>\n<div class=\"wrap\"><div id=\"PAGES\">\n<div class=\"page active\" id=\"page-intro\"><div class=\"phero\"><div class=\"kicker\">Раздел 01 · Бэкенд</div><h1>Что такое бэкенд и первый сервер</h1><p>Фронт ты уже трогал. Теперь вторая половина: код, который живёт на сервере, держит бизнес-логику и базу данных, и с которым фронт переписывается по HTTP. Поднимем сервер на Express и разберём, кто кому что отвечает.</p></div><div class=\"say kyle\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"kFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#b87a48\"/><stop offset=\"100%\" stop-color=\"#9a6238\"/></linearGradient><radialGradient id=\"kCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#e8957a\" stop-opacity=\"0.5\"/><stop offset=\"100%\" stop-color=\"#e8957a\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"58\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"142\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"64\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><ellipse cx=\"136\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><path d=\"M68 58 Q60 22 88 44 Q80 56 72 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M132 58 Q140 22 112 44 Q120 56 128 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M71 54 Q67 36 82 48 Z\" fill=\"#3a3230\"/><path d=\"M129 54 Q133 36 118 48 Z\" fill=\"#3a3230\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#kFur__U)\"/><path d=\"M100 56 Q62 62 60 104 Q100 92 140 104 Q138 62 100 56 Z\" fill=\"#e8cfa8\"/><ellipse cx=\"100\" cy=\"98\" rx=\"40\" ry=\"30\" fill=\"#ecd6b4\"/><ellipse cx=\"100\" cy=\"116\" rx=\"30\" ry=\"24\" fill=\"#f2e1c8\"/><ellipse cx=\"72\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"128\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"100\" cy=\"106\" rx=\"9\" ry=\"7\" fill=\"#3a2a26\"/><ellipse cx=\"97\" cy=\"104\" rx=\"3\" ry=\"2\" fill=\"#5a4a44\" opacity=\"0.7\"/><ellipse cx=\"80\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><ellipse cx=\"120\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><circle cx=\"81\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"119\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"81\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"119\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"84\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"122\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"77\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"115\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M88 120 Q100 130 112 120\" stroke=\"#7a5238\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M74 142 Q100 154 126 142\" stroke=\"#9a4030\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"100\" cy=\"151\" r=\"7\" fill=\"#f0c44e\"/><circle cx=\"100\" cy=\"153\" r=\"1.8\" fill=\"#9a7a1a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Кайл</div><p>Дорогие студенты-Яндексоиды, переходим на тёмную сторону — на сервер. Тут нет кнопок и анимаций. Тут данные, правила и ответственность. Зато именно тут решается, что фронту вообще можно показывать.</p></div></div><section><div class=\"sec-num\">01 · ЗАЧЕМ ОН НУЖЕН</div><h2>Чему нельзя доверять браузеру</h2><p class=\"lead\">Бэкенд — это код, которому можно верить. Браузер у пользователя, его можно вскрыть и подправить. Сервер у тебя.</p><p>Поэтому на бэке живёт всё, что нельзя отдавать клиенту: проверка прав, цены и скидки, доступ к базе, пароли, платежи. Фронт красивый, но наивный: он просто рисует то, что прислал сервер. Решения принимает сервер.</p><ul class=\"plain\"><li><strong>Бизнес-логика</strong> — правила: можно ли забронировать этот слот, хватает ли денег.</li><li><strong>База данных</strong> — единственный источник правды, фронт к ней напрямую не лезет.</li><li><strong>Безопасность</strong> — аутентификация, права, валидация входных данных.</li></ul><div class=\"box warn\"><div class=\"bt\">Золотое правило</div><p>Никогда не доверяй данным с фронта. Цену, роль юзера, id владельца — всё перепроверяй на сервере. Клиент может прислать что угодно, включая то, что ты не предусмотрел.</p></div></section><section><div class=\"sec-num\">02 · СВЯЗЬ С ФРОНТОМ</div><h2>Та же переписка по HTTP</h2><p>Помнишь цикл «запрос → ответ» из лекции про дату? Вот он с другой стороны. Фронт шлёт HTTP-запрос на твой сервер, сервер думает, лезет в базу и возвращает JSON. Бэкенд — это тот, кто отвечает на том конце провода.</p><div class=\"net\"><div class=\"net-stage\"><div class=\"net-node\"><div class=\"nbox\">🧑‍💻</div><div class=\"nlbl\">Фронтенд<br>(React)</div></div><div class=\"net-wire\" id=\"net-wire\"></div><div class=\"net-node\"><div class=\"nbox\">⚙️</div><div class=\"nlbl\">Express<br>сервер</div></div></div><div class=\"net-log\" id=\"net-log\">нажми — фронт отправит запрос на бэк</div><div style=\"text-align:center;margin-top:14px;\"><button class=\"minibtn\" onclick=\"flyPacket()\">▶ Запрос с фронта</button></div></div><div class=\"say ren\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"rFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#8893ab\"/><stop offset=\"100%\" stop-color=\"#6e7a94\"/></linearGradient></defs><circle cx=\"70\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"130\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"70\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"130\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"100\" cy=\"102\" r=\"50\" fill=\"url(#rFur__U)\"/><ellipse cx=\"100\" cy=\"116\" rx=\"38\" ry=\"30\" fill=\"#e6eaf2\"/><ellipse cx=\"100\" cy=\"120\" rx=\"30\" ry=\"22\" fill=\"#eef1f7\"/><ellipse cx=\"100\" cy=\"110\" rx=\"11\" ry=\"8\" fill=\"#3e3e48\"/><ellipse cx=\"96\" cy=\"108\" rx=\"3\" ry=\"2\" fill=\"#5e5e68\" opacity=\"0.7\"/><path d=\"M100 117 L100 126\" stroke=\"#3e3e48\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><circle cx=\"120\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><path d=\"M96 94 Q100 90 104 94\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" fill=\"none\"/><circle cx=\"80\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"120\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"83\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"123\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"77\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><circle cx=\"117\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><path d=\"M72 88 Q78 84 84 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M112 88 Q118 84 124 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M78 116 Q60 114 52 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M78 122 Q60 124 54 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 116 Q140 114 148 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 122 Q140 124 146 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M90 124 Q100 131 110 124\" stroke=\"#525c70\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Рен</div><p>Контракт между ними — это API: набор адресов и форматов. GET /api/bookings вернёт список, POST /api/bookings создаст бронь. Фронт и бэк могут писать разные люди на разных языках — лишь бы соблюдали этот контракт.</p></div></div></section><section><div class=\"sec-num\">03 · ПЕРВЫЙ СЕРВЕР</div><h2>Express за пять строк</h2><p>Node.js позволяет запускать JavaScript вне браузера. Express — лёгкий фреймворк поверх него, который превращает «слушать порт и разбирать HTTP» в пару понятных строк.</p><div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">server.js</span></div>\n  <pre><code><span class=\"tk\">const</span> <span class=\"tx\">express</span> <span class=\"to\">=</span> <span class=\"tf\">require</span><span class=\"tx\">(</span><span class=\"ts2\">'express'</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tk\">const</span> <span class=\"tx\">app</span> <span class=\"to\">=</span> <span class=\"tf\">express</span><span class=\"tx\">(</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n\n<span class=\"tx\">app</span><span class=\"tx\">.</span><span class=\"tf\">use</span><span class=\"tx\">(</span><span class=\"tx\">express</span><span class=\"tx\">.</span><span class=\"tf\">json</span><span class=\"tx\">(</span><span class=\"tx\">)</span><span class=\"tx\">)</span><span class=\"tx\">;</span>          <span class=\"tc\">// понимать JSON в теле запросов</span>\n\n<span class=\"tc\">// маршрут: на GET /health отвечаем, что живы</span>\n<span class=\"tx\">app</span><span class=\"tx\">.</span><span class=\"tk\">get</span><span class=\"tx\">(</span><span class=\"ts2\">'/health'</span><span class=\"tx\">,</span> <span class=\"tx\">(</span><span class=\"tx\">req</span><span class=\"tx\">,</span> <span class=\"tx\">res</span><span class=\"tx\">)</span> <span class=\"to\">=&gt;</span> <span class=\"tx\">{</span>\n  <span class=\"tx\">res</span><span class=\"tx\">.</span><span class=\"tf\">status</span><span class=\"tx\">(</span><span class=\"tn\">200</span><span class=\"tx\">)</span><span class=\"tx\">.</span><span class=\"tf\">json</span><span class=\"tx\">(</span><span class=\"tx\">{</span> <span class=\"tx\">status</span><span class=\"to\">:</span> <span class=\"ts2\">'ok'</span> <span class=\"tx\">}</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">}</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n\n<span class=\"tx\">app</span><span class=\"tx\">.</span><span class=\"tf\">listen</span><span class=\"tx\">(</span><span class=\"tn\">3000</span><span class=\"tx\">,</span> <span class=\"tx\">(</span><span class=\"tx\">)</span> <span class=\"to\">=&gt;</span> <span class=\"tx\">{</span>\n  <span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"ts2\">'Сервер слушает http://localhost:3000'</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">}</span><span class=\"tx\">)</span><span class=\"tx\">;</span></code></pre>\n</div><div class=\"say maxi\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"mFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#46b877\"/><stop offset=\"100%\" stop-color=\"#359a5e\"/></linearGradient><radialGradient id=\"mCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#f0a890\" stop-opacity=\"0.45\"/><stop offset=\"100%\" stop-color=\"#f0a890\" stop-opacity=\"0\"/></radialGradient></defs><path d=\"M66 56 Q56 18 90 42 Q80 54 72 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M134 56 Q144 18 110 42 Q120 54 128 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M70 50 Q64 30 82 44 Z\" fill=\"#1f1f1f\"/><path d=\"M130 50 Q136 30 118 44 Z\" fill=\"#1f1f1f\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#mFur__U)\"/><path d=\"M100 64 Q66 72 70 112 Q100 128 130 112 Q134 72 100 64 Z\" fill=\"#f2f6f2\"/><ellipse cx=\"100\" cy=\"104\" rx=\"34\" ry=\"26\" fill=\"#f7faf7\"/><ellipse cx=\"74\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"126\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"100\" cy=\"108\" rx=\"6.5\" ry=\"5\" fill=\"#2a2a2a\"/><path d=\"M100 113 L100 120\" stroke=\"#2a2a2a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><ellipse cx=\"82\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><ellipse cx=\"118\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><circle cx=\"83\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"117\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"83\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"117\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"86\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"120\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"79\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"113\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M90 119 Q100 127 110 119\" stroke=\"#1f5a32\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M97 124 Q100 129 103 124 Z\" fill=\"#e87a8a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Макси</div><p>Вся суть тут: app слушает порт, на каждый запрос подбирает обработчик по методу и пути, и тот зовёт res.json(). Ниже — та же логика обработчика чистым JS, её можно запустить прямо здесь.</p></div></div><div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">handler.js</span><button class=\"runbtn\" onclick=\"runJS(this)\" data-src=\"%2F%2F%20%D0%B2%20%D0%BF%D0%B0%D0%BC%D1%8F%D1%82%D0%B8%20%D1%81%D0%B5%D1%80%D0%B2%D0%B5%D1%80%D0%B0%20%D0%BB%D0%B5%D0%B6%D0%B0%D1%82%20%D0%B1%D1%80%D0%BE%D0%BD%D0%B8%20%28%D0%BF%D0%BE%D1%82%D0%BE%D0%BC%20%D1%8D%D1%82%D0%BE%20%D0%B1%D1%83%D0%B4%D0%B5%D1%82%20%D0%91%D0%94%29%0Aconst%20bookings%20%3D%20%5B%0A%20%20%7B%20id%3A%201%2C%20court%3A%203%2C%20time%3A%20%2709%3A00%27%20%7D%2C%0A%20%20%7B%20id%3A%202%2C%20court%3A%201%2C%20time%3A%20%2712%3A00%27%20%7D%2C%0A%5D%3B%0A%0A%2F%2F%20%D0%BE%D0%B1%D1%80%D0%B0%D0%B1%D0%BE%D1%82%D1%87%D0%B8%D0%BA%20GET%20%2Fbookings%20%E2%80%94%20%D1%87%D0%B8%D1%81%D1%82%D0%B0%D1%8F%20%D1%84%D1%83%D0%BD%D0%BA%D1%86%D0%B8%D1%8F%3A%20%D0%BD%D0%B0%20%D0%B2%D1%85%D0%BE%D0%B4%D0%B5%20%D0%B7%D0%B0%D0%BF%D1%80%D0%BE%D1%81%2C%20%D0%BD%D0%B0%20%D0%B2%D1%8B%D1%85%D0%BE%D0%B4%D0%B5%20%D0%BE%D1%82%D0%B2%D0%B5%D1%82%0Afunction%20getBookings%28%29%20%7B%0A%20%20return%20%7B%20status%3A%20200%2C%20body%3A%20bookings%20%7D%3B%0A%7D%0A%0Aconst%20response%20%3D%20getBookings%28%29%3B%0Aconsole.log%28%27status%3A%27%2C%20response.status%29%3B%0Aconsole.log%28%27body%3A%27%2C%20response.body%29%3B\"><span>▶</span><span class=\"rlabel\">Запустить</span></button></div>\n  <pre><code><span class=\"tc\">// в памяти сервера лежат брони (потом это будет БД)</span>\n<span class=\"tk\">const</span> <span class=\"tx\">bookings</span> <span class=\"to\">=</span> <span class=\"tx\">[</span>\n  <span class=\"tx\">{</span> <span class=\"tx\">id</span><span class=\"to\">:</span> <span class=\"tn\">1</span><span class=\"tx\">,</span> <span class=\"tx\">court</span><span class=\"to\">:</span> <span class=\"tn\">3</span><span class=\"tx\">,</span> <span class=\"tx\">time</span><span class=\"to\">:</span> <span class=\"ts2\">'09:00'</span> <span class=\"tx\">}</span><span class=\"tx\">,</span>\n  <span class=\"tx\">{</span> <span class=\"tx\">id</span><span class=\"to\">:</span> <span class=\"tn\">2</span><span class=\"tx\">,</span> <span class=\"tx\">court</span><span class=\"to\">:</span> <span class=\"tn\">1</span><span class=\"tx\">,</span> <span class=\"tx\">time</span><span class=\"to\">:</span> <span class=\"ts2\">'12:00'</span> <span class=\"tx\">}</span><span class=\"tx\">,</span>\n<span class=\"tx\">]</span><span class=\"tx\">;</span>\n\n<span class=\"tc\">// обработчик GET /bookings — чистая функция: на входе запрос, на выходе ответ</span>\n<span class=\"tk\">function</span> <span class=\"tf\">getBookings</span><span class=\"tx\">(</span><span class=\"tx\">)</span> <span class=\"tx\">{</span>\n  <span class=\"tk\">return</span> <span class=\"tx\">{</span> <span class=\"tx\">status</span><span class=\"to\">:</span> <span class=\"tn\">200</span><span class=\"tx\">,</span> <span class=\"tx\">body</span><span class=\"to\">:</span> <span class=\"tx\">bookings</span> <span class=\"tx\">}</span><span class=\"tx\">;</span>\n<span class=\"tx\">}</span>\n\n<span class=\"tk\">const</span> <span class=\"tx\">response</span> <span class=\"to\">=</span> <span class=\"tf\">getBookings</span><span class=\"tx\">(</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"ts2\">'status:'</span><span class=\"tx\">,</span> <span class=\"tx\">response</span><span class=\"tx\">.</span><span class=\"tx\">status</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"ts2\">'body:'</span><span class=\"tx\">,</span> <span class=\"tx\">response</span><span class=\"tx\">.</span><span class=\"tx\">body</span><span class=\"tx\">)</span><span class=\"tx\">;</span></code></pre>\n  <div class=\"console\"><div class=\"console-inner\"><div class=\"console-label\">console</div></div></div>\n</div><div class=\"qt\"><div class=\"qt-text\">Бэкенд — это место, где «у меня на машине работает» наконец-то правда, потому что машина одна и она твоя.</div><div class=\"qt-author\">девелоперский фольклор</div></div></section><div class=\"pager\"><button onclick=\"pager(1)\" class=\"next\">Дальше: роутинг и запросы →</button></div></div>\n<div class=\"page\" id=\"page-routing\"><div class=\"phero\"><div class=\"kicker\">Раздел 02 · Роутинг</div><h1>Маршруты и обработка запросов</h1><p>Сервер должен понимать, какой запрос куда вести. Это роутинг: метод + путь → обработчик. Разберём req/res, параметры, middleware, и поднимем живой мок-API, который реально отвечает на кнопки.</p></div><div class=\"say kyle\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"kFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#b87a48\"/><stop offset=\"100%\" stop-color=\"#9a6238\"/></linearGradient><radialGradient id=\"kCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#e8957a\" stop-opacity=\"0.5\"/><stop offset=\"100%\" stop-color=\"#e8957a\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"58\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"142\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"64\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><ellipse cx=\"136\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><path d=\"M68 58 Q60 22 88 44 Q80 56 72 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M132 58 Q140 22 112 44 Q120 56 128 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M71 54 Q67 36 82 48 Z\" fill=\"#3a3230\"/><path d=\"M129 54 Q133 36 118 48 Z\" fill=\"#3a3230\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#kFur__U)\"/><path d=\"M100 56 Q62 62 60 104 Q100 92 140 104 Q138 62 100 56 Z\" fill=\"#e8cfa8\"/><ellipse cx=\"100\" cy=\"98\" rx=\"40\" ry=\"30\" fill=\"#ecd6b4\"/><ellipse cx=\"100\" cy=\"116\" rx=\"30\" ry=\"24\" fill=\"#f2e1c8\"/><ellipse cx=\"72\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"128\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"100\" cy=\"106\" rx=\"9\" ry=\"7\" fill=\"#3a2a26\"/><ellipse cx=\"97\" cy=\"104\" rx=\"3\" ry=\"2\" fill=\"#5a4a44\" opacity=\"0.7\"/><ellipse cx=\"80\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><ellipse cx=\"120\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><circle cx=\"81\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"119\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"81\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"119\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"84\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"122\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"77\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"115\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M88 120 Q100 130 112 120\" stroke=\"#7a5238\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M74 142 Q100 154 126 142\" stroke=\"#9a4030\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"100\" cy=\"151\" r=\"7\" fill=\"#f0c44e\"/><circle cx=\"100\" cy=\"153\" r=\"1.8\" fill=\"#9a7a1a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Кайл</div><p>Роутинг — это диспетчерская. Пришёл запрос, смотрим: какой метод, какой путь, и отправляем нужному обработчику. Не нашли подходящий — отвечаем 404. Всё.</p></div></div><section><div class=\"sec-num\">01 · МАРШРУТ</div><h2>Метод + путь → обработчик</h2><p class=\"lead\">Один маршрут = глагол (метод) + адрес (путь) + функция, которая на это отвечает.</p><p>Двоеточие в пути — это <strong>параметр</strong>. <code>/bookings/:id</code> ловит и <code>/bookings/1</code>, и <code>/bookings/42</code>, а само значение кладёт в <code>req.params.id</code>.</p><div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">routes.js</span></div>\n  <pre><code><span class=\"tx\">app</span><span class=\"tx\">.</span><span class=\"tk\">get</span><span class=\"tx\">(</span><span class=\"ts2\">'/bookings'</span><span class=\"tx\">,</span>     <span class=\"tx\">getAllBookings</span><span class=\"tx\">)</span><span class=\"tx\">;</span>    <span class=\"tc\">// список</span>\n<span class=\"tx\">app</span><span class=\"tx\">.</span><span class=\"tk\">get</span><span class=\"tx\">(</span><span class=\"ts2\">'/bookings/:id'</span><span class=\"tx\">,</span> <span class=\"tx\">getBookingById</span><span class=\"tx\">)</span><span class=\"tx\">;</span>   <span class=\"tc\">// одна бронь по id</span>\n<span class=\"tx\">app</span><span class=\"tx\">.</span><span class=\"tf\">post</span><span class=\"tx\">(</span><span class=\"ts2\">'/bookings'</span><span class=\"tx\">,</span>    <span class=\"tx\">createBooking</span><span class=\"tx\">)</span><span class=\"tx\">;</span>     <span class=\"tc\">// создать</span>\n<span class=\"tx\">app</span><span class=\"tx\">.</span><span class=\"tf\">delete</span><span class=\"tx\">(</span><span class=\"ts2\">'/bookings/:id'</span><span class=\"tx\">,</span> <span class=\"tx\">deleteBooking</span><span class=\"tx\">)</span><span class=\"tx\">;</span>  <span class=\"tc\">// удалить</span>\n\n<span class=\"tc\">// внутри обработчика достаём данные запроса:</span>\n<span class=\"tk\">function</span> <span class=\"tf\">getBookingById</span><span class=\"tx\">(</span><span class=\"tx\">req</span><span class=\"tx\">,</span> <span class=\"tx\">res</span><span class=\"tx\">)</span> <span class=\"tx\">{</span>\n  <span class=\"tk\">const</span> <span class=\"tx\">id</span> <span class=\"to\">=</span> <span class=\"tx\">req</span><span class=\"tx\">.</span><span class=\"tx\">params</span><span class=\"tx\">.</span><span class=\"tx\">id</span><span class=\"tx\">;</span>        <span class=\"tc\">// из пути /bookings/:id</span>\n  <span class=\"tk\">const</span> <span class=\"tx\">sort</span> <span class=\"to\">=</span> <span class=\"tx\">req</span><span class=\"tx\">.</span><span class=\"tx\">query</span><span class=\"tx\">.</span><span class=\"tx\">sort</span><span class=\"tx\">;</span>     <span class=\"tc\">// из ?sort=time</span>\n  <span class=\"tc\">// ... найти и вернуть</span>\n  <span class=\"tx\">res</span><span class=\"tx\">.</span><span class=\"tf\">status</span><span class=\"tx\">(</span><span class=\"tn\">200</span><span class=\"tx\">)</span><span class=\"tx\">.</span><span class=\"tf\">json</span><span class=\"tx\">(</span><span class=\"tx\">booking</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">}</span></code></pre>\n</div><div class=\"box info\"><div class=\"bt\">req и res</div><p>req — это входящий запрос: params (из пути), query (из ?строки), body (тело POST), headers. res — твой ответ: res.status(код).json(данные). Вся обработка крутится вокруг этих двух объектов.</p></div></section><section><div class=\"sec-num\">02 · MIDDLEWARE</div><h2>Конвейер перед обработчиком</h2><p>Middleware — это функции, через которые запрос проходит <strong>по дороге</strong> к обработчику. Каждая может что-то проверить, дополнить или зарубить. Вызвал <code>next()</code> — поехали дальше, не вызвал — запрос застрял (например, отказ по правам).</p><div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">middleware.js</span></div>\n  <pre><code><span class=\"tc\">// логируем каждый запрос</span>\n<span class=\"tx\">app</span><span class=\"tx\">.</span><span class=\"tf\">use</span><span class=\"tx\">(</span><span class=\"tx\">(</span><span class=\"tx\">req</span><span class=\"tx\">,</span> <span class=\"tx\">res</span><span class=\"tx\">,</span> <span class=\"tx\">next</span><span class=\"tx\">)</span> <span class=\"to\">=&gt;</span> <span class=\"tx\">{</span>\n  <span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"ts2\">`${req.method} ${req.url}`</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n  <span class=\"tf\">next</span><span class=\"tx\">(</span><span class=\"tx\">)</span><span class=\"tx\">;</span>                          <span class=\"tc\">// пропускаем дальше по конвейеру</span>\n<span class=\"tx\">}</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n\n<span class=\"tc\">// пускаем дальше только с валидным токеном</span>\n<span class=\"tk\">function</span> <span class=\"tf\">auth</span><span class=\"tx\">(</span><span class=\"tx\">req</span><span class=\"tx\">,</span> <span class=\"tx\">res</span><span class=\"tx\">,</span> <span class=\"tx\">next</span><span class=\"tx\">)</span> <span class=\"tx\">{</span>\n  <span class=\"tk\">if</span> <span class=\"tx\">(</span><span class=\"to\">!</span><span class=\"tx\">req</span><span class=\"tx\">.</span><span class=\"tx\">headers</span><span class=\"tx\">.</span><span class=\"tx\">authorization</span><span class=\"tx\">)</span> <span class=\"tx\">{</span>\n    <span class=\"tk\">return</span> <span class=\"tx\">res</span><span class=\"tx\">.</span><span class=\"tf\">status</span><span class=\"tx\">(</span><span class=\"tn\">401</span><span class=\"tx\">)</span><span class=\"tx\">.</span><span class=\"tf\">json</span><span class=\"tx\">(</span><span class=\"tx\">{</span> <span class=\"tx\">error</span><span class=\"to\">:</span> <span class=\"ts2\">'нужен токен'</span> <span class=\"tx\">}</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n  <span class=\"tx\">}</span>\n  <span class=\"tf\">next</span><span class=\"tx\">(</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">}</span>\n\n<span class=\"tx\">app</span><span class=\"tx\">.</span><span class=\"tk\">get</span><span class=\"tx\">(</span><span class=\"ts2\">'/bookings'</span><span class=\"tx\">,</span> <span class=\"tx\">auth</span><span class=\"tx\">,</span> <span class=\"tx\">getAllBookings</span><span class=\"tx\">)</span><span class=\"tx\">;</span>  <span class=\"tc\">// auth сработает ДО обработчика</span></code></pre>\n</div><div class=\"say ren\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"rFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#8893ab\"/><stop offset=\"100%\" stop-color=\"#6e7a94\"/></linearGradient></defs><circle cx=\"70\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"130\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"70\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"130\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"100\" cy=\"102\" r=\"50\" fill=\"url(#rFur__U)\"/><ellipse cx=\"100\" cy=\"116\" rx=\"38\" ry=\"30\" fill=\"#e6eaf2\"/><ellipse cx=\"100\" cy=\"120\" rx=\"30\" ry=\"22\" fill=\"#eef1f7\"/><ellipse cx=\"100\" cy=\"110\" rx=\"11\" ry=\"8\" fill=\"#3e3e48\"/><ellipse cx=\"96\" cy=\"108\" rx=\"3\" ry=\"2\" fill=\"#5e5e68\" opacity=\"0.7\"/><path d=\"M100 117 L100 126\" stroke=\"#3e3e48\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><circle cx=\"120\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><path d=\"M96 94 Q100 90 104 94\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" fill=\"none\"/><circle cx=\"80\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"120\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"83\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"123\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"77\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><circle cx=\"117\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><path d=\"M72 88 Q78 84 84 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M112 88 Q118 84 124 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M78 116 Q60 114 52 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M78 122 Q60 124 54 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 116 Q140 114 148 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 122 Q140 124 146 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M90 124 Q100 131 110 124\" stroke=\"#525c70\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Рен</div><p>Порядок middleware = порядок конвейера. express.json() парсит тело, логгер пишет, auth проверяет права, и только потом обработчик. Ошибку ловит специальный error-middleware в самом конце. Это тот же принцип, что цепочка .filter().map() — данные текут через звенья.</p></div></div></section><section><div class=\"sec-num\">03 · ПЕСОЧНИЦА</div><h2>Живой мок Express-API</h2><p>Ниже — настоящий мини-сервер прямо в браузере: роутер, обработчики, данные в памяти. Жми кнопки — это реальные запросы к моку. Увидишь, какой маршрут совпал, через какие слои прошёл запрос и что вернулось (статус + JSON). POST добавляет бронь, DELETE удаляет, кривой путь даёт 404.</p><div class=\"api\"><div class=\"api-head\">mock express · POST добавляет, DELETE удаляет, /oops → 404</div><div class=\"ctrl-row\"><button class=\"verb get\" onclick=\"apiSend('GET','/bookings')\">GET /bookings</button><button class=\"verb get\" onclick=\"apiSend('GET','/bookings/1')\">GET /bookings/1</button><button class=\"verb bad\" onclick=\"apiSend('GET','/bookings/99')\">GET /bookings/99</button><button class=\"verb post\" onclick=\"apiSend('POST','/bookings')\">POST /bookings</button><button class=\"verb del\" onclick=\"apiSend('DELETE','/bookings/1')\">DELETE /bookings/1</button><button class=\"verb bad\" onclick=\"apiSend('GET','/oops')\">GET /oops</button><button class=\"minibtn ghost\" onclick=\"apiReset()\">reset</button></div><div class=\"api-out\" id=\"api-out\"></div></div><div class=\"meme-row\"><span class=\"meme\"><span class=\"mava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"mFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#46b877\"/><stop offset=\"100%\" stop-color=\"#359a5e\"/></linearGradient><radialGradient id=\"mCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#f0a890\" stop-opacity=\"0.45\"/><stop offset=\"100%\" stop-color=\"#f0a890\" stop-opacity=\"0\"/></radialGradient></defs><path d=\"M66 56 Q56 18 90 42 Q80 54 72 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M134 56 Q144 18 110 42 Q120 54 128 58 Z\" fill=\"url(#mFur__U)\"/><path d=\"M70 50 Q64 30 82 44 Z\" fill=\"#1f1f1f\"/><path d=\"M130 50 Q136 30 118 44 Z\" fill=\"#1f1f1f\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#mFur__U)\"/><path d=\"M100 64 Q66 72 70 112 Q100 128 130 112 Q134 72 100 64 Z\" fill=\"#f2f6f2\"/><ellipse cx=\"100\" cy=\"104\" rx=\"34\" ry=\"26\" fill=\"#f7faf7\"/><ellipse cx=\"74\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"126\" cy=\"108\" rx=\"12\" ry=\"9\" fill=\"url(#mCheek__U)\"/><ellipse cx=\"100\" cy=\"108\" rx=\"6.5\" ry=\"5\" fill=\"#2a2a2a\"/><path d=\"M100 113 L100 120\" stroke=\"#2a2a2a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><ellipse cx=\"82\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><ellipse cx=\"118\" cy=\"96\" rx=\"12\" ry=\"14\" fill=\"#fff\"/><circle cx=\"83\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"117\" cy=\"98\" r=\"8.5\" fill=\"#e8a020\"/><circle cx=\"83\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"117\" cy=\"98\" r=\"4.5\" fill=\"#3a2400\"/><circle cx=\"86\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"120\" cy=\"93\" r=\"3.2\" fill=\"#fff\"/><circle cx=\"79\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"113\" cy=\"100\" r=\"1.6\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M90 119 Q100 127 110 119\" stroke=\"#1f5a32\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M97 124 Q100 129 103 124 Z\" fill=\"#e87a8a\"/></svg></span>404 — это не баг сервера, это сервер вежливо говорит «такого адреса у меня нет»</span></div></section><div class=\"pager\"><button onclick=\"pager(-1)\">← Бэкенд</button><button onclick=\"pager(1)\" class=\"next\">Дальше: SOLID →</button></div></div>\n<div class=\"page\" id=\"page-solid\"><div class=\"phero\"><div class=\"kicker\">Раздел 03 · SOLID</div><h1>SOLID: пять правил, чтобы код не сгнил</h1><p>Сервер живёт годами и его правят десятки людей. SOLID — пять принципов, которые держат код гибким и не дают ему превратиться в один гигантский класс, который страшно трогать. Разберём каждый на бэкенд-примере.</p></div><div class=\"say kyle\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"kFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#b87a48\"/><stop offset=\"100%\" stop-color=\"#9a6238\"/></linearGradient><radialGradient id=\"kCheek__U\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\"><stop offset=\"0%\" stop-color=\"#e8957a\" stop-opacity=\"0.5\"/><stop offset=\"100%\" stop-color=\"#e8957a\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"58\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"142\" cy=\"115\" rx=\"26\" ry=\"32\" fill=\"#6e4426\"/><ellipse cx=\"64\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><ellipse cx=\"136\" cy=\"90\" rx=\"22\" ry=\"26\" fill=\"#6e4426\"/><path d=\"M68 58 Q60 22 88 44 Q80 56 72 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M132 58 Q140 22 112 44 Q120 56 128 60 Z\" fill=\"url(#kFur__U)\"/><path d=\"M71 54 Q67 36 82 48 Z\" fill=\"#3a3230\"/><path d=\"M129 54 Q133 36 118 48 Z\" fill=\"#3a3230\"/><circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"url(#kFur__U)\"/><path d=\"M100 56 Q62 62 60 104 Q100 92 140 104 Q138 62 100 56 Z\" fill=\"#e8cfa8\"/><ellipse cx=\"100\" cy=\"98\" rx=\"40\" ry=\"30\" fill=\"#ecd6b4\"/><ellipse cx=\"100\" cy=\"116\" rx=\"30\" ry=\"24\" fill=\"#f2e1c8\"/><ellipse cx=\"72\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"128\" cy=\"112\" rx=\"13\" ry=\"10\" fill=\"url(#kCheek__U)\"/><ellipse cx=\"100\" cy=\"106\" rx=\"9\" ry=\"7\" fill=\"#3a2a26\"/><ellipse cx=\"97\" cy=\"104\" rx=\"3\" ry=\"2\" fill=\"#5a4a44\" opacity=\"0.7\"/><ellipse cx=\"80\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><ellipse cx=\"120\" cy=\"94\" rx=\"13\" ry=\"15\" fill=\"#fff\"/><circle cx=\"81\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"119\" cy=\"96\" r=\"9.5\" fill=\"#4a90d9\"/><circle cx=\"81\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"119\" cy=\"96\" r=\"5\" fill=\"#1a2f4a\"/><circle cx=\"84\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"122\" cy=\"91\" r=\"3.5\" fill=\"#fff\"/><circle cx=\"77\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><circle cx=\"115\" cy=\"98\" r=\"1.8\" fill=\"#fff\" opacity=\"0.8\"/><path d=\"M88 120 Q100 130 112 120\" stroke=\"#7a5238\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M74 142 Q100 154 126 142\" stroke=\"#9a4030\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"100\" cy=\"151\" r=\"7\" fill=\"#f0c44e\"/><circle cx=\"100\" cy=\"153\" r=\"1.8\" fill=\"#9a7a1a\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Кайл</div><p>SOLID звучит как заклинание, но за каждой буквой простая мысль. Тыкай буквы — расскажу по одной. Главная из них для нас — последняя, D, на ней держится слоистая архитектура.</p></div></div><section><div class=\"sec-num\">01 · ПЯТЬ ПРИНЦИПОВ</div><h2>Тыкай букву</h2><div class=\"stx\"><div class=\"stx-chips\"><button class=\"stx-chip\" data-code=\"S\" onclick=\"pickSolid('S')\">S</button><button class=\"stx-chip\" data-code=\"O\" onclick=\"pickSolid('O')\">O</button><button class=\"stx-chip\" data-code=\"L\" onclick=\"pickSolid('L')\">L</button><button class=\"stx-chip\" data-code=\"I\" onclick=\"pickSolid('I')\">I</button><button class=\"stx-chip\" data-code=\"D\" onclick=\"pickSolid('D')\">D</button></div><div class=\"stx-detail\" id=\"stx-detail\"></div></div></section><section><div class=\"sec-num\">02 · НА ПРАКТИКЕ</div><h2>Божественный объект против разделения</h2><p>Самое частое нарушение у новичков — <strong>God Object</strong>: один класс делает всё. Принимает запрос, считает логику, лезет в базу. Поменялась БД — лезешь в тот же файл, где бизнес-логика. Поменялось правило — туда же. Всё спутано.</p><div class=\"cmp\"><div class=\"ch a\">разделено (S + D) ✓</div><div class=\"ch b\">God Object ✗</div><div class=\"cc\">// контроллер — только HTTP\n// сервис — только логика\n// репозиторий — только БД\n\nкаждый меняется\nпо своей причине</div><div class=\"cc\">class BookingController {\n  handle(req, res) {\n    // парсит запрос\n    // считает цену\n    // пишет SQL\n    // шлёт письмо\n  } // всё в куче\n}</div></div><div class=\"say ren\"><div class=\"ava\"><svg viewBox=\"0 0 200 165\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"rFur__U\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#8893ab\"/><stop offset=\"100%\" stop-color=\"#6e7a94\"/></linearGradient></defs><circle cx=\"70\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"130\" cy=\"62\" r=\"15\" fill=\"url(#rFur__U)\"/><circle cx=\"70\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"130\" cy=\"62\" r=\"7.5\" fill=\"#525c70\"/><circle cx=\"100\" cy=\"102\" r=\"50\" fill=\"url(#rFur__U)\"/><ellipse cx=\"100\" cy=\"116\" rx=\"38\" ry=\"30\" fill=\"#e6eaf2\"/><ellipse cx=\"100\" cy=\"120\" rx=\"30\" ry=\"22\" fill=\"#eef1f7\"/><ellipse cx=\"100\" cy=\"110\" rx=\"11\" ry=\"8\" fill=\"#3e3e48\"/><ellipse cx=\"96\" cy=\"108\" rx=\"3\" ry=\"2\" fill=\"#5e5e68\" opacity=\"0.7\"/><path d=\"M100 117 L100 126\" stroke=\"#3e3e48\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><circle cx=\"120\" cy=\"94\" r=\"16\" fill=\"#c4e8f4\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" opacity=\"0.92\"/><path d=\"M96 94 Q100 90 104 94\" stroke=\"#4a5a6a\" stroke-width=\"2.5\" fill=\"none\"/><circle cx=\"80\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"120\" cy=\"95\" r=\"8\" fill=\"#3e3e48\"/><circle cx=\"83\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"123\" cy=\"92\" r=\"3\" fill=\"#fff\"/><circle cx=\"77\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><circle cx=\"117\" cy=\"97\" r=\"1.5\" fill=\"#fff\" opacity=\"0.7\"/><path d=\"M72 88 Q78 84 84 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M112 88 Q118 84 124 87\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\"0.5\" stroke-linecap=\"round\"/><path d=\"M78 116 Q60 114 52 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M78 122 Q60 124 54 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 116 Q140 114 148 118\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M122 122 Q140 124 146 128\" stroke=\"#a8b2c4\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M90 124 Q100 131 110 124\" stroke=\"#525c70\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/></svg></div>\n    <div class=\"bubble\"><div class=\"who\">Рен</div><p>Принцип D (инверсия зависимостей) — самый важный на практике. Сервис не должен знать, что там за база. Он зависит от интерфейса репозитория. Запусти пример: подменяем реальный репозиторий на мок, а сервис даже не замечает.</p></div></div><div class=\"code\">\n  <div class=\"code-top\"><span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span><span class=\"fn\">dip.js</span><button class=\"runbtn\" onclick=\"runJS(this)\" data-src=\"%2F%2F%20%D1%81%D0%B5%D1%80%D0%B2%D0%B8%D1%81%20%D0%B7%D0%B0%D0%B2%D0%B8%D1%81%D0%B8%D1%82%20%D0%BE%D1%82%20%D0%90%D0%91%D0%A1%D0%A2%D0%A0%D0%90%D0%9A%D0%A6%D0%98%D0%98%20%D1%80%D0%B5%D0%BF%D0%BE%D0%B7%D0%B8%D1%82%D0%BE%D1%80%D0%B8%D1%8F%2C%20%D0%B0%20%D0%BD%D0%B5%20%D0%BE%D1%82%20%D0%BA%D0%BE%D0%BD%D0%BA%D1%80%D0%B5%D1%82%D0%BD%D0%BE%D0%B9%20%D0%91%D0%94%0Afunction%20createBookingService%28repo%29%20%7B%0A%20%20return%20%7B%0A%20%20%20%20book%28court%2C%20time%29%20%7B%0A%20%20%20%20%20%20if%20%28repo.isTaken%28court%2C%20time%29%29%20%7B%0A%20%20%20%20%20%20%20%20return%20%7B%20ok%3A%20false%2C%20reason%3A%20%27%D1%81%D0%BB%D0%BE%D1%82%20%D0%B7%D0%B0%D0%BD%D1%8F%D1%82%27%20%7D%3B%0A%20%20%20%20%20%20%7D%0A%20%20%20%20%20%20const%20saved%20%3D%20repo.save%28%7B%20court%2C%20time%20%7D%29%3B%0A%20%20%20%20%20%20return%20%7B%20ok%3A%20true%2C%20booking%3A%20saved%20%7D%3B%0A%20%20%20%20%7D%2C%0A%20%20%7D%3B%0A%7D%0A%0A%2F%2F%20%D0%B2%20%D1%82%D0%B5%D1%81%D1%82%D0%B0%D1%85%20%D0%BF%D0%BE%D0%B4%D1%81%D0%BE%D0%B2%D1%8B%D0%B2%D0%B0%D0%B5%D0%BC%20%D0%BC%D0%BE%D0%BA-%D1%80%D0%B5%D0%BF%D0%BE%D0%B7%D0%B8%D1%82%D0%BE%D1%80%D0%B8%D0%B9%20%28%D0%BD%D0%B8%D0%BA%D0%B0%D0%BA%D0%BE%D0%B9%20%D0%BD%D0%B0%D1%81%D1%82%D0%BE%D1%8F%D1%89%D0%B5%D0%B9%20%D0%91%D0%94%29%0Aconst%20fakeRepo%20%3D%20%7B%0A%20%20taken%3A%20%5B%7B%20court%3A%203%2C%20time%3A%20%2709%3A00%27%20%7D%5D%2C%0A%20%20isTaken%28c%2C%20t%29%20%7B%20return%20this.taken.some%28x%20%3D%3E%20x.court%20%3D%3D%3D%20c%20%26%26%20x.time%20%3D%3D%3D%20t%29%3B%20%7D%2C%0A%20%20save%28b%29%20%7B%20return%20%7B%20id%3A%2042%2C%20...b%20%7D%3B%20%7D%2C%0A%7D%3B%0A%0Aconst%20service%20%3D%20createBookingService%28fakeRepo%29%3B%0Aconsole.log%28service.book%283%2C%20%2709%3A00%27%29%29%3B%20%20%20%2F%2F%20%D0%B7%D0%B0%D0%BD%D1%8F%D1%82%0Aconsole.log%28service.book%281%2C%20%2712%3A00%27%29%29%3B%20%20%20%2F%2F%20ok%2C%20id%2042\"><span>▶</span><span class=\"rlabel\">Запустить</span></button></div>\n  <pre><code><span class=\"tc\">// сервис зависит от АБСТРАКЦИИ репозитория, а не от конкретной БД</span>\n<span class=\"tk\">function</span> <span class=\"tf\">createBookingService</span><span class=\"tx\">(</span><span class=\"tx\">repo</span><span class=\"tx\">)</span> <span class=\"tx\">{</span>\n  <span class=\"tk\">return</span> <span class=\"tx\">{</span>\n    <span class=\"tf\">book</span><span class=\"tx\">(</span><span class=\"tx\">court</span><span class=\"tx\">,</span> <span class=\"tx\">time</span><span class=\"tx\">)</span> <span class=\"tx\">{</span>\n      <span class=\"tk\">if</span> <span class=\"tx\">(</span><span class=\"tx\">repo</span><span class=\"tx\">.</span><span class=\"tf\">isTaken</span><span class=\"tx\">(</span><span class=\"tx\">court</span><span class=\"tx\">,</span> <span class=\"tx\">time</span><span class=\"tx\">)</span><span class=\"tx\">)</span> <span class=\"tx\">{</span>\n        <span class=\"tk\">return</span> <span class=\"tx\">{</span> <span class=\"tx\">ok</span><span class=\"to\">:</span> <span class=\"tn\">false</span><span class=\"tx\">,</span> <span class=\"tx\">reason</span><span class=\"to\">:</span> <span class=\"ts2\">'слот занят'</span> <span class=\"tx\">}</span><span class=\"tx\">;</span>\n      <span class=\"tx\">}</span>\n      <span class=\"tk\">const</span> <span class=\"tx\">saved</span> <span class=\"to\">=</span> <span class=\"tx\">repo</span><span class=\"tx\">.</span><span class=\"tf\">save</span><span class=\"tx\">(</span><span class=\"tx\">{</span> <span class=\"tx\">court</span><span class=\"tx\">,</span> <span class=\"tx\">time</span> <span class=\"tx\">}</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n      <span class=\"tk\">return</span> <span class=\"tx\">{</span> <span class=\"tx\">ok</span><span class=\"to\">:</span> <span class=\"tn\">true</span><span class=\"tx\">,</span> <span class=\"tx\">booking</span><span class=\"to\">:</span> <span class=\"tx\">saved</span> <span class=\"tx\">}</span><span class=\"tx\">;</span>\n    <span class=\"tx\">}</span><span class=\"tx\">,</span>\n  <span class=\"tx\">}</span><span class=\"tx\">;</span>\n<span class=\"tx\">}</span>\n\n<span class=\"tc\">// в тестах подсовываем мок-репозиторий (никакой настоящей БД)</span>\n<span class=\"tk\">const</span> <span class=\"tx\">fakeRepo</span> <span class=\"to\">=</span> <span class=\"tx\">{</span>\n  <span class=\"tx\">taken</span><span class=\"to\">:</span> <span class=\"tx\">[</span><span class=\"tx\">{</span> <span class=\"tx\">court</span><span class=\"to\">:</span> <span class=\"tn\">3</span><span class=\"tx\">,</span> <span class=\"tx\">time</span><span class=\"to\">:</span> <span class=\"ts2\">'09:00'</span> <span class=\"tx\">}</span><span class=\"tx\">]</span><span class=\"tx\">,</span>\n  <span class=\"tf\">isTaken</span><span class=\"tx\">(</span><span class=\"tx\">c</span><span class=\"tx\">,</span> <span class=\"tx\">t</span><span class=\"tx\">)</span> <span class=\"tx\">{</span> <span class=\"tk\">return</span> <span class=\"tk\">this</span><span class=\"tx\">.</span><span class=\"tx\">taken</span><span class=\"tx\">.</span><span class=\"tf\">some</span><span class=\"tx\">(</span><span class=\"tx\">x</span> <span class=\"to\">=&gt;</span> <span class=\"tx\">x</span><span class=\"tx\">.</span><span class=\"tx\">court</span> <span class=\"to\">===</span> <span class=\"tx\">c</span> <span class=\"to\">&amp;&amp;</span> <span class=\"tx\">x</span><span class=\"tx\">.</span><span class=\"tx\">time</span> <span class=\"to\">===</span> <span class=\"tx\">t</span><span class=\"tx\">)</span><span class=\"tx\">;</span> <span class=\"tx\">}</span><span class=\"tx\">,</span>\n  <span class=\"tf\">save</span><span class=\"tx\">(</span><span class=\"tx\">b</span><span class=\"tx\">)</span> <span class=\"tx\">{</span> <span class=\"tk\">return</span> <span class=\"tx\">{</span> <span class=\"tx\">id</span><span class=\"to\">:</span> <span class=\"tn\">42</span><span class=\"tx\">,</span> <span class=\"to\">...</span><span class=\"tx\">b</span> <span class=\"tx\">}</span><span class=\"tx\">;</span> <span class=\"tx\">}</span><span class=\"tx\">,</span>\n<span class=\"tx\">}</span><span class=\"tx\">;</span>\n\n<span class=\"tk\">const</span> <span class=\"tx\">service</span> <span class=\"to\">=</span> <span class=\"tf\">createBookingService</span><span class=\"tx\">(</span><span class=\"tx\">fakeRepo</span><span class=\"tx\">)</span><span class=\"tx\">;</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span class=\"tf\">log</span><span class=\"tx\">(</span><span class=\"tx\">service</span><span class=\"tx\">.</span><span class=\"tf\">book</span><span class=\"tx\">(</span><span class=\"tn\">3</span><span class=\"tx\">,</span> <span class=\"ts2\">'09:00'</span><span class=\"tx\">)</span><span class=\"tx\">)</span><span class=\"tx\">;</span>   <span class=\"tc\">// занят</span>\n<span class=\"tx\">console</span><span class=\"tx\">.</span><span
